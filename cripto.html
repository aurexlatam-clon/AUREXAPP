<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cripto · AUREX Academy</title>
<meta name="theme-color" content="#070707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9952A;--gold-l:#F0C96B;--bg:#070707;--green:#1D9E75;
  --surface:#121212;--surface2:#181818;--border:#262626;
  --text:#f2efe9;--muted:#9a9ea6;--danger:#e05252;--blue:#93c5fd;
  --head:'Oswald','Arial Narrow',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html.fs1{font-size:112%}
html.fs2{font-size:125%}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:var(--body);cursor:pointer}
a{color:var(--gold-l)}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.1rem}

/* ===== BARRA SUPERIOR ===== */
.top{position:sticky;top:0;z-index:30;background:rgba(7,7,7,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:.6rem;height:58px}
.top-back{background:none;border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;color:var(--muted);font-size:.85rem;text-decoration:none;white-space:nowrap}
.top-back:hover{border-color:var(--gold);color:var(--text)}
.top-logo{flex:1;font-family:var(--head);letter-spacing:.22em;color:var(--gold);font-size:1rem;text-align:center}
.top-logo small{color:var(--muted);letter-spacing:.18em;font-size:.72rem}
.top-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.85rem;padding:.5rem .7rem;font-weight:600}
.top-btn:hover{border-color:var(--gold)}
.top-btn.dic{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.top-btn.dic:hover{background:var(--gold-l)}

/* ===== HERO ===== */
.hero{position:relative;margin-top:1.1rem;border-radius:20px;border:1px solid rgba(201,149,42,.35);min-height:220px;display:flex;align-items:flex-end;padding:1.4rem;overflow:hidden;background:#0d0b07}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-bg.fb{background:radial-gradient(ellipse 70% 90% at 85% 20%,rgba(201,149,42,.35),transparent 60%),radial-gradient(ellipse 50% 60% at 10% 100%,rgba(240,201,107,.12),transparent 70%),#0b0906}
.hero-coin{position:absolute;right:6%;top:50%;transform:translateY(-50%);font-family:var(--head);font-size:9rem;color:rgba(240,201,107,.16);line-height:1;pointer-events:none}
.hero::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(7,7,7,.95) 10%,rgba(7,7,7,.25) 85%)}
.hero-in{position:relative;z-index:2;width:100%}
.kick{font-family:var(--head);font-size:.74rem;letter-spacing:.28em;color:var(--gold)}
.hero h1{font-family:var(--head);font-size:2.3rem;text-transform:uppercase;font-weight:600;letter-spacing:.04em;margin:.3rem 0 .2rem}
.hero p{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:#e0d8c8}
.prog{display:flex;align-items:center;gap:.8rem;margin-top:1rem;font-size:.85rem;color:var(--muted);max-width:560px}
.bar{flex:1;height:7px;background:#222;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:4px;transition:width .5s}

/* ===== PESTAÑAS ===== */
.tabs{position:sticky;top:58px;z-index:20;display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none;background:rgba(7,7,7,.97);padding:.65rem 0;margin-top:1rem;border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;background:transparent;border:1px solid transparent;border-radius:11px;color:var(--muted);font-family:var(--head);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;padding:.65rem .9rem;display:flex;gap:.4rem;align-items:center}
.tabs button:hover{color:var(--text)}
.tabs button.ok{color:var(--green)}
.tabs button.on{background:rgba(201,149,42,.14);border-color:rgba(201,149,42,.5);color:var(--gold-l)}
.tabs button .n{font-size:.75rem;opacity:.7}
@media(min-width:821px){.tabs button{letter-spacing:.05em;font-size:.82rem;padding:.6rem .7rem}}

/* ===== CONTENIDO GENERAL ===== */
main{padding:1.8rem 0 5rem}
.step{font-family:var(--head);font-size:.8rem;letter-spacing:.3em;color:var(--gold)}
.h{font-family:var(--head);font-size:2rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:.3rem 0 1rem;line-height:1.15}
.meta{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.3rem}
.meta span{background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:.35rem .85rem;font-size:.88rem;color:#cfcac0}
.obj{display:inline-block;max-width:100%;background:linear-gradient(135deg,rgba(201,149,42,.14),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.45);border-radius:16px;padding:.95rem 1.3rem;margin-bottom:1.4rem}
.obj span{font-family:var(--head);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.25rem}
.obj p{font-family:var(--serif);font-style:italic;font-size:1.4rem;line-height:1.35;color:var(--gold-l)}
.p{font-size:1.08rem;line-height:1.75;color:#d4cfc6;margin-bottom:1.1rem;max-width:860px}
.sec{font-family:var(--head);font-size:1.3rem;letter-spacing:.1em;text-transform:uppercase;margin:2.8rem 0 .5rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.6rem}
.sec .num{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-size:1rem;flex-shrink:0}
.sec-d{font-size:1rem;color:var(--muted);margin-bottom:1rem;line-height:1.6}
.how{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.3);border-radius:16px;padding:1rem 1.25rem;margin:0 0 1.3rem;max-width:860px}
.how-t{font-family:var(--head);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:.5rem}
.how ol{padding-left:1.3rem;display:grid;gap:.4rem}
.how li{font-size:1.02rem;line-height:1.6;color:#d8d4cc}
.how li b{color:var(--gold-l)}
.btn-gold{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:var(--gold);color:#0a0a0a;font-family:var(--head);letter-spacing:.14em;font-size:1rem;padding:1rem 1.6rem;border-radius:13px;font-weight:600;border:none;text-transform:uppercase;text-decoration:none}
.btn-gold:hover{background:var(--gold-l)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-line{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:13px;padding:.95rem 1.3rem;font-size:1rem;text-decoration:none}
.btn-line:hover{border-color:var(--gold)}

/* ===== TÉRMINO DEL DICCIONARIO EN EL TEXTO ===== */
.term{background:none;border:none;color:var(--gold-l);font:inherit;border-bottom:1.5px dotted var(--gold);padding:0;cursor:help}

/* ===== TU MAPA ===== */
.road{display:flex;flex-direction:column;gap:.9rem;max-width:960px}
.road-it{display:flex;gap:1.1rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.15rem 1.3rem;cursor:pointer;transition:border-color .2s;text-align:left;color:var(--text);width:100%}
.road-it:hover{border-color:rgba(201,149,42,.5)}
.road-it.next{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(201,149,42,.1)}
.road-it.done{border-color:rgba(29,158,117,.45)}
.road-n{width:48px;height:48px;border-radius:50%;background:rgba(201,149,42,.14);border:1px solid rgba(201,149,42,.5);display:grid;place-items:center;font-family:var(--head);font-size:1.3rem;color:var(--gold-l);flex-shrink:0}
.road-it.done .road-n{background:var(--green);border-color:var(--green);color:#fff}
.road-c{flex:1}
.road-c b{font-family:var(--head);font-size:1.12rem;letter-spacing:.05em;text-transform:uppercase;display:block}
.road-c p{font-size:.98rem;line-height:1.55;color:#b9b5ad;margin-top:.2rem}
.road-tag{font-size:.82rem;white-space:nowrap;border-radius:20px;padding:.3rem .7rem;border:1px solid var(--border);color:var(--muted)}
.road-tag.go{background:var(--gold);color:#0a0a0a;border-color:var(--gold);font-weight:600}
.road-tag.ok{color:var(--green);border-color:rgba(29,158,117,.5)}
.road-tag.wip{color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;max-width:960px}
.howto>div{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem}
.howto .i{font-size:1.8rem}
.howto .ht{font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;display:block;margin:.4rem 0 .2rem;font-size:1.02rem}
.howto p{font-size:.95rem;line-height:1.55;color:#b9b5ad}
.where{display:grid;gap:.7rem;max-width:860px}
.where-q{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.9rem 1.1rem}
.where-q p{font-size:1.02rem;flex:1;min-width:220px}
.yn{display:flex;gap:.4rem}
.yn button{min-width:64px;border:1px solid var(--border);background:#0e0e0e;color:var(--text);border-radius:10px;padding:.6rem .9rem;font-size:.95rem}
.yn button.sel{background:rgba(201,149,42,.18);border-color:var(--gold);color:var(--gold-l);font-weight:600}
.reco{margin-top:1rem;max-width:860px;border-radius:16px;padding:1.1rem 1.3rem;background:linear-gradient(135deg,rgba(201,149,42,.12),transparent);border:1px solid rgba(201,149,42,.45)}
.reco b{font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-l);display:block;margin-bottom:.4rem}
.reco p{font-size:1.02rem;line-height:1.65;color:#d8d4cc;margin-top:.35rem}
.side-box{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;max-width:960px;background:#0e0e0e;border:1px dashed rgba(201,149,42,.5);border-radius:16px;padding:1.1rem 1.3rem;margin-top:1.2rem}
.side-box p{flex:1;min-width:240px;font-size:1rem;line-height:1.6;color:#cfcac0}
.side-box b{color:var(--gold-l)}

/* ===== TARJETAS DE APRENDIZAJE ===== */
.learn{background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;max-width:1100px}
.learn-top{display:flex;align-items:center;gap:1rem;padding:1rem 1.3rem;border-bottom:1px solid var(--border);background:#0f0f0f}
.learn-top .lbl{font-family:var(--head);letter-spacing:.2em;font-size:.8rem;color:var(--gold);white-space:nowrap}
.dots{display:flex;gap:.35rem;flex:1;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:#2a2a2a}
.dots i.d{background:var(--gold)}
.dots i.c{background:var(--gold-l);box-shadow:0 0 0 2px rgba(240,201,107,.25)}
.dots i.q{width:10px;border-radius:50%;height:10px;background:#2a2a2a}
.dots i.q.d{background:var(--green)}
.dots i.q.c{background:var(--blue)}
.card{display:grid;grid-template-columns:1.25fr 1fr;min-height:360px;animation:fade .35s ease}
.card.noanim{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-txt{padding:1.8rem 1.9rem}
.card-k{font-family:var(--head);font-size:.78rem;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.card-t{font-family:var(--head);font-size:1.7rem;text-transform:uppercase;letter-spacing:.03em;margin:.35rem 0 .9rem;line-height:1.2}
.card-txt p{font-size:1.1rem;line-height:1.75;color:#d8d4cc;margin-bottom:.85rem}
.card-txt p b{color:var(--text)}
.card-ex{border-left:3px solid var(--gold);background:rgba(201,149,42,.06);border-radius:0 12px 12px 0;padding:.8rem 1rem;margin:1rem 0}
.card-ex span{font-family:var(--head);font-size:.74rem;letter-spacing:.2em;color:var(--gold);display:block;margin-bottom:.2rem}
.card-ex p{margin:0;font-size:1.04rem}
.card-do{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.3);border-radius:12px;padding:.75rem 1rem;font-size:1rem;line-height:1.55;color:var(--blue);margin-top:1rem}
.card-vis{background:radial-gradient(ellipse at 50% 40%,rgba(201,149,42,.16),transparent 70%),#0b0b0b;border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6rem;text-align:center;gap:.6rem;position:relative}
.card-vis img{max-width:100%;max-height:340px;border-radius:14px;object-fit:contain}
.vis-ic{font-size:5rem;line-height:1}
.vis-l{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:var(--gold-l);line-height:1.35;max-width:300px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;width:100%;max-width:420px}
.ladder div{border:1px solid var(--border);border-radius:12px;padding:.7rem .3rem;background:#121212;font-size:.8rem;line-height:1.3;color:#cfcac0}
.ladder div em{font-style:normal;font-size:1.6rem;display:block;margin-bottom:.25rem}
.ladder div.hi{border-color:var(--gold);background:rgba(201,149,42,.12);color:var(--gold-l)}
.ladder-ax{display:flex;justify-content:space-between;width:100%;max-width:420px;font-size:.8rem;color:var(--muted);margin-top:.2rem}
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;max-width:330px}
.ledger div{background:#151515;border:1px solid rgba(201,149,42,.35);border-radius:9px;padding:.45rem;font-size:.72rem;color:#cfcac0;font-family:monospace}
.chain{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;justify-content:center}
.chain span{background:#151515;border:1px solid var(--gold);border-radius:8px;padding:.5rem .6rem;font-family:var(--head);font-size:.8rem;color:var(--gold-l)}
.chain i{color:var(--gold);font-style:normal}
/* pregunta de comprobación */
.check{padding:2rem 1.9rem;grid-column:1/-1;max-width:780px}
.check-k{font-family:var(--head);font-size:.8rem;letter-spacing:.24em;color:var(--blue)}
.check-q{font-size:1.4rem;font-weight:600;line-height:1.4;margin:.5rem 0 1.2rem}
.opts{display:grid;gap:.6rem}
.opt{text-align:left;background:#0e0e0e;border:1.5px solid var(--border);border-radius:13px;padding:1rem 1.1rem;color:var(--text);font-size:1.06rem;line-height:1.45;display:flex;gap:.8rem;align-items:center}
.opt:hover:not(:disabled){border-color:rgba(201,149,42,.6)}
.opt .l{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font-family:var(--head);flex-shrink:0;font-size:.9rem}
.opt.ok{border-color:var(--green);background:rgba(29,158,117,.1)}
.opt.ok .l{background:var(--green);border-color:var(--green)}
.opt.bad{border-color:var(--danger);background:rgba(224,82,82,.08)}
.opt.bad .l{background:var(--danger);border-color:var(--danger)}
.opt:disabled{cursor:default}
.fb{margin-top:1rem;border-radius:13px;padding:1rem 1.1rem;font-size:1.04rem;line-height:1.6}
.fb.ok{background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.45)}
.fb.bad{background:rgba(224,82,82,.07);border:1px solid rgba(224,82,82,.4)}
.fb b{display:block;font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.25rem;font-size:.95rem}
.fb.ok b{color:var(--green)}
.fb.bad b{color:#f08a8a}
.learn-nav{position:sticky;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:.7rem;padding:1rem 1.3rem;border-top:1px solid var(--border);background:#0f0f0f}
.learn-nav .hint{font-size:.92rem;color:var(--muted);text-align:center;flex:1}

/* ===== BLOQUES DESPUÉS DE LAS TARJETAS ===== */
.locked{max-width:860px;border:1px dashed var(--border);border-radius:16px;padding:1.2rem 1.3rem;color:var(--muted);font-size:1rem;line-height:1.6;display:flex;gap:.8rem;align-items:center;margin-top:2.5rem}
.locked span{font-size:1.6rem}
.tasks{display:grid;gap:.6rem;max-width:860px}
.task{display:flex;gap:.85rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.15rem;font-size:1.04rem;text-align:left;color:var(--text);width:100%}
.task .bx{width:28px;height:28px;border-radius:8px;border:2px solid #3a3a3a;display:grid;place-items:center;font-size:.9rem;flex-shrink:0;color:#fff}
.task small{display:block;color:var(--muted);font-size:.88rem;margin-top:.1rem}
.task.on{border-color:rgba(29,158,117,.5)}
.task.on .bx{background:var(--green);border-color:var(--green)}
.task-res{margin-top:.8rem;max-width:860px;border-radius:14px;padding:1rem 1.2rem;background:rgba(201,149,42,.07);border:1px solid rgba(201,149,42,.4);font-size:1.02rem;line-height:1.65;color:#d8d4cc}
.task-res b{color:var(--gold-l)}
.video{max-width:860px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#000;aspect-ratio:16/9;position:relative}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-btn{display:flex;gap:1rem;align-items:center;max-width:860px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem 1.2rem;width:100%;color:var(--text);text-align:left}
.video-btn:hover{border-color:var(--gold)}
.video-btn .pl{width:54px;height:54px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-size:1.4rem;flex-shrink:0}
.video-btn b{font-size:1.06rem;display:block}
.video-btn small{color:var(--muted);font-size:.92rem}
.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;max-width:1100px}
.recap>div{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:14px;padding:1.1rem 1.15rem}
.recap span{font-family:var(--head);color:var(--gold);font-size:1.6rem}
.recap p{font-size:1.02rem;line-height:1.6;color:#d8d4cc;margin-top:.3rem}
.rule{display:grid;grid-template-columns:auto 1fr;gap:1.3rem;align-items:center;margin:1.4rem 0 0;padding:1.3rem 1.4rem;border-left:3px solid var(--green);background:rgba(29,158,117,.06);border-radius:0 18px 18px 0;max-width:860px}
.rule-l{font-family:var(--serif);font-style:italic;font-size:1.55rem;line-height:1.05;color:var(--green)}
.rule p{font-size:1.05rem;line-height:1.7}
.quiz-box{max-width:860px;background:var(--surface);border:1px solid rgba(201,149,42,.45);border-radius:20px;padding:1.5rem 1.6rem}
.quiz-box .qk{font-family:var(--head);font-size:.8rem;letter-spacing:.24em;color:var(--gold)}
.quiz-box .qq{font-size:1.35rem;font-weight:600;line-height:1.4;margin:.5rem 0 1.1rem}
.quiz-intro p{font-size:1.04rem;line-height:1.65;color:#d8d4cc;margin:.4rem 0 1rem}
.qbar{height:6px;background:#222;border-radius:3px;overflow:hidden;margin-bottom:1rem}
.qbar i{display:block;height:100%;background:var(--gold)}
.result{text-align:center;padding:.5rem 0}
.result .big{font-size:3.5rem}
.result h3{font-family:var(--head);font-size:1.7rem;text-transform:uppercase;letter-spacing:.05em;margin:.4rem 0}
.result p{font-size:1.06rem;line-height:1.65;color:#d8d4cc;max-width:560px;margin:0 auto .4rem}
.result .btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem}
.disc{max-width:860px;margin-top:3rem;font-size:.86rem;line-height:1.6;color:var(--muted);border-top:1px solid var(--border);padding-top:1rem}
.recall{max-width:860px;background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.35);border-radius:18px;padding:1.3rem 1.4rem;margin-bottom:1.6rem}
.wip{max-width:860px;border:1px dashed rgba(201,149,42,.5);border-radius:18px;padding:1.6rem;text-align:center;background:#0d0d0d}
.wip .big{font-size:2.6rem}
.wip b{font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;font-size:1.2rem;display:block;margin:.4rem 0}

.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:80;max-width:calc(100% - 32px);text-align:center;background:var(--green);color:#fff;border-radius:12px;padding:.8rem 1.2rem;font-weight:600;font-size:1rem;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}

async function loadCloud(){
  if(!USER||!db)return;
  if(LS('prog_uid')&&LS('prog_uid')!==USER.uid){Object.keys(localStorage).filter(k=>/^(done_|cr_)/.test(k)).forEach(k=>localStorage.removeItem(k));}
  LS('prog_uid',USER.uid);
  try{const s=await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').get();
    if(s.exists){const c=s.data().claves||{};Object.keys(c).forEach(k=>{if(c[k])LS(k,'1');});}}catch(e){}
}
async function saveCloud(key){
  if(!USER||!db)return;
  const claves={};claves['done_'+key]=1;
  try{await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').set({claves,actualizado:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}catch(e){}
}
function setDone(key){LS('done_'+key,'1');saveCloud(key);}

  let h=`<div class="step">LECCIÓN ${i+1} DE ${LESSONS.length}</div><h2 class="h">${L.icon} ${L.title}</h2>
  <div class="meta"><span>⏱ ${L.min} minutos</span>${L.cards?`<span>🃏 ${L.cards.filter(c=>!c.check).length} tarjetas</span><span>❓ ${L.cards.filter(c=>c.check).length} preguntas rápidas</span><span>📝 Quiz de ${L.quiz.length} preguntas</span>`:''}${done(L.key)?'<span style="color:var(--green);border-color:rgba(29,158,117,.5)">✓ Completada</span>':''}</div>
  <div class="obj"><span>🎯 Al terminar podrás</span><p>${L.obj}</p></div>`;
  if(L.wip){
    return h+`<div class="wip"><div class="big">🔨</div><b>Esta lección está en construcción</b><p>Muy pronto vas a poder estudiarla aquí. Mientras tanto, avanza con las lecciones disponibles.</p><div style="margin-top:1.2rem"><button class="btn-line" onclick="go(0)">← Volver a tu mapa</button></div></div>`;
  }
  h+=recallHTML(i);
  h+=`<div class="how"><div class="how-t">👉 Cómo estudiar esta lección</div><ol>
    <li>Lee la tarjeta con calma y toca <b>Siguiente →</b> para avanzar. Si quieres repasar, toca <b>← Anterior</b>.</li>
    <li>Cuando aparezca una <b>pregunta rápida</b>, elige tu respuesta. No pasa nada si te equivocas: te explicamos y sigues.</li>
    <li>Al terminar las tarjetas se abren abajo tu práctica, el video y el quiz final.</li></ol></div>`;
  h+=`<div class="learn" id="learn">${learnInner(L)}</div>`;
  h+=`<div id="after">${afterHTML(L)}</div>`;
  return h;
}
function recallHTML(i){
  if(i===0)return '';
  const P=LESSONS[i-1];if(!P||P.wip||!P.quiz)return '';
  const q=P.quiz[0];
  return `<div class="recall" id="recall"><div class="check-k">🧠 ¿TE ACUERDAS? · DE LA LECCIÓN ANTERIOR</div><div class="check-q" style="font-size:1.2rem">${q.p}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" onclick="answerRecall(${i},${j})"><span class="l">${'ABCD'[j]}</span>${o}</button>`).join('')}</div><div id="recall-fb"></div></div>`;
}
function answerRecall(i,j){
  const q=LESSONS[i-1].quiz[0],box=document.getElementById('recall');
  box.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===j)b.classList.add('bad');});
  document.getElementById('recall-fb').innerHTML=`<div class="fb ${j===q.a?'ok':'bad'}"><b>${j===q.a?'¡Bien recordado!':'Casi. Aquí va un repaso:'}</b>${q.y}</div>`;
}

// tarjetas
function learnInner(L){
  const pos=cardPos(L),c=L.cards[pos],n=L.cards.length;
  const dots=L.cards.map((x,k)=>`<i class="${x.check?'q ':''}${k<pos?'d':k===pos?'c':''}"></i>`).join('');
  const body=c.check?checkHTML(L,c,pos):cardHTML(c);
  const last=pos===n-1;
  const answered=!c.check||LS(`cr_chk_${L.key}_${pos}`)!==null;
  return `<div class="learn-top"><span class="lbl">${pos+1} / ${n}</span><div class="dots">${dots}</div></div>
  ${body}
  <div class="learn-nav">
    <button class="btn-line" onclick="moveCard(-1)" ${pos===0?'disabled style="opacity:.35;cursor:default"':''}>← Anterior</button>
    <span class="hint">${c.check&&!answered?'Elige una respuesta para continuar':''}</span>
    <button class="btn-gold" id="btn-next" onclick="moveCard(1)" ${answered?'':'disabled'}>${last?'Terminar ✓':'Siguiente →'}</button>
  </div>`;
}
function cardHTML(c){
  const vis=c.vis?(c.vis.img?`<img src="${c.vis.img}" alt="">`:c.vis.html?c.vis.html:`<div class="vis-ic">${c.vis.ic}</div><div class="vis-l">${c.vis.l}</div>`):'';
  return `<div class="card"><div class="card-txt"><div class="card-k">${c.k}</div><h3 class="card-t">${c.t}</h3>
    ${c.p.map(x=>`<p>${rich(x)}</p>`).join('')}
    ${c.ex?`<div class="card-ex"><span>EJEMPLO</span><p>${rich(c.ex)}</p></div>`:''}
    ${c.do?`<div class="card-do">👉 ${rich(c.do)}</div>`:''}
  </div><div class="card-vis">${vis}</div></div>`;
}
function checkHTML(L,c,pos){
  const prev=LS(`cr_chk_${L.key}_${pos}`);const sel=prev===null?null:parseInt(prev);
  return `<div class="card" style="grid-template-columns:1fr;min-height:0"><div class="check"><div class="check-k">❓ PREGUNTA RÁPIDA</div><div class="check-q">${c.q}</div>
  <div class="opts">${c.o.map((o,j)=>{let cl='';if(sel!==null){if(j===c.a)cl='ok';else if(j===sel)cl='bad';}return `<button class="opt ${cl}" ${sel!==null?'disabled':''} onclick="answerCheck(${pos},${j})"><span class="l">${'ABC'[j]}</span>${o}</button>`;}).join('')}</div>
  ${sel!==null?`<div class="fb ${sel===c.a?'ok':'bad'}"><b>${sel===c.a?'¡Correcto!':'No exactamente'}</b>${c.y}</div>`:''}</div></div>`;
}
function answerCheck(pos,j){const L=LESSONS[ST.tab-1];LS(`cr_chk_${L.key}_${pos}`,String(j));const el=document.getElementById('learn');el.innerHTML=learnInner(L);el.querySelector('.card')?.classList.add('noanim');}
function moveCard(d){
  const L=LESSONS[ST.tab-1],pos=cardPos(L),n=L.cards.length;
  if(d>0&&pos===n-1){
    const first=!learned(L);LS('cr_learn_'+L.key,'1');
    document.getElementById('after').innerHTML=afterHTML(L);
    toast(first?'¡Tarjetas terminadas! Sigue con tu práctica 👇':'Repaso terminado 👇');
    setTimeout(()=>document.getElementById('practice')?.scrollIntoView({behavior:'smooth',block:'start'}),250);
    return;
  }
  LS('cr_card_'+L.key,String(Math.max(0,Math.min(n-1,pos+d))));
  const el=document.getElementById('learn');el.innerHTML=learnInner(L);
  const off=58+document.getElementById('tabs').offsetHeight+8;
  window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-off,behavior:'smooth'});
}

// práctica, video, recuerda y quiz
function afterHTML(L){
  if(!learned(L))return `<div class="locked"><span>🔒</span><div>Termina las tarjetas de arriba y aquí se abrirán <b>tu práctica, el video y el quiz final</b>.</div></div>`;
  const T=L.tasks;let h='';let s=1;
  if(T){
    if(L.key==='cripto0'&&LS('cr_task_cripto0_2')===null){const W=JSON.parse(LS('cr_where')||'{}');if(W.ex===1){LS('cr_task_cripto0_2','1');LS('cr_task_cripto0_0','1');}}
    const on=T.items.map((_,k)=>LS(`cr_task_${L.key}_${k}`)==='1');
    h+=`<div class="sec" id="practice"><span class="num">${s++}</span>Ponlo en práctica</div><p class="sec-d">${T.t} ${T.d}</p>
    <div class="tasks">${T.items.map(([ic,t,sub],k)=>`<button class="task ${on[k]?'on':''}" onclick="toggleTask(${k})"><span class="bx">${on[k]?'✓':''}</span><div>${ic} ${t}<small>${sub}</small></div></button>`).join('')}</div>
    <div class="task-res">${T.res(on)}</div>`;
  }
  if(L.video){
    h+=`<div class="sec"><span class="num">${s++}</span>Míralo en video <span style="font-size:.85rem;color:var(--muted);letter-spacing:.05em;text-transform:none;font-family:var(--body)">(opcional)</span></div>
    <div id="vid"><button class="video-btn" onclick="playVideo('${L.video.yt}')"><span class="pl">▶</span><div><b>${L.video.t}</b><small>${L.video.d} Toca para verlo aquí mismo.</small></div></button></div>`;
  }
  h+=`<div class="sec"><span class="num">${s++}</span>Recuerda</div><p class="sec-d">Si solo te quedas con tres ideas de esta lección, que sean estas:</p>
  <div class="recap">${L.recap.map((r,k)=>`<div><span>${k+1}</span><p>${r}</p></div>`).join('')}</div>
  ${L.rule?`<div class="rule"><div class="rule-l">Regla<br>de oro</div><p>${L.rule}</p></div>`:''}`;
  h+=`<div class="sec" id="quiz-sec"><span class="num">${s++}</span>Quiz final</div><div class="quiz-box" id="quiz">${quizInner(L)}</div>`;
  const i=LESSONS.indexOf(L);
  h+=`<div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:2rem"><button class="btn-line" onclick="go(0)">← Tu mapa</button><button class="btn-line" onclick="restartCards()">↺ Repasar las tarjetas</button></div>`;
  h+=`<p class="disc">Contenido educativo e informativo. Cada persona decide qué hacer con su dinero. Para temas de impuestos, consulta a tu contador.</p>`;
  return h;
}
function toggleTask(k){const L=LESSONS[ST.tab-1],key=`cr_task_${L.key}_${k}`;LS(key,LS(key)==='1'?'0':'1');const y=window.scrollY;document.getElementById('after').innerHTML=afterHTML(L);window.scrollTo(0,y);}
function playVideo(id){document.getElementById('vid').innerHTML=`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video de la lección"></iframe></div>`;}
function restartCards(){const L=LESSONS[ST.tab-1];LS('cr_card_'+L.key,'0');document.getElementById('learn').innerHTML=learnInner(L);scrollToTabs();}

// quiz final
function quizInner(L){
  const Q=ST.quiz;
  if(!Q||Q.key!==L.key){
    const ok=done(L.key);
    return `<div class="quiz-intro"><div class="qk">📝 QUIZ · ${L.quiz.length} PREGUNTAS</div>
    <p>${ok?'Ya aprobaste este quiz. Puedes repetirlo cuando quieras para repasar.':`Responde con calma. Para aprobar necesitas <b>${passN(L)} de ${L.quiz.length}</b> respuestas correctas. Después de cada respuesta verás por qué es la correcta. Si no apruebas, puedes intentarlo de nuevo.`}</p>
    <button class="btn-gold" onclick="startQuiz()">${ok?'Repetir el quiz':'Empezar el quiz'} →</button></div>`;
  }
  if(Q.i>=L.quiz.length)return resultHTML(L);
  const q=L.quiz[Q.i],ans=Q.ans[Q.i];
  return `<div class="qbar"><i style="width:${Math.round(Q.i/L.quiz.length*100)}%"></i></div>
  <div class="qk">PREGUNTA ${Q.i+1} DE ${L.quiz.length}</div><div class="qq">${q.p}</div>
  <div class="opts">${q.o.map((o,j)=>{let cl='';if(ans!==undefined){if(j===q.a)cl='ok';else if(j===ans)cl='bad';}return `<button class="opt ${cl}" ${ans!==undefined?'disabled':''} onclick="answerQuiz(${j})"><span class="l">${'ABCD'[j]}</span>${o}</button>`;}).join('')}</div>
  ${ans!==undefined?`<div class="fb ${ans===q.a?'ok':'bad'}"><b>${ans===q.a?'¡Correcto!':'Esta no era'}</b>${q.y}</div><div style="margin-top:1rem;text-align:right"><button class="btn-gold" onclick="nextQ()">${Q.i===L.quiz.length-1?'Ver mi resultado':'Siguiente pregunta'} →</button></div>`:''}`;
}
function passN(L){return Math.ceil(L.quiz.length*0.7);}
function startQuiz(){const L=LESSONS[ST.tab-1];ST.quiz={key:L.key,i:0,ans:[]};paintQuiz();}
function answerQuiz(j){ST.quiz.ans[ST.quiz.i]=j;paintQuiz(false);}
function nextQ(){ST.quiz.i++;paintQuiz();}
function paintQuiz(scroll=true){const L=LESSONS[ST.tab-1];const el=document.getElementById('quiz');el.innerHTML=quizInner(L);if(scroll)el.scrollIntoView({behavior:'smooth',block:'start'});}
function resultHTML(L){
  const Q=ST.quiz,ok=Q.ans.filter((a,k)=>a===L.quiz[k].a).length,pass=ok>=passN(L);
  const i=LESSONS.indexOf(L),nx=LESSONS[i+1];
  if(pass&&!done(L.key)){setDone(L.key);setTimeout(()=>{renderTop();toast('¡Lección completada! 🏅');},50);}
  return `<div class="result"><div class="big">${pass?'🎉':'💪'}</div><h3>${pass?'¡Lección completada!':'¡Casi lo logras!'}</h3>
  <p><b>${ok} de ${L.quiz.length}</b> respuestas correctas.</p>
  <p>${pass?'Excelente. Tu avance quedó guardado y esta lección ya aparece con ✓ en tu mapa.':`Necesitas ${passN(L)} de ${L.quiz.length}. Repasa las tarjetas (sobre todo las palabras subrayadas) y vuelve a intentarlo. Aprender también es equivocarse.`}</p>
  <div class="btns">${pass?(nx?`<button class="btn-gold" onclick="go(${i+2})">Ir a la lección ${i+2}: ${nx.title} →</button>`:'')+`<button class="btn-line" onclick="go(0)">Ver mi mapa</button>`:`<button class="btn-gold" onclick="startQuiz()">Intentar de nuevo</button><button class="btn-line" onclick="restartCards()">Repasar las tarjetas</button>`}</div></div>`;
}

// ---------- DICCIONARIO ----------
let DF=0;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function openDict(q){document.getElementById('dict').classList.add('open');closePop();const i=document.getElementById('dict-q');i.value=q||'';renderDict();if(!q&&window.innerWidth>820)setTimeout(()=>i.focus(),100);}
function closeDict(){document.getElementById('dict').classList.remove('open');}
function setDictFilter(f){DF=f;document.getElementById('df-all').classList.toggle('on',!f);document.getElementById('df-ess').classList.toggle('on',!!f);renderDict();}
function renderDict(){
  const q=norm(document.getElementById('dict-q').value.trim());
  const list=DICT.filter(d=>(!DF||d[4])&&(!q||norm(d[0]+' '+d[1]+' '+d[2]).includes(q))).sort((a,b)=>{const ia=q&&norm(a[0]).includes(q)?0:1,ib=q&&norm(b[0]).includes(q)?0:1;return ia-ib||norm(a[0]).localeCompare(norm(b[0]));});
  document.getElementById('dict-l').innerHTML=`<div class="dict-n">${list.length} ${list.length===1?'palabra':'palabras'} · Toca una para ver su explicación</div>`+
   (list.length?list.map(d=>`<details ${q&&list.length<=3?'open':''}><summary><b>${d[0]}${d[4]?'<span class="tag-e">Esencial</span>':''}</b><small>${d[1]}</small></summary><div class="dd">${d[2]}${d[3]?`<em>💡 ${d[3]}</em>`:''}</div></details>`).join(''):`<p class="sec-d">No encontramos esa palabra. Prueba con otra forma de escribirla, o pregúntale a quien te invitó.</p>`);
}
function findTerm(t){const n=norm(t);return DICT.find(d=>norm(d[0])===n)||DICT.find(d=>norm(d[0]).startsWith(n));}
function pop(t){
  const d=findTerm(t);if(!d)return;
  const p=document.getElementById('pop');
  p.innerHTML=`<b>${d[0]}</b><p>${d[2]}${d[3]?`<br><em>💡 ${d[3]}</em>`:''}</p><div class="row"><button class="btn-line" onclick="openDict()">📖 Ver todo el diccionario</button><button class="btn-gold" onclick="closePop()">Entendido</button></div>`;
  p.classList.add('open');
}
function closePop(){document.getElementById('pop').classList.remove('open');}

// ---------- AYUDAS ----------
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2800);}
function applyFont(){const f=parseInt(LS('cr_fs'))||0;document.documentElement.classList.remove('fs1','fs2');if(f)document.documentElement.classList.add('fs'+f);}
function cycleFont(){const f=((parseInt(LS('cr_fs'))||0)+1)%3;LS('cr_fs',String(f));applyFont();toast(['Letra normal','Letra grande','Letra más grande'][f]);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDict();closePop();}});

// ---------- RECORRIDO INICIAL (solo la primera vez) ----------
const TOUR=[
 {el:'#tabs',t:'Estas son tus lecciones. Toca cualquiera para abrirla. Las que termines se marcan con ✓ en verde.'},
 {el:'#fab',t:'Aquí está tu <b>Diccionario</b>. Siempre está arriba: si una palabra no te queda clara, búscala aquí cuando quieras.'},
 {el:'#btn-fs',t:'¿La letra se ve pequeña? Toca <b>A+</b> para hacerla más grande.'},
 {el:'.road-it.next, .road-it',t:'Empieza aquí. Toca la lección 1 cuando estés lista o listo. ¡Disfruta el recorrido!'}
];
let TI=0;
function maybeTour(){if(LS('cr_tour')==='1'||ST.tab!==0)return;TI=0;document.getElementById('tour').classList.add('open');showTour();}
function showTour(){
  const s=TOUR[TI],el=document.querySelector(s.el);if(!el){endTour();return;}
  el.scrollIntoView({block:'center'});
  setTimeout(()=>{
    const r=el.getBoundingClientRect(),hole=document.getElementById('tour-hole'),box=document.getElementById('tour-box');
    hole.style.cssText=`left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px`;
    box.innerHTML=`<small>PASO ${TI+1} DE ${TOUR.length}</small><p>${s.t}</p><div class="row"><button class="skip" onclick="endTour()">Saltar</button><button class="btn-gold" style="padding:.75rem 1.2rem" onclick="nextTour()">${TI===TOUR.length-1?'¡Listo!':'Siguiente →'}</button></div>`;
    const bh=box.offsetHeight,bw=box.offsetWidth;
    let top=r.bottom+16;if(top+bh>window.innerHeight-10)top=Math.max(10,r.top-bh-16);
    let left=Math.min(Math.max(12,r.left),window.innerWidth-bw-12);
    box.style.top=top+'px';box.style.left=left+'px';
  },250);
}
function nextTour(){TI++;if(TI>=TOUR.length)endTour();else showTour();}
function endTour(){document.getElementById('tour').classList.remove('open');LS('cr_tour','1');}

// ---------- INICIO ----------
applyFont();
const h0=location.hash.match(/^#l(\d)$/);if(h0){const n=parseInt(h0[1]);if(n>=0&&n<=LESSONS.length)ST.tab=n;}
// Foto del banner: si existe cripto/hero.jpg se usa; si no, queda el fondo dorado
(function(){const im=new Image();im.onload=()=>{const b=document.getElementById('hero-bg');b.classList.remove('fb');b.style.backgroundImage="url('cripto/hero.jpg')";};im.src='cripto/hero.jpg';})();
startAuth();
</script>
