<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cripto · AUREX Academy</title>
<meta name="theme-color" content="#070707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9952A;--gold-l:#F0C96B;--bg:#070707;--green:#1D9E75;
  --surface:#111;--surface2:#171717;--border:#262626;
  --text:#f2efe9;--muted:#9a9ea6;--danger:#e05252;--blue:#93c5fd;
  --head:'Oswald','Arial Narrow',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html.fs1{font-size:112%}
html.fs2{font-size:125%}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;top:0;bottom:0;width:38vw;pointer-events:none;z-index:0}
body::before{left:-12vw;background:radial-gradient(ellipse 50% 40% at 30% 25%,rgba(201,149,42,.13),transparent 70%),radial-gradient(ellipse 35% 30% at 20% 80%,rgba(240,201,107,.07),transparent 70%)}
body::after{right:-12vw;background:radial-gradient(ellipse 50% 40% at 70% 60%,rgba(201,149,42,.12),transparent 70%),radial-gradient(ellipse 30% 25% at 80% 15%,rgba(240,201,107,.08),transparent 70%)}
.sparks{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 6% 18%,rgba(240,201,107,.7),transparent),radial-gradient(1px 1px at 12% 42%,rgba(240,201,107,.6),transparent),radial-gradient(2px 2px at 4% 66%,rgba(240,201,107,.5),transparent),radial-gradient(1px 1px at 9% 88%,rgba(240,201,107,.6),transparent),radial-gradient(1.5px 1.5px at 94% 22%,rgba(240,201,107,.7),transparent),radial-gradient(1px 1px at 89% 48%,rgba(240,201,107,.6),transparent),radial-gradient(2px 2px at 96% 74%,rgba(240,201,107,.5),transparent),radial-gradient(1px 1px at 91% 93%,rgba(240,201,107,.6),transparent)}
button{font-family:var(--body);cursor:pointer}
a{color:var(--gold-l)}
.wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:0 clamp(16px,3.5vw,52px)}
.top{position:sticky;top:0;z-index:30;background:rgba(7,7,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:.6rem;height:60px}
.top-back{background:none;border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;color:var(--muted);font-size:.88rem;text-decoration:none;white-space:nowrap}
.top-back:hover{border-color:var(--gold);color:var(--text)}
.top-logo{flex:1;font-family:var(--head);letter-spacing:.22em;color:var(--gold);font-size:1rem;text-align:center}
.top-logo small{color:var(--muted);letter-spacing:.18em;font-size:.72rem}
.top-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;padding:.5rem .8rem;font-weight:600;white-space:nowrap}
.top-btn:hover{border-color:var(--gold)}
.top-btn.dic{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.top-btn.dic:hover{background:var(--gold-l)}
.hero{position:relative;margin-top:1.4rem;border-radius:22px;border:1px solid rgba(201,149,42,.35);min-height:260px;display:flex;align-items:flex-end;padding:2rem;overflow:hidden;background:#0d0b07}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center right}
.hero-bg.fb{background:radial-gradient(ellipse 60% 90% at 85% 30%,rgba(201,149,42,.35),transparent 60%),radial-gradient(ellipse 50% 60% at 10% 100%,rgba(240,201,107,.12),transparent 70%),#0b0906}
.hero::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(7,7,7,.95) 25%,rgba(7,7,7,.2) 75%)}
.hero-in{position:relative;z-index:2;width:100%;max-width:760px}
.kick{font-family:var(--head);font-size:.78rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--head);font-size:2.8rem;text-transform:uppercase;font-weight:600;letter-spacing:.04em;margin:.35rem 0 .3rem;line-height:1.1}
.hero p{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:#e0d8c8}
.prog{display:flex;align-items:center;gap:.8rem;margin-top:1.2rem;font-size:.9rem;color:var(--muted);max-width:560px}
.bar{flex:1;height:7px;background:#222;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:4px;transition:width .5s}
main{padding:1.6rem 0 5rem}
.l-head{margin-top:1.6rem;padding:2rem 0 1.4rem;border-bottom:1px solid var(--border);margin-bottom:1.6rem}
.l-head .kick{font-size:.85rem}
.h{font-family:var(--head);font-size:2.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:.4rem 0 1.2rem;line-height:1.1}
.obj{background:linear-gradient(135deg,rgba(201,149,42,.14),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.45);border-radius:18px;padding:1.1rem 1.5rem;max-width:1100px}
.obj span{font-family:var(--head);font-size:.82rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.3rem}
.obj p{font-family:var(--serif);font-style:italic;font-size:1.55rem;line-height:1.35;color:var(--gold-l)}
.sec{font-family:var(--head);font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase;margin:3rem 0 .5rem;padding-top:2.2rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.7rem}
.sec .num{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-size:1rem;flex-shrink:0}
.sec small{font-family:var(--body);font-size:.88rem;letter-spacing:0;text-transform:none;color:var(--muted)}
.sec-d{font-size:1.04rem;color:var(--muted);margin-bottom:1.1rem;line-height:1.6;max-width:1000px}
.sec-d b{color:var(--text)}
.how{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.3);border-radius:16px;padding:1.1rem 1.4rem;margin:1.4rem 0;max-width:1100px}
.how-t{font-family:var(--head);font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:.55rem}
.how ol{padding-left:1.3rem;display:grid;gap:.4rem}
.how li{font-size:1.1rem;line-height:1.65;color:#e4dfd5}
.how li b{color:var(--gold-l)}
.btn-gold{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:var(--gold);color:#0a0a0a;font-family:var(--head);letter-spacing:.14em;font-size:1rem;padding:1rem 1.6rem;border-radius:13px;font-weight:600;border:none;text-transform:uppercase;text-decoration:none}
.btn-gold:hover{background:var(--gold-l)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-line{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:13px;padding:.95rem 1.3rem;font-size:1rem;text-decoration:none}
.btn-line:hover{border-color:var(--gold)}
.btn-line:disabled{opacity:.35;cursor:default}
.term{background:none;border:none;color:var(--gold-l);font:inherit;border-bottom:1.5px dotted var(--gold);padding:0;cursor:help}
.gate-box{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:rgba(224,82,82,.06);border:1px solid rgba(224,82,82,.4);border-radius:16px;padding:1.1rem 1.3rem;margin:1.2rem 0;max-width:1100px}
.gate-box div{flex:1;min-width:260px}
.gate-box b{color:#f3a3a3;font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:.3rem}
.gate-box p{font-size:1.02rem;line-height:1.6;color:#d8d4cc}
.gate-box p b{color:var(--text);font-family:var(--body);display:inline;text-transform:none;letter-spacing:0}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.lc{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem 1.3rem 1.2rem;color:var(--text);display:flex;flex-direction:column;gap:.5rem;transition:border-color .2s,transform .2s;overflow:hidden}
.lc:hover{border-color:rgba(201,149,42,.55);transform:translateY(-2px)}
.lc .n{font-family:var(--head);font-size:2.4rem;color:rgba(240,201,107,.3);line-height:1}
.lc b{font-family:var(--head);font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase}
.lc p{font-size:.98rem;line-height:1.55;color:#b9b5ad;flex:1}
.lc .st{font-size:.85rem;align-self:flex-start;border-radius:20px;padding:.3rem .75rem;border:1px solid var(--border);color:var(--muted)}
.lc.next{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(201,149,42,.1)}
.lc.next .st{background:var(--gold);color:#0a0a0a;border-color:var(--gold);font-weight:600}
.lc.done{border-color:rgba(29,158,117,.45)}
.lc.done .st{color:var(--green);border-color:rgba(29,158,117,.5)}
.lc.cur{background:linear-gradient(135deg,rgba(201,149,42,.12),transparent)}
.lc.cur .st{color:var(--gold-l);border-color:rgba(201,149,42,.5)}
.nextbig{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(120deg,rgba(201,149,42,.16),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.5);border-radius:22px;padding:1.6rem 1.8rem;margin-bottom:1.6rem}
.nextbig small{font-family:var(--head);letter-spacing:.26em;color:var(--gold);font-size:.8rem}
.nextbig h3{font-family:var(--head);font-size:1.8rem;text-transform:uppercase;letter-spacing:.04em;margin:.3rem 0}
.nextbig p{font-size:1.04rem;color:#cfcac0;line-height:1.55;max-width:700px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.howto>div{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem}
.howto .i{width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,149,42,.6);color:var(--gold-l);display:grid;place-items:center;font-family:var(--head);font-size:1.2rem}
.howto .ht{font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;display:block;margin:.6rem 0 .25rem;font-size:1.1rem}
.howto p{font-size:1rem;line-height:1.6;color:#b9b5ad}
.where{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.where-q{display:flex;flex-direction:column;justify-content:space-between;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem}
.where-q p{font-size:1.04rem;line-height:1.5}
.yn{display:flex;gap:.5rem}
.yn button{flex:1;border:1px solid var(--border);background:#0b0b0b;color:var(--text);border-radius:10px;padding:.7rem .9rem;font-size:1rem}
.yn button.sel{background:rgba(201,149,42,.18);border-color:var(--gold);color:var(--gold-l);font-weight:600}
.reco{margin-top:1rem;border-radius:16px;padding:1.2rem 1.4rem;background:linear-gradient(135deg,rgba(201,149,42,.12),transparent);border:1px solid rgba(201,149,42,.45)}
.reco>b{font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);display:block;margin-bottom:.3rem}
.reco p{font-size:1.04rem;line-height:1.65;color:#d8d4cc}
.side-box{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;background:#0d0d0d;border:1px dashed rgba(201,149,42,.5);border-radius:18px;padding:1.3rem 1.5rem;margin-top:1.4rem}
.side-box p{flex:1;min-width:260px;font-size:1.04rem;line-height:1.6;color:#cfcac0}
.side-box b{color:var(--gold-l)}
.learn{background:#171614;border:1px solid #2c2a26;border-radius:24px;overflow:hidden}
.learn-top{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid #2c2a26;background:#141312}
.learn-top .lbl{font-family:var(--head);letter-spacing:.2em;font-size:.85rem;color:var(--gold);white-space:nowrap}
.dots{display:flex;gap:.35rem;flex:1;flex-wrap:wrap;align-items:center}
.dots i{width:24px;height:6px;border-radius:3px;background:#2a2a2a}
.dots i.d{background:var(--gold)}
.dots i.c{background:var(--gold-l);box-shadow:0 0 0 2px rgba(240,201,107,.25)}
.dots i.q{width:10px;height:10px;border-radius:50%}
.dots i.q.d{background:var(--green)}
.dots i.v{cursor:pointer}
.dots i.v:hover{outline:2px solid rgba(240,201,107,.6);outline-offset:2px}
.btn-restart{background:transparent;border:1px solid #3a352c;color:#d8cfbd;border-radius:10px;padding:.45rem .85rem;font-size:.9rem;white-space:nowrap}
.btn-restart:hover{border-color:var(--gold);color:var(--gold-l)}
.dots i.q.c{background:var(--blue);box-shadow:0 0 0 2px rgba(147,197,253,.3)}
.card{display:grid;grid-template-columns:1.15fr 1fr;min-height:430px;animation:fade .35s ease}
.card.noanim{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-txt{padding:2.2rem 2.4rem}
.card-k{font-family:var(--head);font-size:.82rem;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.card-lead{font-family:var(--serif);font-style:italic;font-size:2.05rem;line-height:1.25;color:var(--gold-l);margin:.5rem 0 1.1rem}
.card.q .card-lead{display:none}
.card.q .card-k{margin-bottom:1rem}
.card-txt p{font-size:1.24rem;line-height:1.85;color:#e4dfd5;margin-bottom:1rem;letter-spacing:.005em}
.card-txt p b{color:#f6e7c8;font-weight:600;letter-spacing:.012em}
.card-ex{border-left:3px solid var(--gold);background:rgba(201,149,42,.07);border-radius:0 12px 12px 0;padding:.85rem 1.1rem;margin:1.1rem 0}
.card-ex span{font-family:var(--head);font-size:.76rem;letter-spacing:.22em;color:var(--gold);display:block;margin-bottom:.25rem}
.card-ex p{margin:0!important;font-size:1.16rem!important}
.card-do{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.3);border-radius:12px;padding:.85rem 1.1rem;font-size:1.12rem;line-height:1.65;color:var(--blue);margin-top:1.1rem}
.card-do b{color:#cfe3ff}
.card-vis{background:radial-gradient(ellipse at 50% 40%,rgba(201,149,42,.13),transparent 70%),#121110;border-left:1px solid #2c2a26;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:.8rem;position:relative;overflow:hidden}
.card-vis>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-vis.fit{padding:0;background:#050505}
.card-vis.fit>img{position:static;width:100%;height:auto;max-height:100%;object-fit:contain}
.card-vis .alt{width:100%;display:flex;flex-direction:column;align-items:center;gap:.9rem}
.card-vis .alt[hidden]{display:none}
.quote{font-family:var(--serif);font-style:italic;font-size:2.1rem;line-height:1.3;color:var(--gold-l);max-width:440px}
.quote::before{content:'';display:block;width:56px;height:2px;background:var(--gold);margin:0 auto 1.2rem}
.vis-l{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--gold-l);line-height:1.35;max-width:380px}
ol.steps{list-style:none;counter-reset:s;display:grid;gap:.6rem;margin:.3rem 0 .9rem}
ol.steps li{counter-increment:s;display:flex;gap:.8rem;align-items:flex-start;font-size:1.2rem;line-height:1.7;color:#e4dfd5}
ol.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-family:var(--head);font-weight:600;flex-shrink:0;margin-top:.1rem}
ol.steps li b{color:#f6e7c8;font-weight:600;letter-spacing:.012em}
.tbl{width:100%;border-collapse:collapse;font-size:1.08rem;margin:.2rem 0 .6rem}
.tbl th{font-family:var(--head);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;color:var(--gold);text-align:left;padding:.5rem .6rem;border-bottom:1px solid rgba(201,149,42,.4)}
.tbl td{padding:.65rem .6rem;border-bottom:1px solid #2c2a26;color:#e4dfd5;vertical-align:top}
.tbl td:first-child{color:var(--gold-l);font-family:var(--head)}
.tbl .st{color:#7fdcbc}
.tbl tr.ex td{color:var(--muted)}
.a-time{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.35rem;max-width:460px}
.a-time div{border:1px solid var(--border);background:#131313;border-radius:12px;padding:.6rem .7rem;min-width:84px}
.a-time div b{display:block;font-family:var(--head);color:var(--gold);font-size:.8rem;letter-spacing:.1em}
.a-time div span{font-size:.9rem;color:#d8d4cc}
.a-time div.hi{border-color:var(--gold);background:rgba(201,149,42,.14)}
.a-time div.hi span{color:var(--gold-l);font-weight:600}
.a-time i{color:var(--gold);font-style:normal}
.a-nb{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:420px;width:100%}
.a-nb div{background:#f3ead6;color:#2b2416;border-radius:6px 10px 10px 6px;padding:.55rem .5rem .55rem .9rem;font-size:.74rem;line-height:1.55;text-align:left;border-left:4px solid #b88a2a;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.a-nb div small{display:block;font-family:var(--head);letter-spacing:.1em;color:#8a6a24;font-size:.62rem;margin-bottom:.2rem}
.a-nb div.bad{background:#f6dcd6;border-left-color:#c0392b}
.a-nb div.bad s{color:#c0392b}
.a-nb div.bad em{display:block;font-style:normal;color:#c0392b;font-weight:600;font-size:.68rem;margin-top:.15rem}
.a-pil{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;max-width:440px;width:100%}
.a-pil div{border:1px solid rgba(201,149,42,.4);background:#121212;border-radius:12px;padding:.8rem .7rem;text-align:left}
.a-pil div:last-child{grid-column:1/-1}
.a-pil b{display:block;font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-l);font-size:.9rem}
.a-pil span{font-size:.86rem;color:#b9b5ad}
.a-lad{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;width:100%;max-width:460px}
.a-lad div{border:1px solid var(--border);border-radius:12px;padding:.8rem .3rem;background:#121212;font-size:.86rem;color:#cfcac0;display:flex;flex-direction:column;gap:.3rem;align-items:center;justify-content:flex-end}
.a-lad div i{display:block;width:70%;background:linear-gradient(0deg,var(--gold),rgba(201,149,42,.3));border-radius:4px}
.a-lad div.hi{border-color:var(--gold);color:var(--gold-l);background:rgba(201,149,42,.1)}
.a-ax{display:flex;justify-content:space-between;width:100%;max-width:460px;font-size:.84rem;color:var(--muted)}
.a-irr{display:flex;flex-direction:column;gap:.7rem;align-items:center}
.a-irr .ok{border:1px solid rgba(29,158,117,.6);background:rgba(29,158,117,.1);color:#7fdcbc;border-radius:14px;padding:1rem 1.4rem;font-family:var(--head);letter-spacing:.1em;font-size:1.05rem}
.a-irr .no{border:1px dashed #555;color:#777;border-radius:12px;padding:.6rem 1.2rem;font-family:var(--head);letter-spacing:.1em;text-decoration:line-through}
.a-cmc{width:100%;max-width:440px;background:#0f0f0f;border:1px solid var(--border);border-radius:14px;overflow:hidden;text-align:left}
.a-cmc .hd{display:flex;justify-content:space-between;padding:.6rem .9rem;font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.a-cmc .r{display:grid;grid-template-columns:28px 1fr auto;gap:.6rem;padding:.55rem .9rem;border-bottom:1px solid #1d1d1d;font-size:.92rem}
.a-cmc .r b{color:var(--gold-l);font-family:var(--head)}
.a-cmc .r small{color:var(--muted)}
.a-cmc .r.hi{background:rgba(201,149,42,.1)}
.a-roads{display:grid;gap:.6rem;width:100%;max-width:440px;text-align:left}
.a-roads div{display:grid;grid-template-columns:96px 1fr;gap:.7rem;align-items:center;border:1px solid var(--border);background:#121212;border-radius:12px;padding:.7rem .8rem}
.a-roads div.hi{border-color:var(--gold);background:rgba(201,149,42,.1)}
.a-roads b{font-family:var(--head);letter-spacing:.06em;color:var(--gold-l);font-size:1.05rem}
.a-roads span{font-size:.88rem;color:#cfcac0;line-height:1.4}
.a-roads span b{font-size:.88rem}

  {k:'Capítulo 2 · Llegan los bancos',lead:'Guardar el dinero bajo el colchón no era seguro. Así nacieron los bancos.',
   p:['Un banco guarda tu dinero y lleva un <b>registro</b> de cuánto tiene cada cliente. Antes era un libro de cuentas escrito a mano; hoy es un sistema en sus computadoras.',
      'Cuando pagas con tarjeta nadie mueve billetes: el banco resta de tu cuenta y suma en la de otra persona. <b>Tu dinero, en realidad, es una anotación en el registro del banco.</b>',
      'Lo bueno: está regulado y, si algo sale mal, puedes reclamar. Lo menos bueno: tiene horarios, enviar dinero a otro país tarda días y cuesta comisiones, y todo depende de que el banco haga bien su trabajo.'],
   ex:'Cuando te depositan tu sueldo, nadie lleva billetes a tu casa: el banco anota “+ $10,000” en tu cuenta. Esa anotación es tu dinero.',
   img:'cripto/l1-banco.jpg'},
  {check:true,q:'En tu banco, ¿quién lleva el registro de cuánto dinero tienes?',
   o:['Yo, en mi celular','El banco, en su sistema','Nadie, se lleva solo'],a:1,
   y:'El banco lleva el registro. Tú solo lo consultas en tu app o en tu estado de cuenta. Por eso, cuando usas un banco, confías en él.'},
  {k:'Capítulo 3 · Del papel a la app',lead:'Después llegó internet, y el banco se mudó a tu celular.',
   p:['Hoy haces transferencias desde tu teléfono a cualquier hora. Además aparecieron los <b>neobancos</b>: bancos o empresas financieras que funcionan casi solo desde una app, sin sucursales ni filas.',
      'Fue un gran avance en comodidad. Pero fíjate en algo: <b>sigue siendo una empresa la que lleva el registro de tu dinero.</b> Cambió la forma (ahora es una app), no el fondo (sigues confiando en una empresa).'],
   ex:'Nu, Revolut o Ualá: abres tu cuenta en minutos desde el celular, pero la empresa sigue llevando el registro.',
   img:'cripto/l1-neobanco.jpg'},
  {k:'Capítulo 4 · 2008, el año en que la confianza se rompió',lead:'En 2008 el mundo vivió una de las peores crisis financieras de su historia.',
   p:['Grandes bancos de Estados Unidos y Europa quebraron o estuvieron a punto de hacerlo. Millones de personas perdieron su casa, su empleo o sus ahorros, y los gobiernos usaron dinero público para rescatar a los bancos.',
      'Mucha gente se hizo una pregunta: <b>¿y si existiera un dinero que no dependiera de que un banco haga bien su trabajo?</b>',
      'En ese momento, alguien que firmó como <b>Satoshi Nakamoto</b> publicó una propuesta: un dinero digital que se anota en una libreta compartida por todos, no en la de un banco. En enero de 2009 nació {{Bitcoin|Bitcoin}}, la primera criptomoneda. En su primer registro quedó guardado, como mensaje, el titular de un periódico de ese día que hablaba de otro rescate a los bancos.'],
   img:'cripto/l1-2008.jpg'},
  {k:'Capítulo 5 · Cómo funciona la blockchain',lead:'Para entenderla, imagina un salón de clases con 30 alumnos.',
   p:['Cada alumno tiene un cuaderno, y todos los cuadernos son idénticos. Cuando Ana le paga 10 pesos a Luis, lo dice en voz alta y <b>los 30 lo anotan en su cuaderno al mismo tiempo</b>.',
      'Ahora imagina que Luis quiere hacer trampa y borra ese pago para decir que nunca le pagaron. ¿Qué pasa? Los otros 29 cuadernos dicen lo contrario. <b>Gana lo que dice la mayoría, y la trampa no sirve.</b>',
      'Cuando se llena una página, todos la sellan y la unen a la anterior. Para cambiar una página vieja tendrías que cambiar también todas las que siguen… en los 30 cuadernos a la vez.',
      'Ahora cambia el salón por <b>miles de computadoras en todo el mundo</b>. Eso es la {{Blockchain|blockchain}}, o cadena de bloques: cada página sellada es un “bloque”, y los bloques forman una cadena.'],
   do:'Pasa el cursor sobre la palabra subrayada <b>blockchain</b> (en el celular, tócala) y verás su significado. Así funcionan todas las palabras subrayadas.',

   y:'Como miles de copias dicen lo mismo, nadie puede cambiar el registro por su cuenta. Y fíjate: no hay “maestra”. Ninguna persona o empresa manda sobre la blockchain.'},
  {k:'Capítulo 6 · Por qué te debe importar',lead:'No necesitas saber programar. Necesitas saber por qué puedes confiar en ella.',
   p:['<b>Es segura:</b> para falsificarla habría que engañar a miles de computadoras al mismo tiempo.',
      '<b>Es inmutable:</b> lo que se anota ya no se borra ni se cambia. Queda como prueba para siempre.',
      '<b>Es transparente:</b> cada envío tiene un número de guía y cualquiera puede comprobar que llegó, como cuando rastreas un paquete.',
      '<b>No tiene horarios ni fronteras:</b> funciona las 24 horas, los 365 días, y puedes enviar a otro país en minutos.',
      '<b>Nadie la controla:</b> ningún banco, empresa ni gobierno puede apagarla o cambiar las reglas por su cuenta.'],

  {k:'Capítulo 7 · ¿Y qué es una criptomoneda?',lead:'Una criptomoneda es dinero digital que se anota en una blockchain.',
   p:['El nombre viene de <b>criptografía</b>: técnicas matemáticas que protegen la información, las mismas que protegen tus mensajes y tus compras en internet.',
      'Bitcoin fue la primera. Hoy existen miles, y cada una tiene un propósito: unas sirven para guardar valor, otras para crear aplicaciones y otras, como <b>USDT</b>, buscan valer siempre lo mismo que un dólar. Las conocerás en la lección 2.',
      'Una diferencia importante: <b>Bitcoin no tiene dueño</b>, pero algunas criptomonedas sí las emite una empresa. USDT, por ejemplo, la emite una empresa llamada Tether.'],
   ex:'Si le envías 50 USDT a alguien en otro país, ese envío se anota en una blockchain y llega en minutos, sin pasar por ningún banco.',
   img:'cripto/l1-cripto.jpg'},
  {check:true,q:'¿Qué hace diferente a una criptomoneda del dinero de tu banco?',
   o:['Que se ve más bonita en la app','Que se anota en una blockchain que ninguna empresa controla','Que solo se usa en Estados Unidos'],a:1,
   y:'La diferencia de fondo es dónde se anota: en una libreta compartida por miles de computadoras, no en el sistema de un banco.'},
  {k:'Capítulo 8 · Cómo se compra: el exchange',lead:'Para cambiar tus pesos por cripto, normalmente usas un exchange.',
   p:['Un {{Exchange|exchange}} es como una casa de cambio, pero en tu celular y abierta todo el día. Los más conocidos son Binance y Bitso.',
      'Aquí viene algo que mucha gente no sabe: <b>el exchange también es una empresa</b>. Te pide identificarte ({{KYC|KYC}}), guarda tu cripto por ti y, si detecta algo raro, puede congelar tu cuenta.',
      'Piénsalo como un <b>neobanco de cripto</b>: muy práctico para empezar, pero alguien más guarda la llave de tu dinero.'],
   ex:'Tienes 100 USDT en Binance: la cripto existe en la blockchain, pero la llave para moverla la guarda Binance.',
   img:'cripto/l1-exchange.jpg'},
  {k:'Capítulo 9 · Tu propia billetera',lead:'El último escalón: ser tú quien guarda la llave.',
   p:['Con una {{Billetera|billetera}} propia, por ejemplo Exodus, ya no hay empresa en medio: <b>solo tú y la blockchain</b>. La llave se llama {{Frase semilla|frase semilla}}: una lista de 12 o 24 palabras.',
      'A esto se le llama {{Descentralización|descentralizado}}: no depende de ningún banco ni empresa.',
      'Fíjate en la escalera: mientras más subes, <b>más control tienes… y más responsabilidad</b>. En el banco puedes recuperar tu contraseña. En tu billetera, si pierdes la frase semilla, nadie te la puede recuperar.'],

  {check:true,q:'Tienes tu cripto en tu billetera propia. ¿Quién tiene la llave?',
   o:['El banco','Binance','Yo'],a:2,
   y:'En tu billetera propia la llave es tuya. Por eso cuidarla es tan importante: lo verás a fondo en la lección de Blindaje.'},
  {k:'Para cerrar · La diferencia que más importa',lead:'En cripto no existe el botón de “deshacer”.',
   p:['En tu banco, si te equivocas de cuenta o te roban, puedes reclamar y a veces se revierte.',
      'En la blockchain, <b>un envío confirmado no se puede regresar</b>. Es la otra cara de que sea inmutable: lo que protege tu dinero de la trampa también impide deshacer un error.',
      'Por eso esta academia incluye las lecciones de <b>Blindaje</b> y <b>Errores</b> antes de enseñarte a mover tu dinero. No es para dar miedo: es para que lo hagas con seguridad desde el primer día.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica, el video y el quiz.',
   art:'irreversible'}
 ],
 tasks:{t:'¿Cuáles de estos usas hoy?',d:'Toca cada uno que ya uses. Así sabes en qué escalón estás.',
  items:[['Una cuenta de banco','Ej. BBVA, Santander, Bancolombia'],['Un neobanco o app financiera','Ej. Nu, Revolut, Ualá'],['Un exchange de cripto','Ej. Binance o Bitso'],['Una billetera propia','Ej. Exodus o Trust Wallet']],
  res:on=>{const n=on.filter(Boolean).length;let m=`Estás en <b>${n} de 4</b> escalones. `;
   if(!on[2])m+=`Todavía no tienes exchange. No te preocupes: la guía <a href="${GUIDE_URL}">Tu primer USDT</a> te lleva paso a paso para crear tu cuenta en Binance. Te recomendamos hacerla después de las lecciones de Blindaje y Errores.`;
   else if(!on[3])m+='Ya usas un exchange. En la lección 3 vas a ver cuándo conviene tener también una billetera propia.';
   else m+='Ya recorres toda la escalera. Estas lecciones te ayudan a hacerlo con más seguridad.';return m;}},
 video:{yt:'Xsud8d1ITyQ',t:'Video introductorio',d:'Un repaso en video de lo que acabas de aprender.'},
 recap:['Banco, neobanco y exchange tienen algo en común: <b>una empresa lleva el registro</b> de tu dinero y tú confías en ella.','La <b>blockchain</b> es una libreta compartida en miles de computadoras: <b>segura, inmutable y transparente</b>.','En cripto <b>un envío confirmado no se puede regresar</b>. Por eso, antes de mover dinero, aprende a blindarte.'],
 rule:'Antes de tocar cualquier cripto, pregúntate: <b>¿quién tiene la llave?</b> Si es una empresa, confías en ella. Si eres tú, cuidarla depende solo de ti.',
 quiz:[
  {p:'¿Qué es una criptomoneda?',o:['Un billete digital emitido por un banco central','Dinero digital que se anota en una blockchain','Una tarjeta de crédito virtual','Un sistema de puntos de recompensa'],a:1,y:'Una criptomoneda es dinero digital que se anota en una blockchain, no en el registro de un banco.'},
  {p:'¿Qué es la blockchain?',o:['Una app de Binance','Un registro con copias idénticas en miles de computadoras','La página web de un banco','Un tipo de tarjeta'],a:1,y:'Como en el salón de clases: miles de copias idénticas que se vigilan entre sí, por eso es muy difícil hacer trampa.'},
  {p:'¿Qué significa que la blockchain sea “inmutable”?',o:['Que es muy rápida','Que lo que se anota ya no se puede borrar ni cambiar','Que es gratis','Que solo funciona en un país'],a:1,y:'Inmutable significa que no cambia: lo anotado queda como prueba para siempre.'},
  {p:'Binance es…',o:['La blockchain','Un banco del gobierno','Una empresa (exchange) que guarda tu cripto por ti','Una billetera donde solo tú tienes la llave'],a:2,y:'Binance es un exchange: muy práctico, pero la llave de tu cripto la guarda la empresa, no tú.'},
  {p:'Si envías cripto a una dirección equivocada, ¿qué pasa normalmente?',o:['El banco te lo devuelve','Se cancela solo en 24 horas','Normalmente no se puede regresar','Binance lo regresa automáticamente'],a:2,y:'Los envíos confirmados en la blockchain no se pueden deshacer. Por eso siempre se revisa antes de enviar.'}
 ]},

{key:'cripto2',title:'Criptos claras',
 desc:'Cuántas criptomonedas existen, cuáles son las más importantes y cómo consultarlas en CoinMarketCap.',
 obj:'Al terminar podrás reconocer las criptomonedas más importantes, saber para qué sirve cada una y consultar información confiable por tu cuenta.',
 cards:[
  {k:'Capítulo 1 · Un mundo con millones de monedas',lead:'Cuando entras al mundo cripto, la cantidad de monedas abruma.',
   p:['Hoy cualquier persona puede crear una criptomoneda en minutos. Por eso existen <b>millones</b> registradas. Y aquí está lo importante: <b>la gran mayoría casi no tiene uso ni valor</b>, y muchas se crean solo para llamar la atención un rato.',
      'Unas cuantas concentran casi todo el valor y el uso del mercado. Esas son las que vale la pena conocer, y son las que vas a ver en esta lección.',
      'Para no perderte existe un sitio de referencia que usa todo el mundo cripto: {{CoinMarketCap|CoinMarketCap}}.'],
   do:'Cuando alguien te recomiende “una moneda nueva que va a explotar”, recuerda: hay millones, y casi todas terminan sin valor.',
   img:'cripto/l2-millones.jpg'},
  {k:'Capítulo 2 · Tu consulta de confianza',lead:'CoinMarketCap es como un gran directorio de criptomonedas.',
   p:['En <b>coinmarketcap.com</b> puedes buscar cualquier cripto y ver, gratis y sin registrarte:',
      '<ol class="steps"><li>Su <b>posición</b> en el ranking.</li><li>Su <b>precio</b> en este momento.</li><li>Cuánto <b>subió o bajó</b> en las últimas 24 horas.</li><li>Su <b>tamaño</b>: el valor de todas sus monedas juntas (en inglés, <i>market cap</i>).</li></ol>',
      'El ranking se ordena por tamaño. Mientras más arriba, más grande y más usada. Una cripto que no aparece entre las primeras cien merece mucha más precaución.'],
   do:'El ranking cambia todos los días. Lo que verás aquí es la foto de octubre de 2026: consulta siempre la versión actual.',
   art:'cmc'},
  {check:true,q:'¿Qué significa que una cripto esté en la posición 1 de CoinMarketCap?',
   o:['Que es la más barata','Que es la más grande por tamaño (su valor total)','Que es la más nueva'],a:1,
   y:'El ranking se ordena por tamaño, no por precio. Una cripto puede costar poco por unidad y aun así ser enorme, o al revés.'},
  {k:'Las principales · Bitcoin (BTC)',lead:'Bitcoin: el oro digital.',
   p:['La primera criptomoneda, creada en 2009, y la número uno en tamaño desde entonces.',
      '<b>Solo existirán 21 millones de bitcoins</b>, nunca más. Esa escasez, como la del oro, es la razón principal por la que mucha gente lo usa para <b>guardar valor a largo plazo</b>.',
      'Lo que debes saber: <b>su precio sube y baja mucho</b>; puede moverse 10% en un solo día. Por eso casi no se usa para pagos del día a día.'],
   ex:'No necesitas comprar un bitcoin entero: se divide en partes muy pequeñas, como un peso se divide en centavos.',
   img:'cripto/l2-bitcoin.jpg'},
  {k:'Las principales · Ethereum (ETH)',lead:'Ethereum: la computadora del mundo cripto.',
   p:['Lanzada en 2015. Además de ser dinero, permite crear programas que se cumplen solos ({{Contrato inteligente|contratos inteligentes}}) y aplicaciones completas sobre su blockchain.',
      'Si Bitcoin es el oro digital, Ethereum es la plataforma sobre la que se construye buena parte del mundo cripto.',
      'Lo que debes saber: su precio también sube y baja, y enviar por su red (ERC-20) suele costar más comisión que por otras redes.'],
   ex:'Un contrato inteligente funciona como una máquina de refrescos: metes la moneda, eliges y el producto sale solo, sin vendedor.',
   img:'cripto/l2-ethereum.jpg'},
  {k:'Las principales · USDT y USDC',lead:'Los dólares digitales.',
   p:['Se llaman {{Stablecoin|stablecoins}}, monedas estables, porque <b>buscan valer siempre 1 dólar</b>. Combinan la rapidez de la cripto con la estabilidad del dólar.',
      '<b>USDT</b> (de la empresa Tether) es la más usada del mundo para enviar, recibir y pagar en negocios digitales. <b>USDC</b> (de la empresa Circle) es muy similar.',
      'Lo que debes saber: <b>las emiten empresas</b>, que respaldan su valor con reservas y pueden congelar direcciones. En momentos de crisis su precio puede moverse un poco. Y no son intercambiables al enviar: USDT no es lo mismo que USDC.'],
   ex:'1 USDT vale cerca de 1 dólar hoy, mañana y el mes que viene. 1 bitcoin puede valer muy distinto de una semana a otra.',
   art:'stable'},
  {check:true,q:'¿Por qué USDT es la más usada para pagos y envíos?',
   o:['Porque su precio sube mucho','Porque busca valer siempre 1 dólar y es predecible','Porque la emite un gobierno'],a:1,
   y:'Para pagar o recibir dinero necesitas que valga lo mismo mañana. USDT busca mantenerse en 1 dólar. Recuerda: la emite una empresa, no un gobierno.'},
  {k:'Las principales · BNB, XRP y Solana',lead:'Tres que vas a ver seguido.',
   p:['<b>BNB:</b> la moneda creada por Binance en 2017. Sirve para pagar comisiones con descuento dentro de Binance y es la moneda de su red, BNB Chain.',
      '<b>XRP:</b> creada en 2012 para mover dinero entre países de forma rápida y barata. Está entre las más grandes por tamaño.',
      '<b>Solana (SOL):</b> una blockchain muy rápida y de comisiones muy bajas, lanzada en 2020. Muchas aplicaciones y juegos cripto funcionan sobre ella.',
      'Las tres <b>suben y bajan de precio</b>: no son monedas estables.'],
   img:'cripto/l2-otras.jpg'},
  {k:'Una más · No está en el top 7, pero la vas a usar',lead:'TRON (TRX): la carretera por la que viaja tu USDT.',
   p:['Tron es una blockchain creada en 2017, rápida y con comisiones bajas. TRX es su moneda.',
      'Lo importante para ti no es TRX como moneda, sino su red: <b>TRC-20</b>, la más usada en Latinoamérica para enviar USDT. Sus direcciones siempre empiezan con la letra <b>T</b>.',
      'Verás las redes con calma en la lección 6. Por ahora quédate con esto: <b>una misma cripto, como USDT, puede viajar por varias carreteras distintas.</b>'],
   art:'roads'},
  {k:'Para cerrar · Las principales de un vistazo',lead:'Así se ordenan por tamaño (octubre de 2026).',
   p:[`<table class="tbl"><tr><th>#</th><th>Cripto</th><th>Se usa sobre todo para</th><th>Precio</th></tr><tr><td>1</td><td>Bitcoin (BTC)</td><td>Guardar valor a largo plazo</td><td>Sube y baja</td></tr><tr><td>2</td><td>Ethereum (ETH)</td><td>Aplicaciones y contratos inteligentes</td><td>Sube y baja</td></tr><tr><td>3</td><td>Tether (USDT)</td><td>Pagos y envíos en dólares</td><td class="st">≈ 1 dólar</td></tr><tr><td>4</td><td>BNB</td><td>Comisiones dentro de Binance</td><td>Sube y baja</td></tr><tr><td>5</td><td>XRP</td><td>Pagos entre países</td><td>Sube y baja</td></tr><tr><td>6</td><td>USD Coin (USDC)</td><td>Pagos y envíos en dólares</td><td class="st">≈ 1 dólar</td></tr><tr><td>7</td><td>Solana (SOL)</td><td>Aplicaciones rápidas y baratas</td><td>Sube y baja</td></tr><tr class="ex"><td>8</td><td>TRON (TRX)</td><td>Su red TRC-20 mueve USDT</td><td>Sube y baja</td></tr></table>`],
   do:'Esta foto cambia con el tiempo: consúltala actualizada en CoinMarketCap. Es información educativa, no una recomendación de compra.'},
  {check:true,q:'¿Cuál de estas busca valer siempre 1 dólar?',
   o:['Bitcoin','Solana','USDC'],a:2,
   y:'USDC, igual que USDT, es una stablecoin: busca mantenerse en 1 dólar. Bitcoin y Solana suben y bajan.'}
 ],

 recap:['Existen <b>millones</b> de criptomonedas, pero unas pocas concentran casi todo el valor.','<b>Bitcoin</b> guarda valor y sube y baja; <b>USDT</b> busca valer 1 dólar y se usa para pagar y enviar.','Consulta siempre en <b>CoinMarketCap</b>: el ranking cambia todos los días.'],

  {p:'¿Qué diferencia a Ethereum de Bitcoin?',o:['Ethereum es más antigua','Ethereum permite crear contratos inteligentes y aplicaciones','Ethereum no tiene blockchain','Ethereum solo sirve para pagos'],a:1,y:'Ethereum funciona como una plataforma: sobre ella se construyen programas y aplicaciones.'},

  {p:'¿Para qué sirve CoinMarketCap?',o:['Para comprar cripto con tarjeta','Para consultar el ranking, precio y tamaño de cada cripto','Para guardar tu frase semilla','Para enviar USDT'],a:1,y:'Es un directorio de consulta, gratis y sin registro. No es un lugar para comprar ni para guardar.'},

/* =============== LECCIÓN 3 =============== */
{key:'cripto3',title:'¿Dónde viven tus cripto?',
 desc:'Exchanges, billeteras calientes y frías, y dispositivos físicos: quién guarda la llave y cuándo usar cada uno.',
 obj:'Al terminar podrás distinguir quién guarda la llave de tu cripto y elegir el lugar adecuado para cada caso.',
 cards:[
  {k:'Capítulo 1 · Lo que de verdad guardas',lead:'Tu cripto nunca sale de la blockchain. Lo que guardas es la llave.',
   p:['Recuerda el cuaderno compartido: tu dinero está anotado ahí, a tu nombre. Para moverlo necesitas demostrar que es tuyo, y eso se hace con una <b>llave secreta</b>.',
      'Una {{Billetera|billetera}} cripto no es un monedero donde viven las monedas. <b>Es el lugar donde se guarda esa llave.</b>',
      'Por eso, la pregunta más importante de esta lección no es “¿dónde está mi cripto?”, sino <b>“¿quién tiene la llave?”</b>'],
   ex:'Es como una caja fuerte gigante en internet: todos pueden ver la caja, pero solo quien tiene la llave la puede abrir.',
   img:'cripto/l3-llave.jpg'},
  {k:'Capítulo 2 · Dos preguntas que lo aclaran todo',lead:'Cualquier billetera se entiende con dos preguntas.',
   p:['<b>Pregunta 1: ¿quién tiene la llave?</b> Si la guarda una empresa, como Binance, se llama <b>custodia de terceros</b>. Si la guardas tú, se llama <b>custodia propia</b>.',
      '<b>Pregunta 2: ¿está conectada a internet?</b> Si lo está, es una billetera <b>caliente</b>: práctica, pero más expuesta. Si está desconectada, es <b>fría</b>: menos práctica, pero mucho más segura.',
      'Con esas dos respuestas sabes exactamente qué tipo de billetera tienes y cuánto cuidado necesita.'],
   art:'hotcold'},
  {check:true,q:'Una app en tu celular, conectada a internet, donde tú guardas la llave. ¿Qué es?',
   o:['Una billetera fría','Una billetera caliente de custodia propia','Una cuenta de banco'],a:1,
   y:'Está conectada a internet (caliente) y la llave es tuya (custodia propia). Así son Exodus o Trust Wallet. Mucha gente las llama “frías” por error.'},
  {k:'Opción 1 · El exchange',lead:'Binance, Bitso y similares: caliente, y la llave la guarda la empresa.',
   p:['Es el lugar más fácil para empezar: compras, vendes, recibes y conviertes a pesos desde una sola app, con soporte en español.',
      'A cambio, <b>dependes de la empresa</b>: si tiene problemas, te bloquea la cuenta o sufre un ataque, tu dinero puede quedar atrapado. Por eso existe la frase más famosa del mundo cripto: {{No son tus llaves|“no son tus llaves, no son tus monedas”}}.',
      '<b>Ideal para:</b> el dinero que usas seguido o que vas a mover pronto, siempre con 2FA activado.'],
   img:'cripto/l3-exchange.jpg'},
  {k:'Opción 2 · Tu billetera en una app',lead:'Exodus, Trust Wallet y similares: caliente, y la llave es tuya.',
   p:['Descargas la app, creas tu billetera y la app te muestra tu {{Frase semilla|frase semilla}}: 12 o 24 palabras en un orden exacto. <b>Esa lista es tu llave.</b>',
      'Nadie puede bloquearte ni congelar tu dinero. Pero toda la responsabilidad es tuya: si pierdes las palabras y se descompone tu celular, nadie te las puede recuperar.',
      '<b>Ideal para:</b> ahorros de mediano plazo, cuando ya dominas lo básico. Descarga la app solo desde la tienda oficial de tu celular o su sitio oficial.'],
   ex:'Al crear tu billetera en Exodus, la app te muestra 12 palabras en inglés. Las escribes a mano en un papel, las revisas y lo guardas en un lugar seguro.',
   img:'cripto/l3-app.jpg'},
  {k:'Opción 3 · El dispositivo físico',lead:'Ledger, Trezor y similares: fría, y la llave es tuya.',
   p:['Es un aparato parecido a una memoria USB que guarda tu llave <b>sin conexión a internet</b>. Para mover tu cripto necesitas tener el aparato en tus manos y confirmar en él.',
      'Es el nivel máximo de seguridad: aunque alguien entrara a tu computadora, no podría mover nada sin el dispositivo.',
      '<b>Ideal para:</b> montos grandes que no vas a mover pronto. Cómpralo solo en la tienda oficial de la marca, nunca usado ni a revendedores.'],
   img:'cripto/l3-ledger.jpg'},
  {check:true,q:'¿Cuál es la opción más segura para guardar una cantidad grande por mucho tiempo?',
   o:['Dejarla en el exchange','Una foto de la frase semilla en tu celular','Una billetera fría (dispositivo físico)'],a:2,
   y:'El dispositivo físico guarda la llave fuera de internet. Y ojo: una foto de la frase semilla nunca es segura, porque se sube sola a la nube.'},
  {k:'Capítulo 3 · Cuál usar y cuándo',lead:'No tienes que hacerlo todo de golpe. La mayoría avanza en tres etapas.',
   p:['<b>Etapa 1 · Empiezas:</b> solo un exchange, con 2FA activado. Es suficiente para aprender, recibir y pagar.',
      '<b>Etapa 2 · Acumulas:</b> exchange para lo que usas y una billetera propia en app para lo que ahorras. Separas el dinero activo del que estás guardando.',
      '<b>Etapa 3 · Proteges a largo plazo:</b> exchange para moverte, app para el mediano plazo y dispositivo físico para el ahorro grande.'],
   do:'Para pasar dinero de un lugar a otro la regla siempre es la misma: primero un envío pequeño de prueba y, cuando llegue, el resto. Lo verás paso a paso en la lección 6.',
   art:'stages'},
  {check:true,q:'Si apenas empiezas, ¿qué es lo más recomendable?',
   o:['Comprar un dispositivo físico antes de aprender','Usar un exchange con 2FA activado y aprender lo básico','Repartir tu cripto en varias apps desconocidas'],a:1,
   y:'Empieza simple y seguro: un exchange reconocido con 2FA. Cuando domines lo básico, das el siguiente paso.'}
 ],
 tasks:{t:'¿En qué etapa estás?',d:'Palomea lo que ya tienes y te decimos tu siguiente paso.',
  items:[['Tengo cuenta en un exchange',''],['Mi exchange tiene 2FA activado',''],['Tengo una billetera propia en app',''],['Mi frase semilla está escrita en papel, en un lugar seguro','']],
  res:on=>{if(!on[0])return 'Aún no tienes exchange. Tu siguiente paso, cuando termines Blindaje y Errores, es la guía <a href="'+GUIDE_URL+'">Tu primer USDT</a>.';
   if(!on[1])return '<b>Prioridad:</b> activa el 2FA en tu exchange. Lo ves paso a paso en la lección 4, Blindaje.';
   if(on[2]&&!on[3])return '<b>Atención:</b> tienes billetera propia pero tu frase semilla no está en papel. Hazlo hoy: si pierdes el celular, es tu única forma de recuperarla.';
   if(on[2])return 'Estás en la <b>etapa 2</b>. Cuando tu ahorro sea grande, considera un dispositivo físico.';
   return 'Estás en la <b>etapa 1</b>, y está muy bien. Cuando quieras guardar a mediano plazo, el siguiente paso es una billetera propia.';}},
 recap:['La billetera guarda <b>la llave</b>, no las monedas.','<b>Caliente</b> = conectada; <b>fría</b> = desconectada. En el exchange la llave la tiene la empresa; en tu billetera, tú.','Avanza <b>por etapas</b> y, al mover dinero, siempre prueba primero con poco.'],
 rule:'No son tus llaves, no son tus monedas. Pero si la llave es tuya, <b>cuidarla también es solo tuyo</b>.',
 quiz:[
  {p:'¿Cuál es la diferencia entre una billetera caliente y una fría?',o:['La caliente es física y la fría digital','La caliente está conectada a internet y la fría no','La fría es más rápida','No hay diferencia'],a:1,y:'Caliente = conectada; fría = desconectada. La fría es menos práctica pero más segura.'},
  {p:'¿Qué es la frase semilla?',o:['Una contraseña normal de 8 caracteres','Tu nombre de usuario','Una lista de palabras que permite recuperar tu billetera','Un código que te da el exchange'],a:2,y:'Son 12 o 24 palabras que funcionan como la llave maestra de tu billetera propia.'},
  {p:'¿Dónde es más seguro guardar grandes cantidades por mucho tiempo?',o:['En el exchange','En una app del celular','En un documento en tu computadora','En una billetera fría o dispositivo físico'],a:3,y:'El dispositivo físico mantiene la llave fuera de internet.'},
  {p:'Exodus o Trust Wallet son…',o:['Billeteras frías','Billeteras calientes donde tú tienes la llave','Exchanges','Bancos digitales'],a:1,y:'Son apps conectadas a internet (calientes) de custodia propia: la llave es tuya.'},
  {p:'En un exchange como Binance, ¿quién guarda la llave de tu cripto?',o:['Tú','La empresa','Nadie','El gobierno'],a:1,y:'En el exchange la empresa guarda la llave. Por eso se dice “no son tus llaves, no son tus monedas”.'}
 ]},

/* =============== LECCIÓN 4 =============== */
{key:'cripto4',title:'Blindaje cripto',
 desc:'Contraseñas, tu correo, verificación en dos pasos (2FA), frase semilla y las estafas más comunes.',
 obj:'Al terminar podrás proteger tus cuentas y tu cripto desde el primer día, y reconocer las estafas antes de caer en ellas.',
 cards:[
  {k:'Capítulo 1 · Por qué es distinto',lead:'En cripto, la seguridad no es opcional: es la base de todo.',
   p:['Si alguien roba la contraseña de tu banco, llamas y lo bloquean. En cripto, si alguien entra a tu cuenta y envía tu dinero, ese envío no se puede regresar. <b>No hay a quién llamar para deshacerlo.</b>',
      'La buena noticia: <b>casi todas las pérdidas se pueden evitar</b> con unos cuantos hábitos sencillos. La mayoría no ocurre por hackers geniales, sino porque alguien engañó a la persona para que entregara sus datos.',
      'En esta lección vas a armar tu blindaje en cuatro capas: <b>contraseñas, correo, verificación en dos pasos y frase semilla</b>.'],
   img:'cripto/l4-escudo.jpg'},
  {k:'Capa 1 · Tus contraseñas',lead:'Una contraseña débil es una puerta sin cerrojo.',
   p:['<b>Una contraseña distinta para cada plataforma.</b> Si usas la misma en todos lados y se filtra la de una red social, los ladrones la prueban en tu correo y en Binance.',
      '<b>Larga y sin datos personales:</b> nada de tu nombre, tu fecha de nacimiento o “123”. Una frase larga que solo tú entiendas funciona mejor que una palabra corta con símbolos.',
      '<b>No las guardes en notas, fotos ni WhatsApp.</b> Un gestor de contraseñas gratuito, como Bitwarden, las crea y las guarda por ti, protegidas.'],
   art:'passwords'},
  {k:'Capa 2 · Tu correo electrónico',lead:'Tu correo es la llave maestra de todas tus cuentas.',
   p:['Con acceso a tu correo, un ladrón puede tocar “olvidé mi contraseña” en todas tus plataformas y cambiarlas. Por eso <b>tu correo merece la contraseña más fuerte y su propia verificación en dos pasos</b>.',
      'Revisa también que el teléfono y el correo de recuperación de tu cuenta sean tuyos y estén actualizados.'],
   img:'cripto/l4-correo.jpg'},
  {check:true,q:'¿Por qué tu correo electrónico es tan importante?',
   o:['Porque ahí llegan las promociones','Porque con él se pueden cambiar las contraseñas de tus otras cuentas','No importa si tienes 2FA en Binance'],a:1,
   y:'Quien controla tu correo puede restablecer tus demás contraseñas. Protégelo primero.'},
  {k:'Capa 3 · Verificación en dos pasos (2FA)',lead:'Una segunda cerradura que solo se abre con tu celular.',
   p:['Con el {{2FA|2FA}}, para entrar o retirar no basta tu contraseña: también te pide un código de 6 números que cambia cada 30 segundos y que aparece en una app de tu celular, como <b>Google Authenticator</b>.',
      'Aunque alguien robe tu contraseña, sin tu celular no puede entrar.',
      'El 2FA por mensaje SMS es mejor que nada, pero es más débil: existen fraudes en los que duplican tu número de teléfono. Siempre que puedas, usa una app de autenticación.'],
   art:'twofa'},
  {k:'Capa 3 · Cómo activarlo en Binance',lead:'Se activa una vez, en unos minutos, y te protege siempre.',
   p:['<ol class="steps"><li>Descarga <b>Google Authenticator</b> desde la tienda oficial de tu celular.</li><li>En Binance entra a tu <b>Perfil → Seguridad</b> y elige la opción <b>Authenticator</b>.</li><li>Binance te muestra un código QR. En Google Authenticator toca <b>+</b> y escanéalo.</li><li>Escribe en Binance el código de 6 números que aparece en tu app para confirmar.</li><li>Si Binance te da una clave de respaldo, guárdala en papel junto a tus datos importantes.</li></ol>',
      'Los nombres de los botones pueden cambiar un poco según la versión de la app, pero los pasos son los mismos.'],
   do:'Si cambias de celular, pasa tus cuentas de Google Authenticator al teléfono nuevo <b>antes</b> de borrar el viejo.',
   img:'cripto/l4-2fa.jpg'},
  {k:'Capa 4 · Tu frase semilla',lead:'Lo más sagrado de todo este módulo.',
   p:['Si tienes una billetera propia, tu {{Frase semilla|frase semilla}} es la llave maestra. <b>Quien la tenga puede llevarse todo, desde cualquier lugar del mundo, sin tu celular ni tu contraseña.</b>',
      '<b>Así se protege:</b> escrita a mano en papel, revisada palabra por palabra, guardada en un lugar seguro y, mejor, con una segunda copia en otro lugar.',
      '<b>Nunca:</b> foto, captura de pantalla, notas del celular, correo, WhatsApp, Google Drive o iCloud. Y nunca la escribas en una página web que te la pida.'],
   do:'Regla absoluta: <b>ninguna plataforma, soporte técnico ni miembro de la comunidad te va a pedir jamás tu frase semilla</b>. Si alguien la pide, es una estafa.',
   art:'seed'},
  {check:true,q:'Alguien de “soporte de Binance” te pide tu frase semilla para “verificar tu cuenta”. ¿Qué haces?',
   o:['Se la doy si parece amable','Se la mando solo por mensaje privado','No se la doy nunca: es una estafa'],a:2,
   y:'Nadie legítimo te la pedirá jamás. Corta la conversación y, si tienes dudas, entra tú directamente a la app oficial.'},
  {k:'Capítulo 2 · Reconoce las estafas',lead:'Los ladrones no rompen la puerta: te piden que se la abras.',
   p:['<b>Páginas y mensajes falsos ({{Phishing|phishing}}):</b> te llega un correo o mensaje “de Binance” diciendo que tu cuenta será bloqueada, con un enlace a una página idéntica a la real. Si escribes ahí tu contraseña, se la das al ladrón.',
      '<b>Falso soporte:</b> alguien te escribe por WhatsApp o redes diciendo ser del soporte para “ayudarte”. Te pide contraseñas, códigos o que instales una app para controlar tu celular.',
      '<b>Apps falsas:</b> copias de Binance o Exodus que roban tus datos. Descarga solo desde la tienda oficial o el sitio oficial.'],
   art:'phish'},
  {k:'Capítulo 2 · Más estafas comunes',lead:'Si suena demasiado bueno para ser verdad, no es verdad.',
   p:['<b>“Te duplico tu cripto”:</b> videos falsos de famosos o empresarios, muchas veces creados con inteligencia artificial, que prometen devolverte el doble si envías primero. Nadie regala cripto.',
      '<b>Romance o amistad por internet:</b> alguien que conociste en línea gana tu confianza durante semanas y luego te invita a “invertir” en una plataforma que él controla, o te pide dinero por una emergencia.',
      '<b>Ganancias garantizadas:</b> nadie puede garantizarte ganancias en cripto. Quien lo promete con presión y prisa casi siempre está mintiendo.'],
   do:'La prisa es la mejor aliada del estafador. Ante la duda, no hagas nada: para, investiga y pregunta a alguien de confianza.',
   img:'cripto/l4-estafas.jpg'},
  {check:true,q:'Ves un video de un famoso que dice: “envía 100 USDT y te devuelvo 200”. ¿Qué es?',
   o:['Una promoción real por tiempo limitado','Una estafa: nadie regala cripto','Una inversión segura si el video se ve real'],a:1,
   y:'Si tienes que enviar primero para recibir después, es estafa. No importa qué tan real se vea el video.'},
  {k:'Capítulo 3 · Si crees que te hackearon',lead:'Actúa rápido, en este orden.',
   p:['<ol class="steps"><li><b>Cambia tu contraseña</b> de la plataforma y de tu correo, de preferencia desde otro dispositivo.</li><li>En Binance, desde Seguridad, <b>cierra todas las sesiones y dispositivos</b>. Si lo necesitas, <b>desactiva temporalmente tu cuenta</b> desde la misma app.</li><li><b>Contacta al soporte</b> solo desde la app o el sitio oficial, nunca desde enlaces que te manden.</li><li>Si tu billetera propia está comprometida, crea una nueva y mueve lo que quede.</li><li><b>Guarda capturas</b> de mensajes, correos y movimientos por si hay que denunciar.</li></ol>'],
   img:'cripto/l4-alerta.jpg'}
 ],
 tasks:{t:'Checklist: mi cuenta blindada.',d:'Palomea lo que ya tienes. Lo que falte, hazlo hoy.',
  items:[['Tengo una contraseña distinta y larga en Binance',''],['Mi correo tiene contraseña fuerte y 2FA',''],['Activé Google Authenticator en Binance',''],['Entro a Binance solo desde la app oficial o mis favoritos',''],['Si tengo billetera propia: mi frase semilla está en papel, en un lugar seguro','Si no tienes billetera propia, palomea este punto']],
  res:on=>{const f=on.filter(x=>!x).length;return f===0?'<b>¡Tu cuenta está blindada!</b> Revisa este checklist cada pocos meses.':`Te ${f===1?'falta':'faltan'} <b>${f}</b> ${f===1?'punto':'puntos'}. Hazlos hoy: cada uno cierra una puerta que los ladrones conocen muy bien.`;}},
 video:{yt:'AIbEJwuH7OQ',t:'Cómo activar Google Authenticator',d:'Míralo con tu celular a la mano y actívalo al mismo tiempo.'},
 recap:['Una <b>contraseña distinta</b> por plataforma, y tu <b>correo</b> protegido primero.','<b>2FA con app</b> (Google Authenticator), mejor que por SMS.','Tu <b>frase semilla</b> nunca se comparte ni se digitaliza: nadie legítimo te la pedirá.'],
 rule:'Ante la duda, no hagas nada. Para, investiga y pregunta. <b>La prisa es la mejor aliada del estafador.</b>',
 quiz:[
  {p:'¿Qué es la verificación en dos pasos (2FA)?',o:['Una contraseña doble para el correo','Un segundo nivel de verificación, además de tu contraseña','Un seguro bancario para cripto','Un tipo de billetera fría'],a:1,y:'Además de la contraseña, pide un código que solo aparece en tu celular.'},
  {p:'Si alguien te pide tu frase semilla para “verificar tu cuenta”, ¿qué haces?',o:['Se la doy si parece confiable','Se la mando por mensaje privado','La comparto solo con el soporte','Nunca la comparto: nadie legítimo la pide'],a:3,y:'Ninguna plataforma ni soporte real te pedirá tu frase semilla. Si la piden, es estafa.'},
  {p:'¿Qué es el phishing?',o:['Una forma de minar cripto','Una técnica para subir el precio de un token','Un engaño con páginas o mensajes falsos para robar tus datos','Un contrato inteligente'],a:2,y:'Copian la apariencia de una plataforma real para que escribas ahí tus datos.'},
  {p:'¿Qué 2FA es más seguro?',o:['Por SMS','Con una app como Google Authenticator','Por correo','Ninguno, mejor sin 2FA'],a:1,y:'El SMS es mejor que nada, pero tu número puede ser duplicado. La app es más segura.'},
  {p:'¿Por qué hay que proteger primero el correo electrónico?',o:['Porque ahí llegan las promociones','Porque con él se pueden restablecer tus otras contraseñas','Porque Binance lo exige','No hace falta protegerlo'],a:1,y:'Quien controla tu correo puede tomar el control de tus demás cuentas.'}
 ]},

/* =============== LECCIÓN 5 =============== */
{key:'cripto5',title:'Errores que cuestan dinero',
 desc:'Diez situaciones reales: eliges qué harías y descubres qué pasa y cómo evitarlo.',
 obj:'Al terminar podrás reconocer los errores más comunes antes de cometerlos, porque ya los habrás vivido en situaciones reales.',
 cards:[
  {k:'Para empezar',lead:'Aprender del error ajeno es la forma más barata de aprender.',
   p:['Los errores de esta lección los cometen personas reales todos los días. En cripto casi ninguno tiene vuelta atrás, pero <b>todos se pueden evitar</b> si los reconoces a tiempo.',
      'Esta lección es distinta: en lugar de leer una lista vas a vivir <b>diez situaciones</b>. En cada una elige qué harías. Después descubres qué pasa y cómo evitarlo.'],
   do:'Aquí no hay castigo por equivocarte. Equivocarte en la práctica es justo lo que te protege en la vida real.',
   img:'cripto/l5-errores.jpg'},
  {check:true,label:'Situación 1 de 10 · La red',q:'Vas a enviar USDT a una plataforma que te dio su dirección y te dijo “red TRC-20”. En Binance, al retirar, ves varias redes. ¿Qué haces?',
   o:['Elijo la red con la comisión más barata; cualquiera sirve','Elijo exactamente TRC-20, la red que me indicó la plataforma','Elijo la primera que aparece'],a:1,

async function loadCloud(){
  if(!USER||!db)return;
  if(LS('prog_uid')&&LS('prog_uid')!==USER.uid){Object.keys(localStorage).filter(k=>/^(done_|cr_)/.test(k)).forEach(k=>localStorage.removeItem(k));}
  LS('prog_uid',USER.uid);
  try{const s=await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').get();
    if(s.exists){const c=s.data().claves||{};Object.keys(c).forEach(k=>{if(c[k])LS(k,'1');});}}catch(e){}
}
async function saveCloud(key){
  if(!USER||!db)return;const claves={};claves['done_'+key]=1;
  try{await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').set({claves,actualizado:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}catch(e){}
}
function setDone(key){LS('done_'+key,'1');saveCloud(key);}

function recallHTML(i){
  if(i===0)return '';const q=LESSONS[i-1].quiz[0];

}
function answerRecall(i,j){const q=LESSONS[i-1].quiz[0],box=document.getElementById('recall');
  box.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===j)b.classList.add('bad');});
  document.getElementById('recall-fb').innerHTML=`<div class="fb ${j===q.a?'ok':'bad'}"><b>${j===q.a?'¡Bien recordado!':'Casi. Aquí va un repaso:'}</b>${q.y}</div>`;}

function learnInner(L){
  const pos=cardPos(L),c=L.cards[pos],n=L.cards.length,last=pos===n-1;
  const mx=Math.max(pos,parseInt(LS('cr_max_'+L.key))||0);LS('cr_max_'+L.key,String(mx));
  const dots=L.cards.map((x,k)=>`<i class="${x.check?'q ':''}${k<pos?'d':k===pos?'c':''} ${k<=mx&&k!==pos?'v':''}" ${k<=mx&&k!==pos?`onclick="jumpCard(${k})" title="Ir a la tarjeta ${k+1}"`:''}></i>`).join('');
  const answered=!c.check||LS(`cr_chk_${L.key}_${pos}`)!==null;
  return `<div class="learn-top"><span class="lbl">${pos+1} / ${n}</span><div class="dots">${dots}</div>${pos>0?`<button class="btn-restart" onclick="jumpCard(0)">↺ Desde el inicio</button>`:''}</div>
  ${c.check?checkHTML(L,c,pos):cardHTML(c)}
  <div class="learn-nav"><button class="btn-line" onclick="moveCard(-1)" ${pos===0?'disabled':''}>← Anterior</button>
    <span class="hint">${c.check&&!answered?'Elige una respuesta para continuar':''}</span>
    <button class="btn-gold" onclick="moveCard(1)" ${answered?'':'disabled'}>${last?'Terminar ✓':'Siguiente →'}</button></div>`;
}
function cardHTML(c){
  const quote=`<div class="quote">${c.lead}</div>`;
  const alt=c.art?ART[c.art]:quote;
  const qMode=!c.img&&!c.art;
  const vis=c.img?`<img src="${c.img}" alt="" onerror="visFail(this)"><div class="alt" hidden>${alt}</div>`:`<div class="alt">${alt}</div>`;
  return `<div class="card ${qMode?'q':''}" data-alt="${c.art?'art':'q'}"><div class="card-txt"><div class="card-k">${c.k}</div><div class="card-lead">${c.lead}</div>
    ${(c.p||[]).map(x=>/^\s*<(ol|table)/.test(x)?rich(x):`<p>${rich(x)}</p>`).join('')}
    ${c.ex?`<div class="card-ex"><span>EJEMPLO</span><p>${rich(c.ex)}</p></div>`:''}
    ${c.do?`<div class="card-do">${rich(c.do)}</div>`:''}
  </div><div class="card-vis${c.fit?' fit':''}">${vis}</div></div>`;
}
function visFail(img){img.parentElement.classList.remove('fit');const card=img.closest('.card');const alt=img.nextElementSibling;img.remove();if(alt)alt.hidden=false;if(card&&card.dataset.alt==='q')card.classList.add('q');}
function checkHTML(L,c,pos){
  const prev=LS(`cr_chk_${L.key}_${pos}`);const sel=prev===null?null:parseInt(prev);
  return `<div class="card" style="grid-template-columns:1fr;min-height:0"><div class="check">
   <div><div class="check-k">${c.label||'Pregunta rápida'}</div><div class="check-q">${c.q}</div><div class="check-h">${sel===null?'Elige la respuesta que te parezca correcta.':''}</div></div>
   <div><div class="opts">${c.o.map((o,j)=>{let cl='';if(sel!==null){if(j===c.a)cl='ok';else if(j===sel)cl='bad';}return `<button class="opt ${cl}" ${sel!==null?'disabled':''} onclick="answerCheck(${pos},${j})"><span class="l">${'ABC'[j]}</span>${o}</button>`;}).join('')}</div>
   ${sel!==null?`<div class="fb ${sel===c.a?'ok':'bad'}"><b>${sel===c.a?'¡Correcto!':'No exactamente'}</b>${rich(c.y)}</div>`:''}</div>
  </div></div>`;
}
function answerCheck(pos,j){const L=cur();LS(`cr_chk_${L.key}_${pos}`,String(j));const el=document.getElementById('learn');el.innerHTML=learnInner(L);el.querySelector('.card')?.classList.add('noanim');}
function moveCard(d){
  const L=cur(),pos=cardPos(L),n=L.cards.length;
  if(d>0&&pos===n-1){const first=!learned(L);LS('cr_learn_'+L.key,'1');document.getElementById('after').innerHTML=afterHTML(L);
    toast(first?'¡Tarjetas terminadas! Sigue abajo':'Repaso terminado');setTimeout(()=>{const p=document.getElementById('practice')||document.getElementById('after');p&&window.scrollTo({top:p.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'});},250);return;}
  LS('cr_card_'+L.key,String(Math.max(0,Math.min(n-1,pos+d))));
  const el=document.getElementById('learn');el.innerHTML=learnInner(L);
  window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'});
}
function afterHTML(L){
  if(!learned(L))return `<div class="locked"><span class="lk">✓</span><div>Termina las tarjetas de arriba y aquí se abrirán <b>tu práctica${L.video?', el video':''} y el quiz final</b>.</div></div>`;
  const T=L.tasks;let h='',s=1;
  if(T){
    if(L.key==='cripto0'&&LS('cr_task_cripto0_2')===null){const W=JSON.parse(LS('cr_where')||'{}');if(W.ex===1){LS('cr_task_cripto0_2','1');LS('cr_task_cripto0_0','1');}}
    const on=T.items.map((_,k)=>LS(`cr_task_${L.key}_${k}`)==='1');
    h+=`<div class="sec" id="practice"><span class="num">${s++}</span>Ponlo en práctica</div><p class="sec-d"><b>${T.t}</b> ${T.d}</p>
    <div class="tasks">${T.items.map(([t,sub],k)=>`<button class="task ${on[k]?'on':''}" onclick="toggleTask(${k})"><span class="bx">${on[k]?'✓':''}</span><div>${t}${sub?`<small>${sub}</small>`:''}</div></button>`).join('')}</div>
    <div class="task-res">${T.res(on)}</div>`;
  }
  if(L.video)h+=`<div class="sec"><span class="num">${s++}</span>Míralo en video <small>(opcional)</small></div><div id="vid"><button class="video-btn" onclick="playVideo('${L.video.yt}')"><span class="pl">▶</span><div><b>${L.video.t}</b><small>${L.video.d} Toca para verlo aquí mismo.</small></div></button></div>`;
  h+=`<div class="sec"><span class="num">${s++}</span>Recuerda</div><p class="sec-d">Si solo te quedas con tres ideas de esta lección, que sean estas:</p>
  <div class="recap">${L.recap.map((r,k)=>`<div><span>${k+1}</span><p>${r}</p></div>`).join('')}</div>
  ${L.rule?`<div class="rule"><div class="rule-l">Regla<br>de oro</div><p>${L.rule}</p></div>`:''}`;
  h+=`<div class="sec" id="quiz-sec"><span class="num">${s++}</span>Quiz final</div><div class="quiz-box" id="quiz">${quizInner(L)}</div>
  <div style="margin-top:1.2rem"><button class="btn-line" onclick="restartCards()">↺ Repasar las tarjetas</button></div>`;

function resetTasks(){const L=cur();L.tasks.items.forEach((_,k)=>LS(`cr_task_${L.key}_${k}`,'0'));const y=window.scrollY;document.getElementById('after').innerHTML=afterHTML(L);window.scrollTo(0,y);}

function restartCards(){const L=cur();LS('cr_card_'+L.key,'0');const el=document.getElementById('learn');el.innerHTML=learnInner(L);window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'});}

/* ---------- QUIZ ---------- */
function passN(L){return Math.ceil(L.quiz.length*0.7);}
function quizInner(L){
  const Q=ST.quiz;
  if(!Q||Q.key!==L.key){const ok=done(L.key);
    return `<div class="quiz-intro"><div class="qk">QUIZ · ${L.quiz.length} PREGUNTAS</div>
    <p>${ok?'Ya aprobaste este quiz. Puedes repetirlo cuando quieras para repasar.':`Responde con calma. Para aprobar necesitas <b>${passN(L)} de ${L.quiz.length}</b> respuestas correctas. Después de cada respuesta verás por qué es la correcta. Si no apruebas, puedes intentarlo de nuevo.`}</p>
    <button class="btn-gold" onclick="startQuiz()">${ok?'Repetir el quiz':'Empezar el quiz'} →</button></div>`;}
  if(Q.i>=L.quiz.length)return resultHTML(L);
  const q=L.quiz[Q.i],ans=Q.ans[Q.i];
  return `<div class="qbar"><i style="width:${Math.round(Q.i/L.quiz.length*100)}%"></i></div>
  <div class="qgrid"><div><div class="qk">PREGUNTA ${Q.i+1} DE ${L.quiz.length}</div><div class="qq">${q.p}</div></div>
  <div><div class="opts">${q.o.map((o,j)=>{let cl='';if(ans!==undefined){if(j===q.a)cl='ok';else if(j===ans)cl='bad';}return `<button class="opt ${cl}" ${ans!==undefined?'disabled':''} onclick="answerQuiz(${j})"><span class="l">${'ABCD'[j]}</span>${o}</button>`;}).join('')}</div>
  ${ans!==undefined?`<div class="fb ${ans===q.a?'ok':'bad'}"><b>${ans===q.a?'¡Correcto!':'Esta no era'}</b>${q.y}</div><div style="margin-top:1rem;text-align:right"><button class="btn-gold" onclick="nextQ()">${Q.i===L.quiz.length-1?'Ver mi resultado':'Siguiente pregunta'} →</button></div>`:''}</div></div>`;
}
function startQuiz(){ST.quiz={key:cur().key,i:0,ans:[]};paintQuiz();}
function answerQuiz(j){ST.quiz.ans[ST.quiz.i]=j;paintQuiz(false);}
function nextQ(){ST.quiz.i++;paintQuiz();}
function paintQuiz(scroll=true){const el=document.getElementById('quiz');el.innerHTML=quizInner(cur());if(scroll)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-80,behavior:'smooth'});}
function resultHTML(L){
  const Q=ST.quiz,ok=Q.ans.filter((a,k)=>a===L.quiz[k].a).length,pass=ok>=passN(L),i=LESSONS.indexOf(L),nx=LESSONS[i+1];
  if(pass&&!done(L.key)){setDone(L.key);setTimeout(()=>{toast(allDone()?'¡Completaste el módulo! Tu diploma está listo':'¡Lección completada!');refreshCards();},50);}
  const certBtn=pass&&allDone()?`<button class="btn-gold" onclick="showCert()">Ver mi diploma →</button>`:'';
  return `<div class="result"><div class="medal ${pass?'':'try'}">${pass?'✓':ok}</div><h3>${pass?'¡Lección completada!':'¡Casi lo logras!'}</h3>
  <p><b>${ok} de ${L.quiz.length}</b> respuestas correctas.</p>
  <p>${pass?'Excelente. Tu avance quedó guardado y esta lección ya aparece con ✓.':`Necesitas ${passN(L)} de ${L.quiz.length}. Repasa las tarjetas, sobre todo las palabras subrayadas, y vuelve a intentarlo. Aprender también es equivocarse.`}</p>
  <div class="btns">${certBtn}${pass&&!certBtn?(nx?`<button class="btn-gold" onclick="go(${i+2})">Ir a la lección ${i+2}: ${nx.title} →</button>`:`<a class="btn-gold" href="${GUIDE_URL}">Ir a la guía Tu primer USDT →</a>`)+`<button class="btn-line" onclick="go(0)">Ver todas las lecciones</button>`:pass?`<button class="btn-line" onclick="go(0)">Ver todas las lecciones</button>`:`<button class="btn-gold" onclick="startQuiz()">Intentar de nuevo</button><button class="btn-line" onclick="restartCards()">Repasar las tarjetas</button>`}</div></div>`;
}

function spaced(x,t,cx,y,sp){const w=[...t].reduce((s,ch)=>s+x.measureText(ch).width,0)+sp*(t.length-1);let px=cx-w/2;x.save();x.textAlign='left';for(const ch of t){x.fillText(ch,px,y);px+=x.measureText(ch).width+sp;}x.restore();}
function wrap(x,t,cx,y,maxW,lh){const words=t.split(' ');let line='';for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,cx,y);line=w;y+=lh;}else line=test;}if(line)x.fillText(line,cx,y);}

/* ---------- DICCIONARIO ---------- */
let DF=0;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function openDict(q){document.getElementById('dict').classList.add('open');closePop();const i=document.getElementById('dict-q');i.value=q||'';renderDict();if(!q&&window.innerWidth>820)setTimeout(()=>i.focus(),100);}
function closeDict(){document.getElementById('dict').classList.remove('open');}
function setDictFilter(f){DF=f;document.getElementById('df-all').classList.toggle('on',!f);document.getElementById('df-ess').classList.toggle('on',!!f);renderDict();}
function renderDict(){
  const q=norm(document.getElementById('dict-q').value.trim());
  const list=DICT.filter(d=>(!DF||d[4])&&(!q||norm(d[0]+' '+d[1]+' '+d[2]).includes(q))).sort((a,b)=>{const ia=q&&norm(a[0]).includes(q)?0:1,ib=q&&norm(b[0]).includes(q)?0:1;return ia-ib||norm(a[0]).localeCompare(norm(b[0]));});
  document.getElementById('dict-l').innerHTML=`<div class="dict-n">${list.length} ${list.length===1?'palabra':'palabras'} · Toca una para ver su explicación</div>`+
   (list.length?list.map(d=>`<details ${q&&list.length<=3?'open':''}><summary><b>${d[0]}${d[4]?'<span class="tag-e">Esencial</span>':''}</b><small>${d[1]}</small></summary><div class="dd">${d[2]}${d[3]?`<em>${d[3]}</em>`:''}</div></details>`).join(''):`<p class="sec-d">No encontramos esa palabra. Prueba con otra forma de escribirla o pregúntale a quien te invitó.</p>`);
}
function findTerm(t){const n=norm(t);return DICT.find(d=>norm(d[0])===n)||DICT.find(d=>norm(d[0]).startsWith(n));}
function pop(t){if(HOVER){const el=[...document.querySelectorAll('.term')].find(x=>x.dataset.t===t);if(el){showTip(el);return;}}const d=findTerm(t);if(!d)return;const p=document.getElementById('pop');
  p.innerHTML=`<b>${d[0]}</b><p>${d[2]}${d[3]?`<br><em>${d[3]}</em>`:''}</p><div class="row"><button class="btn-line" onclick="openDict()">Ver todo el diccionario</button><button class="btn-gold" onclick="closePop()">Entendido</button></div>`;p.classList.add('open');}
function closePop(){document.getElementById('pop').classList.remove('open');}

/* ---------- PALABRAS DEL DICCIONARIO: AL PASAR EL CURSOR ---------- */
const HOVER=window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches;
let tipT=null;
function showTip(el){
  const d=findTerm(el.dataset.t||'');if(!d)return;const tip=document.getElementById('tip');
  tip.innerHTML=`<b>${d[0]}</b><p>${d[2]}${d[3]?`<br><em>${d[3]}</em>`:''}</p><button onclick="openDict('${d[0].replace(/'/g,"\\'")}')">Ver en el diccionario →</button>`;
  tip.classList.add('open');
  const r=el.getBoundingClientRect(),th=tip.offsetHeight,tw=tip.offsetWidth;
  let top=r.bottom+8;if(top+th>window.innerHeight-10)top=Math.max(10,r.top-th-8);
  tip.style.top=top+'px';tip.style.left=Math.min(Math.max(12,r.left),window.innerWidth-tw-12)+'px';
}
function hideTip(){document.getElementById('tip').classList.remove('open');}
if(HOVER){
  document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t){clearTimeout(tipT);tipT=setTimeout(()=>showTip(t),120);return;}if(e.target.closest('#tip'))clearTimeout(tipT);});
  document.addEventListener('mouseout',e=>{if(e.target.closest('.term')||e.target.closest('#tip')){clearTimeout(tipT);tipT=setTimeout(hideTip,300);}});
  window.addEventListener('scroll',hideTip,{passive:true});
}

/* ---------- RECORRIDO INICIAL ---------- */
const TOUR=[
 {el:'#btn-dic',t:'Este es tu <b>Diccionario</b>. Siempre está arriba: si una palabra no te queda clara, búscala aquí.'},
 {el:'#btn-fs',t:'¿La letra se ve pequeña? Toca <b>A+</b> para hacerla más grande.'},
 {el:'#btn-map',t:'Con <b>Lecciones</b> regresas siempre a esta página, donde ves todo tu avance.'},
 {el:'.lc',t:'Empieza aquí. Toca la lección 1 cuando estés lista o listo. ¡Disfruta el recorrido!'}
];
let TI=0;
function maybeTour(){if(LS('cr_tour2')==='1'||ST.view!==0)return;TI=0;document.getElementById('tour').classList.add('open');showTour();}
function showTour(){const s=TOUR[TI],el=document.querySelector(s.el);if(!el){endTour();return;}
  el.scrollIntoView({block:'center'});
  setTimeout(()=>{const r=el.getBoundingClientRect(),hole=document.getElementById('tour-hole'),box=document.getElementById('tour-box');
    hole.style.cssText=`left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px`;
    box.innerHTML=`<small>PASO ${TI+1} DE ${TOUR.length}</small><p>${s.t}</p><div class="row"><button class="skip" onclick="endTour()">Saltar</button><button class="btn-gold" style="padding:.75rem 1.2rem" onclick="nextTour()">${TI===TOUR.length-1?'¡Listo!':'Siguiente →'}</button></div>`;
    const bh=box.offsetHeight,bw=box.offsetWidth;let top=r.bottom+16;if(top+bh>window.innerHeight-10)top=Math.max(10,r.top-bh-16);
    box.style.top=top+'px';box.style.left=Math.min(Math.max(12,r.left),window.innerWidth-bw-12)+'px';},250);}
function nextTour(){TI++;if(TI>=TOUR.length)endTour();else showTour();}
function endTour(){document.getElementById('tour').classList.remove('open');LS('cr_tour2','1');}

/* ---------- INICIO ---------- */
applyFont();
(function(){const h=location.hash.match(/^#l(\d)$/);if(h){const n=parseInt(h[1]);if(n>=1&&n<=LESSONS.length)ST.view=n;}})();
startAuth();
</script>
</body>
</html>
