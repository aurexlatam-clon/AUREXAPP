<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Digital · AUREX Academy</title>
<meta name="theme-color" content="#070707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9952A;--gold-l:#F0C96B;--bg:#070707;--green:#1D9E75;
  --surface:#111;--surface2:#171717;--border:#262626;
  --text:#f2efe9;--muted:#9a9ea6;--danger:#e05252;--blue:#93c5fd;
  --head:'Oswald','Arial Narrow',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html.fs1{font-size:112%}
html.fs2{font-size:125%}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;top:0;bottom:0;width:38vw;pointer-events:none;z-index:0}
body::before{left:-12vw;background:radial-gradient(ellipse 50% 40% at 30% 25%,rgba(201,149,42,.13),transparent 70%),radial-gradient(ellipse 35% 30% at 20% 80%,rgba(240,201,107,.07),transparent 70%)}
body::after{right:-12vw;background:radial-gradient(ellipse 50% 40% at 70% 60%,rgba(201,149,42,.12),transparent 70%),radial-gradient(ellipse 30% 25% at 80% 15%,rgba(240,201,107,.08),transparent 70%)}
.sparks{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 6% 18%,rgba(240,201,107,.7),transparent),radial-gradient(1px 1px at 12% 42%,rgba(240,201,107,.6),transparent),radial-gradient(2px 2px at 4% 66%,rgba(240,201,107,.5),transparent),radial-gradient(1px 1px at 9% 88%,rgba(240,201,107,.6),transparent),radial-gradient(1.5px 1.5px at 94% 22%,rgba(240,201,107,.7),transparent),radial-gradient(1px 1px at 89% 48%,rgba(240,201,107,.6),transparent),radial-gradient(2px 2px at 96% 74%,rgba(240,201,107,.5),transparent),radial-gradient(1px 1px at 91% 93%,rgba(240,201,107,.6),transparent)}
button{font-family:var(--body);cursor:pointer}
a{color:var(--gold-l)}
.wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:0 clamp(16px,3.5vw,52px)}
.top{position:sticky;top:0;z-index:30;background:rgba(7,7,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:.6rem;height:60px}
.top-back{background:none;border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;color:var(--muted);font-size:.88rem;text-decoration:none;white-space:nowrap}
.top-back:hover{border-color:var(--gold);color:var(--text)}
.top-logo{flex:1;font-family:var(--head);letter-spacing:.22em;color:var(--gold);font-size:1rem;text-align:center}
.top-logo small{color:var(--muted);letter-spacing:.18em;font-size:.72rem}
.top-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;padding:.5rem .8rem;font-weight:600;white-space:nowrap}
.top-btn:hover{border-color:var(--gold)}
.top-btn.dic{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.top-btn.dic:hover{background:var(--gold-l)}
.hero{position:relative;margin-top:1.4rem;border-radius:22px;border:1px solid rgba(201,149,42,.35);min-height:260px;display:flex;align-items:flex-end;padding:2rem;overflow:hidden;background:#0d0b07}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center right}
.hero-bg.fb{background:radial-gradient(ellipse 60% 90% at 85% 30%,rgba(201,149,42,.35),transparent 60%),radial-gradient(ellipse 50% 60% at 10% 100%,rgba(240,201,107,.12),transparent 70%),#0b0906}
.hero::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(7,7,7,.95) 25%,rgba(7,7,7,.2) 75%)}
.hero-in{position:relative;z-index:2;width:100%;max-width:760px}
.kick{font-family:var(--head);font-size:.78rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--head);font-size:2.8rem;text-transform:uppercase;font-weight:600;letter-spacing:.04em;margin:.35rem 0 .3rem;line-height:1.1}
.hero p{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:#e0d8c8}
.prog{display:flex;align-items:center;gap:.8rem;margin-top:1.2rem;font-size:.9rem;color:var(--muted);max-width:560px}
.bar{flex:1;height:7px;background:#222;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:4px;transition:width .5s}
main{padding:1.6rem 0 5rem}
.l-head{margin-top:1.6rem;padding:2rem 0 1.4rem;border-bottom:1px solid var(--border);margin-bottom:1.6rem}
.l-head .kick{font-size:.85rem}
.h{font-family:var(--head);font-size:2.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:.4rem 0 1.2rem;line-height:1.1}
.obj{background:linear-gradient(135deg,rgba(201,149,42,.14),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.45);border-radius:18px;padding:1.1rem 1.5rem;max-width:1100px}
.obj span{font-family:var(--head);font-size:.82rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.3rem}
.obj p{font-family:var(--serif);font-style:italic;font-size:1.55rem;line-height:1.35;color:var(--gold-l)}
.sec{font-family:var(--head);font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase;margin:3rem 0 .5rem;padding-top:2.2rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.7rem}
.sec .num{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-size:1rem;flex-shrink:0}
.sec small{font-family:var(--body);font-size:.88rem;letter-spacing:0;text-transform:none;color:var(--muted)}
.sec-d{font-size:1.04rem;color:var(--muted);margin-bottom:1.1rem;line-height:1.6;max-width:1000px}
.sec-d b{color:var(--text)}
.how{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.3);border-radius:16px;padding:1.1rem 1.4rem;margin:1.4rem 0;max-width:1100px}
.how-t{font-family:var(--head);font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:.55rem}
.how ol{padding-left:1.3rem;display:grid;gap:.4rem}
.how li{font-size:1.1rem;line-height:1.65;color:#e4dfd5}
.how li b{color:var(--gold-l)}
.btn-gold{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:var(--gold);color:#0a0a0a;font-family:var(--head);letter-spacing:.14em;font-size:1rem;padding:1rem 1.6rem;border-radius:13px;font-weight:600;border:none;text-transform:uppercase;text-decoration:none}
.btn-gold:hover{background:var(--gold-l)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-line{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:13px;padding:.95rem 1.3rem;font-size:1rem;text-decoration:none}
.btn-line:hover{border-color:var(--gold)}
.btn-line:disabled{opacity:.35;cursor:default}
.term{background:none;border:none;color:var(--gold-l);font:inherit;border-bottom:1.5px dotted var(--gold);padding:0;cursor:help}
.gate-box{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:rgba(224,82,82,.06);border:1px solid rgba(224,82,82,.4);border-radius:16px;padding:1.1rem 1.3rem;margin:1.2rem 0;max-width:1100px}
.gate-box div{flex:1;min-width:260px}
.gate-box b{color:#f3a3a3;font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:.3rem}
.gate-box p{font-size:1.02rem;line-height:1.6;color:#d8d4cc}
.gate-box p b{color:var(--text);font-family:var(--body);display:inline;text-transform:none;letter-spacing:0}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.lc{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem 1.3rem 1.2rem;color:var(--text);display:flex;flex-direction:column;gap:.5rem;transition:border-color .2s,transform .2s;overflow:hidden}
.lc:hover{border-color:rgba(201,149,42,.55);transform:translateY(-2px)}
.lc .n{font-family:var(--head);font-size:2.4rem;color:rgba(240,201,107,.3);line-height:1}
.lc b{font-family:var(--head);font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase}
.lc p{font-size:.98rem;line-height:1.55;color:#b9b5ad;flex:1}
.lc .st{font-size:.85rem;align-self:flex-start;border-radius:20px;padding:.3rem .75rem;border:1px solid var(--border);color:var(--muted)}
.lc.next{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(201,149,42,.1)}
.lc.next .st{background:var(--gold);color:#0a0a0a;border-color:var(--gold);font-weight:600}
.lc.done{border-color:rgba(29,158,117,.45)}
.lc.done .st{color:var(--green);border-color:rgba(29,158,117,.5)}
.lc.cur{background:linear-gradient(135deg,rgba(201,149,42,.12),transparent)}
.lc.cur .st{color:var(--gold-l);border-color:rgba(201,149,42,.5)}
.nextbig{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(120deg,rgba(201,149,42,.16),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.5);border-radius:22px;padding:1.6rem 1.8rem;margin-bottom:1.6rem}
.nextbig small{font-family:var(--head);letter-spacing:.26em;color:var(--gold);font-size:.8rem}
.nextbig h3{font-family:var(--head);font-size:1.8rem;text-transform:uppercase;letter-spacing:.04em;margin:.3rem 0}
.nextbig p{font-size:1.04rem;color:#cfcac0;line-height:1.55;max-width:700px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.howto>div{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem}
.howto .i{width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,149,42,.6);color:var(--gold-l);display:grid;place-items:center;font-family:var(--head);font-size:1.2rem}
.howto .ht{font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;display:block;margin:.6rem 0 .25rem;font-size:1.1rem}
.howto p{font-size:1rem;line-height:1.6;color:#b9b5ad}
.where{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.where-q{display:flex;flex-direction:column;justify-content:space-between;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem}
.where-q p{font-size:1.04rem;line-height:1.5}
.yn{display:flex;gap:.5rem}
.yn button{flex:1;border:1px solid var(--border);background:#0b0b0b;color:var(--text);border-radius:10px;padding:.7rem .9rem;font-size:1rem}
.yn button.sel{background:rgba(201,149,42,.18);border-color:var(--gold);color:var(--gold-l);font-weight:600}
.reco{margin-top:1rem;border-radius:16px;padding:1.2rem 1.4rem;background:linear-gradient(135deg,rgba(201,149,42,.12),transparent);border:1px solid rgba(201,149,42,.45)}
.reco>b{font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);display:block;margin-bottom:.3rem}
.reco p{font-size:1.04rem;line-height:1.65;color:#d8d4cc}
.side-box{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;background:#0d0d0d;border:1px dashed rgba(201,149,42,.5);border-radius:18px;padding:1.3rem 1.5rem;margin-top:1.4rem}
.side-box p{flex:1;min-width:260px;font-size:1.04rem;line-height:1.6;color:#cfcac0}
.side-box b{color:var(--gold-l)}
.learn{background:#171614;border:1px solid #2c2a26;border-radius:24px;overflow:hidden}
.learn-top{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid #2c2a26;background:#141312}
.learn-top .lbl{font-family:var(--head);letter-spacing:.2em;font-size:.85rem;color:var(--gold);white-space:nowrap}
.dots{display:flex;gap:.35rem;flex:1;flex-wrap:wrap;align-items:center}
.dots i{width:24px;height:6px;border-radius:3px;background:#2a2a2a}
.dots i.d{background:var(--gold)}
.dots i.c{background:var(--gold-l);box-shadow:0 0 0 2px rgba(240,201,107,.25)}
.dots i.q{width:10px;height:10px;border-radius:50%}
.dots i.q.d{background:var(--green)}
.dots i.v{cursor:pointer}
.dots i.v:hover{outline:2px solid rgba(240,201,107,.6);outline-offset:2px}
.btn-restart{background:transparent;border:1px solid #3a352c;color:#d8cfbd;border-radius:10px;padding:.45rem .85rem;font-size:.9rem;white-space:nowrap}
.btn-restart:hover{border-color:var(--gold);color:var(--gold-l)}
.dots i.q.c{background:var(--blue);box-shadow:0 0 0 2px rgba(147,197,253,.3)}
.card{display:grid;grid-template-columns:1.15fr 1fr;min-height:430px;animation:fade .35s ease}
.card.noanim{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-txt{padding:2.2rem 2.4rem}
.card-k{font-family:var(--head);font-size:.82rem;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.card-lead{font-family:var(--serif);font-style:italic;font-size:2.05rem;line-height:1.25;color:var(--gold-l);margin:.5rem 0 1.1rem}
.card.q .card-lead{display:none}
.card.q .card-k{margin-bottom:1rem}
.card-txt p{font-size:1.24rem;line-height:1.85;color:#e4dfd5;margin-bottom:1rem;letter-spacing:.005em}
.card-txt p b{color:#f6e7c8;font-weight:600;letter-spacing:.012em}
.card-ex{border-left:3px solid var(--gold);background:rgba(201,149,42,.07);border-radius:0 12px 12px 0;padding:.85rem 1.1rem;margin:1.1rem 0}
.card-ex span{font-family:var(--head);font-size:.76rem;letter-spacing:.22em;color:var(--gold);display:block;margin-bottom:.25rem}
.card-ex p{margin:0!important;font-size:1.16rem!important}
.card-do{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.3);border-radius:12px;padding:.85rem 1.1rem;font-size:1.12rem;line-height:1.65;color:var(--blue);margin-top:1.1rem}
.card-do b{color:#cfe3ff}
.card-vis{background:radial-gradient(ellipse at 50% 40%,rgba(201,149,42,.13),transparent 70%),#121110;border-left:1px solid #2c2a26;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:.8rem;position:relative;overflow:hidden}
.card-vis>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-vis.fit{padding:0;background:#000;border-left-color:#000}
.card-vis.fit>img{position:static;width:100%;height:auto;max-height:100%;object-fit:contain;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%)}
@media(max-width:820px){.card-vis.fit>img{-webkit-mask-image:none;mask-image:none}}
.card-vis .alt{width:100%;display:flex;flex-direction:column;align-items:center;gap:.9rem}
.card-vis .alt[hidden]{display:none}
.quote{font-family:var(--serif);font-style:italic;font-size:2.1rem;line-height:1.3;color:var(--gold-l);max-width:440px}
.quote::before{content:'';display:block;width:56px;height:2px;background:var(--gold);margin:0 auto 1.2rem}
.vis-l{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--gold-l);line-height:1.35;max-width:380px}
ol.steps{list-style:none;counter-reset:s;display:grid;gap:.6rem;margin:.3rem 0 .9rem}
ol.steps li{counter-increment:s;display:block;position:relative;padding-left:2.6rem;font-size:1.2rem;line-height:1.7;color:#e4dfd5}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.15rem;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:1rem;line-height:1}
ol.steps li b{color:#f6e7c8;font-weight:600;letter-spacing:.012em}
.tbl{width:100%;border-collapse:collapse;font-size:1.08rem;margin:.2rem 0 .6rem}
.tbl th{font-family:var(--head);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;color:var(--gold);text-align:left;padding:.5rem .6rem;border-bottom:1px solid rgba(201,149,42,.4)}
.tbl td{padding:.65rem .6rem;border-bottom:1px solid #2c2a26;color:#e4dfd5;vertical-align:top}
.tbl td:first-child{color:var(--gold-l);font-family:var(--head)}
.tbl .st{color:#7fdcbc}
.tbl tr.ex td{color:var(--muted)}
.a-time{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.35rem;max-width:460px}
.a-time div{border:1px solid var(--border);background:#131313;border-radius:12px;padding:.6rem .7rem;min-width:84px}
.a-time div b{display:block;font-family:var(--head);color:var(--gold);font-size:.8rem;letter-spacing:.1em}
.a-time div span{font-size:.9rem;color:#d8d4cc}
.a-time div.hi{border-color:var(--gold);background:rgba(201,149,42,.14)}
.a-time div.hi span{color:var(--gold-l);font-weight:600}
.a-time i{color:var(--gold);font-style:normal}
.a-nb{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:420px;width:100%}
.a-nb div{background:#f3ead6;color:#2b2416;border-radius:6px 10px 10px 6px;padding:.55rem .5rem .55rem .9rem;font-size:.74rem;line-height:1.55;text-align:left;border-left:4px solid #b88a2a;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.a-nb div small{display:block;font-family:var(--head);letter-spacing:.1em;color:#8a6a24;font-size:.62rem;margin-bottom:.2rem}
.a-nb div.bad{background:#f6dcd6;border-left-color:#c0392b}
.a-nb div.bad s{color:#c0392b}
.a-nb div.bad em{display:block;font-style:normal;color:#c0392b;font-weight:600;font-size:.68rem;margin-top:.15rem}
.a-pil{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;max-width:440px;width:100%}
.a-pil div{border:1px solid rgba(201,149,42,.4);background:#121212;border-radius:12px;padding:.8rem .7rem;text-align:left}
.a-pil div:last-child{grid-column:1/-1}
.a-pil.q4 div:last-child{grid-column:auto}
.a-pil b{display:block;font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-l);font-size:.9rem}
.a-pil span{font-size:.86rem;color:#b9b5ad}
.a-lad{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;width:100%;max-width:460px}
.a-lad div{border:1px solid var(--border);border-radius:12px;padding:.8rem .3rem;background:#121212;font-size:.86rem;color:#cfcac0;display:flex;flex-direction:column;gap:.3rem;align-items:center;justify-content:flex-end}
.a-lad div i{display:block;width:70%;background:linear-gradient(0deg,var(--gold),rgba(201,149,42,.3));border-radius:4px}
.a-lad div.hi{border-color:var(--gold);color:var(--gold-l);background:rgba(201,149,42,.1)}
.a-ax{display:flex;justify-content:space-between;width:100%;max-width:460px;font-size:.84rem;color:var(--muted)}
.a-irr{display:flex;flex-direction:column;gap:.7rem;align-items:center}
.a-irr .ok{border:1px solid rgba(29,158,117,.6);background:rgba(29,158,117,.1);color:#7fdcbc;border-radius:14px;padding:1rem 1.4rem;font-family:var(--head);letter-spacing:.1em;font-size:1.05rem}
.a-irr .no{border:1px dashed #555;color:#777;border-radius:12px;padding:.6rem 1.2rem;font-family:var(--head);letter-spacing:.1em;text-decoration:line-through}
.a-cmc{width:100%;max-width:440px;background:#0f0f0f;border:1px solid var(--border);border-radius:14px;overflow:hidden;text-align:left}
.a-cmc .hd{display:flex;justify-content:space-between;padding:.6rem .9rem;font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.a-cmc .r{display:grid;grid-template-columns:28px 1fr auto;gap:.6rem;padding:.55rem .9rem;border-bottom:1px solid #1d1d1d;font-size:.92rem}
.a-cmc .r b{color:var(--gold-l);font-family:var(--head)}

   p:['Tu <b>perfil personal</b> es tu cuenta de siempre: tus fotos, tu familia, tus amistades. Tiene un límite de amigos y Facebook pide que no se use principalmente para negocios.',
      'Una {{Fanpage|página}} (también le dicen <b>fanpage</b>) es la cara de tu proyecto. Puede tener seguidores sin límite, estadísticas, un botón de WhatsApp y, lo más importante, <b>se conecta con Instagram, con WhatsApp Business y con las herramientas de Meta</b>.',
      'Si algún día quieres hacer publicidad, también la necesitas: <b>los anuncios se hacen desde una página, no desde un perfil</b>.'],
   art:'profpage'},
  {check:true,q:'¿Por qué necesitas una página de Facebook y no solo tu perfil?',
   o:['Porque se ve más bonita','Porque la página se conecta con Instagram, WhatsApp Business y las herramientas de Meta','Porque el perfil cuesta dinero'],a:1,
   y:'La página es la que se conecta con todo tu ecosistema y la que permite estadísticas y publicidad.'},
  {k:'Capítulo 5 · Las piezas de tu ecosistema',lead:'Esta es la base que vas a construir en la Fase 1.',
   p:['<ol class="steps"><li><b>WhatsApp Business</b> para conversar como profesional (lección 3).</li><li><b>Tu página de Facebook</b> para tu comunidad (lección 4).</li><li><b>Instagram profesional</b> para tu marca (lección 5).</li><li><b>Todo conectado con Meta</b>, para manejarlo desde un solo lugar (lección 6).</li></ol>',
      'Si alguna pieza ya la tienes, perfecto: en esa lección usa el botón <b>“Ya lo tengo listo”</b>.'],
   art:'connect'},
  {k:'Para cerrar · Una red a la vez',lead:'No tienes que dominar las tres hoy.',
   p:['El error más común es querer hacerlo todo al mismo tiempo y terminar sin hacer nada.',
      'Aquí vas <b>una red a la vez</b>, en orden. Cuando termines la Fase 1, tendrás tu ecosistema completo y conectado.',
      'Empieza por la red donde ya está tu gente: <b>WhatsApp</b>.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 tasks:{t:'¿Dónde está mi gente?',d:'Toca lo que sea cierto para ti. Te ayuda a saber qué red cuidar primero.',
  items:[['La mayoría de mis contactos me conoce por WhatsApp',''],['Tengo amistades y familia activas en Facebook',''],['Estoy en grupos de Facebook de mi ciudad o de temas que me gustan',''],['Me gustaría que gente nueva me conociera por mi imagen','']],
  res:on=>{let m='';if(on[0])m+='<b>WhatsApp</b> es tu canal más fuerte: ahí empezarás a conversar. ';if(on[1]||on[2])m+='<b>Facebook</b> te conecta con tu comunidad: tu página será clave. ';if(on[3])m+='<b>Instagram</b> será tu aparador para gente nueva. ';return m||'Toca las opciones que sean ciertas para ti y te decimos qué red cuidar primero.';}},
 recap:['<b>Meta</b> es la empresa dueña de WhatsApp, Facebook e Instagram, por eso se pueden conectar.','<b>WhatsApp</b> es tu mostrador, <b>Facebook</b> tu comunidad e <b>Instagram</b> tu aparador.','Tu <b>perfil</b> eres tú; tu <b>página</b> es tu proyecto, y es la que se conecta con todo.'],
 rule:'Cada red tiene un papel. <b>No publiques igual en todas: háblale a quien está en cada una.</b>',
 quiz:[
  {p:'¿Qué es Meta?',o:['Una red social nueva','La empresa dueña de Facebook, Instagram y WhatsApp','Un tipo de publicación','Una app para editar fotos'],a:1,y:'Meta es la empresa que tiene Facebook, Instagram y WhatsApp. Por eso se pueden conectar.'},
  {p:'¿Cuál es el papel principal de WhatsApp?',o:['Que te descubra gente nueva','Conversar uno a uno con quien ya te conoce','Hacer anuncios','Subir videos largos'],a:1,y:'WhatsApp es tu mostrador: ahí conversas con tu mercado cálido.'},
  {p:'¿Para qué funciona muy bien Facebook?',o:['Para tu comunidad, grupos y mostrar productos y servicios','Solo para mandar mensajes','Solo para jóvenes','Para nada'],a:0,y:'Facebook es la red de la comunidad y la confianza: grupos, historias y productos.'},
  {p:'¿Qué red cuidas más para tu imagen profesional?',o:['Instagram','La calculadora','El correo','Ninguna'],a:0,y:'Instagram es tu aparador: ahí se construye tu imagen y te descubre gente nueva.'},
  {p:'¿Desde dónde se hacen los anuncios de Facebook?',o:['Desde tu perfil personal','Desde una página','Desde WhatsApp normal','No se pueden hacer'],a:1,y:'La publicidad se hace desde una página. Por eso tu página es parte de tu base.'}
 ]},
/* ================= FASE 1 · LECCIÓN 3 ================= */
{key:'mkt2',phase:1,fast:true,title:'WhatsApp Business',
 desc:'Pasa a WhatsApp Business y configúralo como profesional: perfil, mensajes automáticos, respuestas rápidas y etiquetas.',
 obj:'Al terminar tendrás WhatsApp Business instalado, con tu perfil de empresa completo y sus herramientas listas para conversar y dar seguimiento.',
 cards:[
  {k:'Capítulo 1 · Dos WhatsApp',lead:'Existe el WhatsApp de siempre… y WhatsApp Business.',
   p:['Los dos son <b>gratuitos</b> y se ven casi igual. La diferencia es que {{WhatsApp Business|WhatsApp Business}} está hecho para quien emprende.',
      'Con él tienes un <b>perfil de empresa</b> (descripción, horario, link), <b>mensajes automáticos</b>, <b>respuestas rápidas</b> y <b>etiquetas</b> para organizar tus conversaciones.',
      'Tus contactos te siguen escribiendo igual. Solo verán que eres una cuenta de empresa, lo cual transmite seriedad.'],
   art:'wab'},
  {k:'Capítulo 2 · ¿Mismo número u otro?',lead:'Antes de descargarlo, decide qué número vas a usar.',
   p:['<b>Opción 1 · Tu mismo número.</b> Pasas tu número a WhatsApp Business y conservas tus chats. Ese número ya no funcionará en el WhatsApp normal: las dos apps no pueden usar el mismo número en el mismo celular. WhatsApp Business te sirve igual para tus pláticas personales.',
      '<b>Opción 2 · Otro número.</b> Usas otro chip o una eSIM solo para tu proyecto. Separas lo personal del negocio, pero empiezas con menos contactos.',
      'Para empezar, la mayoría elige la <b>opción 1</b>: tu gente ya tiene tu número.'],
   do:'Antes de cambiarte, haz una <b>copia de seguridad</b> de tus chats: en WhatsApp ve a <b>Ajustes → Chats → Copia de seguridad</b> y toca <b>Guardar</b>.'},
  {k:'Paso 1 · Descárgalo y pasa tu número',lead:'En 10 minutos tienes WhatsApp Business funcionando.',
   p:['<ol class="steps"><li>Abre <b>Play Store</b> (Android) o <b>App Store</b> (iPhone) y busca <b>WhatsApp Business</b>. Revisa que el autor sea <b>WhatsApp LLC</b>.</li><li>Toca <b>Instalar</b> y ábrelo.</li><li>Acepta las condiciones y escribe tu número. Si ya lo usas en WhatsApp, la app te ofrece <b>pasar tu cuenta</b> con tus chats: acepta.</li><li>Escribe el código que te llega por SMS.</li><li>Pon el <b>nombre de tu proyecto</b> o tu nombre, elige una <b>categoría</b> y tu foto.</li></ol>'],
   g:['wa-business'],img:'marketing/l3-descarga.jpg'},
  {check:true,q:'Si pasas tu número a WhatsApp Business, ¿qué pasa con tus chats?',
   o:['Se borran todos','Los conservas si aceptas pasar tu cuenta y tienes tu copia de seguridad','Se quedan en el otro WhatsApp y los puedes usar a la vez'],a:1,
   y:'Al pasar tu cuenta con tu copia de seguridad, tus chats se vienen contigo. Lo que no puedes es usar el mismo número en las dos apps a la vez.'},
  {k:'Paso 2 · Tu perfil de empresa',lead:'Tu perfil de empresa es tu tarjeta de presentación.',
   p:['Entra a <b>Ajustes → Herramientas para la empresa → Perfil de empresa</b> y llena:',
      '<ol class="steps"><li><b>Foto:</b> tu cara, de frente y con buena luz. La misma que usarás en todas tus redes.</li><li><b>Descripción:</b> quién eres y qué compartes, sin promesas de dinero.</li><li><b>Categoría:</b> por ejemplo, Educación o Servicios.</li><li><b>Horario</b> en que respondes.</li><li><b>Sitio web:</b> el link de tu embudo AUREX o de tu página.</li></ol>'],
   ex:'Descripción: “Comparto lo que aprendo sobre emprendimiento digital. Comunidad AUREX 🌟 Escríbeme y platicamos.”',
   g:['wa-perfil'],img:'marketing/l3-perfil.jpg'},
  {k:'Paso 3 · Tu privacidad',lead:'Que te vean quienes te escriben y tus estados lleguen a tus contactos.',
   p:['En <b>Ajustes → Privacidad</b>:',
      '<ol class="steps"><li><b>Foto del perfil:</b> Todos.</li><li><b>Info:</b> Todos.</li><li><b>Estado:</b> Mis contactos.</li><li><b>Confirmaciones de lectura:</b> activado. Sin esto no puedes ver quién miró tu estado.</li></ol>'],
   g:['wa-privacidad']},
  {k:'Paso 4 · Mensajes automáticos',lead:'WhatsApp Business responde por ti cuando no puedes.',
   p:['En <b>Herramientas para la empresa</b> encuentras dos mensajes automáticos:',
      '<b>Mensaje de bienvenida:</b> se envía la primera vez que alguien te escribe, o si no te ha escrito en 14 días.',
      '<b>Mensaje de ausencia:</b> se envía cuando estás fuera de tu horario.'],
   ex:'Bienvenida: “¡Hola! 😊 Gracias por escribirme. En un momento te respondo.” · Ausencia: “¡Hola! Ahorita no estoy disponible. Te respondo hoy mismo en cuanto me desocupe.”',
   g:['wa-herramientas']},
  {k:'Paso 5 · Respuestas rápidas',lead:'Escribe una vez, úsalo muchas veces.',
   p:['Una <b>respuesta rápida</b> es un mensaje guardado con un atajo. Escribes una diagonal y el atajo, por ejemplo <b>/info</b>, y aparece tu mensaje completo.',
      'Crea 3 para empezar: <b>/hola</b> (tu saludo), <b>/info</b> (el mensaje con tu link) y <b>/zoom</b> (la invitación con horarios).',
      'Ahorras tiempo y todos tus mensajes salen claros y sin errores.'],
   ex:'/info → “Te comparto la información para que la revises con calma. Al final me dices qué te pareció 😊 👇 [tu link]”',
   g:['wa-herramientas']},
  {k:'Paso 6 · Etiquetas',lead:'Las etiquetas son tu seguimiento, a colores.',
   p:['Con las <b>etiquetas</b> marcas cada chat según en qué paso va la persona. Así, de un vistazo, sabes a quién escribirle hoy.',
      'Crea estas cuatro: <b>Nuevo prospecto</b>, <b>Vio la información</b>, <b>Zoom agendado</b> y <b>Comunidad</b>.',
      'Para etiquetar un chat, mantén el dedo sobre él y elige la etiqueta.'],
   g:['wa-herramientas'],art:'labels'},
  {check:true,q:'¿Para qué sirven las etiquetas de WhatsApp Business?',
   o:['Para cambiar el color de la app','Para saber en qué paso va cada persona y a quién escribirle hoy','Para bloquear contactos'],a:1,
   y:'Las etiquetas ordenan tu seguimiento: ves de un vistazo quién es nuevo, quién vio la información y quién tiene Zoom.'},
  {k:'Paso 7 · WhatsApp Web',lead:'Tus mismos chats, en la pantalla de tu computadora.',
   p:['Si tienes computadora, WhatsApp Web te deja escribir con teclado y ver todo más grande.',
      '<ol class="steps"><li>En la computadora entra a <b>web.whatsapp.com</b>.</li><li>En tu celular abre WhatsApp Business → <b>Dispositivos vinculados</b> → <b>Vincular un dispositivo</b>.</li><li>Apunta la cámara al código QR de la pantalla.</li></ol>',
      'Al terminar, cierra la sesión si la computadora no es tuya.'],
   g:['wa-web']},
  {k:'Para cerrar · Tu mostrador está listo',lead:'Ya conversas como profesional.',
   p:['Tienes perfil de empresa, privacidad configurada, mensajes automáticos, respuestas rápidas y etiquetas.',
      'En la lección 6 vas a conectar tu WhatsApp Business con tu página de Facebook, para que el botón de tu página te mande directo aquí.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu checklist y el quiz.'}
 ],
 guides:['wa-business','wa-perfil','wa-privacidad','wa-herramientas','wa-web'],
 tasks:{t:'Mi WhatsApp Business',d:'Toca cada punto cuando lo tengas listo.',
  items:[['Instalé WhatsApp Business y pasé mi cuenta',''],['Perfil de empresa: foto, descripción, categoría y horario',''],['Puse mi link en Sitio web',''],['Privacidad configurada y confirmaciones de lectura activadas',''],['Mensaje de bienvenida y de ausencia activados',''],['Creé mis respuestas rápidas /hola, /info y /zoom',''],['Creé mis 4 etiquetas','']],
  res:on=>{const n=on.filter(Boolean).length;return n===7?'<b>¡Tu WhatsApp Business está listo!</b> Pasa a la lección 4: tu página de Facebook.':`Llevas <b>${n} de 7</b>. Si algún paso no te sale, abre la guía de abajo.`;}},
 recap:['<b>WhatsApp Business</b> es gratis y está hecho para emprender: perfil de empresa, mensajes automáticos, respuestas rápidas y etiquetas.','Puedes pasar <b>tu mismo número</b> conservando tus chats, pero no usarlo en las dos apps a la vez.','Las <b>etiquetas</b> son tu seguimiento: de un vistazo sabes a quién escribirle hoy.'],
 rule:'Tu WhatsApp es tu mostrador: <b>que se vea profesional antes de que alguien te escriba</b>.',
 quiz:[
  {p:'¿Cuánto cuesta WhatsApp Business?',o:['Una mensualidad','Es gratuito','Solo se paga el primer mes','Depende del país'],a:1,y:'WhatsApp Business es gratuito, igual que WhatsApp normal.'},
  {p:'¿Puedes usar el mismo número en WhatsApp normal y en WhatsApp Business al mismo tiempo, en el mismo celular?',o:['Sí, sin problema','No: cada número se usa en una sola de las dos apps','Solo los fines de semana','Solo en iPhone'],a:1,y:'Al pasar tu número a Business, deja de funcionar en el WhatsApp normal.'},
  {p:'¿Qué hace el mensaje de ausencia?',o:['Borra tus chats','Responde automáticamente cuando estás fuera de tu horario','Bloquea a quien te escribe','Publica un estado'],a:1,y:'El mensaje de ausencia avisa que respondes después, para que nadie se quede sin respuesta.'},
  {p:'Escribes /info y aparece tu mensaje completo. ¿Qué herramienta es?',o:['Una etiqueta','Una respuesta rápida','Un estado','Un catálogo'],a:1,y:'Las respuestas rápidas guardan mensajes que usas seguido, con un atajo.'},
  {p:'¿Qué conviene poner en Sitio web de tu perfil de empresa?',o:['Nada','El link de tu embudo AUREX o de tu página','Tu dirección de casa','Tu número de cuenta'],a:1,y:'Así, quien vea tu perfil puede conocer más sin que tengas que explicarlo.'}
 ]},
/* ================= FASE 1 · LECCIÓN 4 ================= */
{key:'mkt3',phase:1,fast:true,title:'Facebook: tu perfil y tu página',
 desc:'Ordena tu perfil personal y crea tu página de Facebook paso a paso, con su botón de WhatsApp.',
 obj:'Al terminar tendrás tu perfil personal en orden y tu página de Facebook creada, completa y lista para conectarse con tu ecosistema.',
 cards:[
  {k:'Capítulo 1 · Primero, tu perfil',lead:'Tu página se crea desde tu perfil personal.',
   p:['Para tener una página necesitas una cuenta personal de Facebook. Si no tienes, créala: descarga la app <b>Facebook</b>, toca <b>Crear cuenta nueva</b> y sigue los pasos con tu nombre real.',
      'Si ya la tienes, dale una revisada: <b>foto de tu cara</b>, la misma que en WhatsApp, y tu <b>ciudad</b>.',
      'Tu perfil no se vuelve tu negocio. Es tu llave para crear y administrar tu página. Nadie verá tus fotos personales en la página.'],
   img:'marketing/l4-perfil.jpg'},
  {k:'Capítulo 2 · Elige el nombre de tu página',lead:'El nombre es lo primero que la gente lee.',
   p:['La fórmula más clara: <b>tu nombre + lo que compartes</b>.',
      'Evita ponerle solo “AUREX”: la gente debe saber que <b>eres tú</b>, una persona real, y no la empresa.',
      'Elige algo fácil de escribir y de recordar. Lo vas a usar en todas tus redes.'],
   ex:'“Carmen López · Emprendimiento digital” · “Luis Pérez | Aprende lo digital” · “Rosy Martínez · Negocios desde el celular”.',
   art:'fbsteps'},
  {k:'Paso 1 · Crea tu página',lead:'Desde la app de Facebook, en 5 minutos.',
   p:['<ol class="steps"><li>Abre Facebook y toca el <b>Menú ☰</b> (arriba a la derecha en Android, abajo a la derecha en iPhone).</li><li>Toca <b>Páginas</b> y luego <b>Crear</b> (o el <b>+</b>).</li><li>Toca <b>Empezar</b>. Escribe el <b>nombre</b> de tu página.</li><li>Elige una <b>categoría</b>: por ejemplo, <b>Emprendedor</b>, <b>Creador digital</b> o <b>Educación</b>.</li><li>Escribe una <b>descripción</b> corta y toca <b>Crear</b>.</li></ol>'],
   g:['fb-pagina'],img:'marketing/l4-crear.jpg'},
  {check:true,q:'¿Qué nombre conviene para tu página?',
   o:['Solo “AUREX”','Tu nombre + lo que compartes','Un nombre en clave que nadie entienda'],a:1,
   y:'Tu nombre + lo que compartes: así la gente sabe que eres una persona real y de qué se trata.'},
  {k:'Paso 2 · Foto y portada',lead:'Tu página se juzga en 3 segundos.',
   p:['<b>Foto de perfil:</b> tu cara, la misma de tus otras redes.',
      '<b>Portada:</b> la imagen grande de arriba. Puede ser una imagen de AUREX o una que hagas en <b>Canva</b> con una frase que diga qué compartes.',
      'Revisa cómo se ve en el celular: la portada se recorta en los lados, así que pon el texto al centro.'],
   ex:'Portada: fondo dorado y negro con la frase “Aprende a emprender desde tu celular”.',
   img:'marketing/l4-portada.jpg'},
  {k:'Paso 3 · Completa tu información',lead:'Una página completa da confianza.',
   p:['Entra a tu página → <b>Editar</b> o <b>Información</b> y llena:',
      '<ol class="steps"><li><b>Descripción:</b> a quién le hablas y qué encuentra contigo.</li><li><b>Ciudad</b> o zona.</li><li><b>Contacto:</b> tu WhatsApp Business.</li><li><b>Sitio web:</b> el link de tu embudo AUREX.</li><li><b>Horario</b>, si quieres.</li></ol>',
      'Es la misma información de tu WhatsApp Business. Que coincida en todas tus redes.']},
  {k:'Paso 4 · El botón de WhatsApp',lead:'Que te escriban con un solo toque.',
   p:['Tu página puede tener un botón grande que diga <b>Enviar mensaje de WhatsApp</b>.',
      '<ol class="steps"><li>Entra a tu página y toca los <b>tres puntos ···</b>.</li><li>Toca <b>Agregar botón de acción</b> (o <b>Editar botón</b>).</li><li>Elige <b>Enviar mensaje de WhatsApp</b>.</li><li>Escribe tu número de WhatsApp Business y confirma con el código que te llega.</li><li>Toca <b>Guardar</b> y pruébalo.</li></ol>'],
   g:['fb-whatsapp']},
  {check:true,q:'¿Para qué sirve el botón de WhatsApp en tu página?',
   o:['Para que te escriban directo con un solo toque','Para borrar comentarios','Para cambiar tu portada'],a:0,
   y:'El botón lleva a la persona directo a tu WhatsApp Business, sin buscar tu número.'},
  {k:'Paso 5 · Tus primeras publicaciones',lead:'Una página vacía no da confianza. Publica 3 cosas antes de invitar.',
   p:['<ol class="steps"><li><b>Tu presentación:</b> quién eres y por qué abriste esta página.</li><li><b>Algo útil:</b> una imagen de AUREX con un consejo.</li><li><b>Tu porqué:</b> una foto tuya y la razón por la que empezaste.</li></ol>',
      'Después, invita a tus amistades a seguir tu página. Facebook te da la opción <b>Invitar</b> dentro de la página.']},
  {k:'Capítulo 3 · Cómo cambiar entre tu perfil y tu página',lead:'Eres la misma persona con dos “sombreros”.',
   p:['Cuando publicas, fíjate <b>desde dónde</b> lo haces: desde tu perfil (como persona) o desde tu página (como proyecto).',
      'Para cambiar: toca tu foto en el <b>Menú ☰</b> y elige tu página. Para regresar, haz lo mismo y elige tu perfil.',
      'Tip: lo que publiques en tu página lo puedes <b>compartir</b> en tu perfil, para que lo vean tus amistades.']},
  {k:'Capítulo 4 · Los grupos',lead:'En los grupos te conoce gente que comparte tus intereses.',
   p:['Únete a <b>3 a 5 grupos</b> de emprendimiento, de tu ciudad o de temas que te gusten.',
      'Regla de oro de los grupos: <b>aporta, no vendas</b>. Comenta con algo útil, responde dudas y comparte consejos.',
      'Muchos grupos prohíben publicar promociones. Lee las reglas de cada uno antes de publicar.'],
   img:'marketing/l4-grupos.jpg'},
  {k:'Para cerrar · Tu comunidad tiene casa',lead:'Ya tienes perfil en orden y página completa.',
   p:['En la lección 5 vas a dejar listo tu Instagram profesional. Y en la 6 conectarás tu página con Instagram y con WhatsApp Business.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu checklist y el quiz.'}
 ],

  res:on=>{const n=on.filter(Boolean).length;return n===7?'<b>¡Tu página está lista!</b> Sigue con la lección 5: tu Instagram profesional.':`Llevas <b>${n} de 7</b>. Si algún paso no te sale, abre la guía de abajo.`;}},

 rule:'Antes de invitar a alguien a tu página, <b>que tenga algo que valga la pena ver</b>.',
 quiz:[
  {p:'¿Qué necesitas para crear una página de Facebook?',o:['Pagar una suscripción','Una cuenta personal de Facebook','Una computadora','Un número de otro país'],a:1,y:'La página se crea y se administra desde tu cuenta personal.'},
  {p:'¿Dónde se crea la página en la app?',o:['En Menú → Páginas → Crear','En la cámara','En WhatsApp','En Mensajes'],a:0,y:'Menú ☰ → Páginas → Crear, y sigues los pasos.'},
  {p:'¿Por qué conviene que la portada tenga el texto al centro?',o:['Porque en el celular se recorta en los lados','Porque así lo pide Meta','No importa','Para que pese menos'],a:0,y:'En el celular la portada se recorta, y el texto de las orillas se pierde.'},
  {p:'Antes de invitar a tus amistades a tu página, conviene…',o:['Publicar 3 cosas: presentación, algo útil y tu porqué','Dejarla vacía','Mandar el link a todos de inmediato','Borrar tu perfil'],a:0,y:'Una página con contenido da confianza desde la primera visita.'},
  {p:'¿Cuál es la regla de oro en los grupos de Facebook?',o:['Vender en cada comentario','Aportar, no vender, y leer las reglas','Publicar el link en todos','No participar'],a:1,y:'En los grupos, quien aporta genera confianza. Y cada grupo tiene sus propias reglas.'}
 ]},
/* ================= FASE 1 · LECCIÓN 5 ================= */
{key:'mkt4',phase:1,fast:true,title:'Instagram profesional',
 desc:'Crea o ajusta tu Instagram, pásalo a cuenta profesional y deja tu perfil completo.',
 obj:'Al terminar tendrás tu Instagram como cuenta profesional, pública y con un perfil completo: foto, nombre, bio, link e historias destacadas.',
 cards:[
  {k:'Capítulo 1 · Tu aparador',lead:'Instagram es donde te descubre gente nueva.',
   p:['Lo primero que hace alguien que te descubre es <b>entrar a tu perfil</b>. En 3 segundos decide si te sigue o se va.',
      'En esta lección vas a dejar tu perfil listo para causar buena impresión. Si no tienes Instagram, empiezas desde cero aquí mismo.'],
   art:'igpro'},
  {k:'Paso 1 · Crea tu cuenta',lead:'Si ya tienes Instagram, salta a la siguiente tarjeta.',
   p:['<ol class="steps"><li>Descarga <b>Instagram</b> de Play Store o App Store.</li><li>Toca <b>Crear cuenta nueva</b> y usa tu celular o tu correo.</li><li>Elige tu <b>nombre de usuario</b>: lo más parecido a tu nombre real, fácil de escribir, sin muchos números ni guiones.</li><li>Crea una contraseña segura y anótala en un lugar seguro.</li><li>Pon tu foto: la misma de tus otras redes.</li></ol>'],
   ex:'Usuario claro: @carmenlopez.digital · Usuario confuso: @c4rm3n_xx_8899',
   g:['ig-crear']},
  {k:'Paso 2 · Pública y profesional',lead:'Dos ajustes que cambian todo.',
   p:['<b>Pública:</b> si tu cuenta es privada, quien llega por curiosidad no puede ver nada y se va. Menú ☰ → <b>Privacidad de la cuenta</b> → apaga <b>Cuenta privada</b>.',
      '<b>Profesional:</b> te da estadísticas (quién te ve, qué funciona), botones de contacto y la posibilidad de conectarte con tu página. Menú ☰ → <b>Tipo de cuenta y herramientas</b> → <b>Cambiar a cuenta profesional</b> → elige <b>Creador</b>.',
      'Las dos son gratis y se pueden cambiar cuando quieras.'],
   g:['ig-cuenta']},
  {check:true,q:'¿Qué te da una cuenta profesional de Instagram?',
   o:['Más fotos gratis','Estadísticas, botones de contacto y la conexión con tu página','Seguidores automáticos'],a:1,
   y:'La cuenta profesional te muestra quién te ve y te permite conectarte con tu página y con Meta.'},
  {k:'Paso 3 · Tu nombre en el perfil',lead:'El nombre del perfil también se busca.',
   p:['Además del usuario, Instagram tiene un campo de <b>Nombre</b>. Ese nombre aparece en negritas y <b>la gente lo puede buscar</b>.',
      'Úsalo así: <b>tu nombre + una palabra clave</b>. Por ejemplo: “Carmen López | Emprendimiento”.',
      'Así, quien busque “emprendimiento” también puede encontrarte.']},
  {k:'Paso 4 · Tu bio de 3 líneas',lead:'Tienes 150 caracteres para que digan “esto es para mí”.',
   p:['<ol class="steps"><li><b>A quién le hablas.</b> Ej.: Para quien quiere aprender lo digital.</li><li><b>Qué encuentra contigo.</b> Ej.: Comparto lo que aprendo en la comunidad AUREX.</li><li><b>Qué hacer ahora.</b> Ej.: 👇 Conoce más en el link.</li></ol>',
      'Sin promesas de dinero. Clara, cálida y con un emoji por línea como máximo.'],
   do:'Pídele ayuda a la ia: <b>“Escríbeme 3 bios de Instagram de máximo 150 caracteres, con emojis: línea 1 a quién le hablo, línea 2 qué encuentran conmigo, línea 3 qué hacer ahora. Sin prometer dinero.”</b>',
   g:['ig-link'],art:'bio3'},
  {k:'Paso 5 · Tu link',lead:'El link es la puerta entre tu Instagram y tu embudo.',
   p:['En <b>Editar perfil → Enlaces → Agregar enlace externo</b> pega el link de tu embudo AUREX y ponle un título, como “Conoce AUREX”.',
      'Después ábrelo desde tu perfil para comprobar que funciona.',
      'Si tu cuenta es profesional, también puedes agregar tu <b>WhatsApp</b> como opción de contacto, desde <b>Editar perfil</b>, si te aparece la opción.'],
   g:['ig-link']},
  {k:'Paso 6 · Historias destacadas',lead:'Las destacadas son tu “menú” permanente.',
   p:['Las historias duran 24 horas, pero puedes guardarlas en círculos debajo de tu bio: las {{Historias destacadas|historias destacadas}}.',
      'Crea 4 para empezar: <b>Empieza aquí</b> (quién eres), <b>Mi historia</b> (por qué empezaste), <b>Comunidad</b> (historias reales, con permiso) y <b>Preguntas</b> (dudas frecuentes).',
      'Para crear una: sube una historia, ábrela y toca <b>Destacar</b>.'],
   g:['ig-destacadas'],img:'marketing/l5-destacadas.jpg'},
  {check:true,q:'¿Qué son las historias destacadas?',
   o:['Historias que se borran solas','Historias guardadas en círculos debajo de tu bio, que no desaparecen','Anuncios pagados'],a:1,
   y:'Las destacadas quedan fijas en tu perfil, como un menú para quien te visita.'},
  {k:'Paso 7 · Tus primeras 9 publicaciones',lead:'Tu feed es lo que ven al entrar a tu perfil.',
   p:['Antes de invitar a alguien, ten al menos <b>9 publicaciones</b> (tres filas). Así tu perfil se ve vivo.',
      'Mezcla: fotos tuyas, imágenes de AUREX con un consejo y tu historia. Cuida que los colores combinen.',
      'No tienes que hacerlas en un día: puedes subir una o dos diarias durante una semana.'],
   img:'marketing/l5-feed.jpg'},
  {k:'Paso 8 · Tus 3 publicaciones fijadas',lead:'Lo primero que ve quien entra a tu perfil.',
   p:['Instagram te deja <b>fijar 3 publicaciones</b> al inicio de tu perfil. Es lo primero que ve quien te visita, así que deben contar tu historia completa:',
      '<ol class="steps"><li><b>Quién eres y a quién ayudas:</b> tu presentación con tu frase de marca.</li><li><b>Tu historia:</b> por qué empezaste (antes, el momento, lo que hiciste y hoy).</li><li><b>Qué encuentran contigo y cómo contactarte:</b> un testimonio o tu invitación.</li></ol>',
      'Para fijar: abre la publicación → toca los <b>tres puntos ···</b> → <b>Fijar en tu perfil</b>.'],
   g:['ig-fijar']},
  {k:'Para cerrar · Tu aparador está listo',lead:'Ya tienes cuenta profesional, pública y con perfil completo.',
   p:['En la lección 6 vas a conectar tu Instagram con tu página de Facebook y vas a manejar todo desde una sola app.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu checklist y el quiz.'}
 ],
 guides:['ig-crear','ig-cuenta','ig-link','ig-destacadas','ig-fijar'],
 tasks:{t:'Mi Instagram',d:'Toca cada punto cuando lo tengas listo.',
  items:[['Tengo cuenta con un usuario claro',''],['La cambié a pública',''],['La cambié a cuenta profesional (Creador)',''],['Nombre del perfil: mi nombre + palabra clave',''],['Bio de 3 líneas',''],['Link de mi embudo que abre bien',''],['4 historias destacadas',''],['Al menos 9 publicaciones',''],['Mis 3 publicaciones fijadas','']],
  res:on=>{const n=on.filter(Boolean).length;return n===9?'<b>¡Tu Instagram está listo!</b> Sigue con la lección 6: conectar todo con Meta.':`Llevas <b>${n} de 9</b>. Las 9 publicaciones pueden tomarte una semana; lo demás, hazlo hoy.`;}},
 recap:['Tu cuenta debe ser <b>pública y profesional</b>: sin eso, quien llega por curiosidad se va.','<b>Nombre con palabra clave, bio de 3 líneas y link</b> que funcione.','<b>Destacadas</b> como menú y <b>9 publicaciones</b> antes de invitar.'],
 rule:'Tu Instagram es tu aparador: <b>arréglalo antes de invitar a alguien a verlo</b>.',
 quiz:[
  {p:'¿Cómo conviene que sea tu nombre de usuario?',o:['Con muchos números y guiones','Parecido a tu nombre real y fácil de escribir','Secreto','Igual al de otra persona famosa'],a:1,y:'Un usuario claro se recuerda y se busca fácil.'},
  {p:'¿Por qué tu cuenta debe ser pública?',o:['Para que quien llega por curiosidad pueda ver tu contenido','Para pagar menos','Porque Meta lo exige siempre','No importa'],a:0,y:'Si es privada, las personas curiosas no ven nada y se van.'},
  {p:'¿Para qué sirve la palabra clave en el Nombre del perfil?',o:['Para que la gente te encuentre al buscar ese tema','Para cambiar tu contraseña','Para tener más fotos','No sirve'],a:0,y:'El Nombre del perfil se puede buscar. Con una palabra clave, te encuentran más fácil.'},
  {p:'¿Cuántas publicaciones conviene tener antes de invitar?',o:['Ninguna','Al menos 9','Exactamente 100','Una'],a:1,y:'Nueve publicaciones (tres filas) hacen que tu perfil se vea vivo y confiable.'},
  {p:'¿Cómo creas una historia destacada?',o:['Pagando','Subes una historia, la abres y tocas Destacar','Mandándola por WhatsApp','No se puede'],a:1,y:'Sube la historia, ábrela y toca Destacar. Así queda fija en tu perfil.'}
 ]},
/* ================= FASE 1 · LECCIÓN 6 ================= */
{key:'mkt5',phase:1,fast:true,title:'Conecta todo con Meta',
 desc:'Conecta tu página, tu Instagram y tu WhatsApp Business, y manéjalos desde Meta Business Suite.',
 obj:'Al terminar tendrás tu ecosistema conectado: página, Instagram y WhatsApp Business enlazados, y Meta Business Suite instalado para publicar y responder desde un solo lugar.',
 cards:[
  {k:'Capítulo 1 · Por qué conectar',lead:'Tres redes sueltas son tres trabajos. Conectadas, son uno.',
   p:['Cuando conectas tus redes:',
      '<ol class="steps"><li>Publicas <b>una vez</b> y sale en Facebook e Instagram.</li><li>Los mensajes de tu página, de Instagram y de WhatsApp llegan a <b>un solo lugar</b>.</li><li>Ves en un solo tablero <b>quién te ve y qué funciona</b>.</li><li>Quedas lista o listo para, algún día, hacer <b>publicidad</b> y usar herramientas de automatización.</li></ol>'],
   art:'connect'},
  {k:'Conexión 1 · Página ↔ Instagram',lead:'Tu Instagram profesional se conecta a tu página.',
   p:['Desde Instagram: <b>Editar perfil</b> → busca <b>Página</b> (en la información pública de la empresa) → <b>Conectar o crear</b> → entra con tu Facebook → elige tu página.',
      'Cuando funcione, verás el nombre de tu página junto a <b>Página</b> en tu perfil de Instagram.',
      'Importante: <b>una página se conecta con una sola cuenta de Instagram</b>. Y tu Instagram debe ser profesional.'],
   g:['ig-conectar']},
  {k:'Conexión 2 · Página ↔ WhatsApp Business',lead:'Tu página y tu WhatsApp Business, enlazados.',
   p:['Desde WhatsApp Business: <b>Herramientas para la empresa</b> → <b>Facebook e Instagram</b> → <b>Facebook</b> → entra y elige tu página.',
      'O desde tu página en Facebook: <b>Configuración</b> → <b>Cuentas vinculadas</b> → <b>WhatsApp</b> → escribe tu número y el código que te llega.',
      'Así tu botón de WhatsApp y tus futuros anuncios llevan directo a tu WhatsApp Business.'],
   g:['wa-conectar']},
  {check:true,q:'¿Con cuántas cuentas de Instagram se puede conectar una página?',
   o:['Con una sola','Con todas las que quieras','Con ninguna'],a:0,
   y:'Una página se conecta con una sola cuenta de Instagram profesional.'},
  {k:'Conexión 3 · El Centro de cuentas',lead:'El Centro de cuentas enlaza tu Facebook y tu Instagram.',
   p:['El {{Centro de cuentas|Centro de cuentas}} es el lugar de Meta donde juntas tus cuentas: entras con una sola contraseña y puedes compartir historias de una red a otra.',
      'En Instagram: Menú ☰ → <b>Centro de cuentas</b> → <b>Cuentas</b> → <b>Agregar cuentas</b> → elige Facebook y entra.',
      'Ojo: el Centro de cuentas <b>no reemplaza</b> la conexión Página ↔ Instagram. Haz las dos.'],
   g:['centro-cuentas']},
  {k:'Capítulo 2 · Meta Business Suite',lead:'Una sola app para manejar todo tu ecosistema.',
   p:['{{Meta Business Suite|Meta Business Suite}} es una app <b>gratuita</b> de Meta para administrar tu página y tu Instagram juntos.',
      'Con ella <b>publicas</b> en las dos redes a la vez, <b>programas</b> publicaciones, <b>respondes</b> todos tus mensajes en una sola bandeja y <b>ves tus estadísticas</b>.',
      'Para usarla necesitas lo que ya construiste: una página de Facebook y un Instagram profesional conectado.'],
   art:'suite'},
  {k:'Paso 1 · Instala Meta Business Suite',lead:'Descárgala y entra con tu Facebook.',
   p:['<ol class="steps"><li>En Play Store o App Store busca <b>Meta Business Suite</b> (autor: Meta Platforms).</li><li>Instálala y entra con tu cuenta de Facebook.</li><li>Elige tu página. Si conectaste tu Instagram, aparece junto a ella.</li><li>Acepta los permisos que te pide.</li></ol>',
      'En la computadora también la usas entrando a <b>business.facebook.com</b>.'],
   g:['meta-suite']},
  {k:'Paso 2 · Publica en las dos redes a la vez',lead:'Una publicación, dos redes.',
   p:['<ol class="steps"><li>En Meta Business Suite toca <b>Crear</b> o el <b>+</b> → <b>Publicación</b>.</li><li>Arriba, marca <b>tu página</b> y <b>tu Instagram</b>.</li><li>Agrega tu imagen y tu texto.</li><li>Toca <b>Publicar</b>, o <b>Programar</b> para elegir día y hora.</li></ol>',
      'Programar es tu mejor aliado: el domingo dejas lista tu semana y sales sola o solo cada día.'],
   g:['meta-suite']},
  {check:true,q:'¿Qué puedes hacer con Meta Business Suite?',
   o:['Publicar en Facebook e Instagram a la vez, programar y responder mensajes en un solo lugar','Solo ver fotos','Mandar SMS'],a:0,
   y:'Meta Business Suite junta publicaciones, mensajes y estadísticas de tu página y tu Instagram.'},
  {k:'Paso 3 · Tu bandeja de mensajes',lead:'Todos tus mensajes en un solo lugar.',
   p:['En Meta Business Suite toca <b>Bandeja de entrada</b>. Ahí llegan los mensajes de tu página, de Instagram y, si lo conectaste, de WhatsApp Business.',
      'Revisa tu bandeja <b>al menos dos veces al día</b>. Una respuesta rápida dice mucho de ti.']},
  {k:'Para cerrar · Tu ecosistema está completo',lead:'Terminaste la Fase 1. Tu base está construida.',
   p:['Tienes WhatsApp Business, página de Facebook e Instagram profesional, <b>conectados entre sí</b> y manejados desde Meta Business Suite.',
      'Esta es la base que se necesita para hacer publicidad en Meta y usar herramientas de automatización. Lo verás en un módulo aparte.',
      'Ahora viene la <b>Fase 2</b>: hacer que todo esto se vea como tú y trabaje para ti.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu checklist y el quiz.'}
 ],
 guides:['ig-conectar','wa-conectar','centro-cuentas','meta-suite'],
 tasks:{t:'Mi ecosistema conectado',d:'El checklist final de la Fase 1. Toca cada punto cuando esté listo.',
  items:[['WhatsApp Business con perfil completo','Lección 3'],['Página de Facebook completa y con botón de WhatsApp','Lección 4'],['Instagram profesional y público','Lección 5'],['Instagram conectado a mi página','Aparece en Editar perfil → Página'],['WhatsApp Business conectado a mi página',''],['Facebook e Instagram en el Centro de cuentas',''],['Meta Business Suite instalado',''],['Hice una publicación en las dos redes a la vez','']],
  res:on=>{const n=on.filter(Boolean).length;return n===8?'<b>¡Tu ecosistema está completo y conectado!</b> Felicidades: terminaste la Fase 1. Te espera la Fase 2.':`Llevas <b>${n} de 8</b>. Cuando completes los 8, tu base estará lista para todo lo que sigue.`;}},
 recap:['Conectar tus redes convierte <b>tres trabajos en uno</b>.','Página ↔ Instagram, Página ↔ WhatsApp Business y el <b>Centro de cuentas</b>: haz las tres.','<b>Meta Business Suite</b> te deja publicar, programar, responder y medir desde una sola app.'],
 rule:'Tu ecosistema conectado es tu base: <b>todo lo que construyas después se apoya aquí</b>.',
 quiz:[
  {p:'¿Qué necesitas para usar Meta Business Suite?',o:['Una página de Facebook y, de preferencia, un Instagram profesional conectado','Solo WhatsApp normal','Una tarjeta de crédito','Nada'],a:0,y:'Meta Business Suite administra tu página y tu Instagram profesional.'},
  {p:'Tu Instagram está en el Centro de cuentas. ¿Ya está conectado a tu página?',o:['Sí, es lo mismo','No necesariamente: la conexión Página ↔ Instagram se hace aparte','Solo en iPhone','Nunca se puede'],a:1,y:'El Centro de cuentas no reemplaza la conexión de tu Instagram con tu página. Haz las dos.'},
  {p:'¿Para qué sirve programar publicaciones?',o:['Para dejar lista tu semana y que salgan solas cada día','Para borrar publicaciones','Para pagar anuncios','No sirve'],a:0,y:'Programar te ahorra tiempo y te mantiene constante.'},
  {p:'¿Dónde ves los mensajes de tu página y de Instagram juntos?',o:['En la Bandeja de entrada de Meta Business Suite','En la galería','En el correo','En la calculadora'],a:0,y:'La bandeja de entrada de Meta Business Suite junta tus mensajes.'},
  {p:'¿Por qué esta base es importante para el futuro?',o:['Porque es la que se necesita para publicidad y automatización','Porque es obligatoria por ley','No es importante','Para tener más contraseñas'],a:0,y:'Con tu ecosistema conectado ya puedes dar los siguientes pasos: publicidad y automatización.'}
 ]},
/* ================= FASE 2 · LECCIÓN 7 ================= */
{key:'mkt6',phase:2,title:'Tu marca personal',
 desc:'Define quién eres, a quién le hablas y qué te hace distinta o distinto. Tu historia y tu frase de marca.',
 obj:'Al terminar tendrás tu marca personal definida: tu nicho, tu historia en 4 partes, tu tono y tu frase de marca, listos para usar en todas tus redes.',
 cards:[
  {k:'Capítulo 1 · Qué es tu marca',lead:'La marca personal es lo que la gente piensa cuando piensa en ti.',
   p:['Ya tienes tus redes listas. Ahora toca que <b>se vean como tú</b>.',
      'Tu {{Marca personal|marca personal}} no es un logo. Si ves un perfil donde todo el tiempo hablan de maquillaje, piensas: “ella es de maquillaje”. <b>Así como es tu perfil, así te recuerda la gente.</b>',
      'La gente no se acerca a una empresa: <b>se acerca a una persona en quien confía</b>. Por eso tu marca eres tú.'],
   art:'brand3'},
  {k:'Ingrediente 1 · A quién le hablas',lead:'Hablarle a todos es hablarle a nadie.',
   p:['Tu {{Nicho|nicho}} es el grupo de personas a quienes diriges tu mensaje.',
      'Elige <b>uno</b>, el que mejor conoces. Casi siempre es gente parecida a ti, o a quien eras antes.',
      'Cuando le hablas a un grupo concreto, esas personas sienten que <b>les hablas a ellas</b>. Y responden.'],
   ex:'Mamás que quieren aprender a emprender desde casa · Personas recién jubiladas que quieren mantenerse activas · Jóvenes que quieren su primer proyecto digital · Profesionistas que buscan un plan B.'},
  {check:true,q:'¿Por qué conviene elegir un solo nicho?',
   o:['Porque así esas personas sienten que les hablas a ellas','Porque está prohibido hablar con más gente','Porque así publicas menos'],a:0,
   y:'Un mensaje para un grupo concreto conecta. Un mensaje para todos no le llega a nadie en especial.'},
  {k:'Ingrediente 2 · Tu historia',lead:'Tu historia es lo único que nadie te puede copiar.',
   p:['El cerebro recuerda mejor las historias que los datos. Por eso el {{Storytelling|storytelling}} conecta tanto.',
      'Tu historia tiene 4 partes: <b>antes</b> (dónde estabas), <b>el momento</b> (qué te hizo buscar algo nuevo), <b>lo que hiciste</b> (qué decidiste aprender) y <b>hoy</b> (qué estás construyendo y a quién ayudas).',
      'Cuéntala con verdad. No necesitas resultados espectaculares: <b>necesitas ser real</b>.'],
   art:'story4'},
  {k:'Tu historia · Un ejemplo',lead:'Así suena una historia real, sin exagerar.',
   p:['<i>“Trabajé 25 años como maestra. Cuando me jubilé, sentí que todavía tenía mucho que dar. Decidí aprender a usar mi celular para emprender, y encontré una comunidad que me enseñó paso a paso. Hoy comparto lo que aprendo con otras personas que, como yo, quieren empezar algo nuevo a cualquier edad.”</i>',
      'Fíjate: no promete dinero, no exagera. <b>Conecta porque es verdad.</b>'],
   do:'Pídele ayuda a la ia: <b>“Ayúdame a escribir mi historia en 4 partes (antes, el momento, lo que hice, hoy), en 5 líneas, con un tono cálido y sin prometer dinero. Esto es lo que me pasó: [cuéntalo con tus palabras].”</b>'},
  {k:'Ingrediente 3 · Lo que te hace distinta o distinto',lead:'Hay mucha gente compartiendo lo mismo. Tu forma es lo que cambia.',
   p:['Pregúntate: ¿qué sé hacer bien? ¿Qué experiencia tengo? ¿Cómo hablo?',
      'Quizá explicas con mucha paciencia. Quizá tienes humor. Quizá vienes de un oficio que te dio disciplina.',
      'Eso que te sale natural es tu sello. <b>No copies a nadie</b>: la gente nota cuando algo es copiado.']},
  {check:true,q:'¿Qué hace que tu historia conecte?',
   o:['Que prometa mucho dinero','Que sea verdad y la cuentes con tus palabras','Que sea igual a la de otra persona'],a:1,
   y:'Las historias conectan cuando son reales. La exageración genera desconfianza.'},
  {k:'Capítulo 2 · Tu tono',lead:'Tu tono es cómo suenas cuando escribes.',
   p:['Elige <b>3 palabras</b> que describan cómo quieres sonar. Por ejemplo: cálida, clara y alegre. O: directo, práctico y cercano.',
      'Úsalas como filtro: antes de publicar, pregúntate si el texto suena a esas tres palabras.',
      'Escribe como hablas. Frases cortas. Sin palabras rebuscadas.']},
  {k:'Capítulo 3 · Tu imagen',lead:'Lo que se ve también habla.',
   p:['<b>Tu foto:</b> la misma en todas tus redes. De frente, con buena luz y una sonrisa natural.',
      '<b>Tus colores:</b> elige 2 o 3 y úsalos siempre en tus portadas e imágenes. Los dorados y negros de AUREX combinan con casi todo.',
      '<b>Tu estilo de fotos:</b> parecidas en luz y en fondo. Así tu perfil se ve ordenado y reconocible.'],
   img:'marketing/l7-imagen.jpg'},
  {k:'Capítulo 4 · Tu frase de marca',lead:'Una sola línea que diga quién eres y a quién ayudas.',
   p:['Tu frase de marca junta tus tres ingredientes en una oración. La vas a usar en tu bio, en tu WhatsApp Business y en tu página.',
      'Fórmula: <b>Ayudo a [tu nicho] a [lo que encuentran contigo]</b>. Sin promesas de dinero.'],
   ex:'“Acompaño a mamás que quieren aprender a emprender desde casa.” · “Comparto con personas jubiladas cómo usar su celular para empezar algo nuevo.”'},

 cards:[
  {k:'Capítulo 1 · Tenerlo no es lo mismo que tenerlo bien',lead:'Mucha gente tiene sus redes… pero no bien hechas.',
   p:['Ya construiste tu ecosistema y definiste tu marca. Ahora toca la <b>auditoría</b>: revisar con ojos de visitante.',

   art:'profile'},
  {k:'La regla de la coherencia',lead:'Mismo nombre, misma foto, misma frase. En todas tus redes.',
   p:['Cuando alguien te encuentra en Instagram y luego te busca en Facebook o te escribe por WhatsApp, debe reconocerte <b>al instante</b>.',

  {k:'Auditoría · WhatsApp Business',lead:'Tu mostrador, revisado.',

   g:['wa-perfil','wa-herramientas']},
  {k:'Auditoría · Tu página de Facebook',lead:'Tu comunidad, revisada.',

   g:['fb-whatsapp']},
  {k:'Auditoría · Tu Instagram',lead:'Tu aparador, revisado.',

   g:['ig-link','ig-destacadas']},
  {check:true,q:'¿Qué significa la regla de la coherencia?',

  {k:'Capítulo 2 · Los errores que alejan',lead:'Seis errores que hacen que alguien entre y se vaya sin preguntar.',
   p:['<b>Perfil privado</b> en Instagram.',

      '<b>Link roto</b> o sin link.',

   art:'errors'},
  {k:'Capítulo 3 · Las portadas de tus destacadas',lead:'Un detalle pequeño que se nota mucho.',
   p:['Las portadas de tus historias destacadas son los círculos debajo de tu bio. Si cada una tiene un estilo distinto, el perfil se ve desordenado.',
      'Hazlas en <b>Canva</b>: busca “portada historia destacada”, usa tus 2 o 3 colores y un ícono sencillo.',
      'Para cambiarla: mantén el dedo sobre la destacada → <b>Editar destacada</b> → <b>Editar portada</b>.'],
   img:'marketing/l8-portadas.jpg'},
  {k:'Capítulo 4 · Pide una segunda opinión',lead:'Tú ya te conoces. Necesitas ojos nuevos.',
   p:['Pídele a alguien de confianza que abra tus perfiles por primera vez y te diga en 3 segundos: <b>¿quién soy y qué comparto?</b>',
      'Si lo que dice coincide con tu frase de marca, tu vitrina funciona. Si no, ajusta lo que no quedó claro.'],
   do:'También puedes pedírselo a la ia: copia tu bio y tu descripción y escribe: <b>“Soy [tu nicho]. ¿Esta presentación deja claro quién soy, a quién le hablo y cómo contactarme? Dame 3 mejoras concretas.”</b>'},
  {check:true,q:'Tu última publicación en Facebook fue hace 3 semanas. ¿Qué pasa?',
   o:['Nada, está bien','Parece que desapareciste: la constancia también es parte de tu vitrina','Te dan más alcance'],a:1,
   y:'Aparecer y desaparecer hace que te olviden. Tu vitrina también se juzga por lo reciente.'},
  {k:'Para cerrar · Tu vitrina, perfeccionada',lead:'Coherente, completa y con tu marca.',

 ],
