function setWhere(k,v){const W=JSON.parse(LS('mk_where')||'{}');W[k]=v;LS('mk_where',JSON.stringify(W));const y=window.scrollY;render();window.scrollTo(0,y);}
function whereReco(W){
  if(W.wa===undefined||W.es===undefined||W.ln===undefined)return `<div class="reco" style="opacity:.6"><b>Tu recomendación</b><p>Responde las tres preguntas para ver tu recomendación.</p></div>`;
  let m='';
  if(W.ln===0)m='Primero pide a quien te invitó tu <b>link del embudo AUREX</b>: lo vas a necesitar desde la lección 3. Mientras tanto, empieza por la lección 1.';
  else if(W.wa===0)m='<b>Tu perfil de WhatsApp todavía no está listo.</b> Es lo primero que ve quien te escribe. Lo arreglas paso a paso en la lección <b>3. Primer paso para ejecutar</b>. Empieza por la lección 1.';
  else if(W.es===1)m='Ya tienes el hábito de publicar. Muy bien. Puedes avanzar más rápido por las primeras lecciones, pero <b>no te saltes las lecciones 4 y 5</b>: ahí aprendes a convertir vistas en conversaciones.';
  else m='Tu perfil y tu link ya están listos. Ahora falta la constancia: sigue las lecciones en orden y en la lección 4 armas tu <b>rutina diaria</b>.';
  return `<div class="reco"><b>Tu recomendación</b><p>${m}</p></div>`;
}

/* ---------- LECCIÓN ---------- */
function lessonHTML(L){
  const i=LESSONS.indexOf(L);
  let h=`<div class="l-head"><div class="kick">Lección ${i+1} de ${LESSONS.length}${done(L.key)?' · <span style="color:var(--green)">✓ Completada</span>':''}</div><h1 class="h">${L.title}</h1>
  <div class="obj"><span>Objetivo</span><p>${L.obj}</p></div></div>`;
  h+=recallHTML(i);
  h+=`<div class="how"><div class="how-t">Cómo estudiar esta lección</div><ol>
    <li>Lee la tarjeta con calma y toca <b>Siguiente</b> para avanzar. Para repasar, toca <b>Anterior</b>, <b>↺ Desde el inicio</b> o cualquiera de las rayitas de arriba que ya viste.</li>
    <li>Cuando aparezca una <b>pregunta</b>, elige tu respuesta. No pasa nada si te equivocas: te explicamos y sigues.</li>
    <li>Al terminar las tarjetas se abren abajo tu práctica${L.video?', el video':''} y el quiz final.</li></ol></div>`;
  h+=`<div class="learn" id="learn">${learnInner(L)}</div><div id="after">${afterHTML(L)}</div>`;
  const nx=LESSONS[i+1];
  h+=`<div class="sec" id="lessons"><span class="num">→</span>Sigue aprendiendo</div>`;
  if(nx)h+=`<div class="nextbig"><div><small>SIGUIENTE · LECCIÓN ${i+2} DE ${LESSONS.length}</small><h3>${nx.title}</h3><p>${nx.desc}</p></div><button class="btn-gold" onclick="go(${i+2})">Ir a la lección ${i+2} →</button></div>`;
  else h+=`<div class="nextbig"><div><small>FIN DEL MÓDULO</small><h3>Ahora toca ejecutar</h3><p>Ya tienes las bases. Vuelve a tus lecciones, revisa tu avance y abre tu rutina diaria cuando completes el módulo.</p></div><button class="btn-gold" onclick="go(0)">Ver mis lecciones →</button></div>`;
  h+=lessonCards(L.key);
  h+=certHTML();
  h+=`<p class="disc">Contenido educativo. Los resultados dependen del trabajo y la constancia de cada persona.</p>`;
  return h;
}
function recallHTML(i){
  if(i===0)return '';const q=LESSONS[i-1].quiz[0];
  return `<div class="recall" id="recall"><div class="check-k">¿Te acuerdas? · De la lección anterior</div><div class="check-q">${q.p}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" onclick="answerRecall(${i},${j})"><span class="l">${'ABCD'[j]}</span>${o}</button>`).join('')}</div><div id="recall-fb"></div></div>`;
}
function answerRecall(i,j){const q=LESSONS[i-1].quiz[0],box=document.getElementById('recall');
  box.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===j)b.classList.add('bad');});
  document.getElementById('recall-fb').innerHTML=`<div class="fb ${j===q.a?'ok':'bad'}"><b>${j===q.a?'¡Bien recordado!':'Casi. Aquí va un repaso:'}</b>${q.y}</div>`;}

function learnInner(L){
  const pos=cardPos(L),c=L.cards[pos],n=L.cards.length,last=pos===n-1;
  const mx=Math.max(pos,parseInt(LS('mk_max_'+L.key))||0);LS('mk_max_'+L.key,String(mx));
  const dots=L.cards.map((x,k)=>`<i class="${x.check?'q ':''}${k<pos?'d':k===pos?'c':''} ${k<=mx&&k!==pos?'v':''}" ${k<=mx&&k!==pos?`onclick="jumpCard(${k})" title="Ir a la tarjeta ${k+1}"`:''}></i>`).join('');
  const answered=!c.check||LS(`mk_chk_${L.key}_${pos}`)!==null;
  return `<div class="learn-top"><span class="lbl">${pos+1} / ${n}</span><div class="dots">${dots}</div>${pos>0?`<button class="btn-restart" onclick="jumpCard(0)">↺ Desde el inicio</button>`:''}</div>
  ${c.check?checkHTML(L,c,pos):cardHTML(c)}
  <div class="learn-nav"><button class="btn-line" onclick="moveCard(-1)" ${pos===0?'disabled':''}>← Anterior</button>
    <span class="hint">${c.check&&!answered?'Elige una respuesta para continuar':''}</span>
    <button class="btn-gold" onclick="moveCard(1)" ${answered?'':'disabled'}>${last?'Terminar ✓':'Siguiente →'}</button></div>`;
}
function cardHTML(c){
  const quote=`<div class="quote">${c.lead}</div>`;
  const alt=c.art?ART[c.art]:quote;
  const qMode=!c.img&&!c.art;
  const vis=c.img?`<img src="${c.img}" alt="" onerror="visFail(this)"><div class="alt" hidden>${alt}</div>`:`<div class="alt">${alt}</div>`;
  return `<div class="card ${qMode?'q':''}" data-alt="${c.art?'art':'q'}"><div class="card-txt"><div class="card-k">${c.k}</div><div class="card-lead">${c.lead}</div>
    ${(c.p||[]).map(x=>/^\s*<(ol|table)/.test(x)?rich(x):`<p>${rich(x)}</p>`).join('')}
    ${c.ex?`<div class="card-ex"><span>EJEMPLO</span><p>${rich(c.ex)}</p></div>`:''}
    ${c.do?`<div class="card-do">${rich(c.do)}</div>`:''}
    ${c.g?`<div class="g-btns">${c.g.map(guideBtn).join('')}</div>`:''}
    ${c.vid?`<div class="card-vid" id="cvid"><button class="video-btn" onclick="cardVideo('${c.vid.yt}')"><span class="pl">▶</span><div><b>${c.vid.t}</b><small>Video corto. Tócalo para verlo aquí mismo.</small></div></button></div>`:''}
  </div><div class="card-vis${c.fit?' fit':''}">${vis}</div></div>`;
}
function cardVideo(id){const v=document.getElementById('cvid');if(v)v.innerHTML=`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video"></iframe></div>`;}
function visFail(img){img.parentElement.classList.remove('fit');const card=img.closest('.card');const alt=img.nextElementSibling;img.remove();if(alt)alt.hidden=false;if(card&&card.dataset.alt==='q')card.classList.add('q');}
function checkHTML(L,c,pos){
  const prev=LS(`mk_chk_${L.key}_${pos}`);const sel=prev===null?null:parseInt(prev);
  return `<div class="card" style="grid-template-columns:1fr;min-height:0"><div class="check">
   <div><div class="check-k">${c.label||'Pregunta rápida'}</div><div class="check-q">${c.q}</div><div class="check-h">${sel===null?'Elige la respuesta que te parezca correcta.':''}</div></div>
   <div><div class="opts">${c.o.map((o,j)=>{let cl='';if(sel!==null){if(j===c.a)cl='ok';else if(j===sel)cl='bad';}return `<button class="opt ${cl}" ${sel!==null?'disabled':''} onclick="answerCheck(${pos},${j})"><span class="l">${'ABC'[j]}</span>${o}</button>`;}).join('')}</div>
   ${sel!==null?`<div class="fb ${sel===c.a?'ok':'bad'}"><b>${sel===c.a?'¡Correcto!':'No exactamente'}</b>${rich(c.y)}</div>`:''}</div>
  </div></div>`;
}
function answerCheck(pos,j){const L=cur();LS(`mk_chk_${L.key}_${pos}`,String(j));const el=document.getElementById('learn');el.innerHTML=learnInner(L);el.querySelector('.card')?.classList.add('noanim');}
function moveCard(d){
  const L=cur(),pos=cardPos(L),n=L.cards.length;
  if(d>0&&pos===n-1){const first=!learned(L);LS('mk_learn_'+L.key,'1');document.getElementById('after').innerHTML=afterHTML(L);
    toast(first?'¡Tarjetas terminadas! Sigue abajo':'Repaso terminado');setTimeout(()=>{const p=document.getElementById('score')||document.getElementById('practice')||document.getElementById('after');p&&window.scrollTo({top:p.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'});},250);return;}
  LS('mk_card_'+L.key,String(Math.max(0,Math.min(n-1,pos+d))));
  const el=document.getElementById('learn');el.innerHTML=learnInner(L);
  window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'});
}
function checkScore(L){const idx=L.cards.map((c,k)=>c.check?k:-1).filter(k=>k>=0);const ans=idx.map(k=>LS(`mk_chk_${L.key}_${k}`));const ok=idx.filter((k,j)=>ans[j]!==null&&parseInt(ans[j])===L.cards[k].a).length;const wrong=idx.filter((k,j)=>ans[j]===null||parseInt(ans[j])!==L.cards[k].a);return {ok,tot:idx.length,wrong};}
function reviewWrong(){const L=cur(),sc=checkScore(L);if(!sc.wrong.length)return;sc.wrong.forEach(k=>localStorage.removeItem(`mk_chk_${L.key}_${k}`));jumpCard(sc.wrong[0]);toast('Vuelve a contestar las que fallaste');}
function toQuiz(){const q=document.getElementById('quiz-sec');q&&window.scrollTo({top:q.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'});}
function scoreHTML(L){const sc=checkScore(L);if(!sc.tot)return '';const pc=Math.round(sc.ok/sc.tot*100),good=pc>=70;
  return `<div class="score ${good?'good':'warn'}" id="score"><div class="score-n"><b>${sc.ok}</b><span>de ${sc.tot}</span></div><div class="score-t"><b>${good?'¡Muy bien!':'Atención: te recomendamos repasar'}</b><p>${good?`Respondiste bien ${sc.ok} de ${sc.tot} preguntas de las tarjetas (${pc}%). Sigue abajo con tu práctica${L.video?', el video':''} y el quiz final.`:`Respondiste bien ${sc.ok} de ${sc.tot} preguntas de las tarjetas (${pc}%). Repasar ahora te ayuda a recordarlo mejor. Antes de seguir, vuelve a contestar las que fallaste.`}</p>
  ${!good&&sc.wrong.length?`<div class="score-b"><button class="btn-gold" onclick="reviewWrong()">Repasar las que fallé (${sc.wrong.length})</button></div>`:''}</div></div>`;}
function afterHTML(L){
  if(!learned(L))return `<div class="locked"><span class="lk">✓</span><div>Termina las tarjetas de arriba y aquí se abrirán <b>tu resultado, tu práctica${L.video?', el video':''} y el quiz final</b>.</div></div>`;
  const T=L.tasks;let h=scoreHTML(L),s=1;
  if(T){
    const on=T.items.map((_,k)=>LS(`mk_task_${L.key}_${k}`)==='1');
    h+=`<div class="sec" id="practice"><span class="num">${s++}</span>Ponlo en práctica</div><p class="sec-d"><b>${T.t}</b> ${T.d}</p>
    <div class="tasks">${T.items.map(([t,sub],k)=>`<button class="task ${on[k]?'on':''}" onclick="toggleTask(${k})"><span class="bx">${on[k]?'✓':''}</span><div>${t}${sub?`<small>${sub}</small>`:''}</div></button>`).join('')}</div>
    <div class="task-res">${T.res(on)}</div>${L.guides?guideHelp(L.guides):''}`;
  }
  if(L.video)h+=`<div class="sec"><span class="num">${s++}</span>Míralo en video <small>(opcional)</small></div><div id="vid"><button class="video-btn" onclick="playVideo('${L.video.yt}')"><span class="pl">▶</span><div><b>${L.video.t}</b><small>${L.video.d} Toca para verlo aquí mismo.</small></div></button></div>`;
  h+=`<div class="sec"><span class="num">${s++}</span>Recuerda</div><p class="sec-d">Si solo te quedas con tres ideas de esta lección, que sean estas:</p>
  <div class="recap">${L.recap.map((r,k)=>`<div><span>${k+1}</span><p>${r}</p></div>`).join('')}</div>
  ${L.rule?`<div class="rule"><div class="rule-l">Regla<br>de oro</div><p>${L.rule}</p></div>`:''}`;
  h+=`<div class="sec" id="quiz-sec"><span class="num">${s++}</span>Quiz final</div><div class="quiz-box" id="quiz">${quizInner(L)}</div>
  <div style="margin-top:1.2rem"><button class="btn-line" onclick="restartCards()">↺ Repasar las tarjetas</button></div>`;
  return h;
}
function toggleTask(k){const L=cur(),key=`mk_task_${L.key}_${k}`;LS(key,LS(key)==='1'?'0':'1');const y=window.scrollY;document.getElementById('after').innerHTML=afterHTML(L);window.scrollTo(0,y);}
function resetTasks(){const L=cur();L.tasks.items.forEach((_,k)=>LS(`mk_task_${L.key}_${k}`,'0'));const y=window.scrollY;document.getElementById('after').innerHTML=afterHTML(L);window.scrollTo(0,y);}
function playVideo(id){document.getElementById('vid').innerHTML=`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video de la lección"></iframe></div>`;}
function jumpCard(k){const L=cur();LS('mk_card_'+L.key,String(k));const el=document.getElementById('learn');el.innerHTML=learnInner(L);window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'});}
function restartCards(){const L=cur();LS('mk_card_'+L.key,'0');const el=document.getElementById('learn');el.innerHTML=learnInner(L);window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-72,behavior:'smooth'});}

/* ---------- QUIZ ---------- */
function passN(L){return Math.ceil(L.quiz.length*0.7);}
function quizInner(L){
  const Q=ST.quiz;
  if(!Q||Q.key!==L.key){const ok=done(L.key);
    return `<div class="quiz-intro"><div class="qk">QUIZ · ${L.quiz.length} PREGUNTAS</div>
    <p>${ok?`Ya acreditaste esta lección${best(L)!==null?' con '+best(L)+' de '+L.quiz.length:''}. Puedes repetir el quiz cuando quieras para repasar o mejorar tu calificación.`:`Este es el examen que <b>acredita</b> la lección. Para acreditar necesitas <b>${passN(L)} de ${L.quiz.length}</b> respuestas correctas. Después de cada respuesta verás por qué es la correcta. Si no acreditas, puedes intentarlo de nuevo.`}</p>
    <button class="btn-gold" onclick="startQuiz()">${ok?'Repetir el quiz':'Empezar el quiz'} →</button></div>`;}
  if(Q.i>=L.quiz.length)return resultHTML(L);
  const q=L.quiz[Q.i],ans=Q.ans[Q.i];
  return `<div class="qbar"><i style="width:${Math.round(Q.i/L.quiz.length*100)}%"></i></div>
  <div class="qgrid"><div><div class="qk">PREGUNTA ${Q.i+1} DE ${L.quiz.length}</div><div class="qq">${q.p}</div></div>
  <div><div class="opts">${q.o.map((o,j)=>{let cl='';if(ans!==undefined){if(j===q.a)cl='ok';else if(j===ans)cl='bad';}return `<button class="opt ${cl}" ${ans!==undefined?'disabled':''} onclick="answerQuiz(${j})"><span class="l">${'ABCD'[j]}</span>${o}</button>`;}).join('')}</div>

function spaced(x,t,cx,y,sp){const w=[...t].reduce((s,ch)=>s+x.measureText(ch).width,0)+sp*(t.length-1);let px=cx-w/2;x.save();x.textAlign='left';for(const ch of t){x.fillText(ch,px,y);px+=x.measureText(ch).width+sp;}x.restore();}
function wrap(x,t,cx,y,maxW,lh){const words=t.split(' ');let line='';for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,cx,y);line=w;y+=lh;}else line=test;}if(line)x.fillText(line,cx,y);}

let DF=0;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function openDict(q){document.getElementById('dict').classList.add('open');closePop();const i=document.getElementById('dict-q');i.value=q||'';renderDict();if(!q&&window.innerWidth>820)setTimeout(()=>i.focus(),100);}
function closeDict(){document.getElementById('dict').classList.remove('open');}
function setDictFilter(f){DF=f;document.getElementById('df-all').classList.toggle('on',!f);document.getElementById('df-ess').classList.toggle('on',!!f);renderDict();}
function renderDict(){
  const q=norm(document.getElementById('dict-q').value.trim());
  const list=DICT.filter(d=>(!DF||d[4])&&(!q||norm(d[0]+' '+d[1]+' '+d[2]).includes(q))).sort((a,b)=>{const ia=q&&norm(a[0]).includes(q)?0:1,ib=q&&norm(b[0]).includes(q)?0:1;return ia-ib||norm(a[0]).localeCompare(norm(b[0]));});
  document.getElementById('dict-l').innerHTML=`<div class="dict-n">${list.length} ${list.length===1?'palabra':'palabras'} · Toca una para ver su explicación</div>`+
   (list.length?list.map(d=>`<details ${q&&list.length<=3?'open':''}><summary><b>${d[0]}${d[4]?'<span class="tag-e">Esencial</span>':''}</b><small>${d[1]}</small></summary><div class="dd">${d[2]}${d[3]?`<em>${d[3]}</em>`:''}</div></details>`).join(''):`<p class="sec-d">No encontramos esa palabra. Prueba con otra forma de escribirla o pregúntale a quien te invitó.</p>`);
}
function findTerm(t){const n=norm(t);return DICT.find(d=>norm(d[0])===n)||DICT.find(d=>norm(d[0]).startsWith(n));}
function pop(t){if(HOVER){const el=[...document.querySelectorAll('.term')].find(x=>x.dataset.t===t);if(el){showTip(el);return;}}const d=findTerm(t);if(!d)return;const p=document.getElementById('pop');
  p.innerHTML=`<b>${d[0]}</b><p>${d[2]}${d[3]?`<br><em>${d[3]}</em>`:''}</p><div class="row"><button class="btn-line" onclick="openDict()">Ver todo el diccionario</button><button class="btn-gold" onclick="closePop()">Entendido</button></div>`;p.classList.add('open');}
function closePop(){document.getElementById('pop').classList.remove('open');}

function showTip(el){
  const d=findTerm(el.dataset.t||'');if(!d)return;const tip=document.getElementById('tip');

  let top=r.bottom+8;if(top+th>window.innerHeight-10)top=Math.max(10,r.top-th-8);

const GORDER=['wa-estado','wa-vistas','wa-perfil','wa-privacidad','dm','ig-link','ig-cuenta','ig-sticker','album'];
let GCUR=null;
function gOS(){let o=LS('mk_os');if(!o){o=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'i':'a';}return o;}
function setOS(o){LS('mk_os',o);if(GCUR)openGuide(GCUR,true);}
function guideBtn(id){const g=GUIDES[id];return g?`<button class="g-btn" onclick="openGuide('${id}')">${g.ic} ${g.t} →</button>`:'';}
function guideHelp(ids){return `<div class="g-help"><p><b>¿No sabes cómo se hace en tu celular?</b> Toca la guía, sigue los pasos y regresas aquí.</p><div class="g-btns">${ids.map(guideBtn).join('')}</div></div>`;}
function openGuide(id,keep){
  const g=GUIDES[id];if(!g)return;GCUR=id;const os=gOS();
  const steps=os==='i'?(g.ip==='a'?g.a:g.ip):g.a;const scr=os==='i'?(g.pi==='a'?g.pa:g.pi):g.pa;const same=g.ip==='a';
  document.getElementById('gd-b').innerHTML=`<div class="gd-os"><button class="${os==='a'?'on':''}" onclick="setOS('a')">Android</button><button class="${os==='i'?'on':''}" onclick="setOS('i')">iPhone</button></div>
   <div class="gd-t">${g.t}</div><p class="gd-i">${g.i}${same?' <b>Es igual en Android y en iPhone.</b>':''}</p>
   <div class="gd-g"><div>${phone(scr)}</div><div><ol class="gd-steps">${steps.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>${g.tip?`<div class="gd-tip">💡 ${g.tip}</div>`:''}
   <p class="gd-note">Las apps se actualizan seguido: si un nombre cambia un poco, busca el más parecido.</p></div></div>`;
  document.getElementById('gd-f').innerHTML=`<button class="btn-line" onclick="guideIndex()">← Todas las guías</button><button class="btn-gold" onclick="closeGuide()">Listo, regresar</button>`;
  const d=document.getElementById('gd');d.classList.add('open');document.body.style.overflow='hidden';if(!keep)document.getElementById('gd-b').scrollTop=0;
}
function guideIndex(){
  GCUR=null;const grp={};GORDER.forEach(id=>{const g=GUIDES[id];(grp[g.g]=grp[g.g]||[]).push(id);});
  document.getElementById('gd-b').innerHTML=`<div class="gd-t">¿Qué quieres aprender a hacer?</div><p class="gd-i">Guías cortas, paso a paso, para Android y para iPhone. Toca una.</p>`+
   Object.keys(grp).map(k=>`<div class="gd-sec">${k}</div><div class="gd-list">${grp[k].map(id=>`<button onclick="openGuide('${id}')"><span class="ic">${GUIDES[id].ic}</span>${GUIDES[id].t}</button>`).join('')}</div>`).join('');
  document.getElementById('gd-f').innerHTML=`<span></span><button class="btn-gold" onclick="closeGuide()">Cerrar</button>`;
  document.getElementById('gd').classList.add('open');document.body.style.overflow='hidden';document.getElementById('gd-b').scrollTop=0;
}
function closeGuide(){document.getElementById('gd').classList.remove('open');document.body.style.overflow='';GCUR=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGuide();});
