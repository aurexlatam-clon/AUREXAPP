/* ================= FASE 2 · LECCIÓN 9 ================= */
{key:'mkt8',phase:2,title:'Tu contenido: qué publicar',
 desc:'Los 6 tipos de contenido según lo que piensa quien te ve, qué va en cada red y en qué formato.',
 obj:'Al terminar sabrás qué publicar según lo que piensa tu prospecto, en qué red y en qué formato, y tendrás tus primeras ideas para cada tipo.',
 cards:[
  {k:'Capítulo 1 · Publica para la cabeza de quien te ve',lead:'No publiques lo que tú quieres decir: publica lo que la otra persona necesita escuchar.',
   p:['Antes de decidir algo, una persona pasa por varias etapas: <b>se identifica</b> contigo, <b>confía</b>, <b>ve a otros</b> como ella, <b>se imagina</b> ahí, <b>resuelve sus dudas</b> y <b>decide</b>.',
      'Cada etapa necesita un tipo de contenido distinto. Por eso hay <b>6 tipos</b>, y cada uno acompaña un paso de ese camino.',
      'Cuando publicas solo invitaciones, te saltas cinco pasos. Por eso la gente no responde.'],
   art:'types6'},
  {k:'Tipo 1 · Razones internas',lead:'Habla de lo que la gente quiere cambiar en su vida.',
   p:['Todos tenemos razones para buscar algo nuevo: más tiempo con la familia, sentirnos útiles, aprender algo, tener un ingreso extra, no depender de un solo trabajo.',
      'Cuando cuentas <b>tus</b> razones, quien tiene las mismas <b>se identifica</b> y siente que le hablas a ella.',
      'Aquí no se menciona el negocio: se habla de la vida.'],
   ex:'“Durante años trabajé tanto que me perdí festivales de mis hijos. Hoy decidí aprender algo que me dé más libertad de tiempo. ¿A ti qué te gustaría cambiar?”'},
  {k:'Tipo 2 · No venta',lead:'Enseña algo útil sin pedir nada a cambio.',
   p:['Consejos, aprendizajes, errores que evitar, herramientas que te sirven. Contenido que ayuda aunque la persona nunca se una a nada.',
      'Es el contenido que más <b>confianza</b> genera: la gente se acerca a quien le aporta.',
      'Debe ser la parte más grande de lo que publicas.'],
   ex:'“3 apps gratis que uso para organizar mi día desde el celular.” · “El error que cometí al empezar en redes y cómo lo corregí.”'},
  {check:true,q:'¿Qué tipo de contenido debe ser la parte más grande de lo que publicas?',
   o:['Oportunidad: invitar todos los días','No venta: contenido útil sin pedir nada a cambio','Ninguno, solo fotos'],a:1,
   y:'El contenido útil genera confianza. Sin confianza, ninguna invitación funciona.'},
  {k:'Tipo 3 · Testimonios',lead:'La gente cree en personas reales como ella.',
   p:['Historias de personas de la comunidad: qué aprendieron, qué hábitos cambiaron, cómo se sienten hoy.',
      '<b>Siempre con su permiso</b>, y <b>sin cifras de dinero</b> ni capturas de ganancias.',
      'Quien ve un testimonio piensa: “si ella pudo, yo también puedo”. Ese es el paso de <b>ver a otros</b>.'],
   ex:'“Rosa tiene 62 años y hace un mes no sabía subir un estado. Hoy publica todos los días y ya dio su primer live. Le pregunté qué fue lo más difícil…”'},
  {k:'Tipo 4 · Estilo de vida',lead:'Muestra que detrás de tu perfil hay una persona real.',
   p:['Tu día, tu rutina, tu café de la mañana, tu familia, lo que disfrutas, cómo organizas tu tiempo.',
      'Ayuda a que la gente <b>se imagine</b> en tu lugar y te sienta cercana o cercano.',
      'Cuidado: estilo de vida <b>no es presumir</b> lujos ni dinero. Eso genera desconfianza.'],
   ex:'“Mi oficina hoy: la terraza, mi café y mi celular. Así empiezo mis mañanas.”'},
  {k:'Tipo 5 · Dudas y miedos',lead:'Responde lo que la gente piensa y no te dice.',
   p:['Casi todos tienen dudas antes de decidir: “¿y si no sé de tecnología?”, “¿y si no tengo tiempo?”, “¿esto es confiable?”.',
      'Este contenido <b>responde esas dudas con honestidad</b>. No se trata de asustar a nadie, sino de <b>quitar obstáculos</b>.',
      'Haz una lista de las preguntas que más te hacen: cada pregunta es una publicación.'],
   ex:'“¿Y si no sé nada de tecnología? Yo tampoco sabía. Empecé por lo más básico: subir un estado. Te cuento cómo fue mi primera semana.”'},
  {check:true,q:'¿Cómo se usa bien el contenido de dudas y miedos?',
   o:['Asustando a la gente para que decida rápido','Respondiendo con honestidad las dudas que la gente ya tiene','Evitando hablar de dudas'],a:1,
   y:'Se trata de quitar obstáculos con verdad, no de provocar miedo.'},
  {k:'Tipo 6 · Oportunidad',lead:'Ahora sí: invita a conocer tu proyecto.',
   p:['Presentas tu comunidad, lo que aprendes y cómo puede conocer más la persona interesada. Siempre con un <b>llamado a la acción</b> claro.',
      'Sin promesas de ingresos y sin presión: “Si te da curiosidad, escríbeme y te comparto la información”.',
      '<b>Proporción:</b> la mayor parte de tu semana publica los tipos 1 a 5. La oportunidad, una o dos veces por semana.'],
   ex:'“Hace 3 meses me uní a una comunidad que me enseña a usar mi celular para emprender. Si quieres saber de qué se trata, escríbeme ‘INFO’ y te cuento.”'},
  {k:'Capítulo 2 · Qué va en cada red',lead:'El mismo tipo de contenido se adapta al tono de cada red.',
   p:['<b>WhatsApp:</b> cercano y personal. Estilo de vida, razones y no venta para tu gente.',
      '<b>Facebook:</b> cálido y de comunidad. Testimonios, tu historia y textos un poco más largos.',
      '<b>Instagram:</b> visual e inspirador. Videos cortos de dudas y razones, carruseles de no venta y frases breves.'],
   art:'roles'},
  {k:'Capítulo 3 · Los formatos',lead:'Cada tipo puede tomar distintas formas.',
   p:['<table class="tbl"><tr><th>Formato</th><th>Cuánto dura</th><th>Ideal para</th></tr><tr><td>Estado de WhatsApp</td><td>24 horas</td><td>Estilo de vida y no venta</td></tr><tr><td>Historia (IG y FB)</td><td>24 horas</td><td>Dudas con sticker de pregunta</td></tr><tr><td>Carrusel</td><td>Se queda</td><td>No venta: consejos paso a paso</td></tr><tr><td>Video corto (reel)</td><td>Se queda</td><td>Razones, dudas y testimonios</td></tr><tr><td>Live</td><td>En vivo</td><td>Enseñar y responder dudas</td></tr></table>']},
  {check:true,q:'¿Con qué frecuencia conviene publicar contenido de oportunidad?',
   o:['Todos los días, varias veces','Una o dos veces por semana; el resto, los otros 5 tipos','Nunca'],a:1,
   y:'La oportunidad funciona cuando antes hubo confianza. Por eso va pocas veces y el resto de la semana aportas.'},
  {k:'Para cerrar · Ya sabes qué decir',lead:'Seis tipos para acompañar a la persona de “te veo” a “quiero saber más”.',
   p:['En la siguiente lección aprendes a <b>producir</b> ese contenido: tu banco de ideas, guiones con ia, imágenes, carruseles y videos editados.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 tasks:{t:'Mis primeras ideas',d:'Escribe en tu nota del celular al menos 2 ideas de cada tipo, y toca cada una cuando la tengas.',
  items:[['2 ideas de razones internas',''],['2 ideas de no venta',''],['2 ideas de testimonios (con permiso)',''],['2 ideas de estilo de vida',''],['2 dudas que me hacen seguido',''],['1 publicación de oportunidad','']],
  res:on=>{const n=on.filter(Boolean).length;return n===6?'<b>¡Ya tienes tus primeras 11 ideas!</b> En la lección 10 las conviertes en contenido.':`Llevas <b>${n} de 6</b>. Si te atoras, pídele ideas a la ia: abajo en la lección 10 te damos el pedido listo.`;}},
 recap:['Publica para la cabeza de quien te ve: <b>se identifica, confía, ve a otros, se imagina, resuelve dudas y decide</b>.','Seis tipos: <b>razones internas, no venta, testimonios, estilo de vida, dudas y oportunidad</b>.','La mayor parte de tu semana, <b>aporta</b>. La oportunidad, una o dos veces.'],
 rule:'Primero ayuda, después invita. <b>La gente se acerca a quien le aporta.</b>',
 quiz:[
  {p:'¿Por qué hay 6 tipos de contenido?',o:['Porque cada uno acompaña una etapa de lo que piensa la persona antes de decidir','Para publicar más','Porque lo pide Meta','No hay razón'],a:0,y:'Cada tipo acompaña un paso: identificarse, confiar, ver a otros, imaginarse, resolver dudas y decidir.'},
  {p:'Cuentas por qué decidiste aprender algo nuevo. ¿Qué tipo es?',o:['Razones internas','Oportunidad','Testimonio','Dudas'],a:0,y:'Tus razones hacen que quien tiene las mismas se identifique contigo.'},
  {p:'¿Cómo se comparte un testimonio?',o:['Con permiso y sin cifras de dinero','Inventándolo','Con capturas de ganancias','Sin preguntar'],a:0,y:'Siempre real, con permiso y sin cifras de dinero.'},
  {p:'El estilo de vida debe…',o:['Mostrar que eres una persona real, sin presumir lujos','Presumir dinero','Ocultar quién eres','Hablar solo del negocio'],a:0,y:'Mostrar tu vida real genera cercanía; presumir genera desconfianza.'},
  {p:'¿Qué formato es ideal para responder dudas con un sticker de pregunta?',o:['La historia de Instagram o Facebook','Un volante','Un correo','Ninguno'],a:0,y:'En las historias, el sticker de pregunta invita a la gente a escribirte sus dudas.'}
 ]},
/* ================= FASE 2 · LECCIÓN 10 ================= */
{key:'mkt9',phase:2,title:'Produce tu contenido',
 desc:'Tu sistema de producción: banco de ideas, guiones con ia, imágenes, carruseles, videos editados y tu semana programada.',
 obj:'Al terminar tendrás un sistema para producir contenido sin depender de la inspiración ni de nadie: ideas, guiones, imágenes, videos y tu semana programada.',
 cards:[
  {k:'Capítulo 1 · Un sistema, no inspiración',lead:'Publicar constante no depende de la inspiración: depende de un sistema.',
   p:['Quien publica todos los días no tiene más ideas que tú: tiene un <b>sistema</b>.',
      'El tuyo tiene 4 pasos: <b>ideas</b> → <b>guion</b> → <b>diseño o grabación</b> → <b>programar</b>.',
      'Lo haces una vez por semana, y el resto de los días solo publicas y conversas.'],
   art:'prod4'},
  {k:'Paso 1 · Tu banco de ideas',lead:'Una nota en tu celular que nunca se vacía.',
   p:['Crea una nota llamada <b>Banco de ideas</b> con 6 secciones, una por cada tipo de contenido.',
      '¿De dónde salen las ideas? De las <b>preguntas que te hacen</b>, de lo que <b>aprendes</b> cada semana, de los <b>comentarios</b> que recibes y de tu propia historia.',
      'Cada vez que se te ocurra algo, anótalo en su sección. Así nunca empiezas de cero.'],
   do:'Pídele a la ia: <b>“Mi nicho es [tu nicho]. Dame 5 ideas de publicación para cada uno de estos tipos: razones internas, no venta, testimonios, estilo de vida, dudas y miedos, y oportunidad. Sin prometer dinero.”</b>',
   g:['album']},
  {k:'Paso 2 · El guion con ia',lead:'La ia te ayuda a escribir; tú le pones tu voz.',
   p:['Toma una idea de tu banco y conviértela en guion con la estructura de 3 partes: <b>gancho</b> (la frase que detiene el dedo), <b>valor</b> (lo que enseñas o cuentas) e <b>invitación</b> (qué hacer después).',
      'Después léelo en voz alta y cambia lo que no suene a ti. La gente nota cuando un texto es copiado.'],
   do:'Pídele: <b>“Escríbeme un guion de 30 segundos para un video corto sobre [tu idea]. Estructura: gancho de una frase, valor en 3 frases cortas e invitación suave. Tono: [tus 3 palabras]. Sin prometer dinero.”</b>',
   art:'reel3'},
  {check:true,q:'¿Cuáles son las 3 partes de un guion?',
   o:['Gancho, valor e invitación','Precio, precio y precio','Saludo, despedida y firma'],a:0,
   y:'El gancho atrapa, el valor ayuda y la invitación dice qué hacer.'},
  {k:'Paso 3 · Tus imágenes',lead:'No dependas de nadie para tener qué publicar.',
   p:['Las imágenes del banco AUREX son un <b>apoyo</b>, no tu única fuente. Si un día no hay imágenes nuevas, tú sigues publicando.',
      'Con <b>Canva</b> (gratis) haces una imagen en 5 minutos: eliges una plantilla, cambias el texto por tu frase y usas tus colores de marca.',
      'Y tus <b>fotos reales</b> (tú trabajando, tu libreta, tu café de la mañana) conectan más que cualquier diseño. Cuando uses una imagen de AUREX, <b>agrégale una frase tuya</b>.'],
   g:['canva'],art:'ownimg'},
  {k:'Paso 3 · Frases y carruseles',lead:'Un carrusel enseña paso a paso, una imagen a la vez.',
   p:['Un <b>carrusel</b> es una publicación con varias imágenes que se deslizan. Es ideal para el contenido de <b>no venta</b>: consejos, pasos, errores que evitar.',
      'Estructura de 5 a 7 imágenes: <b>1</b> portada con un gancho, <b>2 a 6</b> un consejo por imagen y <b>la última</b> con tu invitación (“Guárdalo y escríbeme si tienes dudas”).',
      'En Canva busca la plantilla <b>Carrusel de Instagram</b> y usa siempre tus colores.'],
   g:['canva']},
  {k:'Paso 3 · Graba tu video',lead:'No necesitas producción. Necesitas autenticidad.',
   p:['Graba con el celular <b>de frente</b>, a la altura de tus ojos, con <b>luz de ventana</b> y en un lugar <b>sin ruido</b>.',
      'Ten tu guion a la mano. No pasa nada si te equivocas: graba varias veces y quédate con la mejor.',
      'Duración ideal para empezar: de <b>30 a 60 segundos</b>.']},
  {k:'Paso 3 · Edita en CapCut',lead:'Cuatro arreglos que hacen que tu video se vea profesional.',
   p:['<b>CapCut</b> es una app gratuita para editar videos desde el celular. Para empezar, solo necesitas 4 cosas:',
      '<ol class="steps"><li><b>Quitar los silencios</b> y los errores, para que el video sea ágil.</li><li><b>Mejorar el audio</b> y reducir el ruido.</li><li><b>Agregar subtítulos</b>: mucha gente ve videos sin sonido.</li><li><b>Poner una portada</b> con tu gancho escrito.</li></ol>'],
   g:['capcut']},
  {check:true,q:'¿Por qué conviene agregar subtítulos a tus videos?',
   o:['Porque mucha gente ve videos sin sonido','Porque lo exige la ley','No sirven para nada'],a:0,
   y:'Con subtítulos, tu mensaje llega aunque la persona tenga el sonido apagado.'},
  {k:'Paso 4 · Programa tu semana',lead:'Decide el domingo, publica toda la semana sin pensar.',
   p:['Este es un ejemplo de semana con los 6 tipos. Ajústalo a tu ritmo.',
      'El domingo prepara tus publicaciones y <b>prográmalas</b> en Meta Business Suite. Tus estados de WhatsApp sí los subes cada día.'],
   art:'week',g:['meta-suite']},
  {k:'Capítulo 2 · Materiales de regalo',lead:'Un regalo atrae más que una invitación.',
   p:['Un <b>material de regalo</b> es algo útil que ofreces gratis: una guía corta, una lista de pasos, una clase grabada o un video.',
      'Se usa así: publicas “¿Quieres mi guía para empezar a usar tu celular para emprender? Escríbeme REGALO”. Quien te escribe ya inició una conversación contigo.',
      'No tienes que crearlo tú: <b>pídele a tu líder o al equipo AUREX</b> los materiales disponibles para la comunidad.']},
  {k:'Capítulo 3 · El llamado a la acción',lead:'Al final de cada contenido, di qué hacer.',
   p:['Sin {{Call to Action|llamado a la acción}}, la gente ve y se va. Con él, actúa.',
      'Usa uno solo por publicación, claro y sin presión: “Escríbeme y platicamos”, “Responde esta historia con un 🙋”, “Guárdalo para después”.',
      'Y los {{Hashtag|hashtags}}: pocos (de 3 a 5) y relacionados con tu tema.']},
  {k:'Para cerrar · Tu fábrica de contenido',lead:'Ideas, guion, diseño o video, y tu semana programada.',
   p:['Con este sistema, una o dos horas el domingo te alcanzan para toda la semana.',
      'Si quieres sacarle todo el jugo a la ia, tendrás un módulo dedicado a ChatGPT.',
      'En la siguiente lección conviertes todo esto en tu <b>rutina diaria de 20 minutos</b>.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 guides:['canva','capcut','meta-suite'],
 tasks:{t:'Mi semana de contenido',d:'Prepara tu semana y toca cada punto cuando lo tengas.',
  items:[['Tengo mi Banco de ideas con las 6 secciones',''],['Escribí un guion con la ia y lo ajusté a mi voz',''],['Hice una imagen propia en Canva',''],['Hice un carrusel de 5 a 7 imágenes',''],['Grabé y edité un video con subtítulos',''],['Programé mi semana en Meta Business Suite',''],['Pedí a mi líder un material de regalo','']],
  res:on=>{const n=on.filter(Boolean).length;return n===7?'<b>¡Tu fábrica de contenido está funcionando!</b> Ahora a convertirla en rutina: lección 11.':`Llevas <b>${n} de 7</b>. No tiene que salir perfecto: lo importante es que salga.`;}},
 recap:['Contenido constante es un <b>sistema</b>: ideas → guion → diseño o video → programar.','La ia te ayuda a escribir; <b>tú le pones tu voz</b>. Canva y CapCut te ayudan a producir.','Las imágenes de AUREX y los materiales de regalo son <b>apoyo, no dependencia</b>.'],
 rule:'Lo que no se planea, no se publica. <b>Dedica un rato del domingo a tu semana.</b>',
 quiz:[
  {p:'¿Cuáles son los 4 pasos de tu sistema de producción?',o:['Ideas, guion, diseño o grabación, y programar','Comprar, vender, cobrar y repetir','Esperar inspiración','Copiar a otros'],a:0,y:'Con esos 4 pasos produces tu semana sin depender de la inspiración.'},
  {p:'¿Qué es un carrusel?',o:['Una publicación con varias imágenes que se deslizan','Un video largo','Un anuncio pagado','Un juego'],a:0,y:'Es ideal para enseñar paso a paso: una idea por imagen.'},
  {p:'Si un día no hay imágenes nuevas del banco AUREX…',o:['Dejas de publicar','Creas las tuyas en Canva o usas tus fotos','Esperas una semana','Copias las de otra persona'],a:1,y:'Las imágenes de AUREX son apoyo, no dependencia.'},
  {p:'¿Para qué sirve un material de regalo?',o:['Para que la persona te escriba y empiece una conversación','Para cobrar','Para llenar tu galería','No sirve'],a:0,y:'Quien pide tu regalo ya inició una conversación contigo.'},
  {p:'¿Qué haces con el guion que te da la ia?',o:['Lo publicas tal cual','Lo lees en voz alta y cambias lo que no suene a ti','Lo borras','Lo mandas a todos'],a:1,y:'La ia te ayuda a empezar; tu voz es lo que conecta.'}
 ]},
/* ================= FASE 2 · LECCIÓN 11 ================= */
{key:'mkt10',phase:2,title:'Tu sistema diario, red por red',
 desc:'Tu rutina de 20 minutos: qué hacer cada día en WhatsApp, Facebook e Instagram para abrir conversaciones.',
 obj:'Al terminar tendrás una rutina diaria clara, red por red, para que la gente te vea, detectar quién se interesa y abrir conversaciones sin perseguir a nadie.',
 cards:[
  {k:'Capítulo 1 · De contenido a conversación',lead:'Publicar es la mitad. La otra mitad es conversar.',
   p:['Tu contenido hace que te vean. Tu rutina hace que esas vistas se conviertan en <b>conversaciones</b>.',
      'No necesitas horas: con <b>20 minutos al día</b>, bien hechos, es suficiente. Lo importante es hacerlo <b>todos los días</b>.',
      'Vamos red por red, en el orden en que conviene hacerlo.'],
   art:'daily3'},
  {k:'WhatsApp · Publica tus estados',lead:'5 minutos: tus estados del día.',
   p:['<ol class="steps"><li>Ten listas de 2 a 5 imágenes: tuyas, hechas en Canva o del banco AUREX.</li><li>Súbelas <b>una por una</b>: cada imagen es un estado y suma sus propias vistas.</li><li>Orden recomendado: motivación, valor, historia real y, si quieres, una invitación suave.</li></ol>',
      'Mejores horarios: <b>de 8 a 9 am, de 1 a 2 pm y de 7 a 9 pm</b>.'],
   g:['wa-estado'],art:'sequence'},
  {k:'WhatsApp · Las 3 horas de oro',lead:'Publica, cierra el teléfono y deja que el contenido trabaje.',
   p:['Espera <b>de 2 a 3 horas</b>. Luego abre tu estado y desliza hacia arriba para ver quién lo vio.',
      'Fíjate en tres señales: alguien que vio <b>2 o más</b> imágenes, alguien que <b>no suele interactuar</b> y hoy miró todo, y alguien que <b>respondió</b>.',
      'Anota hasta 5 nombres y ponles la etiqueta <b>Nuevo prospecto</b> en WhatsApp Business.'],
   g:['wa-vistas'],art:'signals'},
  {check:true,q:'Después de publicar tus estados, ¿qué haces?',
   o:['Revisar cada 5 minutos quién los vio','Esperar unas 3 horas y luego revisar las señales de interés','Mandar el link a todos'],a:1,
   y:'Deja trabajar al contenido. Después revisas con calma y anotas a quien mostró interés.'},
  {k:'Facebook · Tu página y tus grupos',lead:'5 minutos: presencia en tu comunidad.',
   p:['<b>Tu página:</b> si no la programaste, publica lo que toca según tu calendario. Compártela en tu perfil para que la vean tus amistades.',
      '<b>Tus grupos:</b> entra a uno de tus grupos y <b>aporta</b>: responde una duda o comenta algo útil. Sin vender.',
      'Responde los comentarios de tu página el mismo día.']},
  {k:'Instagram · Historias y mensajes',lead:'5 minutos: conversar con quien te descubre.',
   p:['Sube <b>una historia con sticker</b> de pregunta o encuesta. Las respuestas te llegan como mensajes directos.',
      'Revisa tus <b>mensajes directos</b> y responde a cada persona.',
      'Comenta en 3 publicaciones de personas de tu nicho. Así te descubren.'],
   g:['ig-sticker','dm']},
  {k:'Todos los días · Tu bandeja única',lead:'5 minutos: responde todo en un solo lugar.',
   p:['Abre la <b>Bandeja de entrada</b> de Meta Business Suite: ahí están los mensajes de tu página y de Instagram.',
      'Y revisa tu WhatsApp Business con tus etiquetas: ¿a quién le toca seguimiento hoy?',
      'Responder el mismo día es de las cosas que más confianza generan.'],
   g:['meta-suite']},
  {k:'De la vista a la conversación',lead:'El primer mensaje solo reconecta.',
   p:['A quienes mostraron interés, salúdales <b>sin hablar del negocio</b>. Como saludarías a cualquier conocido.',
      'Después de 1 o 2 mensajes de plática, haz <b>una sola pregunta</b> para saber si hay interés.',
      'Si dice que sí, compartes tu información. Si dice que no, lo respetas y sigues con amabilidad.'],
   ex:'Saludo: “¡Hola, [nombre]! ¿Cómo estás? Hace tiempo que no sé de ti 😊” · Pregunta: “Oye, te pregunto porque últimamente has visto mis estados 😄 ¿Te da curiosidad conocer algo nuevo?”'},
  {check:true,q:'¿Qué va en el primer mensaje a alguien que vio tus estados?',
   o:['El link del embudo','Un saludo natural, sin hablar del negocio','Una explicación de todo'],a:1,
   y:'El primer mensaje solo reconecta. El negocio viene después, si hay interés.'},
  {k:'Cada semana · Historias en secuencia',lead:'Una historia suelta se olvida; una secuencia se sigue.',
   p:['Una o dos veces por semana, en lugar de historias sueltas, publica una <b>secuencia</b> de 3 a 5 historias seguidas que cuenten algo:',
      '<ol class="steps"><li><b>Gancho:</b> una pregunta o una frase que dé curiosidad.</li><li><b>Contexto:</b> qué pasó o de qué vas a hablar.</li><li><b>Valor:</b> el consejo o el aprendizaje.</li><li><b>Ejemplo:</b> una foto o un video tuyo que lo muestre.</li><li><b>Cierre:</b> un sticker de pregunta o una invitación suave.</li></ol>'],
   ex:'“Un día en mi vida aprendiendo lo digital”: 1) “¿Sabes qué hago a las 8 de la mañana?” 2) Tu café y tu celular. 3) “Dedico 20 minutos a publicar y conversar.” 4) Captura de tu rutina. 5) Sticker: “¿Tú a qué hora empiezas tu día?”',
   g:['ig-sticker']},
  {k:'Cada semana o cada quince días · Tu live',lead:'Un live es tu salón de clases en vivo.',
   p:['Un <b>live</b> es una transmisión en vivo en Instagram o Facebook. Genera mucha confianza, porque la gente te ve y te escucha en tiempo real.',
      '<b>Frecuencia:</b> una vez por semana o cada quince días, el mismo día y a la misma hora. Dura de 20 a 30 minutos.',
      '<b>Estructura:</b> bienvenida (saluda por su nombre a quien llega), <b>un solo tema útil</b>, preguntas del público e invitación suave al final.',
      '<b>Avísalo</b> uno o dos días antes con una imagen de invitación en Canva y con historias.'],
   g:['canva']},
  {check:true,q:'¿Cuántos temas conviene tratar en un live?',
   o:['Uno solo, bien explicado','Todos los que se puedan','Ninguno, solo saludar'],a:0,
   y:'Un solo tema útil hace que la gente se quede y recuerde lo que dijiste.'},
  {k:'Capítulo 2 · Tu ancla: el módulo de Networking',lead:'Cuando alguien levanta la mano, entra tu sistema de seguimiento.',
   p:['En marketing digital tu trabajo es <b>que te vean y abrir la conversación</b>.',
      'Qué decir después, cómo responder dudas, cómo invitar al Zoom y cómo dar seguimiento ya lo tienes paso a paso en tu módulo de <b>Networking</b>.',
      'Usa tus respuestas rápidas (<b>/info</b>, <b>/zoom</b>) y tus etiquetas para que nada se te escape.'],
   do:'Si todavía no has hecho el módulo de Networking, hazlo antes de tus primeras conversaciones: ahí están los guiones completos.'},
  {k:'Para cerrar · 20 minutos que cambian todo',lead:'WhatsApp, Facebook, Instagram y tu bandeja. Todos los días.',
   p:['La constancia vale más que la intensidad: 20 minutos diarios dan más que 3 horas un solo día.',
      'Al terminar el módulo se desbloquea <b>Mi rutina diaria</b>, para que la cumplas sin pensarlo.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 guides:['wa-estado','wa-vistas','ig-sticker','meta-suite'],
 tasks:{t:'Mi rutina de hoy',d:'Hazla hoy mismo y toca cada paso cuando lo cumplas.',
  items:[['Publiqué mis estados, uno por uno',''],['Planeé mi secuencia de historias de esta semana',''],['Revisé las señales después de 3 horas y etiqueté hasta 5 nombres',''],['Publiqué o compartí en mi página y aporté en un grupo',''],['Subí una historia con sticker en Instagram',''],['Respondí todos mis mensajes',''],['Saludé a 3 personas sin hablar del negocio','']],
  res:on=>{const n=on.filter(Boolean).length;return n===7?'<b>¡Cumpliste tu rutina!</b> Ese es todo el secreto: repetirla mañana.':`Llevas <b>${n} de 7</b>. Si hoy no alcanzas, no pasa nada: lo importante es volver mañana.`;}},
 recap:['<b>20 minutos al día</b>, red por red: estados, página y grupos, historias y bandeja.','Las <b>3 horas de oro</b> te dicen a quién saludar. Etiquétalo en WhatsApp Business.','Saluda sin vender y, cuando haya interés, sigue con tu módulo de <b>Networking</b>.'],
 rule:'Publica, espera, revisa y saluda. <b>Todos los días, sin perseguir a nadie.</b>',
 quiz:[
  {p:'¿Cuánto tiempo al día propone tu rutina?',o:['Unos 20 minutos, todos los días','3 horas un día a la semana','Nada','Todo el día'],a:0,y:'La constancia vale más que la intensidad.'},
  {p:'¿Cómo conviene subir tus estados?',o:['Una por una','Todas juntas','Una vez al mes','Solo en la noche'],a:0,y:'Cada imagen es un estado separado y suma sus propias vistas.'},
  {p:'¿Qué haces en tus grupos de Facebook?',o:['Aportar: responder dudas y comentar algo útil','Pegar tu link en todos','Nada','Discutir'],a:0,y:'En los grupos, quien aporta genera confianza.'},
  {p:'¿Dónde respondes juntos los mensajes de tu página y de Instagram?',o:['En la bandeja de Meta Business Suite','En la galería','En la cámara','En el correo'],a:0,y:'La bandeja de entrada de Meta Business Suite junta tus mensajes.'},
  {p:'Alguien mostró interés. ¿Dónde están los guiones para seguir?',o:['En tu módulo de Networking','En ningún lado','En Instagram','En la calculadora'],a:0,y:'El seguimiento completo está en tu módulo de Networking.'}
 ]},
/* ================= FASE 2 · LECCIÓN 12 ================= */
{key:'mkt11',phase:2,title:'Cómo funciona el embudo',
 desc:'Las piezas reales: tráfico, página de captura, funnel, conversación y seguimiento. Y por qué el link se gana.',
 obj:'Al terminar podrás explicar cómo funciona un embudo pieza por pieza, de dónde llega la gente y cuándo compartir tu link.',
 cards:[
  {k:'Capítulo 1 · El embudo, de verdad',lead:'El embudo no es un link. Es un camino con varias piezas.',
   p:['Mucha gente cree que el embudo es “mandar un link”. En realidad es un <b>camino</b> que lleva a una persona desde que te descubre hasta que decide.',
      'Ya conoces la parte de tus redes. Ahora vas a ver <b>todas las piezas juntas</b>, en orden.'],
   art:'chain'},
  {k:'Pieza 1 · El tráfico',lead:'Sin gente que llegue, no hay embudo.',
   p:['El {{Tráfico|tráfico}} es la gente que llega a tu embudo. Llega de dos formas:',
      '<b>Orgánico:</b> por tus redes, gratis. Es lo que construiste en este módulo: tus estados, tu página, tu Instagram, tus conversaciones. Es constante, pero crece poco a poco.',
      '<b>Pagado:</b> con publicidad en Meta, desde tu página. Llega a más gente y más rápido, pero cuesta y tiene sus reglas. Lo verás en un módulo aparte.'],
   art:'orgpaid'},
  {k:'Pieza 2 · La página de captura',lead:'La puerta de entrada: la persona levanta la mano.',
   p:['La {{Página de captura|página de captura}} es una página sencilla donde la persona deja sus datos (por ejemplo, nombre y WhatsApp) para recibir la información.',
      'Al dejar sus datos, esa persona pasa de “alguien que vio algo” a <b>un prospecto</b>: alguien que dijo “cuéntame más”.',
      'Es como la recepción de una escuela: ahí te registras antes de pasar al salón.']},
  {k:'Pieza 3 · El funnel AUREX',lead:'La información completa, explicada por ti, sin que tengas que explicarla.',
   p:['Después de la página de captura, la persona entra al <b>funnel</b> que AUREX te da: la presentación completa, con todo explicado.',
      'El funnel hace algo que tú no podrías por chat: <b>explica igual de bien, a cualquier hora y a cualquier persona</b>.',
      'Tu link personal te lo da tu líder o el equipo AUREX. Es el que pusiste en tus perfiles.']},
  {check:true,q:'¿Qué pasa en la página de captura?',
   o:['La persona deja sus datos y se vuelve prospecto','La persona paga','Se publica un estado'],a:0,
   y:'En la página de captura la persona levanta la mano: deja sus datos para recibir la información.'},
  {k:'Piezas 4 y 5 · Conversación y seguimiento',lead:'El funnel informa. Tú conectas.',
   p:['La decisión no ocurre en el funnel: ocurre en la <b>conversación</b> de después y en el <b>Zoom</b>, donde la persona resuelve sus dudas contigo.',
      'Y como no todos deciden a la primera, viene el <b>seguimiento</b>. Todo eso lo tienes en tu módulo de Networking.']},
  {k:'Capítulo 2 · El link se gana',lead:'Comparte tu link solo cuando hay interés confirmado.',
   p:['El error más común es mandar el link a cualquiera, sin contexto, esperando que “algo pase”.',
      'El link se comparte <b>solo cuando hay interés confirmado</b>. No antes. Nunca por cortesía. Nunca “para ver qué pasa”.',
      'Cada link sin interés es ruido, y el ruido hace que la gente deje de abrir lo que le mandas.'],
   art:'linkgate'},
  {check:true,q:'Un conocido no ha mostrado interés. ¿Le mandas el link “por si acaso”?',
   o:['Sí, por si le interesa','No: el link se comparte solo con interés confirmado','Sí, y a toda su familia'],a:1,
   y:'El link se gana. Sin interés, mejor sigue visible y conversa con calma.'},
  {k:'Capítulo 3 · Cómo compartirlo',lead:'Un mensaje corto que prepare, y después esperar.',
   p:['Acompaña tu link con un mensaje corto. No expliques lo que el funnel ya explica.',
      'Después, <b>espera de 1 a 3 horas</b>. Si no hay respuesta, da seguimiento ese mismo día, con calma: el interés se enfría rápido.'],
   ex:'Tu respuesta rápida /info: “Te comparto la información completa para que la revises con calma. Al final me dices qué te pareció 😊 👇 [link]”'},
  {k:'Capítulo 4 · La regla del 80/20',lead:'En la conversación, escucha más de lo que hablas.',
   p:['<b>80% escuchas:</b> preguntas, entiendes y descubres qué necesita de verdad la persona.',
      '<b>20% hablas:</b> diriges, compartes el link o propones el Zoom.',
      'Si explicas todo por chat, complicas lo que el funnel explica simple, saturas a la persona y rompes su curiosidad.'],
   art:'talk'},
  {k:'Capítulo 5 · Los números y la constancia',lead:'No todos van a responder. Y eso es normal.',
   p:['Así funciona cualquier embudo: <b>empieza ancho y termina angosto</b>. De muchas personas que te ven, algunas te escriben, menos conversan y pocas llegan al Zoom.',
      'Lleva <b>tus propios números</b>: conversaciones abiertas, links compartidos con interés y Zooms agendados. Te dicen dónde mejorar.',
      'Lo que no funciona es parar antes de tiempo.'],
   art:'funnel'},
  {check:true,q:'De cada 10 personas, solo algunas muestran interés. ¿Qué significa?',
   o:['Que el sistema falló','Que es normal: sigue con constancia y revisa tus números','Que debes mandar más links sin preguntar'],a:1,
   y:'Así funciona cualquier embudo. La constancia y tus números marcan la diferencia.'},
  {k:'Para cerrar · Ya ves el camino completo',lead:'Tráfico, página de captura, funnel, conversación y seguimiento.',
   p:['Ahora entiendes para qué sirve cada cosa que construiste: tus redes traen el tráfico, tu link lleva a la captura y al funnel, y tú conectas en la conversación.',
      'En la última lección armas tu <b>plan de 30 días</b> para ponerlo todo en marcha.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 tasks:{t:'Mis hábitos con el embudo',d:'Toca cada hábito que te comprometes a cumplir.',
  items:[['Tengo mi link personal del embudo y lo probé',''],['Solo comparto el link cuando hay interés confirmado',''],['Lo acompaño con un mensaje corto (/info)',''],['Espero de 1 a 3 horas y doy seguimiento el mismo día',''],['Escucho más de lo que hablo',''],['Anoto mis números cada semana','']],
  res:on=>{const n=on.filter(Boolean).length;let m=`Llevas <b>${n} de 6</b>. `;if(!on[0])m+='Lo primero: pide tu link personal a tu líder o al equipo AUREX y pruébalo desde tu celular. ';if(n===6)m+='<b>Excelente:</b> tu embudo trabaja a su máxima capacidad.';return m;}},
 recap:['El embudo tiene piezas: <b>tráfico, página de captura, funnel, conversación y seguimiento</b>.','El tráfico llega <b>orgánico</b> (tus redes) o <b>pagado</b> (publicidad en Meta).','<b>El link se gana</b> y en la conversación escuchas el 80%.'],
 rule:'<b>El link se gana.</b> Nunca por cortesía, nunca “para ver qué pasa”.',

function startAuth(){
  if(DEMO){openApp();return;}
  if(!window.firebase||!firebase.auth){gate('<p>No pudimos conectar. Revisa tu internet y vuelve a intentar.</p><button class="btn-gold" onclick="location.reload()">Reintentar</button>');return;}

  if(LS('prog_uid')&&LS('prog_uid')!==USER.uid){Object.keys(localStorage).filter(k=>/^(done_|mk_)/.test(k)).forEach(k=>localStorage.removeItem(k));}
  LS('prog_uid',USER.uid);
  try{const s=await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').get();

function spaced(x,t,cx,y,sp){const w=[...t].reduce((s,ch)=>s+x.measureText(ch).width,0)+sp*(t.length-1);let px=cx-w/2;x.save();x.textAlign='left';for(const ch of t){x.fillText(ch,px,y);px+=x.measureText(ch).width+sp;}x.restore();}
function wrap(x,t,cx,y,maxW,lh){const words=t.split(' ');let line='';for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,cx,y);line=w;y+=lh;}else line=test;}if(line)x.fillText(line,cx,y);}

/* ---------- DICCIONARIO ---------- */
let DF=0;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function openDict(q){document.getElementById('dict').classList.add('open');closePop();const i=document.getElementById('dict-q');i.value=q||'';renderDict();if(!q&&window.innerWidth>820)setTimeout(()=>i.focus(),100);}
function closeDict(){document.getElementById('dict').classList.remove('open');}
function setDictFilter(f){DF=f;document.getElementById('df-all').classList.toggle('on',!f);document.getElementById('df-ess').classList.toggle('on',!!f);renderDict();}
function renderDict(){
  const q=norm(document.getElementById('dict-q').value.trim());
  const list=DICT.filter(d=>(!DF||d[4])&&(!q||norm(d[0]+' '+d[1]+' '+d[2]).includes(q))).sort((a,b)=>{const ia=q&&norm(a[0]).includes(q)?0:1,ib=q&&norm(b[0]).includes(q)?0:1;return ia-ib||norm(a[0]).localeCompare(norm(b[0]));});
  document.getElementById('dict-l').innerHTML=`<div class="dict-n">${list.length} ${list.length===1?'palabra':'palabras'} · Toca una para ver su explicación</div>`+
   (list.length?list.map(d=>`<details ${q&&list.length<=3?'open':''}><summary><b>${d[0]}${d[4]?'<span class="tag-e">Esencial</span>':''}</b><small>${d[1]}</small></summary><div class="dd">${d[2]}${d[3]?`<em>${d[3]}</em>`:''}</div></details>`).join(''):`<p class="sec-d">No encontramos esa palabra. Prueba con otra forma de escribirla o pregúntale a quien te invitó.</p>`);
}
function findTerm(t){const n=norm(t);return DICT.find(d=>norm(d[0])===n)||DICT.find(d=>norm(d[0]).startsWith(n));}
function pop(t){if(HOVER){const el=[...document.querySelectorAll('.term')].find(x=>x.dataset.t===t);if(el){showTip(el);return;}}const d=findTerm(t);if(!d)return;const p=document.getElementById('pop');
  p.innerHTML=`<b>${d[0]}</b><p>${d[2]}${d[3]?`<br><em>${d[3]}</em>`:''}</p><div class="row"><button class="btn-line" onclick="openDict()">Ver todo el diccionario</button><button class="btn-gold" onclick="closePop()">Entendido</button></div>`;p.classList.add('open');}
function closePop(){document.getElementById('pop').classList.remove('open');}

const HOVER=window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches;

function showTip(el){

  tip.innerHTML=`<b>${d[0]}</b><p>${d[2]}${d[3]?`<br><em>${d[3]}</em>`:''}</p><button onclick="openDict('${d[0].replace(/'/g,"\\'")}')">Ver en el diccionario →</button>`;

  let top=r.bottom+8;if(top+th>window.innerHeight-10)top=Math.max(10,r.top-th-8);
  tip.style.top=top+'px';tip.style.left=Math.min(Math.max(12,r.left),window.innerWidth-tw-12)+'px';

let TI=0;
function maybeTour(){if(LS('mk_tour2')==='1'||ST.view!==0||location.hash==='#diploma')return;TI=0;document.getElementById('tour').classList.add('open');showTour();}
function showTour(){const s=TOUR[TI],el=document.querySelector(s.el);if(!el){endTour();return;}
  el.scrollIntoView({block:'center'});
  setTimeout(()=>{const r=el.getBoundingClientRect(),hole=document.getElementById('tour-hole'),box=document.getElementById('tour-box');
    hole.style.cssText=`left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px`;
    box.innerHTML=`<small>PASO ${TI+1} DE ${TOUR.length}</small><p>${s.t}</p><div class="row"><button class="skip" onclick="endTour()">Saltar</button><button class="btn-gold" style="padding:.75rem 1.2rem" onclick="nextTour()">${TI===TOUR.length-1?'¡Listo!':'Siguiente →'}</button></div>`;
    const bh=box.offsetHeight,bw=box.offsetWidth;let top=r.bottom+16;if(top+bh>window.innerHeight-10)top=Math.max(10,r.top-bh-16);
    box.style.top=top+'px';box.style.left=Math.min(Math.max(12,r.left),window.innerWidth-bw-12)+'px';},250);}
function nextTour(){TI++;if(TI>=TOUR.length)endTour();else showTour();}
function endTour(){document.getElementById('tour').classList.remove('open');LS('mk_tour2','1');}

function phone(o){
  const tabs=o.tabs?`<div class="ph-tabs">${o.tabs.map((t,i)=>`<span class="${i===o.act?'act':''} ${i===o.tabHl?'hl':''}">${t}</span>`).join('')}</div>`:'';
  const rows=(o.rows||[]).map(r=>`<div class="ph-row ${r[3]?'hl':''}"><span class="av">${r[0]}</span><div>${r[1]}${r[2]?`<small>${r[2]}</small>`:''}</div>${r[4]?`<span class="rt">${r[4]}</span>`:''}</div>`).join('');
  const media=o.media?`<div class="ph-media"><span>${o.media[0]}</span><span class="ph-bar ${o.media[2]?'hl':''}">${o.media[1]}</span></div>`:'';
  return `<div class="ph"><div class="ph-n"></div><div class="ph-top"><span>${o.title}</span><span class="ic ${o.rHl?'hl':''}">${o.right||''}</span></div><div class="ph-body">${media}${rows}</div>${tabs}</div>`;
}

let GCUR=null;
function gOS(){let o=LS('mk_os');if(!o){o=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'i':'a';}return o;}
function setOS(o){LS('mk_os',o);if(GCUR)openGuide(GCUR,true);}
function guideBtn(id){const g=GUIDES[id];return g?`<button class="g-btn" onclick="openGuide('${id}')">${g.ic} ${g.t} →</button>`:'';}
function guideHelp(ids){return `<div class="g-help"><p><b>¿No sabes cómo se hace en tu celular?</b> Toca la guía, sigue los pasos y regresas aquí.</p><div class="g-btns">${ids.map(guideBtn).join('')}</div></div>`;}
function openGuide(id,keep){
  const g=GUIDES[id];if(!g)return;GCUR=id;const os=gOS();
  const steps=os==='i'?(g.ip==='a'?g.a:g.ip):g.a;const scr=os==='i'?(g.pi==='a'?g.pa:g.pi):g.pa;const same=g.ip==='a';
  document.getElementById('gd-b').innerHTML=`<div class="gd-os"><button class="${os==='a'?'on':''}" onclick="setOS('a')">Android</button><button class="${os==='i'?'on':''}" onclick="setOS('i')">iPhone</button></div>
   <div class="gd-t">${g.t}</div><p class="gd-i">${g.i}${same?' <b>Es igual en Android y en iPhone.</b>':''}</p>
   <div class="gd-g"><div>${phone(scr)}</div><div><ol class="gd-steps">${steps.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>${g.tip?`<div class="gd-tip">💡 ${g.tip}</div>`:''}
   <p class="gd-note">Las apps se actualizan seguido: si un nombre cambia un poco, busca el más parecido.</p></div></div>`;
  document.getElementById('gd-f').innerHTML=`<button class="btn-line" onclick="guideIndex()">← Todas las guías</button><button class="btn-gold" onclick="closeGuide()">Listo, regresar</button>`;
  const d=document.getElementById('gd');d.classList.add('open');document.body.style.overflow='hidden';if(!keep)document.getElementById('gd-b').scrollTop=0;
}
function guideIndex(){
  GCUR=null;const grp=GGROUP;
  document.getElementById('gd-b').innerHTML=`<div class="gd-t">¿Qué quieres aprender a hacer?</div><p class="gd-i">Guías cortas, paso a paso, para Android y para iPhone. Toca una.</p>`+
   Object.keys(grp).map(k=>`<div class="gd-sec">${k}</div><div class="gd-list">${grp[k].map(id=>`<button onclick="openGuide('${id}')"><span class="ic">${GUIDES[id].ic}</span>${GUIDES[id].t}</button>`).join('')}</div>`).join('');
  document.getElementById('gd-f').innerHTML=`<span></span><button class="btn-gold" onclick="closeGuide()">Cerrar</button>`;
  document.getElementById('gd').classList.add('open');document.body.style.overflow='hidden';document.getElementById('gd-b').scrollTop=0;
}
function closeGuide(){document.getElementById('gd').classList.remove('open');document.body.style.overflow='';GCUR=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGuide();});

applyFont();
(function(){const h=location.hash.match(/^#l(\d+)$/);if(h){const n=parseInt(h[1]);if(n>=1&&n<=LESSONS.length)ST.view=n;}if(location.hash==='#rutina')ST.view='rutina';if(location.hash==='#diploma')setTimeout(()=>{showCert();},900);})();
window.addEventListener('hashchange',()=>{const h=location.hash;if(h==='#rutina'&&ST.view!=='rutina'){ST.view='rutina';render();}else if(h==='#diploma'){if(ST.view!==0){ST.view=0;render();}setTimeout(showCert,300);}else{const m=h.match(/^#l(\d+)$/);if(m&&ST.view!==parseInt(m[1])){ST.view=parseInt(m[1]);render();}}});
