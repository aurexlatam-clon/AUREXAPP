<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Digital · AUREX Academy</title>
<meta name="theme-color" content="#070707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9952A;--gold-l:#F0C96B;--bg:#070707;--green:#1D9E75;
  --surface:#111;--surface2:#171717;--border:#262626;
  --text:#f2efe9;--muted:#9a9ea6;--danger:#e05252;--blue:#93c5fd;
  --head:'Oswald','Arial Narrow',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html.fs1{font-size:112%}
html.fs2{font-size:125%}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;top:0;bottom:0;width:38vw;pointer-events:none;z-index:0}
body::before{left:-12vw;background:radial-gradient(ellipse 50% 40% at 30% 25%,rgba(201,149,42,.13),transparent 70%),radial-gradient(ellipse 35% 30% at 20% 80%,rgba(240,201,107,.07),transparent 70%)}
body::after{right:-12vw;background:radial-gradient(ellipse 50% 40% at 70% 60%,rgba(201,149,42,.12),transparent 70%),radial-gradient(ellipse 30% 25% at 80% 15%,rgba(240,201,107,.08),transparent 70%)}
.sparks{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 6% 18%,rgba(240,201,107,.7),transparent),radial-gradient(1px 1px at 12% 42%,rgba(240,201,107,.6),transparent),radial-gradient(2px 2px at 4% 66%,rgba(240,201,107,.5),transparent),radial-gradient(1px 1px at 9% 88%,rgba(240,201,107,.6),transparent),radial-gradient(1.5px 1.5px at 94% 22%,rgba(240,201,107,.7),transparent),radial-gradient(1px 1px at 89% 48%,rgba(240,201,107,.6),transparent),radial-gradient(2px 2px at 96% 74%,rgba(240,201,107,.5),transparent),radial-gradient(1px 1px at 91% 93%,rgba(240,201,107,.6),transparent)}
button{font-family:var(--body);cursor:pointer}
a{color:var(--gold-l)}
.wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:0 clamp(16px,3.5vw,52px)}
.top{position:sticky;top:0;z-index:30;background:rgba(7,7,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:.6rem;height:60px}
.top-back{background:none;border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;color:var(--muted);font-size:.88rem;text-decoration:none;white-space:nowrap}
.top-back:hover{border-color:var(--gold);color:var(--text)}
.top-logo{flex:1;font-family:var(--head);letter-spacing:.22em;color:var(--gold);font-size:1rem;text-align:center}
.top-logo small{color:var(--muted);letter-spacing:.18em;font-size:.72rem}
.top-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;padding:.5rem .8rem;font-weight:600;white-space:nowrap}
.top-btn:hover{border-color:var(--gold)}
.top-btn.dic{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.top-btn.dic:hover{background:var(--gold-l)}
.hero{position:relative;margin-top:1.4rem;border-radius:22px;border:1px solid rgba(201,149,42,.35);min-height:260px;display:flex;align-items:flex-end;padding:2rem;overflow:hidden;background:#0d0b07}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center right}
.hero-bg.fb{background:radial-gradient(ellipse 60% 90% at 85% 30%,rgba(201,149,42,.35),transparent 60%),radial-gradient(ellipse 50% 60% at 10% 100%,rgba(240,201,107,.12),transparent 70%),#0b0906}
.hero::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(7,7,7,.95) 25%,rgba(7,7,7,.2) 75%)}
.hero-in{position:relative;z-index:2;width:100%;max-width:760px}
.kick{font-family:var(--head);font-size:.78rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--head);font-size:2.8rem;text-transform:uppercase;font-weight:600;letter-spacing:.04em;margin:.35rem 0 .3rem;line-height:1.1}
.hero p{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:#e0d8c8}
.prog{display:flex;align-items:center;gap:.8rem;margin-top:1.2rem;font-size:.9rem;color:var(--muted);max-width:560px}
.bar{flex:1;height:7px;background:#222;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:4px;transition:width .5s}
main{padding:1.6rem 0 5rem}
.l-head{margin-top:1.6rem;padding:2rem 0 1.4rem;border-bottom:1px solid var(--border);margin-bottom:1.6rem}
.l-head .kick{font-size:.85rem}
.h{font-family:var(--head);font-size:2.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:.4rem 0 1.2rem;line-height:1.1}
.obj{background:linear-gradient(135deg,rgba(201,149,42,.14),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.45);border-radius:18px;padding:1.1rem 1.5rem;max-width:1100px}
.obj span{font-family:var(--head);font-size:.82rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.3rem}
.obj p{font-family:var(--serif);font-style:italic;font-size:1.55rem;line-height:1.35;color:var(--gold-l)}
.sec{font-family:var(--head);font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase;margin:3rem 0 .5rem;padding-top:2.2rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.7rem}
.sec .num{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-size:1rem;flex-shrink:0}
.sec small{font-family:var(--body);font-size:.88rem;letter-spacing:0;text-transform:none;color:var(--muted)}
.sec-d{font-size:1.04rem;color:var(--muted);margin-bottom:1.1rem;line-height:1.6;max-width:1000px}
.sec-d b{color:var(--text)}
.how{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.3);border-radius:16px;padding:1.1rem 1.4rem;margin:1.4rem 0;max-width:1100px}
.how-t{font-family:var(--head);font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:.55rem}
.how ol{padding-left:1.3rem;display:grid;gap:.4rem}
.how li{font-size:1.1rem;line-height:1.65;color:#e4dfd5}
.how li b{color:var(--gold-l)}
.btn-gold{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:var(--gold);color:#0a0a0a;font-family:var(--head);letter-spacing:.14em;font-size:1rem;padding:1rem 1.6rem;border-radius:13px;font-weight:600;border:none;text-transform:uppercase;text-decoration:none}
.btn-gold:hover{background:var(--gold-l)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-line{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:13px;padding:.95rem 1.3rem;font-size:1rem;text-decoration:none}
.btn-line:hover{border-color:var(--gold)}
.btn-line:disabled{opacity:.35;cursor:default}
.term{background:none;border:none;color:var(--gold-l);font:inherit;border-bottom:1.5px dotted var(--gold);padding:0;cursor:help}
.gate-box{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:rgba(224,82,82,.06);border:1px solid rgba(224,82,82,.4);border-radius:16px;padding:1.1rem 1.3rem;margin:1.2rem 0;max-width:1100px}
.gate-box div{flex:1;min-width:260px}
.gate-box b{color:#f3a3a3;font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:.3rem}
.gate-box p{font-size:1.02rem;line-height:1.6;color:#d8d4cc}
.gate-box p b{color:var(--text);font-family:var(--body);display:inline;text-transform:none;letter-spacing:0}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.lc{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem 1.3rem 1.2rem;color:var(--text);display:flex;flex-direction:column;gap:.5rem;transition:border-color .2s,transform .2s;overflow:hidden}
.lc:hover{border-color:rgba(201,149,42,.55);transform:translateY(-2px)}
.lc .n{font-family:var(--head);font-size:2.4rem;color:rgba(240,201,107,.3);line-height:1}
.lc b{font-family:var(--head);font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase}
.lc p{font-size:.98rem;line-height:1.55;color:#b9b5ad;flex:1}
.lc .st{font-size:.85rem;align-self:flex-start;border-radius:20px;padding:.3rem .75rem;border:1px solid var(--border);color:var(--muted)}
.lc.next{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(201,149,42,.1)}
.lc.next .st{background:var(--gold);color:#0a0a0a;border-color:var(--gold);font-weight:600}
.lc.done{border-color:rgba(29,158,117,.45)}
.lc.done .st{color:var(--green);border-color:rgba(29,158,117,.5)}
.lc.cur{background:linear-gradient(135deg,rgba(201,149,42,.12),transparent)}
.lc.cur .st{color:var(--gold-l);border-color:rgba(201,149,42,.5)}
.nextbig{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(120deg,rgba(201,149,42,.16),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.5);border-radius:22px;padding:1.6rem 1.8rem;margin-bottom:1.6rem}
.nextbig small{font-family:var(--head);letter-spacing:.26em;color:var(--gold);font-size:.8rem}
.nextbig h3{font-family:var(--head);font-size:1.8rem;text-transform:uppercase;letter-spacing:.04em;margin:.3rem 0}
.nextbig p{font-size:1.04rem;color:#cfcac0;line-height:1.55;max-width:700px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.howto>div{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem}
.howto .i{width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,149,42,.6);color:var(--gold-l);display:grid;place-items:center;font-family:var(--head);font-size:1.2rem}
.howto .ht{font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;display:block;margin:.6rem 0 .25rem;font-size:1.1rem}
.howto p{font-size:1rem;line-height:1.6;color:#b9b5ad}
.where{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.where-q{display:flex;flex-direction:column;justify-content:space-between;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem}
.where-q p{font-size:1.04rem;line-height:1.5}
.yn{display:flex;gap:.5rem}
.yn button{flex:1;border:1px solid var(--border);background:#0b0b0b;color:var(--text);border-radius:10px;padding:.7rem .9rem;font-size:1rem}
.yn button.sel{background:rgba(201,149,42,.18);border-color:var(--gold);color:var(--gold-l);font-weight:600}
.reco{margin-top:1rem;border-radius:16px;padding:1.2rem 1.4rem;background:linear-gradient(135deg,rgba(201,149,42,.12),transparent);border:1px solid rgba(201,149,42,.45)}
.reco>b{font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);display:block;margin-bottom:.3rem}
.reco p{font-size:1.04rem;line-height:1.65;color:#d8d4cc}
.side-box{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;background:#0d0d0d;border:1px dashed rgba(201,149,42,.5);border-radius:18px;padding:1.3rem 1.5rem;margin-top:1.4rem}
.side-box p{flex:1;min-width:260px;font-size:1.04rem;line-height:1.6;color:#cfcac0}
.side-box b{color:var(--gold-l)}
.learn{background:#171614;border:1px solid #2c2a26;border-radius:24px;overflow:hidden}
.learn-top{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid #2c2a26;background:#141312}
.learn-top .lbl{font-family:var(--head);letter-spacing:.2em;font-size:.85rem;color:var(--gold);white-space:nowrap}
.dots{display:flex;gap:.35rem;flex:1;flex-wrap:wrap;align-items:center}
.dots i{width:24px;height:6px;border-radius:3px;background:#2a2a2a}
.dots i.d{background:var(--gold)}
.dots i.c{background:var(--gold-l);box-shadow:0 0 0 2px rgba(240,201,107,.25)}
.dots i.q{width:10px;height:10px;border-radius:50%}
.dots i.q.d{background:var(--green)}
.dots i.v{cursor:pointer}
.dots i.v:hover{outline:2px solid rgba(240,201,107,.6);outline-offset:2px}
.btn-restart{background:transparent;border:1px solid #3a352c;color:#d8cfbd;border-radius:10px;padding:.45rem .85rem;font-size:.9rem;white-space:nowrap}
.btn-restart:hover{border-color:var(--gold);color:var(--gold-l)}
.dots i.q.c{background:var(--blue);box-shadow:0 0 0 2px rgba(147,197,253,.3)}
.card{display:grid;grid-template-columns:1.15fr 1fr;min-height:430px;animation:fade .35s ease}
.card.noanim{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-txt{padding:2.2rem 2.4rem}
.card-k{font-family:var(--head);font-size:.82rem;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.card-lead{font-family:var(--serif);font-style:italic;font-size:2.05rem;line-height:1.25;color:var(--gold-l);margin:.5rem 0 1.1rem}
.card.q .card-lead{display:none}
.card.q .card-k{margin-bottom:1rem}
.card-txt p{font-size:1.24rem;line-height:1.85;color:#e4dfd5;margin-bottom:1rem;letter-spacing:.005em}
.card-txt p b{color:#f6e7c8;font-weight:600;letter-spacing:.012em}
.card-ex{border-left:3px solid var(--gold);background:rgba(201,149,42,.07);border-radius:0 12px 12px 0;padding:.85rem 1.1rem;margin:1.1rem 0}
.card-ex span{font-family:var(--head);font-size:.76rem;letter-spacing:.22em;color:var(--gold);display:block;margin-bottom:.25rem}
.card-ex p{margin:0!important;font-size:1.16rem!important}
.card-do{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.3);border-radius:12px;padding:.85rem 1.1rem;font-size:1.12rem;line-height:1.65;color:var(--blue);margin-top:1.1rem}
.card-do b{color:#cfe3ff}
.card-vis{background:radial-gradient(ellipse at 50% 40%,rgba(201,149,42,.13),transparent 70%),#121110;border-left:1px solid #2c2a26;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:.8rem;position:relative;overflow:hidden}
.card-vis>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-vis.fit{padding:0;background:#000;border-left-color:#000}
.card-vis.fit>img{position:static;width:100%;height:auto;max-height:100%;object-fit:contain;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%)}
@media(max-width:820px){.card-vis.fit>img{-webkit-mask-image:none;mask-image:none}}
.card-vis .alt{width:100%;display:flex;flex-direction:column;align-items:center;gap:.9rem}
.card-vis .alt[hidden]{display:none}
.quote{font-family:var(--serif);font-style:italic;font-size:2.1rem;line-height:1.3;color:var(--gold-l);max-width:440px}
.quote::before{content:'';display:block;width:56px;height:2px;background:var(--gold);margin:0 auto 1.2rem}
.vis-l{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--gold-l);line-height:1.35;max-width:380px}
ol.steps{list-style:none;counter-reset:s;display:grid;gap:.6rem;margin:.3rem 0 .9rem}
ol.steps li{counter-increment:s;display:block;position:relative;padding-left:2.6rem;font-size:1.2rem;line-height:1.7;color:#e4dfd5}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.15rem;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:1rem;line-height:1}
ol.steps li b{color:#f6e7c8;font-weight:600;letter-spacing:.012em}
.tbl{width:100%;border-collapse:collapse;font-size:1.08rem;margin:.2rem 0 .6rem}
.tbl th{font-family:var(--head);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;color:var(--gold);text-align:left;padding:.5rem .6rem;border-bottom:1px solid rgba(201,149,42,.4)}
.tbl td{padding:.65rem .6rem;border-bottom:1px solid #2c2a26;color:#e4dfd5;vertical-align:top}
.tbl td:first-child{color:var(--gold-l);font-family:var(--head)}
.tbl .st{color:#7fdcbc}
.tbl tr.ex td{color:var(--muted)}
.a-time{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.35rem;max-width:460px}
.a-time div{border:1px solid var(--border);background:#131313;border-radius:12px;padding:.6rem .7rem;min-width:84px}
.a-time div b{display:block;font-family:var(--head);color:var(--gold);font-size:.8rem;letter-spacing:.1em}
.a-time div span{font-size:.9rem;color:#d8d4cc}
.a-time div.hi{border-color:var(--gold);background:rgba(201,149,42,.14)}
.a-time div.hi span{color:var(--gold-l);font-weight:600}
.a-time i{color:var(--gold);font-style:normal}
.a-nb{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:420px;width:100%}
.a-nb div{background:#f3ead6;color:#2b2416;border-radius:6px 10px 10px 6px;padding:.55rem .5rem .55rem .9rem;font-size:.74rem;line-height:1.55;text-align:left;border-left:4px solid #b88a2a;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.a-nb div small{display:block;font-family:var(--head);letter-spacing:.1em;color:#8a6a24;font-size:.62rem;margin-bottom:.2rem}
.a-nb div.bad{background:#f6dcd6;border-left-color:#c0392b}
.a-nb div.bad s{color:#c0392b}
.a-nb div.bad em{display:block;font-style:normal;color:#c0392b;font-weight:600;font-size:.68rem;margin-top:.15rem}
.a-pil{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;max-width:440px;width:100%}
.a-pil div{border:1px solid rgba(201,149,42,.4);background:#121212;border-radius:12px;padding:.8rem .7rem;text-align:left}
.a-pil div:last-child{grid-column:1/-1}
.a-pil b{display:block;font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-l);font-size:.9rem}
.a-pil span{font-size:.86rem;color:#b9b5ad}
.a-lad{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;width:100%;max-width:460px}
.a-lad div{border:1px solid var(--border);border-radius:12px;padding:.8rem .3rem;background:#121212;font-size:.86rem;color:#cfcac0;display:flex;flex-direction:column;gap:.3rem;align-items:center;justify-content:flex-end}
.a-lad div i{display:block;width:70%;background:linear-gradient(0deg,var(--gold),rgba(201,149,42,.3));border-radius:4px}
.a-lad div.hi{border-color:var(--gold);color:var(--gold-l);background:rgba(201,149,42,.1)}
.a-ax{display:flex;justify-content:space-between;width:100%;max-width:460px;font-size:.84rem;color:var(--muted)}
.a-irr{display:flex;flex-direction:column;gap:.7rem;align-items:center}
.a-irr .ok{border:1px solid rgba(29,158,117,.6);background:rgba(29,158,117,.1);color:#7fdcbc;border-radius:14px;padding:1rem 1.4rem;font-family:var(--head);letter-spacing:.1em;font-size:1.05rem}
.a-irr .no{border:1px dashed #555;color:#777;border-radius:12px;padding:.6rem 1.2rem;font-family:var(--head);letter-spacing:.1em;text-decoration:line-through}
.a-cmc{width:100%;max-width:440px;background:#0f0f0f;border:1px solid var(--border);border-radius:14px;overflow:hidden;text-align:left}
.a-cmc .hd{display:flex;justify-content:space-between;padding:.6rem .9rem;font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.a-cmc .r{display:grid;grid-template-columns:28px 1fr auto;gap:.6rem;padding:.55rem .9rem;border-bottom:1px solid #1d1d1d;font-size:.92rem}
.a-cmc .r b{color:var(--gold-l);font-family:var(--head)}

 cards:[
  {k:'Capítulo 1 · Érase una vez…',lead:'Hubo un tiempo en que, para hablar con alguien, tenías que llamar a una señorita.',
   p:['Sí. Una señorita. Le decías: <i>“Con el señor González, por favor”</i>. Y ella decidía si te conectaba o no.',
      'Esa señorita era la <b>operadora telefónica</b>: el primer filtro de la humanidad.',
      'Guarda esta idea, porque es la clave de la lección: durante mucho tiempo, <b>alguien más decidía quién llegaba a quién</b>.'],
   art:'phones'},
  {k:'Capítulo 2 · El bíper y el Nokia',lead:'Si usaste bíper, seguro también usaste pantalones de campana. Y con orgullo.',
   p:['El bíper solo recibía un número o un mensaje corto. Para contestar, había que buscar un teléfono.',
      'Después llegó el Nokia: sobrevivía caídas, inundaciones y hasta suegras enojadas. <b>Una bestia.</b>',
      'Pero servía para lo mismo de siempre: llamar y mandar mensajes. Nada más.'],
   img:'marketing/l1-nokia.jpg'},
  {k:'Capítulo 3 · El punto de quiebre',lead:'Y de repente… el mundo cambió.',
   p:['Hoy llevas en tu bolsillo un aparato que hace llamadas, toma fotos, edita videos, traduce idiomas, pide comida y paga cuentas.',
      'Y, si le sabes usar, <b>te ayuda a que la gente correcta te encuentre</b>.',
      'El mismo aparato. El mismo bolsillo. <b>La diferencia es lo que haces con él.</b>'],
   ex:'Dos personas tienen el mismo celular. Una solo ve videos. La otra comparte cada día algo útil, y sus contactos le escriben para preguntarle. El aparato es igual; el uso no.',
   img:'marketing/l1-celular.jpg'},
  {check:true,q:'¿Qué cambió de verdad entre el Nokia y tu celular de hoy?',
   o:['Solo el tamaño de la pantalla','Que hoy tu celular puede ayudarte a que la gente correcta te encuentre','Que ya no sirve para llamar'],a:1,
   y:'El celular de hoy no solo llama: si lo usas con intención, se vuelve tu herramienta de trabajo para que la gente te encuentre.'},
  {k:'Capítulo 4 · Esa cara',lead:'La gente ya aprendió a reconocer esa cara.',
   p:['La del amigo que de repente aparece con una <b>“oportunidad de negocio increíble”</b>.',
      '¿La cara? Tú sabes cuál. La has puesto. La han puesto contigo.',
      'No es que la gente sea mala onda. Cuando sentimos que alguien nos quiere convencer, <b>el cerebro se pone a la defensiva</b> y empieza a buscar razones para decir que no. Es una reacción natural: protege nuestra libertad de decidir.'],
   art:'chase'},
  {k:'Capítulo 5 · La verdad que nadie te dice',lead:'La gente ya no espera a que la llames.',
   p:['Ya no quiere que la invites al café para “contarle algo interesante”.',
      'Hoy la gente <b>busca sola, investiga sola y decide sola</b>.',
      'Y cuando encuentra algo que le genera confianza… <b>ella te escribe a ti</b>.'],
   ex:'Antes de comprar una licuadora, ¿qué haces? Buscas en internet, lees opiniones y le preguntas a quien ya tiene una. Así decidimos hoy casi todo.',
   img:'marketing/l1-busca.jpg'},
  {check:true,q:'¿Por qué perseguir a la gente suele dar el resultado contrario?',
   o:['Porque la gente no tiene tiempo','Porque cuando sentimos presión, el cerebro se defiende y busca razones para decir que no','Porque el celular no sirve para eso'],a:1,
   y:'La presión activa la defensa. Por eso funciona mejor atraer: que la persona se acerque cuando ella quiera.'},
  {k:'Capítulo 6 · Qué es, en simple',lead:'Marketing digital es dejar de perseguir gente y empezar a atraerla.',
   p:['No es magia. No es ser influencer. No es tener miles de seguidores ni bailar en TikTok con una canción que ni te gusta.',
      'El {{Marketing digital|marketing digital}} es <b>estar donde la gente ya está mirando</b>, con el mensaje correcto y en el momento correcto.',
      '¿Y dónde está mirando? En sus estados de WhatsApp, en Facebook y en Instagram. <b>Justo donde tú ya tienes contactos.</b>'],
   do:'Pasa el cursor sobre la palabra subrayada <b>marketing digital</b> (en el celular, tócala) y verás su significado. Así funcionan todas las palabras subrayadas.',
   art:'isnot'},
  {k:'Capítulo 7 · El camino en 4 pasos',lead:'Antes de empezar, mira el mapa completo.',
   p:['Todo este módulo sigue un mismo camino. Lo verás paso a paso, pero conviene que hoy tengas la foto completa:',
      '<ol class="steps"><li><b>Te ven:</b> publicas en tus estados y redes.</li><li><b>Te escriben:</b> a alguien le da curiosidad y te responde.</li><li><b>Conversan:</b> escuchas y, si hay interés, compartes la información.</li><li><b>Se conectan al Zoom:</b> resuelven sus dudas en vivo.</li></ol>',
      'A este camino se le llama {{Embudo|embudo}}. Lo vas a conocer a fondo en la lección 5.'],
   art:'path'},
  {check:true,q:'En el camino de 4 pasos, ¿qué va primero?',
   o:['Mandar el link a todos tus contactos','Que la gente te vea en tus estados y redes','Agendar el Zoom'],a:1,
   y:'Primero te ven. Sin ese paso no hay curiosidad, y sin curiosidad nadie te escribe.'},
  {k:'Capítulo 8 · Lo que ya tienes',lead:'No empiezas de cero. Dentro de AUREX ya tienes casi todo.',
   p:['<b>Imágenes listas</b> para publicar hoy mismo.',
      '<b>Dos embudos</b> que explican y convencen por ti.',
      'Un <b>sistema de prospección</b>, seguimiento y cierre.',
      'No tienes que inventar nada. Tu trabajo es más sencillo de lo que crees.'],
   art:'have'},
  {k:'Para cerrar · La única pieza que falta',lead:'Publicar lo que ya tienes. Con intención. Con constancia.',
   p:['Sin miedo. Sin complicarte. Paso a paso.',
      'La operadora telefónica ya se jubiló. El Nokia ya está en un museo.',
      'Y tú, con tu celular, tus redes y lo que vas a aprender aquí, <b>ya no tienes que perseguir a nadie</b>. Te damos la bienvenida a la era donde el negocio llega a ti.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 tasks:{t:'¿Con qué cuentas hoy?',d:'Toca cada una que ya tengas. Así sabes desde dónde empiezas.',
  items:[['WhatsApp con mis contactos guardados','Es tu audiencia más cercana'],['Facebook','Ahí están quienes ya te conocen'],['Instagram','Tu vitrina principal'],['Acceso a las imágenes de AUREX','Grupo AUREX o canal de Telegram']],
  res:on=>{const n=on.filter(Boolean).length;let m=`Tienes <b>${n} de 4</b>. `;
   if(!on[3])m+='Lo primero: pide a quien te invitó que te agregue al grupo o al canal de imágenes de AUREX. Sin ellas no tienes qué publicar.';
   else if(!on[0])m+='Empieza por WhatsApp: es donde ya tienes a la gente que te conoce. En la lección 3 lo dejas listo.';
   else if(n<4)m+='Muy bien. Con lo que tienes ya puedes empezar. En la lección 3 vas a preparar tus perfiles paso a paso.';
   else m+='Tienes todo para empezar. En la lección 3 vas a convertir tus perfiles en tu mejor carta de presentación.';return m;}},
 recap:['Hoy la gente <b>busca, investiga y decide sola</b>. Perseguirla suele ponerla a la defensiva.','Marketing digital es <b>dejar de perseguir y empezar a atraer</b>: estar donde la gente ya mira, con el mensaje correcto.','Ya tienes imágenes, embudos y un sistema. <b>La pieza que falta es publicar con constancia.</b>'],
 rule:'No persigas. <b>Hazte visible</b> y deja que la gente levante la mano.',
 quiz:[
  {p:'¿Qué es el marketing digital, en simple?',o:['Publicar anuncios pagados todo el día','Dejar de perseguir gente y empezar a atraerla','Tener miles de seguidores','Mandar el link a todos tus contactos'],a:1,y:'Marketing digital es atraer: estar donde la gente ya mira, con el mensaje correcto, para que ella se acerque.'},
  {p:'Hoy, antes de decidir algo, la mayoría de la gente…',o:['Espera a que alguien la llame','Busca, investiga y decide sola','Le pregunta a la operadora','No usa el celular'],a:1,y:'Hoy la gente investiga por su cuenta. Cuando encuentra algo que le da confianza, es ella quien escribe.'},
  {p:'¿Qué NO es el marketing digital?',o:['Estar donde la gente ya está mirando','Publicar con constancia','Ser influencer y bailar en TikTok','Compartir algo útil con tus contactos'],a:2,y:'No necesitas ser influencer ni bailar. Necesitas estar visible y ser constante.'},
  {p:'¿Cuál es el primer paso del camino?',o:['Que te vean en tus estados y redes','Agendar un Zoom','Mandar el link','Insistir hasta que digan que sí'],a:0,y:'Todo empieza cuando te ven. Después vienen la curiosidad, la conversación y el Zoom.'},
  {p:'Según esta lección, ¿cuál es la pieza que falta?',o:['Comprar un celular nuevo','Crear tus propias imágenes desde cero','Publicar lo que ya tienes, con intención y constancia','Tener miles de seguidores'],a:2,y:'Las imágenes, los embudos y el sistema ya existen. Lo que falta es que tú publiques con constancia.'}
 ]},
/* =============== LECCIÓN 2 =============== */
{key:'mkt1',title:'Diccionario: el idioma del marketing',
 desc:'Las palabras esenciales del marketing digital, explicadas en simple y agrupadas en cuatro familias.',
 obj:'Al terminar podrás entender y usar las palabras esenciales del marketing digital que vas a escuchar en todo el módulo.',
 cards:[
  {k:'Capítulo 1 · Hablar el idioma',lead:'Antes de construir, hay que hablar el idioma.',
   p:['En marketing digital se usan palabras en inglés y términos nuevos. <b>No necesitas memorizarlos todos.</b>',
      'En esta lección conocerás las palabras esenciales, agrupadas en <b>4 familias</b>. Las demás las tienes siempre en el botón dorado <b>Diccionario</b>.',
      'Un truco: cada vez que veas una palabra subrayada, tócala. Así se aprende: usándolas, no memorizándolas.'],
   art:'families'},
  {k:'Familia 1 · El camino',lead:'El embudo es el camino de “te veo” a “me uno”.',
   p:['El {{Embudo|embudo}} es el recorrido de una persona desde que te ve por primera vez hasta que decide dar el paso.',
      'Empieza ancho: <b>muchas personas te ven</b>. Termina angosto: <b>pocas avanzan</b>. Y eso es normal, no es un fracaso.',
      'En AUREX tu embudo es: tu estado → la conversación → el Zoom. <b>Ya lo tienes construido.</b>'],
   art:'funnel'},
  {k:'Familia 1 · El camino',lead:'Un prospecto es alguien que levantó la mano.',
   p:['Un {{Lead|lead}} o prospecto es una persona que mostró interés. Todavía no decide nada: solo dijo “cuéntame más”.',
      'La {{Landing page|landing page}} es una página con un solo objetivo: que la persona vea la información completa. <b>Tus embudos de AUREX son landing pages.</b>',
      'La {{Conversión|conversión}} es cuando alguien da el paso que esperabas: te escribe, agenda un Zoom o decide unirse a la comunidad.'],
   ex:'Alguien responde tu estado con “¿qué es eso?”. Ya tienes un prospecto. Si después agenda un Zoom, eso es una conversión.',
   img:'marketing/l2-prospecto.jpg'},
  {check:true,q:'Alguien responde tu estado: “¿Y eso de qué se trata?”. ¿Qué es esa persona?',
   o:['Alguien que ya decidió unirse','Un prospecto: levantó la mano','Alguien sin ningún interés'],a:1,
   y:'Es un prospecto: mostró interés y quiere saber más. Todavía no ha decidido nada, y no hay que presionarla.'},
  {k:'Familia 2 · Tus vitrinas',lead:'Tus vitrinas son los lugares donde la gente te ve todos los días.',
   p:['El {{Estado de WhatsApp|estado de WhatsApp}} dura 24 horas y lo ven tus contactos que tienen tu número guardado. <b>Es tu canal más directo.</b>',
      'La {{Story|historia}} (en inglés, story) es lo mismo, pero en Instagram o Facebook.',
      'El {{Feed|feed}} es el muro de tu perfil: ahí quedan tus publicaciones permanentes. Es tu carta de presentación.',
      'El {{DM|DM}} es el mensaje directo: la conversación privada donde nace la confianza.'],
   art:'vitrinas'},
  {k:'Familia 2 · Tus vitrinas',lead:'Tu perfil habla por ti antes de que digas una palabra.',
   p:['La {{Marca personal|marca personal}} es lo que la gente piensa de ti cuando ve tu perfil y lo que publicas.',
      'Un {{Perfil optimizado|perfil optimizado}} se entiende en 3 segundos: foto clara, presentación directa y un enlace que funciona.',
      'El {{Link en bio|link en bio}} es el enlace de tu perfil de Instagram: la puerta entre tu red social y tu embudo.'],
   do:'En la lección 3 vas a dejar tus perfiles listos, paso a paso.',
   img:'marketing/l2-perfil.jpg'},
  {check:true,q:'¿Cuál es tu canal más directo, donde ya está la gente que te conoce?',
   o:['El estado de WhatsApp','Un anuncio pagado','El perfil de un desconocido'],a:0,
   y:'Tu estado de WhatsApp lo ven las personas que tienen tu número guardado. Ya te conocen, y por eso confían más.'},
  {k:'Familia 3 · Tu contenido',lead:'La gente se acerca a quien le aporta, no a quien solo vende.',
   p:['El {{Contenido de valor|contenido de valor}} enseña, inspira o resuelve algo sin pedir nada a cambio.',
      'La {{Prueba social|prueba social}} es ver que a otros sí les funcionó: historias reales, compartidas con permiso.',
      'El {{Call to Action|llamado a la acción}} (CTA) es la frase que le dice a la persona qué hacer después: “Escríbeme”, “Respóndeme este mensaje”.'],
   ex:'Una imagen con “3 errores al empezar en lo digital” y al final: “¿Quieres saber cuál cometí yo? Respóndeme”. Ahí hay contenido de valor y un llamado a la acción.',
   img:'marketing/l2-contenido.jpg'},
  {k:'Familia 4 · Tus números',lead:'Una respuesta vale más que cien “me gusta”.',
   p:['El {{Engagement|engagement}} es cuánto interactúa la gente contigo: respuestas, comentarios y compartidos.',
      'Pero no todo vale igual. Un “me gusta” es un aplauso. <b>Una respuesta es una conversación</b>, y de las conversaciones nacen los prospectos.',
      'Las {{Métricas|métricas}} son los números que te dicen si vas bien. Las tuyas son sencillas: cuántos días publicaste, cuántas respuestas tuviste y cuántas conversaciones abriste.'],
   art:'likes'},
  {check:true,q:'¿Qué vale más para ti?',
   o:['Una foto con 100 “me gusta”','Un estado con 3 respuestas','Muchos seguidores que no te conocen'],a:1,
   y:'Tres respuestas son tres conversaciones posibles. Los “me gusta” se agradecen, pero no abren conversaciones.'},
  {k:'Para cerrar · Tu diccionario a la mano',lead:'No tienes que memorizar: tienes que usar.',
   p:['Estas son las palabras que vas a escuchar en todo el módulo.',
      'El cerebro aprende una palabra nueva cuando la <b>usa varias veces en situaciones reales</b>, no cuando la lee una sola vez. Por eso volverán a aparecer en las siguientes lecciones.',
      'Y si alguna se te olvida, toca el botón dorado <b>Diccionario</b>: ahí están los 35 términos explicados en simple.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 guides:['wa-vistas','dm','ig-link'],
 tasks:{t:'Encuéntralo en tu celular',d:'Abre tu celular y toca cada punto cuando lo encuentres.',
  items:[['Vi quién miró mi último estado de WhatsApp','Abre tu estado y desliza hacia arriba'],['Encontré mis mensajes directos (DM)','En Instagram o Facebook, el ícono de mensajes'],['Ubiqué dónde va el link en mi perfil de Instagram','Editar perfil → Enlaces'],['Busqué una palabra en el Diccionario','Por ejemplo: embudo']],
  res:on=>{const n=on.filter(Boolean).length;return n===4?'<b>¡Excelente!</b> Ya ubicas tus herramientas. En la siguiente lección las vas a dejar listas para trabajar por ti.':`Llevas <b>${n} de 4</b>. ¿Alguno no lo encuentras? Abre la guía de abajo y sigue los pasos con calma.`;}},
 recap:['El <b>embudo</b> es el camino de “te veo” a “me uno”: empieza ancho, termina angosto, y eso es normal.','Tus vitrinas son tu <b>estado de WhatsApp</b>, tus historias, tu feed y tus mensajes directos.','Una <b>respuesta</b> vale más que cien “me gusta”: las respuestas son conversaciones.'],
 rule:'No memorices palabras: <b>úsalas</b>. Y cuando dudes, abre tu Diccionario.',
 quiz:[
  {p:'¿Qué es un embudo?',o:['Una red social','El camino de una persona desde que te ve hasta que decide dar el paso','Un tipo de anuncio pagado','Una lista de contactos'],a:1,y:'El embudo es el recorrido completo: te ven, te escriben, conversan y llegan al Zoom.'},
  {p:'¿Qué es un lead o prospecto?',o:['Alguien que ya se unió','Alguien que mostró interés y quiere saber más','Un seguidor que nunca interactúa','Un anuncio'],a:1,y:'Un prospecto levantó la mano: mostró interés, pero todavía no decide nada.'},
  {p:'El estado de WhatsApp…',o:['Lo ven tus contactos que tienen tu número guardado','Solo lo ven desconocidos','Dura una semana','Cuesta dinero publicarlo'],a:0,y:'Lo ven tus contactos y dura 24 horas. Es tu canal más directo.'},
  {p:'¿Qué es un llamado a la acción (CTA)?',o:['Una llamada telefónica','La frase que dice qué hacer después, como “Escríbeme”','Un tipo de hashtag','El número de seguidores'],a:1,y:'Sin llamado a la acción la gente ve y se va. Con él, sabe qué hacer.'},
  {p:'¿Cuál de estas es una buena métrica para ti?',o:['Cuántos “me gusta” juntaste','Cuántas conversaciones abriste','Cuántos seguidores tiene otra persona','Cuántas horas pasaste en redes'],a:1,y:'Las conversaciones abiertas te dicen si tu contenido está conectando con la gente correcta.'}
 ]},
/* =============== LECCIÓN 3 =============== */
{key:'mkt2',title:'Primer paso: tu perfil es tu vendedor',
 desc:'Deja listos tus perfiles de WhatsApp, Instagram y Facebook para que trabajen por ti.',
 obj:'Al terminar tendrás tus tres perfiles listos para que, quien llegue a verte, entienda en 3 segundos quién eres y cómo contactarte.',
 cards:[
  {k:'Capítulo 1 · Tu perfil ya está hablando',lead:'Antes de publicar una sola imagen, tu perfil ya está hablando por ti.',
   p:['Cuando alguien ve tu estado y le da curiosidad, lo primero que hace es <b>ver tu perfil</b>.',
      'Tienes unos <b>3 segundos</b> para que decida quedarse o irse.',
      'La pregunta es: ¿qué está diciendo tu perfil hoy? En esta lección vas a dejar listos tus 3 perfiles: WhatsApp, Instagram y Facebook.'],
   art:'profile'},
  {k:'WhatsApp · Tu foto',lead:'En WhatsApp la gente quiere saber con quién está hablando.',
   p:['Usa <b>tu cara</b>: de frente, con buena luz y una sonrisa natural.',
      'Evita el logo de una empresa, la foto de pareja, un paisaje o una selfie borrosa.',
      'Un consejo: <b>usa la misma foto en las 3 redes</b>. Cuando todo coincide, la gente confía más.'],
   g:['wa-perfil'],img:'marketing/l3-foto.jpg'},
  {k:'WhatsApp · Tu Info',lead:'La Info es tu presentación en una línea.',
   p:['Es el texto que aparece debajo de tu nombre cuando alguien abre tu perfil. Muy poca gente la usa con intención. <b>Tú sí, desde hoy.</b>',
      'Escribe <b>quién eres y qué compartes</b>, en una o dos líneas. Sin promesas de dinero: genera curiosidad, no desconfianza.'],
   ex:'Opciones para adaptar: “🌟 Comunidad AUREX · Aprendo y comparto lo digital” · “📱 Negocios digitales desde el celular · Comunidad AUREX” · “🚀 Te comparto lo que aprendo en el mundo digital”.',
   do:'¿Quieres una a tu medida? Pídesela a la ia: <b>“Soy [tu nombre], formo parte de la comunidad AUREX y le hablo a [mamás, personas jubiladas, jóvenes…]. Escríbeme 3 opciones de Info para WhatsApp, de máximo 2 líneas, con un emoji, que generen curiosidad y no prometan dinero.”</b>',g:['wa-perfil']},
  {k:'WhatsApp · Tu privacidad',lead:'Si tu perfil está muy cerrado, quien no te conoce no confía.',
   p:['Configúralo en 2 minutos:',
      '<ol class="steps"><li>Abre WhatsApp → <b>Ajustes</b> → <b>Privacidad</b>.</li><li><b>Foto del perfil:</b> Todos.</li><li><b>Info:</b> Todos.</li><li><b>Estado:</b> Mis contactos.</li></ol>',
      'Así, quien te escriba puede ver quién eres, y tus estados los ven las personas que tienes guardadas.'],
   g:['wa-privacidad'],img:'marketing/l3-privacidad.jpg'},
  {check:true,q:'Alguien nuevo te escribe por WhatsApp. ¿Qué conviene que vea en tu perfil?',
   o:['Nada: es mejor tenerlo cerrado','Tu foto de frente y una Info clara','El logo de una empresa'],a:1,
   y:'Tu cara y una presentación clara generan confianza antes de que digas una sola palabra.'},
  {k:'Instagram · Tu bio',lead:'Tu bio tiene 150 caracteres. No es para tu historia de vida.',
   p:['Es para que quien llegue piense: <b>“esto es para mí”</b>. Usa la fórmula de 3 líneas:',
      '<ol class="steps"><li><b>A quién le hablas.</b> Ej.: Para quien quiere aprender lo digital.</li><li><b>Qué encuentra contigo.</b> Ej.: Comparto lo que aprendo en la comunidad AUREX.</li><li><b>Qué hacer ahora.</b> Ej.: 👇 Conoce más en el link.</li></ol>'],
   do:'Pídele ayuda a la ia: <b>“Escríbeme 3 bios de Instagram de máximo 150 caracteres, con emojis: línea 1 a quién le hablo, línea 2 qué encuentran conmigo, línea 3 qué hacer ahora. Sin prometer dinero.”</b>',
   g:['ig-link'],art:'bio3'},
  {k:'Instagram · Tres ajustes clave',lead:'Tres ajustes de 3 minutos que cambian todo.',
   p:['<ol class="steps"><li><b>Cuenta pública:</b> menú ☰ → <b>Privacidad de la cuenta</b> → desactiva <b>Cuenta privada</b>. Si está privada, quien siente curiosidad no puede ver nada.</li><li><b>Cuenta profesional:</b> menú ☰ → <b>Tipo de cuenta</b> → <b>Cambiar a cuenta profesional</b>. Te da estadísticas para ver quién te mira.</li><li><b>Link en tu perfil:</b> <b>Editar perfil</b> → <b>Enlaces</b> → pega el link de tu embudo AUREX. Ábrelo desde tu celular para comprobar que funciona.</li></ol>',
      'Los nombres de los menús pueden variar un poco según tu versión de Instagram. Y tu foto: la misma de WhatsApp.'],
   g:['ig-cuenta','ig-link'],img:'marketing/l3-instagram.jpg'},
  {check:true,q:'¿Qué pasa si tu cuenta de Instagram está privada?',
   o:['Nada, da igual','Quien siente curiosidad no puede ver tu contenido y se va','Te llegan más mensajes'],a:1,
   y:'Una cuenta privada cierra la puerta justo a las personas que llegaron por curiosidad.'},
  {k:'Facebook · Donde ya te conocen',lead:'En Facebook están las personas que ya te conocen.',
   p:['Familia, amistades, excompañeros. <b>No lo subestimes:</b> tus primeras conversaciones probablemente nazcan aquí.',
      'Actualiza tu <b>foto</b> (la misma de las otras redes), tu <b>portada</b> (puede ser una imagen de AUREX o una que hagas en Canva) y tu sección de <b>Información</b>: a qué te dedicas hoy, tu ciudad y el link de tu embudo.'],
   img:'marketing/l3-facebook.jpg'},
  {k:'Facebook · Antes de invitar, preséntate',lead:'Antes de compartir tu proyecto, deja que tu gente entienda quién eres hoy.',
   p:['Publica estas 3 cosas, en días distintos y sin vender nada todavía:',

  {k:'Cuidado · Los errores que alejan',lead:'Seis errores que hacen que alguien entre a tu perfil y se vaya sin preguntar.',

  {check:true,q:'¿Cuál de estas reglas ayuda a no espantar a la gente?',

 ],

/* =============== LECCIÓN 4 =============== */
{key:'mkt3',title:'Del contenido al Zoom',
 desc:'Tu sistema diario: publica, detecta quién se interesa y convierte vistas en conversaciones.',
 obj:'Al terminar sabrás qué publicar cada día, cómo detectar a quién le interesa y cómo pasar de un saludo a un Zoom sin perseguir a nadie.',
 cards:[
  {k:'Capítulo 1 · Tu sistema diario',lead:'Ya tienes tu vitrina. Ahora toca un sistema diario simple.',
   p:['No necesitas crear contenido desde cero: <b>ya tienes las imágenes de AUREX</b>.',
      'Tu trabajo es <b>publicar con constancia y en el orden correcto</b>.',
      'Este es el ciclo que vas a repetir cada día: publicas, esperas, revisas, saludas, preguntas y, si hay interés, llegas al Zoom.'],
   art:'cycle'},
  {k:'Paso 1 · Descarga tus imágenes',lead:'Cada mañana, prepara tu contenido en menos de 2 minutos.',
   p:['Tienes dos fuentes: el <b>grupo AUREX</b>, donde se suben imágenes cada día, y el <b>canal de Telegram AUREX</b>, con más opciones.',
      'Descarga <b>de 2 a 5 imágenes</b> al día. No más: la constancia vale más que la cantidad.'],
   ex:'Crea en tu celular un álbum llamado “AUREX Hoy”. Cada mañana guarda ahí tus imágenes. Así siempre las tienes listas.',
   g:['album'],img:'marketing/l4-imagenes.jpg'},
  {k:'Paso 2 · Publica en secuencia',lead:'Sube las imágenes una por una, no todas juntas.',
   p:['Cada imagen es un estado separado, y así cada una suma vistas. El orden recomendado es: motivación, contenido de valor, historia real y, si quieres, una invitación suave.',
      'Los mejores horarios: <b>de 8 a 9 am, de 1 a 2 pm y de 7 a 9 pm</b>.'],
   g:['wa-estado'],art:'sequence'},
  {k:'Paso 3 · Tus otras vitrinas',lead:'Lo que subes a WhatsApp también puede llegar a Facebook e Instagram.',
   p:['Si conectas tus cuentas en el <b>Centro de cuentas</b> de Meta, WhatsApp puede ofrecerte compartir tu estado también en Facebook e Instagram. Si no te aparece la opción, súbelo por separado: es un minuto más.',
      'En tus historias de Instagram agrega un <b>sticker de pregunta o encuesta</b>, como “¿Te gustaría aprender a usar tu celular para emprender?”. Así la gente responde sin que tú escribas primero.',
      'En Facebook, 3 veces por semana: una imagen con tu historia, una historia real del equipo y algo útil con una invitación suave. Únete a 3 o 5 grupos de emprendimiento de tu ciudad y participa <b>aportando, no vendiendo</b>.'],
   g:['ig-sticker'],img:'marketing/l4-redes.jpg'},
  {check:true,q:'¿Cómo conviene subir tus imágenes a WhatsApp?',
   o:['Todas juntas en un solo estado','Una por una, en secuencia','Solo una vez a la semana'],a:1,
   y:'Una por una: cada imagen es un estado separado y suma sus propias vistas.'},
  {k:'Las 3 horas de oro',lead:'Publica y deja que el contenido trabaje solo.',
   p:['Después de publicar, <b>cierra el teléfono</b>. No te quedes revisando quién lo vio cada 5 minutos.',
      'Espera <b>de 2 a 3 horas</b>. En ese tiempo la gente ve tus estados.',
      'Luego abre tu estado y desliza hacia arriba para ver quién lo vio. Ahí empieza lo interesante.'],
   g:['wa-vistas'],art:'golden'},
  {k:'Las 3 horas de oro · Las señales',lead:'No persigas a nadie: lee las señales.',
   p:['Fíjate en estas tres señales de interés:',
      '<ol class="steps"><li>Alguien que vio <b>2 o más</b> de tus imágenes.</li><li>Alguien que <b>normalmente no interactúa</b> contigo y de pronto miró todo.</li><li>Alguien que <b>respondió</b> con un emoji o un mensaje.</li></ol>',
      'Anota sus nombres en una nota del celular. <b>No más de 5 a 10 por día</b>, para darles atención de verdad.'],
   g:['album'],art:'signals'},
  {check:true,q:'Después de publicar tus estados, ¿qué haces?',
   o:['Revisar cada 5 minutos quién los vio','Esperar unas 3 horas y luego revisar quién los vio','Mandar el link a todos de una vez'],a:1,
   y:'Deja que el contenido trabaje. Después de unas 3 horas, revisas con calma y anotas las señales de interés.'},
  {k:'De la vista a la conversación · El saludo',lead:'El primer mensaje es solo para reconectar.',
   p:['No menciones el negocio. No mandes el link. No digas “tengo algo para ti”.',
      'Saluda como lo harías con cualquier conocido.'],
   ex:'“¡Hola, [nombre]! ¿Cómo estás? Hace tiempo que no sé de ti 😊” · “¡Hola! Vi que te llamó la atención lo que compartí 👀 ¿Cómo va todo?” · “¡Hola, [nombre]! ¿Qué hay de nuevo contigo?”',
   do:'Elige el que suene más a ti. Si no te sale natural, cámbialo: la gente nota cuando un mensaje es copiado.'},
  {k:'De la vista a la conversación · La pregunta',lead:'Escucha más de lo que hablas, y haz una sola pregunta clave.',
   p:['Después de 1 o 2 mensajes de plática natural, pregunta si hay interés.',
      'Si dice <b>sí</b> o muestra curiosidad, pasas al siguiente paso.',
      'Si dice <b>no</b>, lo respetas, sigues con amabilidad y la dejas en tu lista para más adelante. <b>Un no hoy no es un no para siempre.</b>'],
   ex:'“Oye, te pregunto porque últimamente has visto mis estados 😄 ¿Estás en algún proyecto o te da curiosidad conocer algo nuevo?” · Más directa: “¿Estás con apertura a conocer un proyecto digital, o estás bien con lo que tienes?”'},
  {check:true,q:'La persona te dice que no le interesa. ¿Qué haces?',
   o:['Insistes hasta convencerla','Lo respetas, sigues con amabilidad y la dejas en tu lista para más adelante','La borras de tus contactos'],a:1,
   y:'Respetar el “no” cuida la relación. Mañana puede ver tus estados con otros ojos.'},
  {k:'Comparte el link · En el momento correcto',lead:'El link no se manda en el primer mensaje.',
   p:['Se manda <b>solo cuando hay interés confirmado</b>, con un mensaje corto que prepare a la persona.',
      'Después, <b>espera de 1 a 3 horas</b>. Si no hay respuesta, da seguimiento ese mismo día: el interés se enfría rápido.'],
   ex:'“¡Perfecto! Te comparto la información para que la revises con calma. Es breve y está todo explicado. Me dices qué te parece 👇 [link]”'},
  {k:'Del link al Zoom · El seguimiento',lead:'El embudo informa. Tú conectas.',
   p:['El seguimiento es sencillo y sin presión: <i>“¡Hola, [nombre]! ¿Pudiste revisar la información? 😊”</i>',
      'Si le gustó o tiene dudas, <b>propón una llamada corta</b>, de 20 a 30 minutos, para explicarle en vivo.',
      'Ofrece <b>dos opciones de horario</b>: es más fácil elegir entre dos que decidir desde cero. Y si ninguna le queda, que te diga cuándo sí.'],
   ex:'“Hagamos una videollamada de 20 minutos y te explico todo en vivo. ¿Te queda mejor mañana a las 7 pm o el jueves a las 6?”',
   img:'marketing/l4-zoom.jpg'},
  {check:true,q:'¿Cómo conviene proponer el Zoom?',
   o:['“¿Quieres o no?”','Ofreciendo dos opciones de horario','Mandando el link del Zoom sin preguntar'],a:1,
   y:'Dos opciones facilitan la decisión y respetan su tiempo. Si ninguna le queda, que proponga otra.'},
  {k:'Para cerrar · El ciclo completo',lead:'Publica, espera, revisa, saluda, pregunta, comparte, da seguimiento y propón el Zoom. Mañana, otra vez.',
   p:['Sin perseguir a nadie. Sin escribirle en frío a desconocidos. <b>Con personas que ya vieron tu contenido.</b>',
      'Para profundizar en guiones, respuestas y cierres, tienes el módulo de <b>Networking</b>.',
      'Y al terminar el módulo se desbloquea tu herramienta <b>Mi rutina diaria</b>, para cumplir estos pasos cada día sin pensarlo.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 guides:['album','wa-estado','wa-vistas'],
 tasks:{t:'Mi rutina de hoy',d:'Hazla hoy mismo y toca cada paso cuando lo cumplas.',
  items:[['Descargué de 2 a 5 imágenes de AUREX',''],['Las publiqué una por una en mis estados',''],['Esperé unas 3 horas sin revisar a cada rato',''],['Anoté hasta 5 nombres con señales de interés',''],['Saludé a 3 personas sin hablar del negocio','']],
  res:on=>{const n=on.filter(Boolean).length;return n===5?'<b>¡Cumpliste tu primer día!</b> Ese es todo el secreto: repetirlo mañana.':`Llevas <b>${n} de 5</b>. Si hoy no alcanzas, no pasa nada: lo importante es volver a hacerlo mañana.`;}},
 recap:['Publica <b>de 2 a 5 imágenes, una por una</b>, en los mejores horarios.','Espera <b>3 horas</b>, revisa quién vio y anota solo a quienes muestran interés.','<b>Saluda sin vender</b>, haz una pregunta clave y comparte el link solo si hay interés.'],
 rule:'Publica, espera, revisa y saluda. <b>Todos los días, sin perseguir a nadie.</b>',
 quiz:[
  {p:'¿Cuántas imágenes conviene publicar al día?',o:['Todas las que haya','De 2 a 5, una por una','Una a la semana','Ninguna, solo mandar mensajes'],a:1,y:'De 2 a 5, una por una. La constancia vale más que la cantidad.'},
  {p:'¿Cuál es una señal de interés?',o:['Alguien que vio 2 o más de tus imágenes','Alguien que no ve tus estados','Alguien que te bloqueó','Alguien que no tiene WhatsApp'],a:0,y:'Quien mira varias de tus imágenes probablemente tiene curiosidad.'},
  {p:'¿Qué va en el primer mensaje?',o:['El link del embudo','Un saludo natural, sin hablar del negocio','Una explicación completa del negocio','Un audio de 5 minutos'],a:1,y:'El primer mensaje solo reconecta. El negocio viene después, si hay interés.'},
  {p:'¿Cuándo se manda el link?',o:['En el primer mensaje','Solo cuando hay interés confirmado','A todos tus contactos a la vez','Nunca'],a:1,y:'El link va cuando la persona confirmó que le interesa, con un mensaje corto.'},
  {p:'Mandaste el link y no hay respuesta en 3 horas. ¿Qué haces?',o:['Esperas una semana','Das seguimiento ese mismo día con un mensaje amable','Mandas el link otra vez sin decir nada','Te olvidas de esa persona'],a:1,y:'El interés se enfría rápido. Un mensaje amable el mismo día mantiene viva la conversación.'}
 ]},
/* =============== LECCIÓN 5 =============== */
{key:'mkt4',title:'El embudo de marketing',
 desc:'Para qué sirve de verdad tu embudo, cuándo compartirlo y por qué escuchar vale más que explicar.',
 obj:'Al terminar sabrás para qué sirve tu embudo, cuál usar en cada caso y por qué el link se comparte solo cuando hay interés.',
 cards:[
  {k:'Capítulo 1 · La verdad que cambia todo',lead:'El embudo no es para explicar. Es para filtrar, calentar y preparar.',
   p:['Tu {{Embudo|embudo}} hace algo que tú no podrías hacer por chat: <b>explica todo, igual de bien, a cualquier hora</b>.',
      'Pero solo funciona si llega a la persona correcta, en el momento correcto.',
      'Quien entiende esto trabaja menos y conecta más. Quien no, se cansa explicando por chat.']},
  {k:'Capítulo 2 · El error más común',lead:'Mandar el link a cualquiera, sin contexto, esperando que “algo pase”.',
   p:['Eso no es usar el embudo: es desperdiciarlo. Mira la diferencia:',
      '<table class="tbl"><tr><th>Forma incorrecta</th><th>Forma correcta</th></tr><tr><td>Mando el link a todos</td><td class="st">El link se gana</td></tr><tr><td>Explico todo por chat</td><td class="st">El embudo explica por mí</td></tr><tr><td>Persigo sin detectar interés</td><td class="st">Detecto interés primero</td></tr><tr><td>Comparto sin contexto</td><td class="st">Preparo antes de compartir</td></tr></table>'],
   img:'marketing/l5-error.jpg'},
  {k:'La regla de oro',lead:'El link se gana.',
   p:['Se comparte <b>solo cuando hay interés genuino confirmado</b>.',
      'No antes. Nunca por cortesía. Nunca “para ver qué pasa”.',
      'Cada link que mandas sin interés es ruido, y el ruido hace que la gente deje de abrir lo que le mandas.'],
   art:'linkgate'},
  {check:true,q:'Un conocido no ha mostrado ningún interés. ¿Le mandas el link “por si acaso”?',
   o:['Sí, por si le interesa','No: el link se comparte solo cuando hay interés confirmado','Sí, y también a toda su familia'],a:1,
   y:'El link se gana. Sin interés confirmado, mejor sigue visible con tus estados y conversa con calma.'},
  {k:'Capítulo 3 · Tus tipos de embudo',lead:'No hay un embudo perfecto para todos: hay uno correcto para cada persona.',
   p:['<table class="tbl"><tr><th>Embudo</th><th>Cómo es</th><th>Úsalo cuando</th></tr><tr><td>Cinematográfico</td><td>Video, música y una historia que impacta</td><td>La persona no conoce AUREX y tiene buena conexión</td></tr><tr><td>De texto</td><td>Página sencilla, carga rápido, va al grano</td><td>Ya mostró interés, tiene mala señal o prefiere leer</td></tr></table>',
      'Un truco: si mandaste el cinematográfico y la persona quedó con dudas, el de texto sirve como <b>segundo impacto</b>.']},
  {check:true,q:'Tu prospecto tiene mala señal y prefiere leer. ¿Cuál embudo le compartes?',
   o:['El cinematográfico','El de texto','Ninguno'],a:1,
   y:'El de texto carga rápido con cualquier señal y es ideal para quien prefiere leer.'},
  {k:'Capítulo 4 · El flujo correcto',lead:'El embudo funciona dentro de un sistema de 5 pasos.',
   p:['<ol class="steps"><li><b>Generar curiosidad:</b> tus estados siembran una pregunta. Todavía no hay link.</li><li><b>Detectar interés:</b> un saludo, una pregunta y escuchar. Aquí se gana el link.</li><li><b>Compartir el acceso:</b> mandas el link con un mensaje corto. No expliques lo que el embudo ya explica.</li><li><b>Esperar la reacción:</b> de 1 a 3 horas. No preguntes cada 20 minutos.</li><li><b>Seguimiento y Zoom:</b> resuelves dudas y propones la llamada.</li></ol>'],
   art:'flow5'},
  {k:'El paso 5 · Quién cierra',lead:'La decisión no ocurre en el embudo. Ocurre en la conversación de después.',
   p:['El embudo informa y prepara el terreno. <b>Tú conectas</b>, resuelves dudas y propones el siguiente paso.',
      'Por eso, después de mandar el link no desapareces: das seguimiento ese mismo día, con calma y sin presión.'],
   ex:'Mensaje para acompañar el link: “Te comparto la información completa para que la revises con calma. Al final me dices qué te pareció 😊 👇 [link]”'},
  {check:true,q:'¿Dónde ocurre la decisión de la persona?',
   o:['Dentro del embudo, sola','En la conversación y el Zoom de después','En el primer mensaje'],a:1,
   y:'El embudo prepara; la decisión llega en la conversación y el Zoom, donde resuelve sus dudas contigo.'},
  {k:'Capítulo 5 · La regla del 80/20',lead:'El que habla demasiado pierde.',
   p:['En una buena conversación: <b>80% escuchas y 20% hablas</b>.',
      'En el 80% preguntas, entiendes y descubres qué necesita de verdad la persona.',
      'En el 20% diriges: propones el siguiente paso, compartes el link o propones el Zoom.',
      '¿Por qué funciona? Porque la gente no se une a lo que tú quieres venderle: <b>se une a la solución de lo que ella necesita</b>.'],
   art:'talk'},
  {k:'Cuando explicas de más',lead:'Explicar todo por chat le quita fuerza a tu embudo.',
   p:['Cuando sobreexplicas, <b>complicas</b> lo que el embudo explica simple.',
      '<b>Saturas</b> a la persona con información que no pidió.',
      '<b>Rompes la curiosidad</b>, que es lo más valioso que tienes.',
      'Y <b>le das razones para decir que no</b> antes de que vea la información.'],
   do:'El chat es para abrir la conversación y detectar interés. Para explicar, existe el embudo. Confía en el sistema.'},
  {check:true,q:'Según la regla del 80/20, en una conversación tú…',
   o:['Hablas el 80% para convencer','Escuchas el 80% y hablas el 20%','Mandas audios largos'],a:1,
   y:'Escuchar te dice qué necesita la persona. Con eso, tu 20% va directo al punto.'},
  {k:'Capítulo 6 · Los números y la constancia',lead:'No todos van a responder. Y eso es normal.',
   p:['De cada 10 personas con quienes conversas, solo algunas mostrarán interés, y menos darán el paso. <b>Así funciona cualquier embudo.</b>',
      'Lo que no funciona es parar antes de tiempo.',
      'Lleva <b>tus propios números</b>: cuántas conversaciones abriste, cuántos links compartiste con interés y cuántos Zooms agendaste. Así sabes dónde mejorar.',
      'Y busca un <b>volumen inteligente</b>: personas interesadas llegando cada semana desde WhatsApp, Instagram y Facebook, no links a ciegas.'],
   art:'funnel'},
  {k:'Para cerrar · Estructura, repetición y constancia',lead:'El marketing no es magia. Es estructura, repetición y constancia.',
   p:['Tienes el sistema. Tienes el embudo. Tienes la metodología.',
      'Ahora toca ejecutar con enfoque y paciencia. En la última lección armas tu <b>plan de 30 días</b>.'],
   do:'Terminaste las tarjetas. Toca <b>Terminar</b> y abajo se abren tu práctica y el quiz.'}
 ],
 tasks:{t:'Mis hábitos con el link',d:'Toca cada hábito que te comprometes a cumplir.',
  items:[['Solo comparto el link cuando hay interés confirmado',''],['Lo acompaño con un mensaje corto',''],['No explico por chat lo que el embudo ya explica',''],['Espero de 1 a 3 horas y doy seguimiento el mismo día',''],['En cada conversación escucho más de lo que hablo','']],
  res:on=>{const n=on.filter(Boolean).length;return n===5?'<b>Excelente.</b> Con estos 5 hábitos tu embudo trabaja a su máxima capacidad.':`Llevas <b>${n} de 5</b>. Cada hábito que sumas hace que tu embudo trabaje mejor.`;}},
 recap:['El embudo <b>filtra, calienta y prepara</b>: no lo reemplaces explicando por chat.','<b>El link se gana:</b> se comparte solo cuando hay interés confirmado.','<b>Escucha el 80%</b> y habla el 20%. La decisión ocurre en la conversación de después.'],
 rule:'<b>El link se gana.</b> Nunca por cortesía, nunca “para ver qué pasa”.',

const ST={view:0,quiz:null};
function LS(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function done(k){return LS('done_'+k)==='1';}
function cur(){return LESSONS[ST.view-1];}
function cardPos(L){return Math.min(parseInt(LS('mk_card_'+L.key))||0,L.cards.length-1);}
function learned(L){return LS('mk_learn_'+L.key)==='1';}
function nextLesson(){return LESSONS.findIndex(l=>!done(l.key));}

let db=null,USER=null,USER_NAME='';
try{firebase.initializeApp({apiKey:"AIzaSyBC0jn5B7Ia6MbNqMjUY50Atghok3DCk6g",authDomain:"orygn-expansion.firebaseapp.com",projectId:"orygn-expansion",storageBucket:"orygn-expansion.firebasestorage.app",messagingSenderId:"1044610602898",appId:"1:1044610602898:web:476f08bd5732b9af9e534b"});db=firebase.firestore();}catch(e){}
function gate(html){document.getElementById('gate-msg').innerHTML=html;document.getElementById('gate').style.display='flex';}
function openApp(){document.getElementById('gate').style.display='none';render();setTimeout(maybeTour,600);}
function startAuth(){
  if(DEMO){openApp();return;}
  if(!window.firebase||!firebase.auth){gate('<p>No pudimos conectar. Revisa tu internet y vuelve a intentar.</p><button class="btn-gold" onclick="location.reload()">Reintentar</button>');return;}
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){gate('<p>Para estudiar este módulo, primero entra a tu portal con tu correo y contraseña.</p><a class="btn-gold" href="./">Entrar al portal</a>');return;}
    USER=u;
    try{const s=await db.collection('usuarios').doc(u.uid).get();
      if(s.exists){const d=s.data();USER_NAME=((d.nombre||'')+' '+(d.apellido||'')).trim();if(d.bloqueado===true&&d.rol!=='admin'){gate('<p>Tu acceso está en revisión. Si tienes dudas, escribe a quien te invitó.</p><a class="btn-line" href="./">Volver al portal</a>');return;}}}catch(e){}
    await loadCloud();openApp();
  });
}
async function loadCloud(){
  if(!USER||!db)return;
  if(LS('prog_uid')&&LS('prog_uid')!==USER.uid){Object.keys(localStorage).filter(k=>/^(done_|mk_)/.test(k)).forEach(k=>localStorage.removeItem(k));}
  LS('prog_uid',USER.uid);
  try{const s=await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').get();
    if(s.exists){const c=s.data().claves||{};Object.keys(c).forEach(k=>{if(c[k])LS(k,'1');});}}catch(e){}
  try{const g=await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('marketing').get();
    if(g.exists){const q=g.data().quiz||{};Object.keys(q).forEach(k=>{const v=parseInt(q[k]);if(v>(parseInt(LS('mk_best_'+k))||0))LS('mk_best_'+k,String(v));});}}catch(e){}
}
async function saveScore(key,ok){
  const prev=parseInt(LS('mk_best_'+key));if(!isNaN(prev)&&prev>=ok)return;LS('mk_best_'+key,String(ok));
  if(!USER||!db)return;const quiz={};quiz[key]=ok;
  try{await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('marketing').set({quiz,actualizado:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}catch(e){}
}
function best(L){const v=parseInt(LS('mk_best_'+L.key));return isNaN(v)?null:v;}
async function saveCloud(key){
  if(!USER||!db)return;const claves={};claves['done_'+key]=1;
  try{await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').set({claves,actualizado:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}catch(e){}
}
function setDone(key){LS('done_'+key,'1');saveCloud(key);}

function rich(s){return s.replace(/\{\{([^|}]+)\|([^}]+)\}\}/g,(m,t,txt)=>`<button class="term" data-t="${t.replace(/"/g,'&quot;')}" onclick="pop('${t.replace(/'/g,"\\'")}')">${txt}</button>`);}

const ENVIO=[['Publiqué 2 o 3 imágenes en mis estados','Una por una, en secuencia.'],['Esperé unas 3 horas','Sin quedarme revisando a cada rato.'],['Revisé quién vio mis estados','Fíjate en quien vio 2 o más imágenes.'],['Anoté hasta 5 nombres','En una nota del celular o en papel.'],['Saludé de forma natural','Sin hablar del negocio todavía.']];
function envioHTML(){const on=ENVIO.map((_,k)=>LS('mk_env_'+k)==='1');const all=on.every(Boolean);
  return `<div class="l-head"><div class="kick">Herramienta · Úsala todos los días</div><h1 class="h">Mi rutina diaria</h1><div class="obj"><span>Objetivo</span><p>Cumplir cinco pasos sencillos cada día para que la gente te vea y puedas abrir conversaciones sin perseguir a nadie.</p></div></div>
  <div class="how"><div class="how-t">Cómo usarlo</div><ol><li>Ábrela cada mañana.</li><li>Toca cada paso cuando lo hayas hecho.</li><li>Al terminar el día, toca <b>Reiniciar</b> para empezar mañana desde cero.</li></ol></div>
  <div class="tasks" style="grid-template-columns:1fr;max-width:900px">${ENVIO.map(([t,sub],k)=>`<button class="task ${on[k]?'on':''}" onclick="envToggle(${k})"><span class="bx">${on[k]?'✓':''}</span><div>${k+1}. ${t}<small>${sub}</small></div></button>`).join('')}</div>
  ${guideHelp(['wa-estado','wa-vistas','album'])}
  <div class="task-res" style="max-width:900px">${all?'<b>¡Día cumplido!</b> Hiciste tu parte. Mañana, otra vez.':`Llevas <b>${on.filter(Boolean).length} de 5</b>. Paso a paso: la constancia es lo que da resultado.`}<br><button class="btn-line" onclick="envReset()">Reiniciar mi rutina</button></div>
  <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:2rem"><button class="btn-line" onclick="go(0)">Ver mis lecciones</button><a class="btn-line" href="./">← Volver al portal</a></div>
  <p class="disc">Contenido educativo. Los resultados dependen del trabajo y la constancia de cada persona.</p>`;}
function envToggle(k){LS('mk_env_'+k,LS('mk_env_'+k)==='1'?'0':'1');const y=window.scrollY;render();window.scrollTo(0,y);}
function envReset(){ENVIO.forEach((_,k)=>LS('mk_env_'+k,'0'));render();toast('Rutina lista para mañana');}
function go(v){ST.view=v;ST.quiz=null;try{history.replaceState(null,'',v==='rutina'?'#rutina':v?'#l'+v:'#mapa');}catch(e){}render();window.scrollTo({top:0,behavior:'smooth'});}
function lessonCards(curKey){
  const nx=nextLesson();
  return `<div class="lgrid">${LESSONS.map((l,i)=>{const ok=done(l.key),isN=i===nx,isC=l.key===curKey;
    const bs=best(l),qn=l.quiz?l.quiz.length:0;
    const st=ok?`✓ Acreditada${bs!==null?' · '+bs+'/'+qn:''}`:(bs!==null?`Pendiente · ${bs}/${qn}`:isC?'Estás aquí':isN?'Tu siguiente paso →':'Abrir →');
    return `<button class="lc ${ok?'done':''} ${isN&&!isC?'next':''} ${isC?'cur':''} ${!ok&&bs!==null?'pend':''}" onclick="go(${i+1})"><span class="n">${String(i+1).padStart(2,'0')}</span><b>${l.title}</b><p>${l.desc}</p><span class="st">${st}</span></button>`;}).join('')}</div>`;
}

/* ---------- TU MAPA ---------- */

  return `<section class="hero"><div class="hero-bg fb" id="hero-bg"></div><div class="hero-in">
    <div class="kick">Nivel 3 · Marketing Digital</div><h1>Que la gente te encuentre</h1>
    <p>De perseguir a la gente a que te busquen a ti, paso a paso y sin prisa.</p>
    <div class="prog"><span>${d}/${t} lecciones</span><div class="bar"><i style="width:${pc}%"></i></div><span>${pc}%</span></div></div></section>
  <div class="sec"><span class="num">1</span>Así se estudia cada lección</div>
  <div class="howto">
    <div><div class="i">1</div><span class="ht">Aprende</span><p>Lees tarjetas cortas, una a la vez, y avanzas con el botón <b>Siguiente</b>. Entre tarjetas hay preguntas rápidas para comprobar que vas entendiendo.</p></div>
    <div><div class="i">2</div><span class="ht">Practica</span><p>Al terminar las tarjetas haces una pequeña práctica: palomeas lo que ya tienes o lo que ya hiciste.</p></div>
    <div><div class="i">3</div><span class="ht">Aprueba</span><p>Respondes un quiz corto. Al aprobarlo, la lección queda marcada con ✓ y se abre tu siguiente paso.</p></div>
  </div>
  <div class="how"><div class="how-t">Dos ayudas que siempre tienes a la mano</div><ol>
    <li>Las palabras <button class="term" data-t="Embudo" onclick="pop('Embudo')">subrayadas así</button> se explican solas: pasa el cursor encima (o tócalas en el celular) y aparece su significado.</li>
    <li>El botón dorado <b>Diccionario</b> (arriba) busca cualquier palabra de marketing. Con <b>A+</b> haces la letra más grande.</li></ol></div>
  <div class="sec"><span class="num">2</span>¿Dónde estás hoy?</div>
  <p class="sec-d">Responde con <b>Sí</b> o <b>No</b> y te decimos por dónde te conviene empezar. Nadie más ve tus respuestas.</p>
  <div class="where">${yn('wa','¿Tu perfil de WhatsApp tiene tu foto y una Info clara?')}${yn('es','¿Publicas estados al menos 3 días por semana?')}${yn('ln','¿Ya tienes tu link del embudo AUREX?')}</div>
  ${whereReco(W)}
  <div class="sec" id="lessons"><span class="num">3</span>Tus lecciones</div>
  <p class="sec-d">Toca cualquier lección para abrirla. Te recomendamos seguir el orden: cada una prepara la siguiente.</p>
  ${lessonCards(null)}
  ${certHTML()}
  ${allDone()?`<div class="side-box" style="border-style:solid"><p><b>Mi rutina diaria.</b> Tu herramienta para cumplir los 5 pasos de cada día: publicar, esperar, revisar, anotar y saludar.</p><button class="btn-gold" onclick="go('rutina')">Abrir mi rutina →</button></div>`:''}
  <div class="side-box"><p><b>¿No sabes cómo se hace algo en tu celular?</b> Guías paso a paso para WhatsApp, Instagram y Facebook, en Android y en iPhone.</p><button class="btn-line" onclick="guideIndex()">📱 Abrir las guías →</button></div>
  ${nx>=0?`<div style="margin-top:2rem"><button class="btn-gold" onclick="go(${nx+1})">${LESSONS.some(l=>done(l.key)||learned(l))?'Continuar donde me quedé':'Empezar la lección 1'} →</button></div>`:''}
  <p class="disc">Este módulo es educativo. No promete ingresos: los resultados dependen del trabajo y la constancia de cada persona.</p>`;
