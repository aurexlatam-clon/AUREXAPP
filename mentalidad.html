<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentalidad · AUREX Academy</title>
<meta name="theme-color" content="#070707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9952A;--gold-l:#F0C96B;--bg:#070707;--green:#1D9E75;
  --surface:#111;--surface2:#171717;--border:#262626;
  --text:#f2efe9;--muted:#9a9ea6;--danger:#e05252;--blue:#93c5fd;
  --head:'Oswald','Arial Narrow',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
html.fs1{font-size:112%}
html.fs2{font-size:125%}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;top:0;bottom:0;width:38vw;pointer-events:none;z-index:0}
body::before{left:-12vw;background:radial-gradient(ellipse 50% 40% at 30% 25%,rgba(201,149,42,.13),transparent 70%),radial-gradient(ellipse 35% 30% at 20% 80%,rgba(240,201,107,.07),transparent 70%)}
body::after{right:-12vw;background:radial-gradient(ellipse 50% 40% at 70% 60%,rgba(201,149,42,.12),transparent 70%),radial-gradient(ellipse 30% 25% at 80% 15%,rgba(240,201,107,.08),transparent 70%)}
.sparks{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 6% 18%,rgba(240,201,107,.7),transparent),radial-gradient(1px 1px at 12% 42%,rgba(240,201,107,.6),transparent),radial-gradient(2px 2px at 4% 66%,rgba(240,201,107,.5),transparent),radial-gradient(1px 1px at 9% 88%,rgba(240,201,107,.6),transparent),radial-gradient(1.5px 1.5px at 94% 22%,rgba(240,201,107,.7),transparent),radial-gradient(1px 1px at 89% 48%,rgba(240,201,107,.6),transparent),radial-gradient(2px 2px at 96% 74%,rgba(240,201,107,.5),transparent),radial-gradient(1px 1px at 91% 93%,rgba(240,201,107,.6),transparent)}
button{font-family:var(--body);cursor:pointer}
a{color:var(--gold-l)}
.wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:0 clamp(16px,3.5vw,52px)}
.top{position:sticky;top:0;z-index:30;background:rgba(7,7,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:.6rem;height:60px}
.top-back{background:none;border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;color:var(--muted);font-size:.88rem;text-decoration:none;white-space:nowrap}
.top-back:hover{border-color:var(--gold);color:var(--text)}
.top-logo{flex:1;font-family:var(--head);letter-spacing:.22em;color:var(--gold);font-size:1rem;text-align:center}
.top-logo small{color:var(--muted);letter-spacing:.18em;font-size:.72rem}
.top-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;padding:.5rem .8rem;font-weight:600;white-space:nowrap}
.top-btn:hover{border-color:var(--gold)}
.top-btn.gold{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.top-btn.gold:hover{background:var(--gold-l)}
.hero{position:relative;margin-top:1.4rem;border-radius:22px;border:1px solid rgba(201,149,42,.35);min-height:300px;display:flex;align-items:flex-end;padding:2rem;overflow:hidden;background:#0d0b07}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center right}
.hero::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(7,7,7,.95) 22%,rgba(7,7,7,.15) 72%)}
.hero-in{position:relative;z-index:2;width:100%;max-width:760px}
.kick{font-family:var(--head);font-size:.78rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--head);font-size:2.8rem;text-transform:uppercase;font-weight:600;letter-spacing:.04em;margin:.35rem 0 .3rem;line-height:1.1}
.hero p{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:#e0d8c8}
.prog{display:flex;align-items:center;gap:.8rem;margin-top:1.2rem;font-size:.9rem;color:var(--muted);max-width:560px}
.bar{flex:1;height:7px;background:#222;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:4px;transition:width .5s}
main{padding:1.6rem 0 5rem}
.l-head{margin-top:1.6rem;padding:2rem 0 1.4rem;border-bottom:1px solid var(--border);margin-bottom:1.6rem}
.l-head .kick{font-size:.85rem}
.h{font-family:var(--head);font-size:2.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:.4rem 0 1.2rem;line-height:1.1}
.obj{background:linear-gradient(135deg,rgba(201,149,42,.14),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.45);border-radius:18px;padding:1.1rem 1.5rem;max-width:1100px}
.obj span{font-family:var(--head);font-size:.82rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.3rem}
.obj p{font-family:var(--serif);font-style:italic;font-size:1.55rem;line-height:1.35;color:var(--gold-l)}
.sec{font-family:var(--head);font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase;margin:3rem 0 .5rem;padding-top:2.2rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.7rem}
.sec .num{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-size:1rem;flex-shrink:0}
.sec small{font-family:var(--body);font-size:.88rem;letter-spacing:0;text-transform:none;color:var(--muted)}
.sec-d{font-size:1.06rem;color:var(--muted);margin-bottom:1.1rem;line-height:1.6;max-width:1000px}
.sec-d b{color:var(--text)}
.how{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.3);border-radius:16px;padding:1.1rem 1.4rem;margin:1.4rem 0;max-width:1100px}
.how-t{font-family:var(--head);font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:.55rem}
.how ol{padding-left:1.3rem;display:grid;gap:.4rem}
.how li{font-size:1.1rem;line-height:1.65;color:#e4dfd5}
.how li b{color:var(--gold-l)}
.btn-gold{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:var(--gold);color:#0a0a0a;font-family:var(--head);letter-spacing:.14em;font-size:1rem;padding:1rem 1.6rem;border-radius:13px;font-weight:600;border:none;text-transform:uppercase;text-decoration:none}
.btn-gold:hover{background:var(--gold-l)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-line{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:13px;padding:.95rem 1.3rem;font-size:1rem;text-decoration:none}
.btn-line:hover{border-color:var(--gold)}
.btn-line:disabled{opacity:.35;cursor:default}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.lc{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem 1.3rem 1.2rem;color:var(--text);display:flex;flex-direction:column;gap:.5rem;transition:border-color .2s,transform .2s;overflow:hidden}
.lc:hover:not(:disabled){border-color:rgba(201,149,42,.55);transform:translateY(-2px)}
.lc:disabled{cursor:default;opacity:.55}
.lc .n{font-family:var(--head);font-size:2.4rem;color:rgba(240,201,107,.3);line-height:1}
.lc b{font-family:var(--head);font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase}
.lc p{font-size:.98rem;line-height:1.55;color:#b9b5ad;flex:1}
.lc .st{font-size:.85rem;align-self:flex-start;border-radius:20px;padding:.3rem .75rem;border:1px solid var(--border);color:var(--muted)}
.lc.next{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(201,149,42,.1)}
.lc.next .st{background:var(--gold);color:#0a0a0a;border-color:var(--gold);font-weight:600}
.lc.done{border-color:rgba(29,158,117,.45)}
.lc.done .st{color:var(--green);border-color:rgba(29,158,117,.5)}
.lc.cur{background:linear-gradient(135deg,rgba(201,149,42,.12),transparent)}
.lc.cur .st{color:var(--gold-l);border-color:rgba(201,149,42,.5)}
.nextbig{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(120deg,rgba(201,149,42,.16),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.5);border-radius:22px;padding:1.6rem 1.8rem;margin-bottom:1.6rem}
.nextbig small{font-family:var(--head);letter-spacing:.26em;color:var(--gold);font-size:.8rem}
.nextbig h3{font-family:var(--head);font-size:1.8rem;text-transform:uppercase;letter-spacing:.04em;margin:.3rem 0}
.nextbig p{font-size:1.04rem;color:#cfcac0;line-height:1.55;max-width:700px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.howto>div{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem}
.howto .i{width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,149,42,.6);color:var(--gold-l);display:grid;place-items:center;font-family:var(--head);font-size:1.2rem}
.howto .ht{font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;display:block;margin:.6rem 0 .25rem;font-size:1.1rem}
.howto p{font-size:1rem;line-height:1.6;color:#b9b5ad}
.where{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.where-q{display:flex;flex-direction:column;justify-content:space-between;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem}
.where-q p{font-size:1.04rem;line-height:1.5}
.yn{display:flex;gap:.5rem}
.yn button{flex:1;border:1px solid var(--border);background:#0b0b0b;color:var(--text);border-radius:10px;padding:.7rem .9rem;font-size:1rem}
.yn button.sel{background:rgba(201,149,42,.18);border-color:var(--gold);color:var(--gold-l);font-weight:600}
.reco{margin-top:1rem;border-radius:16px;padding:1.2rem 1.4rem;background:linear-gradient(135deg,rgba(201,149,42,.12),transparent);border:1px solid rgba(201,149,42,.45)}
.reco>b{font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);display:block;margin-bottom:.3rem}
.reco p{font-size:1.04rem;line-height:1.65;color:#d8d4cc}
.learn{background:#171614;border:1px solid #2c2a26;border-radius:24px;overflow:hidden}
.learn-top{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid #2c2a26;background:#141312}
.learn-top .lbl{font-family:var(--head);letter-spacing:.2em;font-size:.85rem;color:var(--gold);white-space:nowrap}
.dots{display:flex;gap:.35rem;flex:1;flex-wrap:wrap;align-items:center}
.dots i{width:24px;height:6px;border-radius:3px;background:#2a2a2a}
.dots i.d{background:var(--gold)}
.dots i.c{background:var(--gold-l);box-shadow:0 0 0 2px rgba(240,201,107,.25)}
.dots i.q{width:10px;height:10px;border-radius:50%}
.dots i.q.d{background:var(--blue)}
.dots i.q.c{background:var(--blue);box-shadow:0 0 0 2px rgba(147,197,253,.3)}
.dots i.v{cursor:pointer}
.dots i.v:hover{outline:2px solid rgba(240,201,107,.6);outline-offset:2px}
.btn-restart{background:transparent;border:1px solid #3a352c;color:#d8cfbd;border-radius:10px;padding:.45rem .85rem;font-size:.9rem;white-space:nowrap}
.btn-restart:hover{border-color:var(--gold);color:var(--gold-l)}
.card{display:grid;grid-template-columns:1.15fr 1fr;min-height:430px;animation:fade .35s ease}
.card.noanim{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-txt{padding:2.2rem 2.4rem}
.card-k{font-family:var(--head);font-size:.82rem;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.card-lead{font-family:var(--serif);font-style:italic;font-size:2.05rem;line-height:1.25;color:var(--gold-l);margin:.5rem 0 1.1rem}
.card.q .card-lead{display:none}
.card.q .card-k{margin-bottom:1rem}
.card-txt p{font-size:1.24rem;line-height:1.85;color:#e4dfd5;margin-bottom:1rem;letter-spacing:.005em}
.card-txt p b{color:#f6e7c8;font-weight:600;letter-spacing:.012em}
.card-ex{border-left:3px solid var(--gold);background:rgba(201,149,42,.07);border-radius:0 12px 12px 0;padding:.85rem 1.1rem;margin:1.1rem 0}
.card-ex span{font-family:var(--head);font-size:.76rem;letter-spacing:.22em;color:var(--gold);display:block;margin-bottom:.25rem}
.card-ex p{margin:0!important;font-size:1.16rem!important}
.card-do{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.3);border-radius:12px;padding:.85rem 1.1rem;font-size:1.12rem;line-height:1.65;color:var(--blue);margin-top:1.1rem}
.card-do b{color:#cfe3ff}
.card-vis{background:radial-gradient(ellipse at 50% 40%,rgba(201,149,42,.13),transparent 70%),#121110;border-left:1px solid #2c2a26;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:.8rem;position:relative;overflow:hidden}
.card-vis>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-vis.fit{padding:0;background:#000;border-left-color:#000}
.card-vis.fit>img{position:static;width:100%;height:auto;max-height:100%;object-fit:contain;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%)}
@media(max-width:820px){.card-vis.fit>img{-webkit-mask-image:none;mask-image:none}}
.card-vis .alt{width:100%;display:flex;flex-direction:column;align-items:center;gap:.9rem}
.card-vis .alt[hidden]{display:none}
.quote{font-family:var(--serif);font-style:italic;font-size:2.1rem;line-height:1.3;color:var(--gold-l);max-width:440px}
.quote::before{content:'';display:block;width:56px;height:2px;background:var(--gold);margin:0 auto 1.2rem}
.vis-l{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--gold-l);line-height:1.35;max-width:380px}
ol.steps{list-style:none;counter-reset:s;display:grid;gap:.5rem;margin:.3rem 0 .9rem}
ol.steps li{counter-increment:s;display:block;position:relative;padding-left:2.6rem;font-size:1.16rem;line-height:1.6;color:#e4dfd5}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.1rem;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:1rem;line-height:1}
ol.steps li b{color:#f6e7c8;font-weight:600;letter-spacing:.012em}
/* ilustraciones */
.a-path{display:flex;flex-direction:column;gap:.45rem;width:100%;max-width:380px;text-align:left}
.a-path div{display:flex;align-items:center;gap:.8rem;border:1px solid var(--border);background:#121212;border-radius:12px;padding:.55rem .8rem;font-size:.95rem;color:#cfcac0}
.a-path div b{width:28px;height:28px;border-radius:50%;border:1px solid rgba(201,149,42,.6);color:var(--gold-l);display:grid;place-items:center;font-family:var(--head);flex-shrink:0}
.a-path div.hi{border-color:var(--gold);background:rgba(201,149,42,.12);color:var(--gold-l)}
.a-path div.hi b{background:var(--gold);color:#0a0a0a}
.a-path div.end{border-style:dashed}
.a-gps{position:relative;width:230px;height:230px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(147,197,253,.12) 0 1px,transparent 1px 38px),#0e1116;border:1px solid #23324a;display:grid;place-items:center}
.a-gps i{width:22px;height:22px;border-radius:50%;background:#3b82f6;box-shadow:0 0 0 8px rgba(59,130,246,.25),0 0 0 22px rgba(59,130,246,.1)}
.a-gps span{position:absolute;bottom:-2.2rem;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--serif);font-style:italic;color:var(--gold-l);font-size:1.25rem}
.a-jm{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%;max-width:440px;text-align:left}
.a-jm div{border:1px solid var(--border);background:#121212;border-radius:14px;padding:1rem .9rem}
.a-jm b{display:block;font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;font-size:.95rem;margin-bottom:.45rem}
.a-jm p{font-size:.95rem;line-height:1.5;color:#cfcac0;font-style:italic}
.a-jm .j{border-color:rgba(224,82,82,.45)}.a-jm .j b{color:#f3a3a3}
.a-jm .m{border-color:rgba(201,149,42,.6);background:rgba(201,149,42,.08)}.a-jm .m b{color:var(--gold-l)}
.a-chain{display:flex;flex-direction:column;align-items:center;gap:.25rem;width:100%;max-width:300px}
.a-chain div{width:100%;border:1px solid rgba(201,149,42,.45);background:#121212;border-radius:12px;padding:.6rem;font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);font-size:.95rem}
.a-chain div.hi{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.a-chain i{color:var(--gold);font-style:normal;font-size:.9rem}
/* pausa honesta */
.check{display:grid;grid-template-columns:1fr 1.1fr;gap:2.5rem;padding:2.4rem;align-items:start}
.check-k{font-family:var(--head);font-size:.85rem;letter-spacing:.24em;color:var(--blue);text-transform:uppercase}
.check-q{font-size:1.55rem;font-weight:500;line-height:1.5;margin-top:.7rem;color:#f2ead9}
.check-h{font-size:1rem;color:var(--muted);margin-top:1rem;line-height:1.55}
.opts{display:grid;gap:.65rem}
.opt{text-align:left;background:#121110;border:1.5px solid var(--border);border-radius:14px;padding:1rem 1.15rem;color:#e4dfd5;font-size:1.16rem;line-height:1.5;display:flex;gap:.9rem;align-items:center}
.opt:hover:not(:disabled){border-color:rgba(201,149,42,.6)}
.opt .l{width:32px;height:32px;border-radius:50%;border:1.5px solid #3a3a3a;display:grid;place-items:center;font-family:var(--head);flex-shrink:0;font-size:.95rem}
.opt.sel{border-color:var(--gold);background:rgba(201,149,42,.1)}
.opt.sel .l{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.fb{margin-top:1rem;border-radius:14px;padding:1rem 1.15rem;font-size:1.14rem;line-height:1.7;color:#e4dfd5;background:rgba(201,149,42,.07);border:1px solid rgba(201,149,42,.4)}
.fb b{color:#f6e7c8;font-weight:600}
.fb>b:first-child{display:block;font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem;font-size:.95rem;color:var(--gold-l)}
.fb .chg{display:block;margin-top:.6rem;background:none;border:none;color:var(--blue);font-size:.95rem;padding:0;text-decoration:underline}
.learn-nav{position:sticky;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:.7rem;padding:1rem 1.5rem;border-top:1px solid #2c2a26;background:#141312}
.learn-nav .hint{font-size:.95rem;color:var(--muted);text-align:center;flex:1}
.locked{border:1px dashed #3a3a3a;border-radius:18px;padding:1.3rem 1.5rem;color:var(--muted);font-size:1.04rem;line-height:1.6;margin-top:2.5rem;display:flex;gap:1rem;align-items:center}
.locked .lk{width:40px;height:40px;border-radius:50%;border:1px solid #444;display:grid;place-items:center;flex-shrink:0;font-family:var(--head)}
.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.recap>div{background:#171614;border:1px solid #2c2a26;border-top:3px solid var(--gold);border-radius:16px;padding:1.2rem 1.25rem}
.recap span{font-family:var(--head);color:var(--gold);font-size:1.7rem}
.recap p{font-size:1.12rem;line-height:1.65;color:#e4dfd5;margin-top:.3rem}
.recap p b{color:#f6e7c8;font-weight:600}
.rule{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center;margin-top:1.2rem;padding:1.4rem 1.5rem;border-left:3px solid var(--green);background:rgba(29,158,117,.06);border-radius:0 18px 18px 0}
.rule-l{font-family:var(--serif);font-style:italic;font-size:1.6rem;line-height:1.05;color:var(--green)}
.rule p{font-size:1.14rem;line-height:1.75;color:#e4dfd5}
.rule p b{color:#f6e7c8;font-weight:600}
.disc{margin-top:3rem;font-size:.9rem;line-height:1.6;color:var(--muted);border-top:1px solid var(--border);padding-top:1rem}
/* rueda */
.wheel-box{display:grid;grid-template-columns:1.25fr 1fr;gap:1.6rem;align-items:start}
.rate-list{display:grid;gap:.7rem}
.rate{background:#171614;border:1px solid #2c2a26;border-radius:16px;padding:1rem 1.15rem}
.rate.ok{border-color:rgba(201,149,42,.45)}
.rate-h{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline}
.rate-h b{font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;font-size:1.08rem}
.rate-h em{font-style:normal;font-family:var(--head);color:var(--gold-l);font-size:1.25rem}
.rate p{font-size:1rem;color:#b9b5ad;line-height:1.5;margin:.2rem 0 .7rem}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:.3rem}
.nums button{border:1px solid #333;background:#0d0d0d;color:#d8d4cc;border-radius:9px;padding:.6rem 0;font-size:1rem;font-weight:600}
.nums button:hover{border-color:var(--gold)}
.nums button.f{background:rgba(201,149,42,.22);border-color:rgba(201,149,42,.5);color:var(--gold-l)}
.nums button.on{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.nums-ax{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:.3rem}
.wheel-side{position:sticky;top:80px;background:#141312;border:1px solid rgba(201,149,42,.35);border-radius:20px;padding:1.2rem;text-align:center}
.wheel-side svg{width:100%;max-width:440px;height:auto}
.wheel-side .cnt{font-size:.98rem;color:var(--muted);margin-top:.4rem}
.read{margin-top:1.3rem;border-radius:18px;padding:1.3rem 1.5rem;background:linear-gradient(135deg,rgba(201,149,42,.12),transparent);border:1px solid rgba(201,149,42,.45)}
.read>b{font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);display:block;margin-bottom:.5rem;font-size:1.05rem}
.read p{font-size:1.1rem;line-height:1.7;color:#e4dfd5;margin-bottom:.5rem}
.read p b{color:#f6e7c8}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.chips button{border:1px solid var(--border);background:#0d0d0d;color:#e4dfd5;border-radius:24px;padding:.65rem 1rem;font-size:1rem}
.chips button:hover{border-color:var(--gold)}
.chips button.on{background:var(--gold);border-color:var(--gold);color:#0a0a0a;font-weight:600}
.tasks{display:grid;grid-template-columns:1fr;gap:.7rem;max-width:1000px}
.task{display:flex;gap:.9rem;align-items:center;background:#171614;border:1px solid #2c2a26;border-radius:14px;padding:1rem 1.15rem;font-size:1.12rem;text-align:left;color:#e4dfd5;width:100%;line-height:1.45}
.task .bx{width:28px;height:28px;border-radius:50%;border:2px solid #3a3a3a;display:grid;place-items:center;font-size:.9rem;flex-shrink:0;color:#0a0a0a}
.task small{display:block;color:var(--muted);font-size:.92rem;margin-top:.15rem}
.task.on{border-color:var(--gold);background:rgba(201,149,42,.08)}
.task.on .bx{background:var(--gold);border-color:var(--gold)}
.own{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.2rem}
.own input,.fld{flex:1;min-width:240px;background:#121110;border:1px solid var(--border);border-radius:12px;padding:.95rem 1rem;color:var(--text);font-size:1.06rem;font-family:var(--body);outline:none}
.own input:focus,.fld:focus{border-color:var(--gold)}
.task-res{margin-top:.9rem;border-radius:14px;padding:1.05rem 1.3rem;background:rgba(201,149,42,.07);border:1px solid rgba(201,149,42,.4);font-size:1.12rem;line-height:1.7;color:#e4dfd5;max-width:1000px}
.task-res b{color:var(--gold-l)}
.audio-box{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.2rem 1.4rem;max-width:1000px}
.audio-box .pl{width:58px;height:58px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-size:1.3rem;flex-shrink:0}
.audio-box .pl.off{background:#222;color:var(--muted)}
.audio-box div{flex:1;min-width:240px}
.audio-box b{font-size:1.1rem;display:block}
.audio-box small{color:var(--muted);font-size:.98rem;line-height:1.55;display:block;margin-top:.2rem}
.audio-box audio{width:100%;margin-top:.7rem}
.finish{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;border-radius:20px;padding:1.4rem 1.6rem;border:1px solid rgba(201,149,42,.5);background:linear-gradient(120deg,rgba(201,149,42,.14),rgba(201,149,42,.02))}
.finish.ok{border-color:rgba(29,158,117,.5);background:rgba(29,158,117,.07)}
.finish div{flex:1;min-width:260px}
.finish b{font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;font-size:1.15rem;color:var(--gold-l)}
.finish.ok b{color:#7fdcbc}
.finish p{font-size:1.06rem;line-height:1.65;color:#d8d4cc;margin-top:.3rem}
.finish ul{list-style:none;margin-top:.5rem;display:grid;gap:.25rem}
.finish li{font-size:1rem;color:var(--muted)}
.finish li.y{color:#7fdcbc}
/* brújula */
.bru{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:start}
.bp{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.45rem}
.bp .ic{font-family:var(--head);font-size:.78rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.bp b{font-family:var(--head);font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase}
.bp p{font-size:1rem;line-height:1.55;color:#b9b5ad;flex:1}
.bp p em{font-style:normal;color:var(--gold-l)}
.bp.lock{border-style:dashed;opacity:.6}
.bp.on{border-color:rgba(201,149,42,.5);background:linear-gradient(135deg,rgba(201,149,42,.1),transparent)}
.bp svg{width:100%;max-width:240px;align-self:center}
.bru-main{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;align-items:start}
.bru-card{background:#141312;border:1px solid rgba(201,149,42,.35);border-radius:20px;padding:1.4rem 1.5rem}
.bru-card>small{font-family:var(--head);letter-spacing:.22em;color:var(--gold);font-size:.8rem;text-transform:uppercase}
.bru-card h3{font-family:var(--head);text-transform:uppercase;letter-spacing:.05em;font-size:1.45rem;margin:.3rem 0 .6rem}
.bru-card p{font-size:1.08rem;line-height:1.65;color:#e4dfd5;margin-bottom:.5rem}
.bru-card p b{color:var(--gold-l)}
.bru-card svg{width:100%;max-width:420px;display:block;margin:0 auto}
.hist{display:grid;gap:.4rem;margin-top:.6rem}
.hist div{display:flex;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:.55rem .8rem;font-size:.98rem;color:#cfcac0}
.hist div b{color:var(--gold-l)}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:80;background:var(--green);color:#fff;border-radius:12px;padding:.85rem 1.3rem;font-weight:600;font-size:1rem;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;background-image:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(201,149,42,.14) 0%,transparent 70%)}
.gate .logo{font-family:var(--head);font-size:2.2rem;letter-spacing:.2em;color:var(--gold)}
.gate p{color:#cfcac0;font-size:1.06rem;line-height:1.6;max-width:420px;margin:1rem auto 1.4rem}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid #222;border-top-color:var(--gold);animation:sp 1s linear infinite;margin:1.4rem auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:1100px){
  .lgrid,.howto,.where,.recap,.bru{grid-template-columns:1fr 1fr}
  .check{grid-template-columns:1fr;gap:1.2rem}
  .wheel-box,.bru-main{grid-template-columns:1fr}
  .wheel-side{position:static}
}
@media(max-width:820px){
  .hero{min-height:240px;padding:1.3rem}
  .hero h1{font-size:2rem}
  .h{font-size:1.8rem}
  .obj p{font-size:1.25rem}
  .lgrid,.howto,.where,.recap,.bru{grid-template-columns:1fr}
  .card{grid-template-columns:1fr;min-height:0}
  .card-vis{order:-1;border-left:none;border-bottom:1px solid var(--border);padding:1.3rem;min-height:200px}
  .card.q .card-vis{min-height:0;padding:1.6rem 1.3rem}
  .quote{font-size:1.5rem}
  .card-txt{padding:1.4rem 1.25rem}
  .card-lead{font-size:1.5rem}
  .card-txt p{font-size:1.14rem;line-height:1.8}
  ol.steps li{font-size:1.08rem}
  .opt{font-size:1.08rem}
  .check{padding:1.4rem 1.25rem}
  .check-q{font-size:1.3rem}
  .learn-top{padding:.8rem 1rem}
  .learn-nav{padding:.85rem 1rem}
  .learn-nav .hint{display:none}
  .rule{grid-template-columns:1fr;gap:.5rem}
  .top-logo small{display:none}
  .top-btn .tx{display:none}
  .top-btn{padding:.5rem .6rem;font-size:.82rem}
  .top-back{padding:.5rem .6rem;font-size:.82rem}
  .top-logo{font-size:.85rem;letter-spacing:.15em}
  .nextbig{padding:1.3rem}
  .nextbig h3{font-size:1.4rem}
  .nums{grid-template-columns:repeat(5,1fr)}
  .a-gps{width:180px;height:180px}
}
@media(max-width:400px){.top-logo{display:none}.top .wrap{justify-content:space-between}}
/* ===== recorrido y tarjetas ===== */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin:1.4rem 0 1.2rem;background:#100f0d;border:1px solid #2c2a26;border-radius:16px;padding:.8rem 1rem}
.flow i{color:#4a443a;font-style:normal}
.fl{display:inline-flex;align-items:center;gap:.4rem;border:1px solid #2c2a26;background:#151412;color:#b9b5ad;border-radius:20px;padding:.4rem .75rem .4rem .4rem;font-size:.9rem}
.fl span{width:22px;height:22px;border-radius:50%;border:1px solid #3a3a3a;display:grid;place-items:center;font-size:.75rem;font-family:var(--head)}
.fl.ok{border-color:rgba(29,158,117,.5);color:#bfe9d9}.fl.ok span{background:var(--green);border-color:var(--green);color:#fff}
.fl.now{border-color:var(--gold);color:var(--gold-l);box-shadow:0 0 0 3px rgba(201,149,42,.12)}.fl.now span{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.cards-t{display:flex;align-items:center;gap:.8rem;margin:0 0 .8rem}
.cards-t .num{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-family:var(--head);flex-shrink:0}
.cards-t b{font-family:var(--head);font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase;display:block}
.cards-t small{font-size:1rem;color:var(--muted)}.cards-t small b{display:inline;font-family:var(--body);font-size:1rem;letter-spacing:0;text-transform:none;color:var(--gold-l)}
/* resultado */
.res{display:grid;gap:1rem;max-width:1100px}
.res-b{background:#171614;border:1px solid #2c2a26;border-left:3px solid var(--gold);border-radius:0 16px 16px 0;padding:1.1rem 1.3rem}
.res-b.g{border-left-color:var(--green);background:rgba(29,158,117,.06)}
.res-b small{font-family:var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-size:.85rem}
.res-b.g small{color:#7fdcbc}
.res-b p{font-size:1.08rem;line-height:1.7;color:#e4dfd5;margin-top:.45rem}
.res-b p b{color:#f6e7c8}
ul.dev{list-style:none;display:grid;gap:.35rem;margin:.3rem 0 .4rem}
ul.dev li{font-size:1.06rem;color:#e4dfd5;line-height:1.55}ul.dev li b{color:#f6e7c8}
.big-q{font-family:var(--serif);font-style:italic;font-size:1.6rem;line-height:1.35;color:var(--gold-l)}
textarea.fld{width:100%;resize:vertical;line-height:1.6;min-width:0}
.read .own{margin-top:.6rem}
/* metas */
.meta-card{background:#151412;border:1px solid rgba(201,149,42,.35);border-radius:18px;padding:1.2rem 1.3rem;margin-top:1rem;max-width:1100px}
.meta-card .mq{font-size:1.06rem;color:#e4dfd5;margin:.9rem 0 .2rem}
.chips button:disabled{opacity:1;cursor:default}
/* papel / carta */
.paper{background:radial-gradient(ellipse 70% 60% at 50% 20%,rgba(201,149,42,.1),transparent 70%),#0d0c0a;border:2px solid var(--gold);border-radius:8px;padding:clamp(1.2rem,4vw,2.6rem);max-width:900px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.paper::before{content:'';position:absolute;inset:8px;border:1px solid rgba(201,149,42,.35);border-radius:4px;pointer-events:none}
.paper>small{font-family:var(--head);letter-spacing:.3em;color:var(--gold);font-size:.82rem;display:block;margin-bottom:1rem}
.paper p{font-size:1.1rem;line-height:1.75;color:#e4dfd5;margin-bottom:.7rem}
.paper p b{color:#f6e7c8}.paper i{color:var(--gold-l)}
.paper ul{list-style:none;display:grid;gap:.4rem;margin:0 0 .9rem}
.paper li{font-size:1.06rem;line-height:1.6;color:#e4dfd5;padding-left:1rem;border-left:2px solid rgba(201,149,42,.5)}
.paper li b{color:#f6e7c8}
.paper.letter{font-family:var(--serif);font-style:italic;font-size:1.3rem;line-height:1.7;color:#efe6d2}
.letter-s{font-family:var(--serif);font-style:italic;font-size:1.15rem;line-height:1.65;color:#efe6d2}
.sig-row{margin-top:1.2rem;position:relative;z-index:1}
.sig{display:block;width:100%;max-width:520px;height:150px;border:1px dashed rgba(201,149,42,.6);border-radius:10px;background:rgba(255,255,255,.02);touch-action:none;cursor:crosshair}
.sig-row img{max-width:320px;display:block}
.sig-row span{display:block;font-size:.95rem;color:var(--muted);margin-top:.3rem;border-top:1px solid #3a352c;padding-top:.3rem;max-width:520px}
.big-n{font-family:var(--head);font-size:2.6rem!important;color:var(--gold-l)!important;line-height:1.1!important}
.big-n span{font-family:var(--body);font-size:1.1rem;color:var(--muted)}
.fine{font-size:.92rem!important;color:var(--muted)!important;border-top:1px solid #2c2a26;padding-top:.7rem;margin-top:.6rem}
/* número */
.gastos{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem}
.gastos label{display:flex;align-items:center;justify-content:space-between;gap:.7rem;background:#121110;border:1px solid var(--border);border-radius:12px;padding:.6rem .8rem}
.gastos span{font-size:1rem;color:#d8d4cc}
.gastos input{width:130px;background:#0a0a0a;border:1px solid #333;border-radius:9px;padding:.6rem .7rem;color:var(--text);font-size:1.05rem;text-align:right;font-family:var(--body)}
.gastos input:focus{outline:none;border-color:var(--gold)}
.g-tot{margin-top:1rem;font-size:1.15rem;color:#e4dfd5}.g-tot b{font-family:var(--head);font-size:1.6rem;color:var(--gold-l);letter-spacing:.03em}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;max-width:1100px}
.act{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:#171614;border:1px solid #2c2a26;border-radius:14px;padding:1rem 1.1rem}
.act b{font-size:1.08rem;display:block}.act small{color:var(--muted);font-size:.92rem}
.stp{display:flex;align-items:center;gap:.5rem}
.stp button{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:#0d0d0d;color:var(--gold-l);font-size:1.3rem}
.stp button:hover{border-color:var(--gold)}
.stp span{min-width:36px;text-align:center;font-family:var(--head);font-size:1.5rem;color:var(--gold-l)}
/* raíz */
.pq{margin-top:.9rem}.pq b{display:block;font-size:1.06rem;margin-bottom:.4rem;color:#f2ead9}
.crs{display:grid;gap:.6rem;margin-top:.6rem}
.cr{display:grid;grid-template-columns:1fr auto 1.3fr;gap:.8rem;align-items:center;background:#121110;border:1px solid var(--border);border-radius:12px;padding:.8rem 1rem}
.cr s{color:#9a8f86;font-size:1rem}.cr span{color:var(--gold)}.cr b{color:var(--gold-l);font-size:1.05rem;font-weight:600}
/* brújula y herramientas */
.tools{display:flex;gap:.8rem;flex-wrap:wrap;margin:1rem 0 .5rem}
.btn-rescue{display:inline-flex;align-items:center;gap:.5rem;background:#1b2433;border:1px solid #3b82f6;color:#cfe3ff;font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;font-size:1rem;padding:1rem 1.5rem;border-radius:13px;font-weight:600}
.btn-rescue:hover{background:#22304a}
.chain-r{display:grid;grid-template-columns:32px 1fr;gap:.7rem;padding:.7rem 0;border-bottom:1px solid #2c2a26}
.chain-r>span{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:grid;place-items:center;font-family:var(--head);font-size:.9rem}
.chain-r small{font-family:var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:.75rem}
.chain-r div div{font-size:1.06rem;line-height:1.55;color:#e4dfd5;margin-top:.15rem}
.gl{color:var(--gold-l)}
/* mi día */
.dia{background:#141312;border:1px solid rgba(201,149,42,.35);border-radius:18px;padding:.6rem 1.2rem 1rem;max-width:1100px}
.dia-r{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 0;border-bottom:1px solid #2c2a26}
.dia-t b{font-size:1.08rem;display:block;margin-bottom:.4rem}
.wk{display:flex;gap:.3rem}
.wk i{width:26px;height:26px;border-radius:50%;border:1px solid #333;display:grid;place-items:center;font-style:normal;font-size:.72rem;color:var(--muted);text-transform:uppercase}
.wk i.y{background:var(--green);border-color:var(--green);color:#fff}
.wk i.n{background:#2a1b1b;border-color:#5a3030;color:#d99}
.dia-b{display:flex;gap:.5rem}
.dia-b button{border:1px solid var(--border);background:#0d0d0d;color:var(--text);border-radius:11px;padding:.7rem 1rem;font-size:1rem}
.dia-b button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.dia-b button.no{background:#2a1b1b;border-color:#5a3030;color:#f3c4c4}
.dia-f{padding-top:.8rem;font-size:1.04rem;line-height:1.6;color:#e4dfd5}
/* modal */
.modal{position:fixed;inset:0;z-index:95;display:none}
.modal.open{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.8)}
.modal-in{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 40px);overflow-y:auto;background:#121110;border:1px solid var(--gold);border-radius:20px;padding:1.6rem 1.7rem;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.m-k{font-family:var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-size:.95rem;margin-bottom:.8rem}
.m-b p{font-size:1.12rem;line-height:1.7;color:#e4dfd5;margin-bottom:.7rem}.m-b p b{color:#f6e7c8}
.m-f{display:flex;justify-content:space-between;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem}
.qbar{height:6px;background:#222;border-radius:3px;overflow:hidden;margin-bottom:1.1rem}
.qbar i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
/* ilustraciones nuevas */
.a-paper{width:240px;background:#f3ead6;border-radius:8px;padding:1.2rem 1.1rem;text-align:left;box-shadow:0 14px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:.55rem}
.a-paper small{font-family:var(--head);letter-spacing:.14em;color:#8a6a24;font-size:.7rem}
.a-paper i{display:block;height:6px;border-radius:3px;background:#d9cba8}
.a-paper i.s{width:60%}
.a-paper em{margin-top:.8rem;font-family:var(--serif);font-size:1.3rem;color:#8a6a24;border-top:1px solid #b8a37a;padding-top:.3rem}
.a-cal{width:200px;border:2px solid var(--gold);border-radius:16px;overflow:hidden;background:#121212}
.a-cal small{display:block;background:var(--gold);color:#0a0a0a;font-family:var(--head);letter-spacing:.2em;padding:.5rem}
.a-cal b{display:block;font-size:3rem;color:var(--gold-l);padding:.6rem 0 .2rem}
.a-cal span{display:block;font-size:.9rem;color:#cfcac0;padding-bottom:.9rem}
.a-valley{width:100%;max-width:440px}.a-valley svg{width:100%;height:auto}
@media(max-width:820px){
  .gastos,.acts{grid-template-columns:1fr}
  .cr{grid-template-columns:1fr;gap:.3rem}.cr span{display:none}
  .fl{font-size:.8rem}.flow i{display:none}
  .cards-t b{font-size:1.1rem}
  .gastos input{width:110px}
  .modal-in{padding:1.2rem}
}
/* ===== diseño pro v2 ===== */
.e-hero{position:relative;margin-top:1.4rem;border-radius:24px;border:1px solid rgba(201,149,42,.4);overflow:hidden;min-height:330px;display:flex;align-items:flex-end;background:#0d0b07;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.e-bg{position:absolute;inset:0;background-size:cover;background-position:center right;opacity:.75}
.e-hero::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(7,7,7,.97) 30%,rgba(7,7,7,.55) 65%,rgba(7,7,7,.2)),linear-gradient(0deg,rgba(7,7,7,.8),transparent 50%)}
.e-in{position:relative;z-index:2;padding:2.2rem 2.4rem;max-width:820px}
.e-num{font-family:var(--head);font-size:4.2rem;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(240,201,107,.7);letter-spacing:.02em}
.e-num small{font-size:1.2rem;-webkit-text-stroke:0;color:var(--muted);letter-spacing:.1em}
.e-hero h1{font-family:var(--head);font-size:3rem;text-transform:uppercase;letter-spacing:.04em;line-height:1.05;margin:.3rem 0 .6rem}
.e-bridge{font-family:var(--serif);font-style:italic;font-size:1.4rem;line-height:1.4;color:#e8dcc4;margin-bottom:1rem}
.e-obj{border-left:3px solid var(--gold);padding:.3rem 0 .3rem 1rem;font-size:1.08rem;line-height:1.6;color:#e4dfd5;max-width:700px}
.e-obj span{display:block;font-family:var(--head);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-size:.78rem;margin-bottom:.2rem}
.e-meta{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem}
.e-meta span{border:1px solid rgba(201,149,42,.4);background:rgba(0,0,0,.35);border-radius:20px;padding:.3rem .8rem;font-size:.88rem;color:#d8cfbd}
details.how{cursor:default}
details.how summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:'＋';color:var(--blue);font-size:1.1rem}
details.how[open] summary::after{content:'−'}
details.how[open] summary{margin-bottom:.55rem}
#flow{position:sticky;top:60px;z-index:20}
.flow{background:rgba(14,13,11,.95);backdrop-filter:blur(8px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.sec{border-top:none;padding-top:1rem;margin-top:3.4rem;position:relative}
.sec::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,rgba(201,149,42,.55),rgba(201,149,42,.08) 60%,transparent)}
.sec .num{box-shadow:0 0 0 5px rgba(201,149,42,.15),0 6px 18px rgba(201,149,42,.25)}
.learn{box-shadow:0 24px 50px rgba(0,0,0,.45)}
.read{box-shadow:0 10px 26px rgba(0,0,0,.25)}
.read>b{font-size:1.12rem}
.finish.ok{display:grid;grid-template-columns:auto 1fr;gap:1.3rem;align-items:start;padding:1.7rem 1.8rem;background:radial-gradient(ellipse 60% 80% at 0% 0%,rgba(29,158,117,.18),transparent 60%),rgba(29,158,117,.06)}
.finish.ok>div:last-child{grid-column:1/-1}
.badge-ok{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4fd1a5,var(--green));color:#fff;display:grid;place-items:center;font-size:1.9rem;box-shadow:0 0 0 7px rgba(29,158,117,.18)}
.finish.ok>div:nth-child(2) b{font-size:1.45rem}
.built-t{margin-top:.6rem!important;color:#cfe9df!important}
ul.built{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem .9rem;margin:.5rem 0 .4rem}
ul.built li{font-size:1.02rem;color:#bfe9d9;background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.3);border-radius:10px;padding:.5rem .7rem}
.keep{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-top:1.2rem;border-radius:18px;padding:1.3rem 1.5rem;background:linear-gradient(120deg,rgba(201,149,42,.16),rgba(201,149,42,.03));border:1px solid rgba(201,149,42,.55);max-width:900px}
.keep>div:first-child{flex:1;min-width:260px}
.keep b{font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-l);font-size:1.1rem}
.keep p{font-size:1.04rem;line-height:1.6;color:#e4dfd5;margin-top:.3rem}
.keep-b{display:flex;gap:.6rem;flex-wrap:wrap}
.lc{background:linear-gradient(160deg,#151412,#0f0e0d)}
.lc .n{font-size:2.8rem;color:transparent;-webkit-text-stroke:1px rgba(240,201,107,.5)}
.lc.done .n{-webkit-text-stroke-color:rgba(127,220,188,.6)}
@media(max-width:820px){
  .e-hero{min-height:0}.e-in{padding:1.5rem 1.3rem}.e-hero h1{font-size:2.1rem}.e-num{font-size:3rem}.e-bridge{font-size:1.15rem}
  .e-hero::before{background:linear-gradient(0deg,rgba(7,7,7,.97) 45%,rgba(7,7,7,.6))}
  .flow{flex-wrap:nowrap;overflow-x:auto;padding:.6rem .7rem;margin-left:-4px;margin-right:-4px;scrollbar-width:none}
  .flow::-webkit-scrollbar{display:none}
  .fl{white-space:nowrap;flex-shrink:0}
  ul.built{grid-template-columns:1fr}
  .finish.ok{grid-template-columns:1fr}
}

.finish .badge-ok{flex:0 0 64px;min-width:0;width:64px;height:64px}
@media(max-width:820px){.learn-top{flex-wrap:wrap;justify-content:space-between}.learn-top .dots{order:3;flex-basis:100%;flex-direction:row}}

.bal{margin-top:.9rem;border-radius:12px;padding:.9rem 1.1rem;font-size:1.06rem;line-height:1.6}
.bal.ok{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.45);color:#d6efe6}
.bal.warn{background:rgba(224,160,60,.08);border:1px solid rgba(224,160,60,.5);color:#f1e2c6}
.bal b{color:#fff}
.magic{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:1100px}
.mg{background:#151412;border:1px solid #2c2a26;border-radius:18px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.3rem}
.mg small{font-family:var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-size:.78rem}
.mg b{font-family:var(--head);font-size:1.9rem;color:#f2efe9;letter-spacing:.02em}
.mg span{font-size:.95rem;color:var(--muted)}
.mg.hi{border:2px solid var(--gold);background:radial-gradient(ellipse at 30% 0%,rgba(201,149,42,.22),transparent 70%),#151412;box-shadow:0 0 0 5px rgba(201,149,42,.1)}
.mg.hi b{color:var(--gold-l);font-size:2.2rem}
.steps-m{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.6rem 0}
.steps-m div{border:1px solid var(--border);background:#121110;border-radius:14px;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.15rem}
.steps-m b{font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-size:.82rem}
.steps-m span{font-size:.98rem;color:#e4dfd5}.steps-m em{font-style:normal;font-family:var(--head);font-size:1.3rem;color:var(--gold-l)}
.steps-m i{font-style:normal;font-size:.85rem;color:#7fdcbc}
.steps-m div.ok{border-color:rgba(29,158,117,.5);background:rgba(29,158,117,.06)}
@media(max-width:820px){.magic,.steps-m{grid-template-columns:1fr}}
</style>

const ETAPAS=[
/* =============== ETAPA 1 · EL ESPEJO =============== */
{key:'mente0',title:'El espejo',
 desc:'Mira con honestidad dónde estás hoy en las 8 áreas de tu vida, sin juzgarte.',
 obj:'Ver con honestidad dónde estás hoy en las 8 áreas de tu vida, sin juzgarte, para tener tu punto de partida.',
 audio:'mente-etapa1.mp3',
 cards:[
  {k:'Antes de empezar',lead:'Este no es un curso para memorizar. Es un viaje para conocerte.',
   p:['En otros módulos aprendiste cosas: qué es una blockchain o cómo enviar USDT. Aquí no vas a aprender datos. <b>Vas a mirarte.</b>',
      'Muchas personas empiezan un negocio con toda la información… y a las tres semanas lo dejan. No les faltó saber. Les faltó <b>claridad</b>: saber dónde estaban, a dónde iban y para qué.',
      'Por eso este módulo es un viaje de <b>6 etapas</b>. En cada una construyes una pieza de tu <b>Brújula</b>: una herramienta personal que te recuerda cada día por qué empezaste.'],
   art:'path'},
  {k:'Capítulo 1 · El GPS',lead:'Ningún GPS puede darte la ruta si no sabe dónde estás.',
   p:['Cuando abres un mapa en tu celular, lo primero que hace es buscar tu ubicación: <b>el puntito azul</b>. Sin ese punto, el destino no sirve de nada.',
      'Con tu vida pasa lo mismo. Todos queremos llegar a algún lugar: más tiempo, más tranquilidad, más ingresos. Pero casi nadie se detiene a ver con honestidad <b>dónde está parado hoy</b>.',
      'Esta primera etapa es tu puntito azul.'],
   art:'gps'},
  {k:'Capítulo 2 · La historia de Carmen',lead:'Carmen tenía todo para empezar. Y aun así no avanzaba.',
   p:['Carmen tiene 52 años, dos hijos ya grandes y un trabajo que le da para vivir, pero no para disfrutar. Se unió a la comunidad con muchas ganas, vio los videos y entendió el sistema.',
      'Pasaron tres semanas y no había hablado con nadie. <b>“No tengo tiempo”</b>, decía. <b>“Cuando las cosas se calmen, empiezo.”</b>',
      'Un día su mentora le pidió algo sencillo: <b>“Califica del 1 al 10 cada área de tu vida.”</b> Carmen lo hizo… y se le hizo un nudo en la garganta. Salud: 4. Tiempo libre: 2. Dinero: 3.',
      'No era falta de tiempo. Era que nunca se había detenido a mirar. <b>Y lo que no miras, no lo puedes cambiar.</b>'],
   ex:'Carmen es un ejemplo. Pero quizá algo de su historia te suene conocido.'},
  {pause:true,label:'Pausa honesta',q:'Cuando piensas en tu vida hoy, ¿qué sientes primero?',
   o:['Tranquilidad: estoy bien, pero sé que puedo más','Cansancio: hago mucho y avanzo poco','Inquietud: sé que algo tiene que cambiar'],
   fb:['Qué bueno que partes de un lugar estable. Desde ahí es más fácil crecer. Cuidado con una trampa: <b>“estoy bien”</b> a veces es la forma más cómoda de no moverse.',
       'Ese cansancio es información valiosa: te dice que el problema no es el esfuerzo, sino <b>hacia dónde</b> lo pones. Este viaje es justo para eso.',
       'Esa inquietud es tu brújula interna hablando. No la calles: <b>es el primer paso de todo cambio</b>. Ahora vamos a ponerle nombre.'],
   other:'Otra: lo escribo con mis palabras',
   ofb:'Ponerlo con tus propias palabras ya es un acto de honestidad. <b>Lo que sientes hoy es tu punto de partida</b>, y no hay una forma correcta de sentirlo.',
   save:'siento'},
  {k:'Capítulo 3 · Por qué cuesta mirarse',lead:'Tu cerebro prefiere lo conocido, aunque no te guste.',
   p:['No es flojera ni falta de carácter. Tu mente busca ahorrar energía y alejarte de lo incómodo. Por eso, a veces, es más fácil decir <b>“estoy bien”</b> que mirar lo que no está bien.',
      'Los psicólogos le llaman <b>sesgo del statu quo</b>: la tendencia a quedarnos como estamos, aunque cambiar nos convenga.',
      'La buena noticia: <b>eso se entrena</b>. Cada vez que te miras con honestidad, sin castigarte, le enseñas a tu mente que mirar no es peligroso. Es el primer paso para decidir.']},
  {k:'Capítulo 4 · Mirar sin juzgar',lead:'Un espejo no te regaña. Solo te muestra.',
   p:['Hay dos formas de mirarte: con <b>el juez</b> o con <b>el espejo</b>.',
      'El juez te paraliza: busca culpables. El espejo te da información: te muestra lo que hay para que decidas qué hacer.',
      'En esta etapa vas a usar solo el espejo. Un 3 en un área <b>no dice que eres un fracaso</b>. Dice dónde tienes más espacio para crecer.'],
   art:'jm'},
  {k:'Capítulo 5 · Las 8 áreas de tu vida',lead:'Tu vida es como una rueda: si un lado está desinflado, todo el viaje se siente.',
   p:['La <b>rueda de la vida</b> es una herramienta que usan coaches de todo el mundo. Divide tu vida en 8 áreas:',
      '<ol class="steps"><li><b>Salud y cuerpo</b></li><li><b>Mente y emociones</b></li><li><b>Espíritu y propósito</b></li><li><b>Familia</b></li><li><b>Amistades y comunidad</b></li><li><b>Dinero</b></li><li><b>Trabajo y negocio</b></li><li><b>Tiempo libre y disfrute</b></li></ol>',
      'Al terminar las tarjetas vas a calificar cada una del 1 al 10, y tu rueda se dibujará sola.'],
   art:'wheel'},
  {pause:true,label:'Pausa honesta',q:'¿Cuál de estas frases te dices más seguido?',
   o:['“No tengo tiempo”','“No soy buena o bueno para vender”','“Ya estoy grande para esto”','“Cuando las cosas se calmen, empiezo”'],
   fb:['Casi siempre, “no tengo tiempo” significa <b>“todavía no es mi prioridad”</b>. No es un regaño: es una pista. Cuando algo se vuelve importante, el tiempo aparece.',
       'Vender no es un don con el que se nace: <b>es una habilidad que se aprende</b>, como manejar. Y en esta comunidad no se trata de convencer, sino de compartir lo que a ti te sirve.',
       'La experiencia que tienes es una ventaja, no un obstáculo. <b>Muchas personas empiezan algo nuevo a los 50, 60 o más</b>, justo porque ya saben lo que quieren.',
       'Las cosas casi nunca se calman solas. <b>Las personas que avanzan empiezan en medio del ruido</b>, con pasos pequeños.'],
   other:'Otra: la escribo yo',
   ofb:'Gracias por escribirla tal como te la dices. <b>Ponerle nombre a esa frase es el primer paso para cambiarla.</b> En la etapa 4, La raíz, vas a trabajar con ella.',
   save:'frase'},
  {k:'Capítulo 6 · La historia que te cuentas',lead:'La frase que más repites se vuelve el techo de lo que intentas.',
   p:['Esa frase que elegiste no es mala. Es una historia que tu mente aprendió para protegerte: del rechazo, del cansancio o de equivocarte.',
      'Carmen decía “no tengo tiempo”. Cuando revisó su día con calma, encontró casi dos horas viendo videos en el celular. <b>No le faltaba tiempo: le faltaba prioridad.</b>',
      'Hoy no tienes que pelearte con tu frase. <b>Solo detectarla.</b> Al final de esta etapa te ayudamos a elegir una <b>frase nueva</b> para decirte en su lugar. Y en la etapa 4, <b>La raíz</b>, vas a ir a fondo: de dónde viene.']},
  {k:'Para cerrar · Qué tiene que ver con tu negocio',lead:'Tu negocio crece al ritmo de tu claridad.',
   p:['Quizá te preguntas qué tiene que ver todo esto con tu negocio digital. <b>Todo.</b>',
      'Las personas que avanzan no son las que más saben. Son las que saben <b>para qué</b> lo hacen y lo vuelven a hacer aunque no tengan ganas.',
      'Por eso, antes de hablar de prospectos o de ventas, empezamos aquí. Tu rueda de hoy es tu foto del <b>“antes”</b>. En 30 días la vas a repetir para ver cuánto avanzaste.'],
   do:'Toca <b>Terminar ✓</b> y abajo se abre tu rueda de la vida.',
   art:'chain'}
 ],
 recap:['Sin saber dónde estás, ningún destino tiene ruta. Tu rueda es tu <b>punto de partida</b>.','Mírate con el <b>espejo</b>, no con el juez: un número bajo es información, no un castigo.','La frase que más repites puede ser tu techo. Hoy la <b>detectas</b> y eliges una <b>frase nueva</b>; en la etapa 4 vas a su raíz.'],
 rule:'<b>La claridad crea dirección.</b> No tienes que cambiar toda tu vida hoy. Solo mirar con honestidad dónde estás y elegir un área. Lo que ves con claridad, lo puedes transformar.'
},

 cards:[

  {k:'Capítulo 2 · Carmen y su “quiero más”',lead:'“Quiero estar mejor” no mueve a nadie. Una imagen clara, sí.',
   p:['Cuando su mentora le preguntó qué quería, Carmen dijo: <b>“Quiero estar mejor. Quiero más dinero.”</b>',
      '—¿Más cuánto? ¿Para hacer qué? ¿Cómo se vería un día de esa vida?',
      'Carmen se quedó callada. Nunca se lo había imaginado con detalle. Esa noche escribió: <b>“Despertar con calma, caminar en la playa con mi hija y pagar mis cuentas con tranquilidad, y que me sobre.”</b> Por primera vez, su meta tenía cara.'],
   ex:'¿Puedes ver tu vida ideal con ese nivel de detalle? Si todavía no, para eso es esta etapa.'},
  {pause:true,label:'Pausa honesta',q:'Imagina que ya vives tu vida ideal. ¿Qué es lo primero que notas al despertar?',

       'Tu motor es la <b>gente que amas</b>. Recuérdalo los días difíciles: lo que construyes también es para ellos.',
       'Querer <b>prosperidad</b> es legítimo: es querer vivir con tranquilidad y libertad. Esa meta merece un plan, y lo vas a hacer en la etapa 3.'],
   other:'Otra: la escribo yo',
   ofb:'Esa imagen es tuya y es valiosa. <b>Guárdala</b>: la vas a usar ahora mismo para diseñar tu vida ideal.',
   save:'despertar'},
  {k:'Capítulo 3 · Por qué escribirlo funciona',lead:'Tu mente se mueve hacia lo que puede ver con claridad.',
   p:['Los estudios sobre metas muestran algo sencillo: las metas <b>claras y específicas</b> funcionan mucho mejor que “hacer lo mejor posible”.',
      'Cuando escribes lo que quieres con detalle, tu mente empieza a notar oportunidades que antes pasaban de largo. Es como cuando compras un carro rojo y de pronto ves carros rojos por todos lados: siempre estuvieron ahí, pero ahora tu atención los busca.',
      'Por eso hoy no vas a “pensar” tu vida ideal. <b>La vas a escribir.</b>']},
  {pause:true,label:'Pausa honesta',q:'Imagina que pasan 5 años y todo sigue exactamente igual que hoy. ¿Qué es lo que más te dolería?',

   fb:['Ese dolor es información poderosa. <b>Úsalo como impulso, no como peso</b>: tu meta de dinero va a tener un plan en la etapa 3.',
       'El tiempo con los que amas no se recupera. <b>Por eso tu vida ideal no es un lujo: es una prioridad.</b>',
       'Tu cuerpo es tu primera casa. <b>Cuidarlo hoy es la base de todo lo demás</b>, incluido tu negocio.',
       'Ese es el dolor más grande para muchas personas: el “¿y si…?”. <b>Hoy estás eligiendo no quedarte con esa pregunta.</b>'],
   other:'Otra: la escribo yo',
   ofb:'Mirar de frente lo que no quieres <b>te da la fuerza para ir por lo que sí quieres</b>. Ahora vamos a convertir eso en una decisión.',
   save:'dolor'},
  {k:'Capítulo 4 · El momento de decidir',lead:'Las vidas cambian en el momento en que alguien decide de verdad.',
   p:['Acabas de ver dos caminos: la vida que quieres y la vida que tendrías si todo sigue igual. <b>Las dos son posibles.</b> La diferencia está en lo que decidas hoy.',
      'Decidir no es desear. Desear es “ojalá”. <b>Decidir es cortar otras opciones</b>: “esto sí va a pasar, y empiezo hoy”.',
      'No necesitas saber todo el camino. Solo necesitas decidir el destino y dar el primer paso. El resto se aprende andando.'],
   art:'decide'},
  {k:'Capítulo 5 · Menos es más',lead:'Quien persigue ocho metas a la vez, no alcanza ninguna.',
   p:['Tu rueda tiene 8 áreas, y es normal querer mejorarlas todas. Pero la energía y la atención tienen límite.',
      'Por eso vas a elegir <b>máximo 3 metas</b>: tu área foco y, si quieres, dos más. Cuando avances en esas, las demás suelen mejorar solas.',
      'Y a cada meta le vas a poner <b>una acción pequeña diaria</b>. La meta te da dirección; la acción diaria te da avance.'],
   art:'three'},
  {pause:true,label:'Pausa honesta',q:'¿Qué es lo que más te frena al escribir una meta?',
   o:['Miedo a no cumplirla','Pensar que es demasiado para mí','No saber por dónde empezar','Que otros se burlen'],
   fb:['Una meta no es una promesa de perfección: es una <b>dirección</b>. Si te desvías, la corriges; no la tiras.',
       'Ese pensamiento suena a tu frase de siempre. Recuerda tu <b>frase nueva</b>: hoy eliges una vida que mereces, paso a paso.',
       'Para eso te damos opciones. <b>No tienes que inventarlo todo</b>: elige, ajusta y listo.',
       'Tu carta es tuya. <b>Nadie la tiene que ver</b>. Y quien se burla de los sueños de otros, casi siempre dejó de soñar los suyos.'],
   other:'Otra: la escribo yo',
   ofb:'Ponerle nombre a ese freno ya le quita fuerza. <b>Escribir tu meta a pesar de eso</b> es tu primer acto de valentía de esta etapa.'},
  {k:'Para cerrar · Una carta que firmas',lead:'Lo que firmas con tu nombre se vuelve un compromiso contigo.',
   p:['Al final de esta etapa vas a firmar una <b>carta compromiso</b>: tu vida ideal, tus metas, tus acciones diarias y tu frase nueva, en una sola hoja.',

      'Y a partir de mañana, en tu Brújula vas a poder <b>medir cada día</b> si cumpliste tus acciones.'],
   do:'Toca <b>Terminar</b> y abajo empiezas a diseñar tu vida ideal.',
   art:'sign'}
 ],
 recap:['Un GPS necesita <b>dos datos</b>: dónde estás y a dónde vas. Hoy elegiste tu destino.','Una meta <b>clara y escrita</b> mueve más que mil buenas intenciones.','<b>Menos es más</b>: máximo 3 metas, cada una con una acción pequeña diaria.'],
 rule:'<b>La dirección crea enfoque.</b> Cuando sabes a dónde vas, es más fácil decir que no a lo que te distrae y sí a lo que te acerca.'
},
/* =============== ETAPA 3 · EL NÚMERO =============== */
{key:'mente2',title:'El número',
 desc:'Ponle número y fecha a tu meta, y conviértela en acciones que sí controlas.',
 obj:'Ponerle número y fecha a tu meta, y convertirla en acciones semanales que sí dependen de ti.',
 audio:'mente-etapa3.mp3',
 cards:[
  {k:'Capítulo 1 · Del sueño al plan',lead:'Un sueño sin número es un deseo. Con número, empieza a ser un plan.',
   p:['En la etapa 2 dibujaste tu vida ideal. Ahora vas a responder una pregunta que muchas personas evitan: <b>¿cuánto cuesta esa vida?</b>',
      'Vas a sacar tres números con calma y con lápiz: <b>lo que cuesta tu vida hoy</b>, <b>lo que ganas hoy</b> y <b>lo que cuesta la vida que quieres</b>. Con ellos sale tu <b>número mágico</b>: la cantidad al mes que hace posible tu vida ideal.',
      'Cuando el número está claro, deja de dar miedo. Lo que asusta es lo que no tiene forma.']},
  {k:'Capítulo 2 · Carmen hace cuentas',lead:'Carmen pensaba que necesitaba una fortuna. Necesitaba menos de lo que creía.',
   p:['Carmen se sentó con una hoja. Primero anotó lo que paga cada mes: renta, luz, comida, el seguro de su mamá. Luego lo que gana. Y al final, lo que le sumaría a su vida ideal: un viaje al año y empezar a ahorrar.',
      'Cuando sumó, se sorprendió: <b>el número era más pequeño que su miedo</b>. No era fácil, pero era posible imaginarlo.',
      'Y algo cambió: dejó de decir “quiero más dinero” y empezó a decir <b>“estoy construyendo esta cantidad extra al mes”</b>.']},
  {pause:true,label:'Pausa honesta',q:'Cuando piensas en ponerle número a tu meta de dinero, ¿qué sientes?',
   o:['Emoción: me motiva','Miedo: ¿y si no llego?','Incomodidad: hablar de dinero me cuesta','Nada todavía: nunca lo había pensado'],
   fb:['Esa emoción es combustible. Úsala, y acompáñala de un <b>plan semanal</b> para que no se apague.',
       'Es normal. Por eso vas a separar lo que <b>no controlas</b> (el resultado) de lo que <b>sí controlas</b> (tus acciones). Eso baja mucho el miedo.',
       'Mucha gente creció escuchando que hablar de dinero está mal. En la etapa 4, <b>La raíz</b>, vas a revisar de dónde viene eso.',
       'Entonces hoy es un gran día: <b>vas a verlo por primera vez</b>, con calma y sin presión.'],
   other:'Otra: la escribo yo',
   ofb:'Gracias por ponerlo en tus palabras. <b>Lo que sientes no está mal</b>: solo es información para saber cómo acompañarte.'},
  {k:'Capítulo 3 · Lo que sí controlas',lead:'Nadie controla el resultado. Todos controlamos la acción.',
   p:['Seamos honestos: <b>nadie puede prometerte cuánto vas a ganar</b>, ni en este ni en ningún negocio. El resultado depende de muchas cosas.',
      'Lo que sí depende de ti son tus <b>acciones</b>: con cuántas personas platicas, a cuántas les das seguimiento, cuánto tiempo estudias.',
      'Por eso tu número va a tener dos partes: tu <b>meta de resultado</b> (el número que te da dirección) y tus <b>metas de actividad</b> (lo que haces cada semana). La segunda es la que vas a medir.'],
   art:'control'},
  {k:'Capítulo 4 · Tu tiempo real',lead:'15 minutos todos los días valen más que 3 horas una vez al mes.',
   p:['Aquí no se trata de cuánto tiempo te gustaría tener, sino de <b>cuánto tienes de verdad</b>.',
      'Es mejor comprometerte con poco y cumplirlo, que con mucho y fallar. Cada vez que cumples lo que te prometes, <b>tu confianza en ti crece</b>.',
      'Y cuando ya sea parte de tu rutina, subes un poquito más.']},
  {pause:true,label:'Pausa honesta',q:'Siendo realista, ¿cuánto tiempo puedes dedicarle a tu negocio?',
   o:['15 a 30 minutos al día','Alrededor de 1 hora al día','2 horas o más al día','Solo algunos días de la semana'],
   fb:['Es un gran inicio. <b>Lo poco y constante gana.</b> Protege esos minutos como una cita importante.',

const DEMO=new URLSearchParams(location.search).has('demo');
let ADMIN=false;
const ST={view:0};
function LS(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function done(k){return LS('done_'+k)==='1';}
function cur(){return ETAPAS[ST.view-1];}
function cardPos(E){return Math.min(parseInt(LS('mt_card_'+E.key))||0,E.cards.length-1);}
function learned(E){return LS('mt_learn_'+E.key)==='1';}
function nextEtapa(){return ETAPAS.findIndex(e=>!done(e.key));}
function isOpen(i){return ADMIN||DEMO||i===0||done(ETAPAS[i-1].key);}
function D(){try{return JSON.parse(LS('mt_data')||'{}');}catch(e){return {};}}
function setD(patch){const d=Object.assign(D(),patch);Object.keys(d).forEach(k=>{if(d[k]===undefined)delete d[k];});LS('mt_data',JSON.stringify(d));queueCloud();return d;}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(d){return d.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});}
function dayKey(dt){const d=dt||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

async function loadCloud(){
  if(!USER||!db)return;
  if(LS('prog_uid')&&LS('prog_uid')!==USER.uid){Object.keys(localStorage).filter(k=>/^(done_|cr_|mt_)/.test(k)).forEach(k=>localStorage.removeItem(k));}
  LS('prog_uid',USER.uid);
  try{const s=await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').get();
    if(s.exists){const c=s.data().claves||{};Object.keys(c).forEach(k=>{if(c[k])LS(k,'1');});}}catch(e){}
  try{const g=await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('mentalidad').get();
    if(g.exists&&g.data().datos){const local=D(),cloud=g.data().datos;LS('mt_data',JSON.stringify((local.t||0)>(cloud.t||0)?Object.assign({},cloud,local):Object.assign({},local,cloud)));}}catch(e){}
}
let _cT=null;

async function saveData(){
  if(!USER||!db)return;const d=D();d.t=Date.now();LS('mt_data',JSON.stringify(d));
  try{await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('mentalidad').set({datos:d,actualizado:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}catch(e){}
}
async function saveDone(key){
  if(!USER||!db)return;const claves={};claves['done_'+key]=1;
  try{await db.collection('usuarios').doc(USER.uid).collection('progreso').doc('resumen').set({claves,actualizado:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}catch(e){}
}
function setDone(key){LS('done_'+key,'1');saveDone(key);}

/* ---------- RUEDA (dibujo) ---------- */
function wheelSVG(vals,opt={}){
  const S=opt.size||420,c=S/2,R=S*0.34,n=AREAS.length,lab=opt.labels!==false;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+r*Math.cos(a),c+r*Math.sin(a)];};
  let g='';
  for(let k=2;k<=10;k+=2){g+=`<polygon points="${AREAS.map((_,i)=>pt(i,R*k/10).join(',')).join(' ')}" fill="none" stroke="${k===10?'#3a352c':'#26231e'}" stroke-width="1"/>`;}
  AREAS.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#26231e"/>`;});
  const has=AREAS.some(a=>vals&&vals[a.id]);
  if(has){
    const P=AREAS.map((a,i)=>pt(i,R*((vals[a.id]||0)/10)));
    g+=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="rgba(201,149,42,.28)" stroke="#F0C96B" stroke-width="2.5" stroke-linejoin="round"/>`;
    P.forEach((p,i)=>{if(vals[AREAS[i].id])g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${S/105}" fill="#F0C96B"/>`;});
  }
  if(lab)AREAS.forEach((a,i)=>{const [x,y]=pt(i,R+S*0.085);const v=vals&&vals[a.id];
    const anchor=Math.abs(x-c)<4?'middle':x>c?'start':'end';const fs=S/30;
    g+=`<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="DM Sans,Arial,sans-serif" font-size="${fs}" fill="#cfcac0">${SHORT[a.id]}</text>`;
    if(v)g+=`<text x="${x}" y="${y+fs*1.15}" text-anchor="${anchor}" font-family="Oswald,Arial,sans-serif" font-size="${fs*1.15}" fill="#F0C96B">${v}</text>`;});
  const vb=opt.pad?`${-S*0.06} ${-S*0.02} ${S*1.12} ${S*1.04}`:`${-S*0.06} 0 ${S*1.12} ${S}`;
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rueda de la vida">${g}</svg>`;
}

function fnGroups(d){

function commitOpts(d){
  const o=[];
  if(d.frase!==undefined&&d.fraseNueva)o.push([`Durante 3 días, anotar cada vez que me digo ${fraseTxt(d)} y cambiarla en ese momento por mi frase nueva`,`“${esc(d.fraseNueva)}”`]);
  if((d.cual||[]).length)o.push([`Preguntarle a 2 personas de confianza cuáles creen que son mis cualidades, y compararlas con las que elegí`,`Elegiste: ${(d.cual||[]).slice(0,5).map(esc).join(', ')}${(d.cual||[]).length>5?` y ${(d.cual||[]).length-5} más`:''}. A veces otros ven en ti lo que tú no ves.`]);
  if((d.opor||[]).length)o.push([`Durante 3 días, notar cuándo aparece “${esc(d.opor[0])}” y qué la provoca`,'Solo obsérvalo y anótalo. Entenderlo es el primer paso para cambiarlo.']);
  if(d.foco)o.push([`Durante 3 días, anotar una cosa que ayudó y una que afectó a mi área foco: ${aName(d.foco)}`,'Así descubres qué la hace crecer en tu día a día.']);
  return o;
}
function commitHTML(d){
  if(!espejoOk(d))return lockBox('Primero completa tu espejo interior. Con eso armamos opciones de compromiso hechas para ti.');

  return `<div class="tasks">${opts.map(([t,sub],k)=>`<button class="task ${k===idx?'on':''}" onclick="setCommit(${k})"><span class="bx">${k===idx?'✓':''}</span><div>${t}<small>${sub}</small></div></button>`).join('')}
  <div class="own"><input id="own-c" maxlength="160" placeholder="O escribe tu propio compromiso…" value="${own?esc(cm):''}"><button class="btn-line" onclick="setOwnCommit()">Guardar el mío</button></div></div>
  ${cm?`<div class="task-res">Tu compromiso: <b>${esc(cm)}</b><br>Empieza hoy. Quedó guardado en tu Brújula.</div>`:''}`;
}

const MONEDAS=['MXN','COP','USD','EUR','ARS','PEN'];
const BASICOS=[['casa','Casa: renta o hipoteca'],['servicios','Luz, agua, gas, internet y teléfono'],['comida','Comida y súper'],['transporte','Transporte o gasolina'],['salud','Salud y seguros'],['educacion','Escuela o educación'],['deudas','Pagos de deudas o créditos'],['otros','Otros gastos de cada mes']];
const DESEOS=[['viajes','Viajes y paseos'],['ahorro','Ahorro'],['inversion','Inversión'],['casa2','Una mejor casa o un mejor auto'],['familia','Apoyar a mi familia'],['gustos','Pasatiempos y gustos'],['dar','Ayudar a otros o donar'],['otro','Otro sueño']];

function money(n,m){return (Number(n)||0).toLocaleString('es-MX',{maximumFractionDigits:0})+' '+(m||'');}
function sumOf(o,list){o=o||{};return list.reduce((t,[k])=>t+(Number(o[k])||0),0);}
function nums(d){const B=sumOf(d.gb,BASICOS),W=sumOf(d.gd,DESEOS),I=Number(d.ingreso)||0,Y=B+W;return {B,W,I,Y,extra:Math.max(0,Y-I),falta:Math.max(0,B-I),mult:I>0?Y/I:null,libre:Y*12*25};}
function gTotal(d){return nums(d).Y;}
function baseOk(d){return sumOf(d.gb,BASICOS)>0&&d.ingreso!==undefined&&d.ingreso!=='';}
function idealOk(d){return baseOk(d)&&!!d.idealListo;}
function rows(kind,list,o){return `<div class="gastos">${list.map(([k,t])=>`<label><span>${t}</span><input type="number" min="0" inputmode="numeric" value="${(o||{})[k]||''}" placeholder="0" oninput="setMoney('${kind}','${k}',this.value)"></label>`).join('')}</div>`;}
function baseHTML(d){
  const m=d.moneda||'MXN',n=nums(d);
  return `<div class="read" style="margin-top:0"><b>¿En qué moneda haces tus cuentas?</b><div class="chips">${MONEDAS.map(x=>`<button class="${m===x?'on':''}" onclick="setD({moneda:'${x}'});paint()">${x}</button>`).join('')}</div></div>
  <div class="read"><b>1 · Lo que cuesta tu vida hoy</b><p>Escribe lo que pagas <b>cada mes</b> en tus gastos básicos, los que pagas sí o sí. Si un gasto no es mensual (por ejemplo, un seguro anual), divídelo entre 12.</p>
   ${rows('gb',BASICOS,d.gb)}<div class="g-tot">Tu número base: <b id="t-gb">${money(n.B,m)}</b> al mes</div></div>
  <div class="read"><b>2 · Lo que ganas hoy</b><p>Suma todo lo que entra a tu bolsillo cada mes: sueldo, negocio, pensión, apoyos. Si hoy no tienes ingresos, escribe 0.</p>
   <div class="gastos" style="grid-template-columns:1fr"><label><span>Mi ingreso total al mes</span><input type="number" min="0" inputmode="numeric" value="${d.ingreso!==undefined?d.ingreso:''}" placeholder="0" oninput="setIngreso(this.value)"></label></div>
   <div id="t-bal">${balHTML(d)}</div></div>`;
}
function balHTML(d){const n=nums(d),m=d.moneda||'MXN';if(!baseOk(d))return '';
  return n.I>=n.B?`<div class="bal ok">Hoy tus ingresos <b>cubren tus básicos</b> y te quedan <b>${money(n.I-n.B,m)}</b> al mes. Ahora vamos por la vida que quieres.</div>`
   :`<div class="bal warn">Hoy te faltan <b>${money(n.B-n.I,m)}</b> al mes para cubrir tus básicos. Es valioso saberlo: ese es tu <b>primer escalón</b>. Antes que los sueños, la meta número uno es cubrir esa diferencia.</div>`;}
function idealHTML(d){
  if(!baseOk(d))return lockBox('Primero escribe tus gastos básicos y lo que ganas hoy.');
  const m=d.moneda||'MXN',n=nums(d);
  return `<div class="read" style="margin-top:0"><b>3 · Lo que quieres sumar</b><p>Ahora piensa en tu vida ideal. ¿Cuánto <b>al mes</b> le sumarías a tus básicos para vivirla? Un viaje de ${money(24000,'')} al año, por ejemplo, son ${money(2000,'')} al mes. Deja vacío lo que no aplique.</p>
   ${rows('gd',DESEOS,d.gd)}<div class="g-tot">Tu vida ideal suma: <b id="t-gd">${money(n.W,m)}</b> al mes</div>
   <div style="margin-top:.9rem"><button class="btn-gold" onclick="setD({idealListo:1});paint();setTimeout(()=>flowGo('s-numero'),250)">Calcular mi número mágico →</button></div></div>`;
}
function setMoney(kind,k,v){const d=D(),o=Object.assign({},d[kind]||{});if(v==='')delete o[k];else o[k]=Number(v);const p={};p[kind]=o;setD(p);
  const n=nums(D()),m=D().moneda||'MXN',t=document.getElementById('t-'+kind);if(t)t.textContent=money(kind==='gb'?n.B:n.W,m);const b=document.getElementById('t-bal');if(b)b.innerHTML=balHTML(D());paintLite();}
function setIngreso(v){setD({ingreso:v===''?undefined:Number(v)});const b=document.getElementById('t-bal');if(b)b.innerHTML=balHTML(D());paintLite();}
function magicHTML(d){const n=nums(d),m=d.moneda||'MXN';
  return `<div class="magic">
   <div class="mg"><small>Tu número base</small><b>${money(n.B,m)}</b><span>lo que cuesta tu vida hoy</span></div>
   <div class="mg"><small>Lo que ganas hoy</small><b>${money(n.I,m)}</b><span>${n.I>=n.B?'cubre tus básicos':'te faltan '+money(n.falta,m)}</span></div>
   <div class="mg hi"><small>Tu número mágico</small><b>${money(n.Y,m)}</b><span>lo que cuesta tu vida ideal al mes</span></div>
  </div>
  <div class="read"><b>Lo que esto significa</b>
   ${n.extra>0?`<p>Para vivir tu vida ideal necesitas generar <b>${money(n.extra,m)} más al mes</b> de lo que ganas hoy. Esa es tu <b>meta de ingreso extra</b>.</p>`:`<p>Tus ingresos de hoy ya alcanzan para tu vida ideal. ¡Felicidades! Tu reto ahora es <b>sostenerlo y hacerlo crecer</b>.</p>`}
   ${n.mult&&n.mult>1?`<p>Dicho de otra forma: tu vida ideal cuesta <b>${n.mult.toFixed(1)} veces</b> lo que ganas hoy. No tienes que llegar de golpe: puedes ir por escalones.</p>`:''}
   ${n.mult&&n.mult>1?`<div class="steps-m">${[['1','Cubrir tus básicos',n.B],['2','La mitad del camino',Math.round(n.B+n.W/2)],['3','Tu vida ideal',n.Y]].map(([k,t,v])=>`<div class="${n.I>=v?'ok':''}"><b>Escalón ${k}</b><span>${t}</span><em>${money(v,m)}</em>${n.I>=v?'<i>✓ ya lo tienes</i>':''}</div>`).join('')}</div>`:''}
   <p style="margin-top:1rem"><b>Tu número de libertad</b> <span style="color:var(--muted)">(para inspirarte)</span>: una regla muy conocida en finanzas personales, la <b>regla del 4%</b>, dice que si juntas unas <b>25 veces lo que gastas en un año</b>, podrías vivir de tus inversiones. En tu caso serían <b>${money(n.libre,m)}</b>. Es una referencia educativa, no una garantía.</p>
  </div>`;}
function tiempoOk(d){return !!d.fechaObj&&!!d.dias&&!!d.horas;}
function tiempoHTML(d){
  const today=dayKey();
  return `<div class="read" style="margin-top:0"><b>¿Para cuándo quieres lograrlo?</b><p>Elige una fecha retadora, pero realista.</p><input type="date" class="fld" style="max-width:280px" min="${today}" value="${d.fechaObj||''}" onchange="setD({fechaObj:this.value});paint()"></div>
  <div class="read"><b>¿Cuántos días a la semana le vas a dedicar a tu negocio?</b><div class="chips">${[1,2,3,4,5,6,7].map(n=>`<button class="${d.dias===n?'on':''}" onclick="setD({dias:${n}});paint()">${n} ${n===1?'día':'días'}</button>`).join('')}</div></div>
  <div class="read"><b>¿Cuánto tiempo cada uno de esos días?</b><div class="chips">${HORAS.map(([v,t])=>`<button class="${d.horas===v?'on':''}" onclick="setD({horas:${v}});paint()">${t}</button>`).join('')}</div>
  ${d.dias&&d.horas?`<p style="margin-top:.8rem">En total: <b>${horasTxt(d.dias*d.horas)} a la semana</b> para tu negocio.</p>`:''}</div>`;
}
function horasTxt(h){if(h<1)return Math.round(h*60)+' minutos';const H=Math.floor(h),M=Math.round((h-H)*60);return H+(H===1?' hora':' horas')+(M?' y '+M+' minutos':'');}
function actSug(d){const h=(d.dias||3)*(d.horas||0.5);return {conv:Math.max(2,Math.round(h*1.5)),seg:Math.max(3,Math.round(h*2)),est:Math.max(1,Math.round(h*0.3)),pub:Math.min(7,Math.max(2,d.dias||3))};}
function actividadHTML(d){
  if(!tiempoOk(d))return lockBox('Primero elige tu fecha, tus días y tu tiempo.');
  const a=d.act||{},s=actSug(d);
  return `<p class="sec-d" style="margin-top:0">Con <b>${horasTxt(d.dias*d.horas)} a la semana</b>, esto es lo que te sugerimos. Ajústalo con los botones <b>−</b> y <b>+</b>. Mejor poco y cumplido que mucho y abandonado.</p>
  <div class="acts">${ACT.map(([k,t,sub])=>{const v=a[k]!==undefined?a[k]:null;return `<div class="act"><div><b>${t}</b><small>${sub} · por semana</small></div><div class="stp"><button onclick="stepAct('${k}',-1)">−</button><span>${v===null?'—':v}</span><button onclick="stepAct('${k}',1)">+</button></div></div>`;}).join('')}</div>
  <div style="margin-top:.9rem"><button class="btn-line" onclick="setD({act:actSug(D())});paint()">Usar la sugerencia (${s.conv} conversaciones, ${s.seg} seguimientos, ${s.est} h de estudio, ${s.pub} publicaciones)</button></div>`;
}
function stepAct(k,dl){const d=D(),a=Object.assign({},d.act||actSug(d));a[k]=Math.max(0,(a[k]||0)+dl);setD({act:a});paint();}
function numeroOk(d){return idealOk(d)&&tiempoOk(d)&&!!d.act&&d.act.conv>0;}
function numeroCard(d){
  const a=d.act||{},m=d.moneda||'MXN';
  return `<div class="paper"><small>MI NÚMERO</small>
   ${(()=>{const n=nums(d);return `<p class="big-n">${money(n.Y,m)}<span> al mes · mi número mágico</span></p><p>Hoy gano <b>${money(n.I,m)}</b>. ${n.extra>0?`Mi meta de ingreso extra: <b>${money(n.extra,m)} al mes</b>.`:'Ya cubro mi vida ideal: ahora la sostengo y la hago crecer.'}</p>`;})()}
   <p>Para el <b>${fmtDate(new Date(d.fechaObj+'T12:00:00'))}</b>.</p>
   <p>Le dedico <b>${d.dias} ${d.dias===1?'día':'días'} a la semana</b>, ${HORAS.find(x=>x[0]===d.horas)[1]} cada día (${horasTxt(d.dias*d.horas)} a la semana).</p>
   <p><b>Cada semana hago:</b> ${a.conv||0} conversaciones nuevas · ${a.seg||0} seguimientos · ${a.est||0} h de estudio · ${a.pub||0} publicaciones.</p>
   <p class="fine">Este número es tu objetivo personal, no una promesa de ingresos ni una asesoría financiera. Para decisiones de inversión o impuestos, consulta a un profesional. Los resultados dependen de muchos factores y de la constancia de cada persona. Lo que sí controlas son tus acciones de cada semana.</p></div>`;
}
function resumenHTML(d){if(!numeroOk(d))return lockBox('Tu número aparece cuando completes los tres pasos de arriba.');return numeroCard(d);}
