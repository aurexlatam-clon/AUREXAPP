/* ---------- MI DÍA (medir las acciones) ---------- */
function diaActs(d){const l=metasAreas(d).map(a=>(d.metas||{})[a]).filter(m=>m&&m.ac).map(m=>m.ac);if(d.ritualHora)l.push('Mi ritual de 3 minutos');return l;}
function diaHTML(d){
  const acts=diaActs(d),log=d.dia||{},today=dayKey(),T=log[today]||{};
  const days=[];for(let k=6;k>=0;k--){const x=new Date();x.setDate(x.getDate()-k);days.push(x);}
  const streak=(()=>{let s=0;const x=new Date();if(!Object.values(log[dayKey(x)]||{}).includes(1))x.setDate(x.getDate()-1);while(Object.values(log[dayKey(x)]||{}).includes(1)){s++;x.setDate(x.getDate()-1);}return s;})();
  const missedY=(()=>{const y=new Date();y.setDate(y.getDate()-1);const L=log[dayKey(y)];return L&&!Object.values(L).includes(1);})();
  return `<div class="dia">${acts.map((a,i)=>{const v=T[i];return `<div class="dia-r"><div class="dia-t"><b>${esc(a)}</b><div class="wk">${days.map(x=>{const L=(log[dayKey(x)]||{})[i];return `<i class="${L===1?'y':L===0?'n':''}" title="${x.toLocaleDateString('es-MX',{weekday:'long',day:'numeric'})}">${x.toLocaleDateString('es-MX',{weekday:'narrow'})}</i>`;}).join('')}</div></div>
    <div class="dia-b"><button class="${v===1?'on':''}" onclick="markDia(${i},1)">✓ Lo hice</button><button class="${v===0?'no':''}" onclick="markDia(${i},0)">Hoy no</button></div></div>`;}).join('')}
   <div class="dia-f">${streak>1?`🔥 Llevas <b>${streak} días seguidos</b> cumpliendo al menos una acción.`:streak===1?'🔥 <b>Primer día</b> cumpliendo. Mañana vas por el segundo.':'Empieza hoy tu racha.'}${Object.values(T).includes(0)?`<br><span style="color:var(--muted)">Está bien. Un día no define tu camino. <b style="color:var(--text)">Lo importante es no fallar dos días seguidos</b>: mañana retomas.</span>`:''}${missedY&&!Object.values(T).includes(1)?`<br><span style="color:var(--gold-l)">Ayer no se pudo. Hoy es el día para retomar: aunque sea 2 minutos.</span>`:''}</div></div>`;
}
function markDia(i,v){const d=D(),log=Object.assign({},d.dia||{}),k=dayKey();log[k]=Object.assign({},log[k]||{});log[k][i]=v;
  const keys=Object.keys(log).sort();while(keys.length>60)delete log[keys.shift()];setD({dia:log});
  if(ST.view==='brujula'){const y=window.scrollY;render();window.scrollTo(0,y);}else paint();
  if(v===1)toast('¡Bien! Un paso más');}

/* ---------- RITUAL (3 minutos guiados) ---------- */
let RIT=null;
function openRitual(){RIT={i:0,t:60};showModal(ritualInner());ritTick();}
function ritualSteps(d){const acts=diaActs(d).filter(x=>x!=='Mi ritual de 3 minutos');
  return [
   {k:'Minuto 1 · Recuerda',b:`${d.fraseNueva?`<p class="big-q">“${esc(d.fraseNueva)}”</p>`:''}${d.paraque?`<p>Mi para qué: <b>${esc(d.paraque)}</b></p>`:'<p>Lee en voz alta tu frase nueva. Siente lo que dice.</p>'}`},
   {k:'Minuto 2 · Visualiza',b:`<p>Cierra los ojos. Respira profundo. Mira un momento de tu vida ideal como si ya fuera hoy: ¿dónde estás?, ¿con quién?, ¿qué sientes?</p>${d.viTxt?`<p style="color:var(--muted)">${esc(d.viTxt.slice(0,260))}${d.viTxt.length>260?'…':''}</p>`:''}`},
   {k:'Minuto 3 · Decide',b:`<p>¿Cuál es <b>la acción más importante de hoy</b> para tu negocio y para tu vida?</p>${acts.length?`<ul class="dev">${acts.map(a=>`<li>→ ${esc(a)}</li>`).join('')}</ul>`:''}${d.bHora?`<p>Tu bloque de negocio de hoy: <b>${esc(d.bHora)}</b>.</p>`:''}`}
  ];}
function ritualInner(){const S=ritualSteps(D()),s=S[RIT.i];
  return `<div class="m-k">${s.k} · <span id="rit-t">${RIT.t}</span> s</div><div class="qbar"><i style="width:${Math.round((RIT.i*60+(60-RIT.t))/180*100)}%"></i></div><div class="m-b">${s.b}</div>
  <div class="m-f"><button class="btn-line" onclick="closeModal()">Salir</button><button class="btn-gold" onclick="ritNext()">${RIT.i<2?'Siguiente →':'Terminar ✓'}</button></div>`;}
function ritTick(){clearTimeout(RIT&&RIT._h);if(!RIT)return;RIT._h=setTimeout(()=>{if(!RIT)return;RIT.t--;const e=document.getElementById('rit-t');if(e)e.textContent=RIT.t;if(RIT.t<=0){ritNext();return;}ritTick();},1000);}
function ritNext(){if(!RIT)return;if(RIT.i<2){RIT.i++;RIT.t=60;document.getElementById('modal-in').innerHTML=ritualInner();ritTick();return;}
  clearTimeout(RIT._h);RIT=null;const d=D();const p={ritualDone:1};const acts=diaActs(d),i=acts.indexOf('Mi ritual de 3 minutos');
  if(i>=0){const log=Object.assign({},d.dia||{}),k=dayKey();log[k]=Object.assign({},log[k]||{});log[k][i]=1;p.dia=log;}
  setD(p);closeModal();toast('¡Ritual completado! Que tengas un gran día');if(ST.view==='brujula'){const y=window.scrollY;render();window.scrollTo(0,y);}else paint();}

/* ---------- HOY NO TENGO GANAS ---------- */
function openRescue(){const d=D(),acts=diaActs(d).filter(x=>x!=='Mi ritual de 3 minutos'),p=d.plan||{};
  showModal(`<div class="m-k">☂ Hoy no tengo ganas</div><div class="m-b">
   <p class="big-q" style="font-size:1.5rem">Respira. Está bien no tener ganas. Hoy basta con un paso pequeño.</p>
   ${d.carta4?`<div class="paper letter" style="margin:1rem 0">${esc(d.carta4).replace(/\n/g,'<br>')}</div>`:''}
   ${d.paraque?`<p><b>Recuerda por qué empezaste:</b> ${esc(d.paraque)}</p>`:''}
   ${d.fraseNueva?`<p><b>Tu frase:</b> <i>“${esc(d.fraseNueva)}”</i></p>`:''}
   ${p.noganas?`<p><b>Tu plan para hoy:</b> ${esc(p.noganas)}.</p>`:''}
   ${acts[0]?`<div class="task-res">Solo 2 minutos de: <b>${esc(acts[0])}</b>. Empieza y, si quieres, para ahí. Mañana es otro día.</div>`:''}
  </div><div class="m-f"><button class="btn-gold" onclick="closeModal()">Gracias. Voy por mis 2 minutos</button></div>`);
  setD({rescueTried:1});if(typeof ST.view==='number'&&ST.view>0)paint();}
function showModal(html){let m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<div class="modal-bg" onclick="closeModal()"></div><div class="modal-in" id="modal-in"></div>';document.body.appendChild(m);}
  document.getElementById('modal-in').innerHTML=html;m.classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){const m=document.getElementById('modal');if(m)m.classList.remove('open');document.body.style.overflow='';if(RIT){clearTimeout(RIT._h);RIT=null;}}

/* ---------- FIRMA ---------- */
let SIG=null;
function initSig(){const c=document.getElementById('sig');if(!c)return;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(10,r.width*dpr);c.height=Math.max(10,r.height*dpr);
  const x=c.getContext('2d');x.scale(dpr,dpr);x.strokeStyle='#F0C96B';x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';SIG={c,x,drawn:false,down:false};
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);SIG.down=true;const [a,b]=pos(e);x.beginPath();x.moveTo(a,b);};
  c.onpointermove=e=>{if(!SIG.down)return;const [a,b]=pos(e);x.lineTo(a,b);x.stroke();SIG.drawn=true;};
  c.onpointerup=c.onpointercancel=()=>{SIG.down=false;};}
function clearSig(){if(!SIG)return;SIG.x.clearRect(0,0,SIG.c.width,SIG.c.height);SIG.drawn=false;}
function saveSig(){const d=D(),n=(document.getElementById('c-nombre')?.value||d.nombre||USER_NAME||'').trim();
  if(!n){toast('Escribe tu nombre');return;}if(!SIG||!SIG.drawn){toast('Firma con tu dedo o con el mouse');return;}
  const t=document.createElement('canvas');t.width=600;t.height=Math.round(600*SIG.c.height/SIG.c.width);t.getContext('2d').drawImage(SIG.c,0,0,t.width,t.height);
  setD({nombre:n,firma:t.toDataURL('image/png'),cartaF:Date.now()});paint();toast('¡Firmaste tu carta compromiso!');}

/* ---------- DESCARGAS ---------- */
function dl(cv,name){cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);});}
function wrapT(x,t,X,y,maxW,lh){const words=String(t).split(' ');let line='';for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,X,y);line=w;y+=lh;}else line=test;}if(line){x.fillText(line,X,y);y+=lh;}return y;}
function downloadWheel(){
  const d=D();const svg=wheelSVG(d.rueda||{},{size:420,pad:true});
  const img=new Image();const W=1200,H=1400;
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
    x.fillStyle='#0b0a08';x.fillRect(0,0,W,H);x.strokeStyle='#C9952A';x.lineWidth=4;x.strokeRect(24,24,W-48,H-48);
    x.textAlign='center';x.fillStyle='#C9952A';x.font='600 34px Oswald, Arial';x.fillText('A U R E X   V I P',W/2,110);
    x.fillStyle='#f2efe9';x.font='600 64px Oswald, Arial';x.fillText('MI RUEDA DE LA VIDA',W/2,190);
    x.fillStyle='#cfc7b5';x.font='italic 36px Georgia, serif';x.fillText(fmtDate(new Date(d.ruedaF||Date.now())),W/2,245);
    x.drawImage(img,60,290,W-120,(W-120)*1.04/1.12);
    x.fillStyle='#F0C96B';x.font='600 40px Oswald, Arial';x.fillText('Promedio: '+avg(d.rueda)+' / 10',W/2,1250);
    if(d.foco){x.fillStyle='#e4dfd5';x.font='32px Arial';x.fillText('Mi área foco: '+aName(d.foco),W/2,1310);}
    dl(cv,'Mi-rueda-AUREX.png');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function downloadCarta(){
  const d=D(),c=cartaLines(d),W=1240,cv=document.createElement('canvas'),x=cv.getContext('2d');
  const draw=(H,sig)=>{cv.width=W;cv.height=H;x.fillStyle='#0d0c0a';x.fillRect(0,0,W,H);x.strokeStyle='#C9952A';x.lineWidth=4;x.strokeRect(28,28,W-56,H-56);x.lineWidth=1.5;x.strokeRect(42,42,W-84,H-84);
    x.textAlign='center';x.fillStyle='#C9952A';x.font='600 30px Oswald, Arial';x.fillText('A U R E X   V I P',W/2,120);
    x.fillStyle='#f2efe9';x.font='600 60px Oswald, Arial';x.fillText('CARTA COMPROMISO',W/2,200);
    x.textAlign='left';const L=110,MW=W-220;let y=290;x.fillStyle='#e4dfd5';x.font='30px Arial';
    y=wrapT(x,`Yo, ${c.nombre}, hoy ${c.fecha}, me comprometo conmigo.`,L,y,MW,44)+18;
    x.fillStyle='#F0C96B';x.font='bold 30px Arial';x.fillText('Así quiero vivir:',L,y);y+=46;x.fillStyle='#e4dfd5';x.font='28px Arial';y=wrapT(x,c.vida,L,y,MW,42)+18;
    x.fillStyle='#F0C96B';x.font='bold 30px Arial';x.fillText('Me comprometo a:',L,y);y+=46;x.font='28px Arial';
    c.metas.forEach(m=>{x.fillStyle='#e4dfd5';y=wrapT(x,`• ${m.a}: ${m.m}. Mi acción diaria: ${m.ac}.`,L,y,MW,42)+8;});y+=14;
    if(c.frase){x.fillStyle='#F0C96B';x.font='italic 30px Georgia, serif';y=wrapT(x,`“${c.frase}”`,L,y,MW,44)+14;}
    x.fillStyle='#e4dfd5';x.font='28px Arial';y=wrapT(x,'No busco la perfección: busco avanzar un paso cada día.',L,y,MW,42)+40;
    if(sig){const sw=420,sh=sw*sig.height/sig.width;x.drawImage(sig,L,y,sw,sh);y+=sh+6;}
    x.strokeStyle='#5a5040';x.beginPath();x.moveTo(L,y);x.lineTo(L+460,y);x.stroke();y+=40;x.fillStyle='#cfc7b5';x.font='26px Arial';x.fillText(c.nombre,L,y);return y+100;};
  const go2=sig=>{const H=draw(1754,sig);draw(Math.max(H,1200),sig);dl(cv,'Carta-compromiso-AUREX.png');};
  if(d.firma){const im=new Image();im.onload=()=>go2(im);im.src=d.firma;}else go2(null);
}
function downloadWall(){
  const d=D(),c=cartaLines(d),W=1080,H=1920,cv=document.createElement('canvas'),x=cv.getContext('2d');cv.width=W;cv.height=H;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14100a');g.addColorStop(.5,'#0a0907');g.addColorStop(1,'#14100a');x.fillStyle=g;x.fillRect(0,0,W,H);
  const r=x.createRadialGradient(W/2,420,10,W/2,420,700);r.addColorStop(0,'rgba(201,149,42,.28)');r.addColorStop(1,'rgba(201,149,42,0)');x.fillStyle=r;x.fillRect(0,0,W,H);
  const y0=420+(3-Math.min(3,c.metas.length))*120;x.textAlign='center';x.fillStyle='#C9952A';x.font='600 34px Oswald, Arial';x.fillText('A U R E X   V I P',W/2,y0);
  x.fillStyle='#F0C96B';x.font='italic 58px Georgia, serif';let y=wrapC(x,c.frase?`“${c.frase}”`:'Un paso cada día.',W/2,y0+120,W-180,74)+50;
  x.strokeStyle='#C9952A';x.lineWidth=2;x.beginPath();x.moveTo(W/2-80,y);x.lineTo(W/2+80,y);x.stroke();y+=90;
  x.fillStyle='#C9952A';x.font='600 30px Oswald, Arial';x.fillText('M I S   M E T A S',W/2,y);y+=70;
  c.metas.forEach(m=>{x.fillStyle='#f2efe9';x.font='bold 40px Arial';y=wrapC(x,m.m,W/2,y,W-180,52);x.fillStyle='#cfc7b5';x.font='32px Arial';y=wrapC(x,'Cada día: '+m.ac,W/2,y+6,W-200,44)+50;});
  if(d.paraque){x.fillStyle='#9a9ea6';x.font='italic 32px Georgia, serif';wrapC(x,d.paraque,W/2,Math.max(y+30,H-330),W-220,44);}
  dl(cv,'Fondo-de-pantalla-AUREX.png');toast('Guárdala y ponla como fondo de pantalla de tu celular');}
function wrapC(x,t,X,y,maxW,lh){const words=String(t).split(' ');let line='';const lines=[];for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){lines.push(line);line=w;}else line=test;}if(line)lines.push(line);lines.forEach(l=>{x.fillText(l,X,y);y+=lh;});return y;}
function downloadICS(){
  const d=D();if(!bloqueOk(d))return;const pad=n=>String(n).padStart(2,'0');
  const now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';
  const dt=(hm)=>{const t=new Date();const [H,M]=hm.split(':');return t.getFullYear()+pad(t.getMonth()+1)+pad(t.getDate())+'T'+pad(H)+pad(M)+'00';};
  let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AUREX VIP//Mentalidad//ES',
   'BEGIN:VEVENT','UID:bloque-'+Date.now()+'@aurexvip','DTSTAMP:'+stamp,'DTSTART:'+dt(d.bHora),'DURATION:PT'+d.bDur+'M','RRULE:FREQ=WEEKLY;BYDAY='+d.bDias.join(','),'SUMMARY:Mi bloque de negocio · AUREX','DESCRIPTION:Mi cita fija con mi negocio.','BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:Mi bloque de negocio','END:VALARM','END:VEVENT'];
  if(d.ritualHora)ics=ics.concat(['BEGIN:VEVENT','UID:ritual-'+Date.now()+'@aurexvip','DTSTAMP:'+stamp,'DTSTART:'+dt(d.ritualHora),'DURATION:PT3M','RRULE:FREQ=DAILY','SUMMARY:Mi ritual de 3 minutos · AUREX','DESCRIPTION:'+(d.ancla||'')+', hago mi ritual.','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Mi ritual de 3 minutos','END:VALARM','END:VEVENT']);
  ics.push('END:VCALENDAR');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics.join('\r\n')],{type:'text/calendar'}));a.download='Mi-bloque-AUREX.ics';a.click();
  toast('Abre el archivo descargado para agregarlo a tu calendario');
}

/* ---------- UTILIDADES ---------- */
function quiet(k,v){const p={};p[k]=v;setD(p);clearTimeout(quiet._h);quiet._h=setTimeout(()=>{if(typeof ST.view==='number'&&ST.view>0)paintLite();},400);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2800);}
function applyFont(){const f=parseInt(LS('cr_fs'))||0;document.documentElement.classList.remove('fs1','fs2');if(f)document.documentElement.classList.add('fs'+f);}
function cycleFont(){const f=((parseInt(LS('cr_fs'))||0)+1)%3;LS('cr_fs',String(f));applyFont();toast(['Letra normal','Letra grande','Letra más grande'][f]);}

/* ---------- INICIO ---------- */
applyFont();
function fromHash(){const h=location.hash;if(h==='#brujula')return 'brujula';const m=h.match(/^#e(\d)$/);if(m){const n=parseInt(m[1]);if(n>=1&&n<=ETAPAS.length&&isOpen(n-1))return n;}return 0;}
window.addEventListener('hashchange',()=>{const v=fromHash();if(v!==ST.view){ST.view=v;render();window.scrollTo(0,0);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
startAuth();
