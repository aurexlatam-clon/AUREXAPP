<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanzas y Patrimonio | AUREX Academia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --panel:#141416; --panel2:#1b1b1e; --line:#2b2b30;
    --gold:#c9a54a; --gold-soft:#e6cf8f; --gold-dim:#5a4a22;
    --text:#f3efe6; --muted:#aaa397;
    --c1:#d9826b; --c2:#d9b25f; --c3:#8fc39a; --c4:#7fb6d9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:19px;line-height:1.6;min-height:100vh}
  .wrap{max-width:680px;margin:0 auto;padding:22px 18px 70px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;font-size:15px;color:var(--muted)}
  .top a{color:var(--gold-soft);text-decoration:none}
  .brand{letter-spacing:.3em;color:var(--gold);font-weight:700;font-size:13px}
  .screen{display:none}
  .screen.active{display:block;animation:in .4s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1.15}
  h1{font-size:44px;margin-bottom:14px}
  h1 i,h2 i{font-weight:500;color:var(--gold-soft)}
  h2{font-size:32px;margin-bottom:12px}
  h3{font-size:24px;margin-bottom:8px}
  .kicker{color:var(--gold);font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;margin-bottom:12px}
  .lead{color:var(--muted);font-size:20px;margin-bottom:26px}
  p{margin-bottom:14px}
  .btn{display:block;width:100%;border:none;cursor:pointer;border-radius:14px;padding:18px 20px;font-family:'DM Sans',sans-serif;
    font-weight:700;font-size:19px;background:var(--gold);color:#111;text-align:center;text-decoration:none;transition:filter .2s}
  .btn:hover{filter:brightness(1.08)}
  .btn.line{background:transparent;color:var(--gold-soft);border:1.5px solid var(--gold-dim)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:12px}
  .row .btn{flex:1}
  .hint{color:var(--muted);font-size:16px;text-align:center;margin-top:12px}

  /* mapa de etapas */
  .map{margin:8px 0 30px}
  .stage{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
  .stage .n{flex:0 0 44px;height:44px;border-radius:50%;border:1.5px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-soft)}
  .stage.open .n{background:var(--gold);color:#111;border-color:var(--gold)}
  .stage.done .n{background:#24301f;border-color:var(--c3);color:var(--c3)}
  .stage h4{font-size:19px;font-weight:700}
  .stage p{color:var(--muted);font-size:16px;margin:2px 0 0}
  .stage .tag{font-size:13px;color:var(--muted);letter-spacing:.06em}
  .stage.locked{opacity:.55}

  /* recorrido de la etapa */
  .path{display:flex;gap:6px;margin-bottom:8px}
  .path i{flex:1;height:6px;border-radius:6px;background:var(--line);transition:background .3s}
  .path i.on{background:var(--gold)}
  .pathlabel{font-size:14px;color:var(--muted);margin-bottom:24px}
  .pathlabel b{color:var(--gold-soft)}

  /* tarjetas */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px;margin-bottom:20px;min-height:260px}
  .card .num{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:20px;margin-bottom:8px}
  .card strong{color:var(--gold-soft)}

  /* preguntas */
  .qarea{display:inline-block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);
    border-radius:20px;padding:4px 12px;margin-bottom:14px}
  .qtext{font-family:'Cormorant Garamond',serif;font-size:29px;font-weight:700;line-height:1.2;margin-bottom:20px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel);color:var(--text);border:1.5px solid var(--line);border-radius:14px;
    padding:17px 18px;margin-bottom:12px;font-family:'DM Sans',sans-serif;font-size:18px;cursor:pointer;transition:all .2s}
  .opt:hover{border-color:var(--gold-dim)}
  .opt.sel{border-color:var(--gold);background:#211c10}
  .back{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:10px 0;font-family:'DM Sans',sans-serif}

  /* formulario */
  label{display:block;font-weight:700;margin:22px 0 4px}
  label small{display:block;font-weight:400;color:var(--muted);font-size:15px;margin-top:2px}
  .money{display:flex;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;margin-top:8px}
  .money span{padding:0 6px 0 18px;color:var(--gold);font-size:22px}
  .money input{flex:1;background:none;border:none;color:var(--text);font-size:22px;padding:16px 16px 16px 4px;font-family:'DM Sans',sans-serif}
  .money input:focus{outline:none}
  .money:focus-within{border-color:var(--gold)}
  textarea{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font-size:18px;
    padding:16px;font-family:'DM Sans',sans-serif;min-height:100px;margin-top:10px}
  textarea:focus{outline:none;border-color:var(--gold)}
  .err{color:var(--c1);font-size:16px;min-height:24px;margin:10px 0}

  /* resultado */
  .score{text-align:center;background:radial-gradient(circle at top,#231d0f,var(--panel) 70%);border:1px solid var(--gold-dim);border-radius:24px;padding:30px 20px;margin-bottom:22px}
  .score .big{font-family:'Cormorant Garamond',serif;font-size:96px;font-weight:700;color:var(--gold-soft);line-height:1}
  .score .of{color:var(--muted);font-size:16px}
  .score .lvl{font-family:'Cormorant Garamond',serif;font-size:30px;margin-top:10px}
  .scale{display:flex;gap:4px;margin:18px 0 6px}
  .scale div{flex:1;font-size:12px;color:var(--muted);text-align:center}
  .scale div b{display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:6px}
  .scale div.on{color:var(--text);font-weight:700}
  .scale div.on b{background:var(--gold)}
  .areas{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:22px}
  .bar{margin-bottom:14px}
  .bar .t{display:flex;justify-content:space-between;font-size:16px;margin-bottom:6px}
  .bar .tr{height:10px;background:var(--line);border-radius:10px;overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:10px;background:var(--gold);width:0;transition:width 1s ease}
  .reading{display:grid;gap:14px;margin-bottom:22px}
  .reading .box{background:var(--panel2);border-radius:16px;padding:18px}
  .reading h5{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  .reading .strong h5{color:var(--c3)} .reading .grow h5{color:var(--c2)}
  .shield{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:22px}
  .shield .m{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:700;color:var(--gold-soft);line-height:1;text-align:center;min-width:90px}
  .shield .m small{display:block;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--muted);font-weight:400}

  /* cierre */
  .seal{text-align:center;border:1px solid var(--gold-dim);border-radius:24px;padding:34px 22px;margin-bottom:22px;background:var(--panel)}
  .seal .ring{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--gold-soft)}
  .stat{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0;font-size:17px}
  .stat b{color:var(--gold-soft)}

  @media(max-width:420px){h1{font-size:36px}h2{font-size:28px}.qtext{font-size:25px}.score .big{font-size:80px}body{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/">← Volver al portal</a>
    <span class="brand">AUREX</span>
  </div>

  <!-- PORTADA DEL MÓDULO -->
  <section class="screen active" id="home">
    <div class="kicker">Módulo · Finanzas y Patrimonio</div>
    <h1>Tu dinero, <i>con método.</i></h1>
    <p class="lead">No vas a memorizar reglas. Vas a medir dónde estás, encontrar lo que se te escapa y construir un sistema que funcione con tu vida real.</p>
    <div class="map" id="map"></div>
    <button class="btn" id="homeBtn" onclick="openStage1()">Empezar la etapa 1</button>
    <p class="hint">Al final del módulo vuelves a medir tu Pulso y ves cuánto avanzaste.</p>
  </section>

  <!-- ETAPA 1 -->
  <section class="screen" id="stage1">
    <div class="path" id="path"></div>
    <div class="pathlabel" id="pathlabel"></div>
    <div id="view"></div>
  </section>
</div>

<script>
/* ======================================================
   CONFIGURACIÓN DEL MÓDULO
   El progreso se guarda en el navegador como respaldo.
   Para guardarlo en Firebase como los demás módulos,
   conecta la función saveProgress() al mismo sistema.
   ====================================================== */
const STORE_KEY = 'aurex_finanzas_v1';

const STAGES = [
  {t:'El Pulso',        d:'Tu punto de partida: tu puntaje financiero y tus meses de escudo.'},
  {t:'Las Fugas',       d:'Encuentras por dónde se te escapa el dinero sin darte cuenta.'},
  {t:'Las 3 Llaves',    d:'Le das destino a tu dinero antes de gastarlo: Base, Futuro y Gusto.'},
  {t:'Tu Escudo',       d:'Defines cuántos meses de tranquilidad quieres y cómo construirlos.'},
  {t:'Los 4 Motores',   d:'Tiempo, Talento, Sistema y Capital: cuál tienes encendido y cuál sigue.'},
  {t:'Tu "yo" del futuro', d:'Tu carta, tus compromisos y tu ritual de 12 minutos contigo.'}
];

const AREAS = {
  claridad:'Claridad', control:'Control', escudo:'Escudo', motores:'Motores', futuro:'Futuro'
};

const QUESTIONS = [
  {a:'claridad', q:'¿Sabes cuánto dinero te entra al mes?',
   o:[['Sí, la cifra exacta',10],['Más o menos',6],['Varía mucho y no lo llevo',3],['La verdad, no lo sé',0]]},
  {a:'claridad', q:'¿Sabes en qué se fue tu dinero el mes pasado?',
   o:[['Sí, lo tengo anotado',10],['Sé los gastos grandes',6],['Tengo una idea general',3],['No tengo idea',0]]},
  {a:'control', q:'¿Cómo terminas normalmente el mes?',
   o:[['Me sobra y lo aparto',10],['Llego justo',5],['A veces me falta',2],['Casi siempre me falta',0]]},
  {a:'control', q:'En una semana normal, ¿cuántas compras haces que no tenías planeadas?',
   o:[['Casi ninguna',10],['Una o dos',6],['Varias',3],['Pierdo la cuenta',0]]},
  {a:'escudo', q:'Si mañana dejaras de recibir ingresos, ¿cuánto tiempo podrías cubrir tus gastos básicos?',
   o:[['Más de 6 meses',10],['Entre 3 y 6 meses',7],['Menos de 3 meses',3],['Menos de un mes',0]]},
  {a:'escudo', q:'¿Usas tarjeta de crédito o préstamos para tus gastos del día a día?',
   o:[['No los uso para eso',10],['Sí, pero pago el total cada mes',8],['Pago una parte cada mes',3],['Se me van acumulando',0]]},
  {a:'motores', q:'¿Cuántas fuentes de ingreso tienes hoy?',
   o:[['Tres o más',10],['Dos',7],['Una',3],['Ninguna fija por ahora',0]]},
  {a:'motores', q:'Si tu ingreso principal se detuviera, ¿otra fuente te sostendría?',
   o:[['Sí, por completo',10],['En parte',6],['Muy poco',3],['No',0]]},
  {a:'futuro', q:'¿Apartas dinero para tu futuro de forma constante?',
   o:[['Cada vez que cobro',10],['Cuando me sobra',5],['Alguna vez lo he hecho',2],['Todavía no',0]]},
  {a:'futuro', q:'¿Tienes una meta de dinero con cifra y fecha?',
   o:[['Sí, y la tengo escrita',10],['Tengo la cifra, pero no la fecha',6],['Tengo una idea general',3],['Todavía no',0]]}
];

const LEVELS = [
  {min:0,  max:39, name:'En alerta',        txt:'Tu dinero hoy se mueve más por urgencia que por decisión. La buena noticia: es el punto donde cada pequeño cambio se nota más rápido.'},
  {min:40, max:59, name:'En construcción',  txt:'Ya tienes bases, pero todavía hay partes de tu dinero que se deciden solas. Con orden, este nivel sube rápido.'},
  {min:60, max:79, name:'En equilibrio',    txt:'Tienes control sobre lo importante. Lo que sigue es blindarte y encender nuevos motores de ingreso.'},
  {min:80, max:100,name:'En expansión',     txt:'Tu dinero trabaja con dirección. Tu reto ahora es multiplicar lo que ya construiste y protegerlo.'}
];

const AREA_TIPS = {
  claridad:'Saber exactamente cuánto entra y a dónde va. Es la base de todo lo demás.',
  control:'Decidir tus gastos antes de que el momento los decida por ti.',
  escudo:'Tener un respaldo que te dé tranquilidad si algo cambia.',
  motores:'No depender de una sola fuente de ingreso.',
  futuro:'Construir hoy algo para la persona que serás mañana.'
};

const COMMITS = [
  'Anotar todos mis gastos durante los próximos 7 días',
  'Revisar los movimientos de mi cuenta del último mes',
  'Apartar hoy una cantidad pequeña, aunque sea simbólica, para mi escudo'
];

const STEPS = ['Tarjetas','Tu Pulso','Tu Escudo','Resultado','Compromiso','Cierre'];

const CARDS = [
  {t:'Lo que no se mide, se adivina.',
   b:`<p>La mayoría maneja su dinero por sensación: "creo que gasto poco", "creo que me alcanza".</p>
      <p>En esta etapa vas a cambiar la sensación por <strong>un número</strong>. No para juzgarte, sino para saber desde dónde empiezas.</p>`},
  {t:'Tu Pulso Financiero',
   b:`<p>Es un puntaje de <strong>0 a 100</strong> que mide cinco áreas: <strong>Claridad, Control, Escudo, Motores y Futuro</strong>.</p>
      <p>No es una calificación. Es la foto de tu punto de partida. Al terminar el módulo lo vuelves a medir y comparas.</p>`},
  {t:'Tu Escudo',
   b:`<p>Tu Escudo es el dinero que te protege si algo cambia: un imprevisto, una enfermedad, un ingreso que se detiene.</p>
      <p>No se mide en pesos, se mide en <strong>meses</strong>: cuánto tiempo podrías cubrir tus gastos básicos sin recibir ingresos.</p>`}
];

/* ---------- estado ---------- */
let state = loadProgress() || {stage1:null};
let step = 0, card = 0, qi = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let shieldData = {ahorro:'', gastos:''};
let commit = {pick:null, own:''};

function loadProgress(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ return null; } }
function saveProgress(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- portada ---------- */
function renderMap(){
  const done1 = !!state.stage1;
  document.getElementById('map').innerHTML = STAGES.map((s,i)=>{
    const cls = i===0 ? (done1?'done':'open') : 'locked';
    const tag = i===0 ? (done1?'Completada':'Disponible') : 'Se abre al terminar la anterior';
    return `<div class="stage ${cls}"><div class="n">${done1&&i===0?'✓':i+1}</div>
      <div><span class="tag">${tag}</span><h4>${s.t}</h4><p>${s.d}</p></div></div>`;
  }).join('');
  document.getElementById('homeBtn').textContent = done1 ? 'Ver mi resultado de la etapa 1' : 'Empezar la etapa 1';
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function openStage1(){
  show('stage1');
  if(state.stage1){ step=5; } else { step=0; card=0; qi=0; }
  render();
}

/* ---------- recorrido ---------- */
function renderPath(){
  document.getElementById('path').innerHTML = STEPS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');
  document.getElementById('pathlabel').innerHTML = `Etapa 1 · El Pulso &nbsp;—&nbsp; <b>${STEPS[step]}</b>`;
}
function go(n){ step=n; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function render(){
  renderPath();
  const v = document.getElementById('view');
  if(step===0) v.innerHTML = viewCards();
  if(step===1) v.innerHTML = viewQuestion();
  if(step===2) v.innerHTML = viewShield();
  if(step===3){ v.innerHTML = viewResult(); setTimeout(animateResult,80); }
  if(step===4) v.innerHTML = viewCommit();
  if(step===5) v.innerHTML = viewClose();
}

/* paso 0: tarjetas */
function viewCards(){
  const c = CARDS[card];
  return `<div class="card"><div class="num">${card+1} de ${CARDS.length}</div><h2>${c.t}</h2>${c.b}</div>
    <div class="row">
      ${card>0?`<button class="btn line" onclick="card--;render()">Anterior</button>`:''}
      <button class="btn" onclick="${card<CARDS.length-1?'card++;render()':'go(1)'}">${card<CARDS.length-1?'Siguiente →':'Medir mi Pulso →'}</button>
    </div>`;
}

/* paso 1: preguntas */
function viewQuestion(){
  const item = QUESTIONS[qi];
  return `<div class="qarea">${AREAS[item.a]} · Pregunta ${qi+1} de ${QUESTIONS.length}</div>
    <div class="qtext">${item.q}</div>
    ${item.o.map((o,i)=>`<button class="opt ${answers[qi]===i?'sel':''}" onclick="pick(${i})">${o[0]}</button>`).join('')}
    <button class="back" onclick="${qi===0?'go(0)':'qi--;render()'}">← Volver</button>`;
}
function pick(i){
  answers[qi]=i;
  document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i));
  setTimeout(()=>{ if(qi<QUESTIONS.length-1){ qi++; render(); } else go(2); },280);
}

/* paso 2: escudo */
function viewShield(){
  return `<h2>Calcula tu Escudo</h2>
    <p class="lead" style="font-size:18px">Usa la misma moneda en las dos casillas. Si alguna cantidad es cero, escribe 0.</p>
    <label for="ahorro">Dinero que tienes disponible para una emergencia
      <small>Ahorros o efectivo que podrías usar hoy mismo, sin pedir prestado.</small></label>
    <div class="money"><span>$</span><input id="ahorro" type="text" inputmode="decimal" placeholder="0" value="${shieldData.ahorro}"></div>
    <label for="gastos">Tus gastos básicos de un mes
      <small>Solo lo indispensable: vivienda, comida, servicios, transporte y pagos fijos.</small></label>
    <div class="money"><span>$</span><input id="gastos" type="text" inputmode="decimal" placeholder="0" value="${shieldData.gastos}"></div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="saveShield()">Ver mi resultado →</button>
    <button class="back" onclick="qi=QUESTIONS.length-1;go(1)">← Volver</button>`;
}
const num = s => parseFloat(String(s).replace(/[^\d.]/g,''));
function saveShield(){
  const a=document.getElementById('ahorro').value.trim(), g=document.getElementById('gastos').value.trim();
  const err=document.getElementById('err');
  if(a===''||g===''){ err.textContent='Completa las dos casillas. Si es cero, escribe 0.'; return; }
  if(isNaN(num(a))||isNaN(num(g))){ err.textContent='Escribe solo números, sin letras.'; return; }
  if(num(g)<=0){ err.textContent='Tus gastos básicos deben ser mayores a cero.'; return; }
  shieldData={ahorro:a,gastos:g};
  go(3);
}

/* cálculos */
function compute(){
  const total = answers.reduce((t,a,i)=>t+QUESTIONS[i].o[a][1],0);
  const byArea = {};
  Object.keys(AREAS).forEach(k=>byArea[k]=0);
  answers.forEach((a,i)=>byArea[QUESTIONS[i].a]+=QUESTIONS[i].o[a][1]*5); // cada área sobre 100
  const months = num(shieldData.ahorro)/num(shieldData.gastos);
  return {total, byArea, months};
}
const levelOf = s => LEVELS.find(l=>s>=l.min&&s<=l.max);
function shieldLevel(m){
  if(m<1) return {n:'Escudo frágil', t:'Todavía no cubre un mes completo. Construirlo será una de tus prioridades en este módulo.'};
  if(m<3) return {n:'Escudo en formación', t:'Ya tienes un respaldo. El siguiente objetivo es llegar a 3 meses.'};
  if(m<6) return {n:'Escudo firme', t:'Tienes un respaldo sólido. Llegar a 6 meses te daría aún más tranquilidad.'};
  return {n:'Escudo blindado', t:'Tienes un respaldo amplio. Ahora puedes enfocarte en hacer crecer tu dinero.'};
}
const fmtMonths = m => m>=10 ? Math.round(m) : (Math.round(m*10)/10).toString().replace('.',',');

/* paso 3: resultado */
function viewResult(){
  const r = state.stage1 ? state.stage1 : compute();
  const lvl = levelOf(r.total);
  const sorted = Object.entries(r.byArea).sort((a,b)=>b[1]-a[1]);
  const strong = sorted.slice(0,2), grow = sorted.slice(-2).reverse();
  const sh = shieldLevel(r.months);
  return `<div class="score">
      <div class="of">Tu Pulso Financiero</div>
      <div class="big" id="bigScore">0</div>
      <div class="of">de 100</div>
      <div class="lvl">${lvl.name}</div>
      <div class="scale">${LEVELS.map(l=>`<div class="${l===lvl?'on':''}"><b></b>${l.name}</div>`).join('')}</div>
    </div>
    <p>${lvl.txt}</p>
    <div class="areas"><h3>Tus 5 áreas</h3>
      ${Object.keys(AREAS).map(k=>`<div class="bar"><div class="t"><span>${AREAS[k]}</span><span>${r.byArea[k]}</span></div>
        <div class="tr"><i data-w="${r.byArea[k]}"></i></div></div>`).join('')}
    </div>
    <div class="reading">
      <div class="box strong"><h5>Tus fortalezas</h5>
        ${strong.map(([k])=>`<p><strong>${AREAS[k]}:</strong> ${AREA_TIPS[k]}</p>`).join('')}</div>
      <div class="box grow"><h5>Lo que vas a fortalecer</h5>
        ${grow.map(([k])=>`<p><strong>${AREAS[k]}:</strong> ${AREA_TIPS[k]}</p>`).join('')}</div>
    </div>
    <div class="shield"><div class="m">${fmtMonths(r.months)}<small>meses</small></div>
      <div><h3>${sh.n}</h3><p style="margin:0;color:var(--muted)">${sh.t}</p></div></div>
    <button class="btn" onclick="${state.stage1?'go(5)':'go(4)'}">${state.stage1?'Continuar →':'Elegir mi compromiso →'}</button>`;
}
function animateResult(){
  const r = state.stage1 ? state.stage1 : compute();
  const el=document.getElementById('bigScore'); let n=0;
  const t=setInterval(()=>{ n+=Math.max(1,Math.round(r.total/30)); if(n>=r.total){n=r.total;clearInterval(t);} el.textContent=n; },30);
  document.querySelectorAll('.bar .tr i').forEach(i=>i.style.width=i.dataset.w+'%');
}

/* paso 4: compromiso */
function viewCommit(){
  return `<h2>Tu primer movimiento</h2>
    <p class="lead" style="font-size:18px">Elige una sola acción para esta semana. Pequeña, pero hecha.</p>
    ${COMMITS.map((c,i)=>`<button class="opt ${commit.pick===i?'sel':''}" onclick="pickCommit(${i})">${c}</button>`).join('')}
    <button class="opt ${commit.pick==='own'?'sel':''}" onclick="pickCommit('own')">Prefiero escribir el mío</button>
    <div id="ownBox" style="display:${commit.pick==='own'?'block':'none'}">
      <textarea id="ownTxt" placeholder="Esta semana yo voy a…">${commit.own}</textarea></div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="closeStage()">Cerrar la etapa 1</button>
    <button class="back" onclick="go(3)">← Volver a mi resultado</button>`;
}
function pickCommit(i){
  commit.pick=i;
  document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel', (i==='own'?j===COMMITS.length:j===i)));
  document.getElementById('ownBox').style.display = i==='own'?'block':'none';
}
function closeStage(){
  const err=document.getElementById('err');
  if(commit.pick===null){ err.textContent='Elige una acción o escribe la tuya.'; return; }
  let text = commit.pick==='own' ? document.getElementById('ownTxt').value.trim() : COMMITS[commit.pick];
  if(commit.pick==='own' && text.length<5){ err.textContent='Escribe tu acción para continuar.'; return; }
  const r = compute();
  state.stage1 = {...r, compromiso:text, fecha:new Date().toISOString()};
  saveProgress();
  go(5);
}

/* paso 5: cierre */
function viewClose(){
  const s = state.stage1, lvl = levelOf(s.total);
  const fecha = new Date(s.fecha).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
  return `<div class="seal"><div class="ring">1</div>
      <div class="kicker" style="margin-bottom:6px">Etapa completada</div>
      <h2>Ya tienes tu punto de partida.</h2>
      <p style="color:var(--muted);margin:0">Guarda este resultado: al final del módulo lo vas a comparar.</p></div>
    <div class="areas" style="padding:8px 22px">
      <div class="stat"><span>Pulso inicial</span><b>${s.total} · ${lvl.name}</b></div>
      <div class="stat"><span>Meses de escudo</span><b>${fmtMonths(s.months)}</b></div>
      <div class="stat"><span>Fecha</span><b>${fecha}</b></div>
      <div class="stat" style="display:block"><span>Tu compromiso</span><p style="margin:6px 0 0;color:var(--gold-soft)">${s.compromiso}</p></div>
    </div>
    <div class="card" style="min-height:0"><div class="num">Lo que sigue</div><h3>Etapa 2 · Las Fugas</h3>
      <p style="margin:0;color:var(--muted)">Vas a descubrir por dónde se te escapa el dinero sin darte cuenta. Se abre muy pronto.</p></div>
    <div class="row">
      <button class="btn line" onclick="go(3)">Ver mi resultado</button>
      <a class="btn" href="/">Volver al portal</a>
    </div>
    <button class="back" style="display:block;margin:14px auto 0" onclick="resetStage1()">Repetir la etapa 1</button>`;
}
function resetStage1(){
  if(!confirm('¿Quieres repetir la etapa? Se borrará tu resultado actual.')) return;
  state.stage1=null; saveProgress();
  answers.fill(null); shieldData={ahorro:'',gastos:''}; commit={pick:null,own:''};
  step=0; card=0; qi=0; render();
}

renderMap();
</script>
</body>
</html>
